<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: game</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* The game (chosen 2026-11-07 over three other takes, task 019): the board in the
     middle, leaving the game on the left (home, settings, start over), playing it on the
     right (whose turn, or the two clocks, and take back). Every control is an icon and a
     word, as on home. Move hints are in settings only. In portrait the way out is a slim
     bar above the board and the play is below it. ?clock=on shows the clocks; low,
     white's under ten seconds. */
  .game {
    --gap: 24px;
    --side: 232px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--gap);
    height: 100%;
    padding: var(--gap);
  }
  #board { flex: none; width: min(100vh - 2 * var(--gap), 100vw - 2 * var(--side) - 4 * var(--gap)); }
  .panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: none;
    width: var(--side);
    height: min(100vh - 2 * var(--gap), 100vw - 2 * var(--side) - 4 * var(--gap));
    padding: 20px 16px;
  }
  .panel .space { flex: 1; }
  .left { order: -1; }

  /* A control: a glass tile, its icon and its word. Take back is the big one. */
  .row { display: flex; align-items: center; justify-content: flex-start; gap: 12px; min-height: 72px;
    padding: 0 14px; font-size: 24px; text-align: left; white-space: nowrap; }
  .row.button svg { flex: none; width: 34px; height: 34px; stroke-width: 2.2; }
  .row.big { flex-direction: column; justify-content: center; gap: 8px; min-height: 132px; font-size: 26px; }
  .row.big svg { width: 48px; height: 48px; }

  /* Whose turn: the piece with its glow ring, and the words. */
  .turn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 18px 0 10px; text-align: center; font-size: 26px; }
  .turn .piece { --u: 7px; position: relative; inset: auto; flex: none; width: 72px; height: 72px;
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--glow) 80%, transparent),
      0 0 22px 4px color-mix(in srgb, var(--glow) 45%, transparent); }

  /* The clocks: each side's piece and time, black's on top as black's side of the board
     is. The running one is lit in the glow color and its piece has the glow ring; under
     ten seconds it turns red. */
  .clocks { display: grid; gap: 10px; }
  .clock { display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 0 14px; border-radius: 20px;
    font-size: 36px; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; color: var(--fg-dim);
    background: rgb(255 255 255 / 0.06); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.12); }
  .clock .piece { --u: 4px; position: relative; inset: auto; flex: none; width: 44px; height: 44px; opacity: 0.7; }
  .clock .time { margin-left: auto; }
  .clock.run { color: var(--fg); background: color-mix(in srgb, var(--glow) 18%, transparent); box-shadow: inset 0 0 0 2px var(--glow); }
  .clock.run .piece { opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, var(--glow) 80%, transparent),
      0 0 18px 3px color-mix(in srgb, var(--glow) 45%, transparent); }
  .clock.low { color: var(--forced); background: color-mix(in srgb, var(--forced) 16%, transparent); box-shadow: inset 0 0 0 2px var(--forced); }

  /* How many pieces the must-capture piece takes, at most (?count=a or b, &n= for
     another count; 2026-11-09). a: one pip per piece round the ring's top, a number in
     a pip past five; b: a small badge with the number at the ring's upper right. The
     pieces are 78% of a square; a pip is 22% of a radius, on the ring. */
  .count { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .count .pip { position: absolute; width: 22%; height: 22%; margin: -11% 0 0 -11%; border-radius: 50%;
    background: #fff4ec; box-shadow: 0 0 0 calc(0.32 * var(--u)) var(--forced),
      0 0 calc(1.2 * var(--u)) color-mix(in srgb, var(--forced) 70%, transparent); }
  .count .pip.num, .count .badge { display: grid; place-items: center; color: #fff; font-weight: 700;
    background: var(--forced); line-height: 1; }
  .count .pip.num { width: 40%; height: 40%; margin: -20% 0 0 -20%; font-size: calc(1.9 * var(--u)); }
  .count .badge { position: absolute; width: 46%; height: 46%; margin: -23% 0 0 -23%; border-radius: 50%;
    font-size: calc(2.2 * var(--u)); box-shadow: 0 0 0 calc(0.3 * var(--u)) #fff4ec,
      0 0 calc(1.2 * var(--u)) color-mix(in srgb, var(--forced) 70%, transparent); }

  @media (orientation: portrait) {
    .game { --top: 104px; --bottom: 200px; flex-direction: column; }
    #board { width: min(100vw - 2 * var(--gap), 100vh - var(--top) - var(--bottom) - 4 * var(--gap)); }
    .panel { display: grid; gap: 12px 16px; align-content: start; height: auto; padding: 16px 20px;
      width: min(100vw - 2 * var(--gap), 100vh - var(--top) - var(--bottom) - 4 * var(--gap)); }
    .panel .space { display: none; }
    .left { grid-template-columns: repeat(3, 1fr); }
    .left .row { justify-content: center; }
    .turn { flex-direction: row; padding: 0 6px; }
    .turn .piece { width: 52px; height: 52px; --u: 5px; }
    .clocks { grid-template-columns: 1fr 1fr; }
    .row.big { flex-direction: row; min-height: 80px; }
    .row.big svg { width: 36px; height: 36px; }
  }
</style>
</head>
<body data-screen="board">
<main class="game">
  <div id="board"></div>
  <aside class="panel glass left">
    <button class="row button" onclick="location.href='home.html'"><span data-icon="home"></span>Home</button>
    <button class="row button" onclick="location.href='settings.html'"><span data-icon="gear"></span>Settings</button>
    <div class="space"></div>
    <button class="row button"><span data-icon="restart"></span>Start over</button>
  </aside>
  <aside class="panel glass right" id="play"></aside>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const clock = params.get('clock');
  const clockOf = (side, t, cls = '') =>
    `<div class="clock ${side} ${cls}"><div class="piece ${side}"></div><span class="time" data-t="${t}"></span></div>`;
  document.getElementById('play').innerHTML =
    (clock ? `<div class="clocks">${clockOf('black', 192)}${clockOf('white', clock === 'low' ? 9 : 277, clock === 'low' ? 'run low' : 'run')}</div>`
      : `<div class="turn"><div class="piece white"></div>White's turn</div>`) +
    '<div class="space"></div><button class="row button big"><span data-icon="undo"></span>Take back</button>';
  Draughts.init();
  // The clocks show m:ss; the running one counts down once a second (natively, one
  // frame a second while a clock runs).
  const show = () => document.querySelectorAll('.time').forEach((e) => {
    const t = +e.dataset.t;
    e.textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  });
  show();
  setInterval(() => {
    document.querySelectorAll('.run .time').forEach((e) => { e.dataset.t = Math.max(0, e.dataset.t - 1); });
    show();
  }, 1000);
  // The clock, from the switcher.
  const bar = document.querySelector('.proto-bar');
  bar.insertAdjacentHTML('afterbegin', `<select aria-label="clock">${['off', 'on', 'low'].map((c) =>
    `<option${c === (clock || 'off') ? ' selected' : ''}>${c}</option>`).join('')}</select>`);
  bar.querySelector('select').onchange = (e) => {
    e.stopPropagation();
    if (e.target.value === 'off') params.delete('clock'); else params.set('clock', e.target.value);
    location.search = params.toString();
  };
  const count = params.get('count');
  const mistakes = Draughts.settings.assist === 'mistakes';
  if (!count) {
    // White to move must capture: d4 (two pieces, via f6 to h4) and the king on h6 (two,
    // via f4 to d6). d4 is selected. With mistakes only, d4 was moved toward c5, which
    // isn't legal: c5 flashes and the pieces that must capture pulse.
    Draughts.board(document.getElementById('board'), {
      error: mistakes ? ['c5'] : [],
      white: ['a1', 'c1', 'e1', 'g1', 'b2', 'f2', 'h2', 'c3', 'e3', 'd4', 'h6'],
      black: ['b8', 'd8', 'f8', 'h8', 'a7', 'c7', 'b6', 'e5', 'g5'],
      kings: ['h6'],
      selected: 'd4',
      forced: ['h6'],
      via: ['f6'],
      targets: ['h4'],
      last: ['h4', 'g5'],
    });
  } else {
    // The child's game of 2026-11-09 (International, B:WK1,K21,24,28,31,32,33,45:BK35):
    // black's king on j4 must take four, by h6, b6, b4, and f4 to g5, and nothing said
    // how far it goes. The count says how many, not which.
    const turn = document.querySelector('.turn');
    if (turn) {
      turn.lastChild.textContent = "Black's turn";
      turn.querySelector('.piece').className = 'piece black';
    }
    Draughts.board(document.getElementById('board'), {
      n: 10,
      white: ['b10', 'b6', 'h6', 'e5', 'b4', 'd4', 'f4', 'j2'],
      black: ['j4'],
      kings: ['b10', 'b6', 'j4'],
      forced: ['j4'],
    });
    const n = +(params.get('n') || 4);
    const piece = document.querySelectorAll('#board .sq')[(10 - 4) * 10 + 9].querySelector('.piece');
    const at = (deg, rad) => `left:${50 + 50 * rad * Math.sin(deg * Math.PI / 180)}%;` +
      `top:${50 - 50 * rad * Math.cos(deg * Math.PI / 180)}%`;
    let html = '';
    if (count === 'a' && n <= 5) {
      // On the ring (1.24 radii), 28 degrees apart, centred over the top.
      for (let i = 0; i < n; i++) html += `<i class="pip" style="${at((i - (n - 1) / 2) * 28, 1.24)}"></i>`;
    } else if (count === 'a') {
      html = `<i class="pip num" style="${at(0, 1.24)}">${n}</i>`;
    } else {
      html = `<i class="badge" style="${at(45, 1.2)}">${n}</i>`;
    }
    piece.insertAdjacentHTML('beforeend', `<div class="count">${html}</div>`);
  }
</script>
</body>
</html>

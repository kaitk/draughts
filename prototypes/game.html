<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: game</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* The game screen as built (docs/architecture/rendering.md, "Game screen", "The moves
     panel"), on move 20 of the shared game: the child (white) has just played 33-29, a
     blunder, and it is the computer's turn. Landscape: the board between the way out
     (back, then settings and start over, what each side has taken) and the play (whose
     turn with the lookout's eye, the hint and undo move, the moves panel under it). A
     phone in landscape (under 600 dp tall): narrower panels, back and settings side by
     side, the moves as a line under the catch. Portrait: the way out and the catch with
     the last move over the board, the play under it.
     ?view= a kings' ending of International, the child white against the computer:
       kings    the draw tile with start over, while both sides have a king (&friend=1
                a friend's game: "Draw", which ends the game at once)
       no       the computer refused: a card in the middle over an undimmed board, the
                tile dim for the child's next five moves
       asked    the computer offers a draw, once a game
       giveup   start over from the child's fifth move: give up this game?
       lost     the end's card after giving up
       drawn    the end's card after a draw agreed */
  .game { display: grid; grid-template-columns: var(--side) minmax(0, 1fr) var(--side); gap: 24px; --side: 232px; }
  .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  #board { place-self: center; width: min(var(--h), 100%); }
  .back { flex: none; }
  .way { display: flex; flex-direction: column; gap: 20px; padding: 20px; }
  .way .tile { justify-content: flex-start; }
  .catch { display: grid; gap: 8px; padding: 14px 16px; flex: none; }
  .row { display: flex; height: 32px; }
  .row .piece { width: 32px; margin-right: -15px; }
  .play { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 20px 16px 16px; flex: none; }
  .turn { position: relative; display: grid; justify-items: center; gap: 14px; width: 100%; }
  .turn .piece { width: 72px; }
  .eye { position: absolute; right: 0; top: 8px; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
    background: rgb(0 0 0 / 0.25); color: var(--fg); opacity: 0.55; }
  .eye .icon { width: 28px; height: 28px; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
  .duo .tile { flex-direction: column; gap: 6px; min-height: 132px; min-width: 0; padding: 6px; white-space: normal; text-align: center; }
  .pips { display: flex; gap: 7px; }
  .pips i { width: 12px; height: 12px; border-radius: 50%; background: var(--glow); }
  .moves { flex: 1; min-height: 0; overflow: hidden; padding: 10px 12px; font-size: 20px;
    display: flex; flex-direction: column; justify-content: flex-end; }
  .mrow { display: grid; grid-template-columns: 30px 1fr 1fr; align-items: center; height: 34px; flex: none; }
  .mrow .n { font-size: 17px; color: var(--fg-dim); }
  .mv { justify-self: start; display: flex; gap: 3px; padding: 2px 8px; border-radius: 9px; white-space: nowrap; }
  .mv.lit { background: color-mix(in srgb, var(--glow) 22%, transparent); }
  .line { display: none; position: relative; }
  @container (max-height: 599px) or (orientation: portrait) {
    .way > .copy, .way::after { display: none; }
    .way .tile { background: var(--glass-tint); }
  }
  .pill { display: none; }
  /* A card over the board: the computer's refusal and offer, give up, the end's. */
  .veil { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; pointer-events: none; }
  .veil.dim { background: rgb(0 0 0 / 0.42); }
  .card { display: grid; justify-items: center; gap: 14px; width: min(440px, 100%); padding: 24px; text-align: center; pointer-events: auto; }
  .card h1 { font-size: 32px; }
  .card .pieces { display: flex; gap: 12px; }
  .card .pieces .piece { width: 72px; }
  .card .big { width: 72px; height: 72px; stroke-width: 1.6; }
  .card small.inline .icon { width: 1.7em; height: 1.7em; vertical-align: -0.5em; margin-right: 0.15em; color: var(--fg); }
  .card .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
  .card .two .tile { min-width: 0; padding: 0 10px; }
  .card > .tile { width: 100%; }  /* a lone answer spans the card, as the app's Continue */
  #board.dimmed { filter: brightness(0.55); } /* the app dims in the shaders */

  /* A phone in landscape. */
  @container (max-height: 599px) and (orientation: landscape) {
    .game { --side: 192px; }
    .left { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto 1fr; gap: 12px; }
    .left > .tile, .way .tile { flex-direction: column; gap: 4px; min-height: 96px; min-width: 0; padding: 0; font-size: 20px; }
    .way { display: contents; }
    .way .tile:last-child:nth-child(odd) { grid-column: span 2; }
    .way .tile { justify-content: center; }
    .catch { grid-column: span 2; padding: 10px 14px; }
    .line { display: flex; grid-column: span 2; padding: 6px 8px; font-size: 18px; }
    .line .mrow { grid-template-columns: 24px 1fr 1fr; }
    .line .mv { padding: 2px 4px; }
    .line .chev { position: absolute; right: 8px; top: 4px; }
    .line .chev .icon { width: 20px; height: 20px; }
    .line .mrow { height: 31px; }
    .line .mrow:not(:last-child) { opacity: 0.6; }
    .moves:not(.line) { display: none; }
    .duo { grid-template-columns: 1fr; gap: 10px; }
    .duo .tile { flex-direction: row; min-height: 88px; }
    .play { padding: 12px 12px 12px; gap: 10px; }
  }
  /* Portrait: the bar over the board, the play under it. */
  @container (orientation: portrait) {
    .game { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) auto; }
    .col { display: contents; }
    .left { display: grid; background: var(--glass-tint); border-radius: 28px; }
    .bar { order: 0; display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 12px; padding: 16px; }
    .way { display: contents; }
    .bar .tile { flex-direction: column; gap: 4px; min-height: 96px; min-width: 0; padding: 0; font-size: 20px; justify-content: center; }
    #board { order: 1; width: min(var(--w), 100%); align-self: center; }
    .play { order: 2; display: grid; grid-template-columns: 1fr 1fr; padding: 14px 16px 16px; }
    .turn { grid-column: span 2; display: flex; justify-content: center; align-items: center; gap: 16px; }
    .turn .piece { width: 52px; }
    .eye { top: 2px; }
    .duo { grid-column: span 2; }
    .duo .tile { flex-direction: row; min-height: 88px; }
    .catch, .moves, .line { display: none; }
    .pill { display: grid; grid-template-columns: 1fr auto 1fr; grid-column: span 3; align-items: center; height: 40px; }
    .pill > :first-child { justify-self: start; } .pill > :last-child { justify-self: end; }
    .pill .mv, .pill .card { display: flex; align-items: center; height: 40px; border-radius: 20px; }
    .pill .mv { padding: 0 14px; font-size: 20px; }
    .pill .card { padding: 0 25px 0 10px; }
    .pill .card .row { height: 26px; }
    .pill .card .row .piece { width: 26px; margin-right: -12px; }
    .pill .mv .icon { width: 20px; height: 20px; }
  }
</style>
</head>
<body data-screen="board">
<main class="screen game">
  <div class="col left bar">
    <a class="tile glass back" href="home.html" data-icon="back">Back</a>
    <div class="glass way" id="way">
      <a class="tile" href="settings.html" data-icon="gear">Settings</a>
      <a class="tile" data-icon="restart">Start over</a>
    </div>
    <div class="glass catch" id="catch"></div>
    <div class="glass moves line" id="line"></div>
    <div class="pill" id="pill"></div>
  </div>
  <div id="board"></div>
  <div class="col right">
    <div class="glass play" id="play">
      <div class="turn"><span class="piece solo black ring"></span>Black's turn
        <span class="eye" data-icon="eyeOff"></span></div>
      <div class="duo">
        <a class="tile dim" data-icon="hint">Hint<span class="pips"><i></i><i></i><i></i></span></a>
        <a class="tile" data-icon="undo">Undo move</a>
      </div>
    </div>
    <div class="glass moves" id="moves"></div>
  </div>
  <div class="veil" id="veil" hidden></div>
</main>
<script>
  const PLY = 39, D = Draughts, P = D.PLIES;
  const mv = (i, lit) => (i < PLY ? `<span class="mv${lit ? ' lit' : ''}">${P[i].m}${D.mark(P[i].k)}</span>` : '<span></span>');
  const rows = (from) => {
    let html = '';
    for (let i = from; i < PLY; i += 2) html += `<div class="mrow"><span class="n">${i / 2 + 1}</span>${mv(i, i === PLY - 1)}${mv(i + 1, i + 1 === PLY - 1)}</div>`;
    return html;
  };
  document.getElementById('moves').innerHTML = rows(0);
  document.getElementById('line').innerHTML = rows(PLY - 1 - (PLY - 1) % 2 - 4) + `<span class="chev">${D.icon('right')}</span>`;
  // What each side has taken: black's catch, the white men, over white's (none yet).
  const pos = D.game(PLY);
  const taken = (color, k) => `<div class="row">${`<span class="piece solo ${color}"></span>`.repeat(k)}</div>`;
  document.getElementById('catch').innerHTML = taken('white', 20 - pos.white.length) + taken('black', 20 - pos.black.length);
  // Portrait: each side's catch on a card of its own once it has taken something, the last
  // move's pill between, no strip under them.
  const card = (color, k) => k ? `<div class="glass card">${taken(color, k)}</div>` : '<div></div>';
  document.getElementById('pill').innerHTML = card('white', 20 - pos.white.length) +
    `<span class="glass mv">${Math.ceil(PLY / 2)}. ${P[PLY - 1].m}${D.mark(P[PLY - 1].k)}${D.icon('up')}</span>${card('black', 0)}`;
  const view = new URLSearchParams(location.search).get('view');
  if (view) kings(view); else D.board(document.getElementById('board'), pos);
  D.init();

  // Task 112's states in a kings' ending: white two kings and a man, black two kings.
  function kings(view) {
    const $ = (id) => document.getElementById(id), friend = new URLSearchParams(location.search).has('friend');
    const ended = view === 'lost' || view === 'drawn';
    D.board($('board'), { n: 10, white: ['c3', 'g7', 'b2'], black: ['h8', 'd8'], kings: ['c3', 'g7', 'h8', 'd8'], last: ['f10', 'd8'] });
    if (ended) $('board').classList.add('dimmed');
    const turn = friend ? 'White\'s turn' : 'Your turn';
    $('play').querySelector('.turn').innerHTML = `<span class="piece solo white ring"></span>${turn}<span class="eye" data-icon="eyeOff"></span>`;
    // The draw tile with start over, the bar's fourth in portrait; dim after a refusal.
    if (!ended && view !== 'asked') {
      $('way').insertAdjacentHTML('beforeend', `<a class="tile${view === 'no' ? ' dim' : ''}" href="?view=${friend ? 'drawn&friend=1' : 'no'}" data-icon="handshake">${friend ? 'Draw' : 'Offer draw'}</a>`);
      document.querySelector('.bar').style.setProperty('--n', 4);
    }
    $('way').querySelector('[data-icon=restart]').href = friend ? '?view=kings&friend=1' : '?view=giveup';
    const M = ['41-37', '4-27', '37-46', '27-4', '46-37', '15-4', '37-28', '4-15', '28-46', '15-4', '46-28', '9-4'];
    let rows = '';
    for (let i = 0; i < M.length; i += 2) rows += `<div class="mrow"><span class="n">${48 + i / 2}</span><span class="mv">${M[i]}</span><span class="mv${i + 1 === M.length - 1 ? ' lit' : ''}">${M[i + 1]}</span></div>`;
    $('moves').innerHTML = rows;
    $('line').innerHTML = rows;
    $('pill').innerHTML = `<div></div><span class="glass mv">53. 9-4${D.icon('up')}</span><div></div>`;
    const taken = (color, k) => `<div class="row">${`<span class="piece solo ${color}"></span>`.repeat(k)}</div>`;
    $('catch').innerHTML = taken('white', 10) + taken('black', 11);
    const big = (name) => D.icon(name).replace('class="icon"', 'class="icon big"');
    const card = (html, dim) => { $('veil').hidden = false; $('veil').classList.toggle('dim', dim); $('veil').innerHTML = `<div class="glass card">${html}</div>`; };
    const again = `<div class="two"><a class="tile" href="home.html" data-icon="back">Back</a><a class="tile primary" href="?view=kings" data-icon="restart">Play again</a></div>`;
    if (view === 'no') card(`<div class="pieces">${big('handshakeOff')}</div><h1>No draw</h1>
      <small class="inline">${D.icon('computer')} wants to play on.</small><a class="tile primary" href="?view=kings">Continue</a>`, false);
    if (view === 'asked') card(`<div class="pieces">${big('computer')}${big('handshake')}</div><h1>Draw?</h1>
      <div class="two"><a class="tile primary" href="?view=drawn" data-icon="handshake">Draw</a><a class="tile" href="?view=kings" data-icon="next">Play on</a></div>`, false);
    if (view === 'giveup') card(`${big('flag')}<h1>Give up this game?</h1><small>It counts as a loss.</small>
      <div class="two"><a class="tile" href="?view=lost" data-icon="flag">Give up</a><a class="tile primary" href="?view=kings" data-icon="next">Keep playing</a></div>`, true);
    if (view === 'lost') card(`<div class="pieces"><span class="piece solo black king"></span></div><h1>Black wins</h1><small>White gave up</small>${again}`, false);
    if (view === 'drawn') card(`<div class="pieces"><span class="piece solo white"></span><span class="piece solo black"></span></div><h1>Draw</h1><small>Agreed</small>${again}`, false);
  }
</script>
</body>
</html>

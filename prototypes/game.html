<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kabe: game</title>
<link rel="stylesheet" href="kabe.css">
<script src="kabe.js"></script>
<style>
  .game {
    --gap: 24px;
    --panel: 272px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--gap);
    height: 100%;
    padding: var(--gap);
  }
  /* Landscape: the board fills the height; the panel stands to its right, the side to
     move on top, then undo, hint, restart, and back in a 2×2 grid. */
  #board { width: min(100vh - 2 * var(--gap), 100vw - var(--panel) - 3 * var(--gap)); }
  .panel {
    display: grid;
    justify-items: center;
    align-content: center;
    gap: 22px;
    width: var(--panel);
    height: min(100vh - 2 * var(--gap), 100vw - var(--panel) - 3 * var(--gap));
    padding: 24px;
  }
  .panel .rule { width: 100%; height: 1px; background: rgb(255 255 255 / 0.18); }
  .controls { display: grid; grid-template-columns: repeat(2, 104px); grid-auto-rows: 104px; gap: 16px; }
  .controls .button svg { width: 50px; height: 50px; }
  .turn { display: grid; place-items: center; width: var(--target); height: var(--target); }
  /* The side to move: a piece of its color with a glow ring, no text. */
  .turn .piece { --u: 6px; position: relative; inset: auto; width: 64px; height: 64px;
    box-shadow: 0 3px 0 var(--side), 0 0 0 4px color-mix(in srgb, var(--glow) 80%, transparent),
      0 0 22px 4px color-mix(in srgb, var(--glow) 45%, transparent); }
  /* Portrait: the board fills the width; below it the side to move, then the four
     buttons in a row. */
  @media (orientation: portrait) {
    .game { --panel: 220px; flex-direction: column; }
    #board { width: min(100vw - 2 * var(--gap), 100vh - var(--panel) - 3 * var(--gap)); }
    .panel { width: min(100vw - 2 * var(--gap), 100vh - var(--panel) - 3 * var(--gap)); height: auto; gap: 18px; padding: 18px 24px 22px; }
    .panel .rule { display: none; }
    .controls { grid-template-columns: repeat(4, var(--target)); grid-auto-rows: var(--target); gap: 24px; }
    .controls .button svg { width: 44px; height: 44px; }
  }
</style>
</head>
<body>
<main class="game">
  <div id="board"></div>
  <aside class="panel glass">
    <div class="turn" aria-label="White to move"><div class="piece white"></div></div>
    <div class="rule"></div>
    <div class="controls">
      <button class="button" data-icon="undo" aria-label="Undo"></button>
      <button class="button" data-icon="hint" aria-label="Hint"></button>
      <button class="button" data-icon="restart" aria-label="Restart"></button>
      <button class="button" data-icon="back" aria-label="Back" onclick="location.href='home.html'"></button>
    </div>
  </aside>
</main>
<script>
  Kabe.init();
  // White to move must capture: d4 (two pieces, via f6 to h4) and the king on h6 (two,
  // via f4 to d6). d4 is selected. Black's last move was g7-f6... then f6-g5.
  Kabe.board(document.getElementById('board'), {
    white: ['a1', 'c1', 'e1', 'g1', 'b2', 'f2', 'h2', 'c3', 'e3', 'd4', 'h6'],
    black: ['b8', 'd8', 'f8', 'h8', 'a7', 'c7', 'b6', 'e5', 'g5'],
    kings: ['h6'],
    selected: 'd4',
    forced: ['h6'],
    via: ['f6'],
    targets: ['h4'],
    last: ['h4', 'g5'],
  });
</script>
</body>
</html>

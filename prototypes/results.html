<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: results</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* The results screen as built (docs/architecture/rendering.md, "The results screen"):
     back and the title, the draughts with the player's rating in each on one glass; a
     panel with the rating and the results against each level; the games in that draughts,
     newest first, each row opening its replay. Portrait: the panel above the list.
     A desktop's large window (task 087): the whole at most 1640 dp wide, centered, its
     words larger, taps 64 dp; draughts.css caps every screen at 1.9 times its height. */
  .res { display: flex; flex-direction: column; gap: 20px; }
  .top h1 { flex: 1; text-align: center; }
  .joined .tile { flex-direction: column; gap: 2px; font-size: 20px; }
  .body { flex: 1; min-height: 0; display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 20px; }
  .stats { --r: 24px; display: flex; flex-direction: column; gap: 10px; padding: 20px 24px; align-self: start; }
  .big { font-size: 36px; margin-bottom: 14px; }
  .lv { display: grid; grid-template-columns: 1fr repeat(3, 52px); align-items: center; font-size: 20px; }
  .lv span { display: flex; align-items: center; gap: 4px; }
  .lv .icon { width: 20px; height: 20px; }
  .games { --r: 24px; padding: 12px; overflow: hidden; }
  .game { display: grid; grid-template-columns: 56px 1fr auto 80px; align-items: center; min-height: 88px; padding: 0 16px;
    border-radius: 18px; background: rgb(255 255 255 / 0.06); margin-bottom: 8px; font-size: 22px; }
  .game > .icon { width: 26px; height: 26px; opacity: 0.85; }
  .game small { display: block; }
  .game .chg { justify-self: end; margin-right: 24px; }
  @container (orientation: portrait), (max-height: 599px) {
    .top { flex-wrap: wrap; }
    .top .end { width: 100%; }
    .joined .tile { flex: 1; min-width: 0; }
  }
  @container (orientation: portrait) {
    .body { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .stats { align-self: stretch; }
  }
  @container (max-height: 599px) and (orientation: landscape) {
    .top { flex-wrap: nowrap; }
    .top h1 { display: none; }
    .top .end { width: auto; margin-left: auto; }
    .body { grid-template-columns: 320px minmax(0, 1fr); }
    .big { margin-bottom: 0; }
  }
  @container (min-width: 1700px) and (min-height: 1000px) {
    .res { padding-inline: max(24px, (100% - 1640px) / 2); }
    .top { min-height: 64px; }
    .top h1 { font-size: 44px; }
    .top .tile { min-height: 64px; font-size: 26px; }
    .joined .tile { font-size: 24px; min-width: 170px; }
    .joined small { font-size: 20px; }
    .body { grid-template-columns: 480px minmax(0, 1fr); gap: 24px; }
    .stats { padding: 28px 32px; gap: 14px; }
    .stats small { font-size: 21px; }
    .big { font-size: 56px; }
    .lv { font-size: 26px; grid-template-columns: 1fr repeat(3, 68px); }
    .lv .icon { width: 26px; height: 26px; }
    .games { padding: 16px; }
    .game { font-size: 28px; min-height: 96px; grid-template-columns: 64px 1fr auto 96px; }
    .game small { font-size: 20px; }
    .game > .icon { width: 32px; height: 32px; }
    .mk { font-size: 22px; }
  }
</style>
</head>
<body>
<main class="screen res">
  <div class="top">
    <a class="tile glass" href="home.html" data-icon="back">Back</a><h1>Results</h1>
    <div class="end joined glass"><a class="tile on">International<small>1031</small></a>
      <a class="tile">Brazilian<small>800</small></a><a class="tile">Russian<small>812</small></a></div>
  </div>
  <div class="body">
    <section class="stats glass"><small>Rating</small><div class="big">1031</div>
      <small>Against the computer</small><div id="levels"></div></section>
    <section class="games glass" id="games"></section>
  </div>
</main>
<script>
  const D = Draughts, sign = { won: 'crown', drawn: '', lost: 'x' };
  const res = (r) => (r === 'drawn' ? '<span>=</span>' : D.icon(sign[r]));
  document.getElementById('levels').innerHTML = [['Easy', 590, 6, 1, 0], ['Medium', 1050, 4, 2, 5], ['Hard', 1500, 0, 0, 2]]
    .map(([n, r, w, d, l]) => `<div class="lv">${n} ${r}<span>${D.icon('crown')}${w}</span><span>= ${d}</span><span>${D.icon('x')}${l}</span></div>`).join('');
  document.getElementById('games').innerHTML = [['lost', 'Medium 1050', '2026-11-13', -8, 1], ['won', 'Medium 1050', '2026-11-13', 12, 0],
    ['won', 'Easy 590', '2026-11-12', 2, 0], ['drawn', 'Medium 1050', '2026-11-12', 1, 0], ['won', 'A friend', '2026-11-11', 0, 2],
    ['lost', 'Hard 1500', '2026-11-09', -3, 3]].map(([r, who, when, chg, bl]) =>
    `<a class="game" href="replay.html">${res(r)}<span>${who}<small>${when}</small></span>` +
    `<span class="chg">${who === 'A friend' ? '' : (chg > 0 ? '+' : '') + chg}</span><span>${bl ? `${D.mark('??')} ${bl}` : ''}</span></a>`).join('');
  D.init();
</script>
</body>
</html>

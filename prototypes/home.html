<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: home, title menu</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* Take C: a title screen. The season's photograph and a 3D board set the mood; the
     wordmark and a plain menu of large words sit on one glass column at the side; the
     2D game itself stays on the calm table. Settings are the menu's last row in
     landscape and a quiet button beside the wordmark in portrait, where a row would take
     the board's room. The chosen take (task 008). */
  .home { display: grid; grid-template-columns: 440px 1fr; height: 100%; }
  .menu { display: grid; align-content: center; gap: 10px; padding: 48px 40px; border-radius: 0 32px 32px 0; }
  .menu.glass { --r: 0px; }
  .mark { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .mark .piece { position: relative; inset: auto; width: 56px; height: 56px; --u: 5px; flex: none; }
  .mark h1 { margin: 0; font-size: 64px; font-weight: 400; letter-spacing: 0.06em; }
  .item { display: flex; align-items: center; gap: 18px; min-height: 80px; padding: 0 18px; border-radius: 20px;
    color: var(--fg); text-decoration: none; font-size: 30px; }
  .item:hover { background: rgb(255 255 255 / 0.08); }
  .item .icon { width: 34px; height: 34px; stroke-width: 2.2; opacity: 0.85; }
  .item.primary { background: color-mix(in srgb, var(--glow) 24%, transparent); }
  .item small { margin-left: auto; font-size: 17px; color: var(--fg-dim); }
  /* Beside the wordmark in portrait, one quiet control: the way to settings, which hold
     the language. */
  .tools { display: flex; gap: 8px; margin-left: auto; }
  .tools > * { width: 48px; height: 48px; min-width: 0; border-radius: 16px; display: grid; place-items: center;
    color: var(--fg); text-decoration: none; font-size: 17px; letter-spacing: 0.06em; cursor: pointer;
    background: rgb(255 255 255 / 0.08); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.18); }
  .tools svg { width: 26px; height: 26px; stroke-width: 2; }
  /* A new game (?pick=friend or computer): the column turns into its setup, back and the
     title, then a row of tiles per choice: which draughts (international, the default
     once it exists, Russian 8×8, or Brazilian 8×8), the level against the computer, and the clock (none,
     5+3, 10+5, task 019); then play. A tile is lit as in settings. The choices are kept
     for next time. */
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; font-size: 34px; }
  .head .back { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 16px; color: var(--fg);
    background: var(--button); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.2); }
  .head .back svg { width: 28px; height: 28px; stroke-width: 2.4; }
  .head > .icon { width: 36px; height: 36px; opacity: 0.85; }
  .choose h2 { margin: 10px 4px 2px; font-size: 18px; font-weight: 400; color: var(--fg-dim); letter-spacing: 0.04em; }
  .choose .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .choose .tiles.two { grid-template-columns: repeat(2, 1fr); }
  .pick, .choose a, .head a { text-decoration: none; }
  .pick { display: grid; justify-items: center; align-content: center; gap: 4px; min-height: 76px; padding: 8px 6px;
    border: 0; border-radius: 16px; cursor: pointer; color: var(--fg); font: inherit; font-size: 18px;
    background: var(--button); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.12); }
  .pick.on { background: color-mix(in srgb, var(--glow) 22%, transparent); box-shadow: inset 0 0 0 2px var(--glow); }
  .pick small { font-size: 15px; color: var(--fg-dim); }
  .pick .pips { display: flex; gap: 5px; }
  .pick .pips i { width: 10px; height: 10px; border-radius: 50%; background: currentColor; opacity: 0.25; }
  .pick .pips i.full { opacity: 0.9; }
  .pick .icon { width: 26px; height: 26px; opacity: 0.85; }
  .play { margin-top: 18px; justify-content: center; }
  .stage { display: grid; place-items: center; padding: 40px; overflow: hidden; }
  #board { width: min(70vh, 100%); }
  .tools { display: none; }
  @media (orientation: portrait) {
    .tools { display: flex; }
    .item.settings { display: none; }
    .home { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .stage { grid-row: 1; }
    #board { width: min(80vw, 60vh); }
    .menu { border-radius: 32px 32px 0 0; padding: 32px; }
    .mark { margin-bottom: 12px; }
  }
</style>
</head>
<body>
<main class="home">
  <nav class="menu glass">
    <div class="mark"><div class="piece white king"></div><h1>Draughts</h1>
      <div class="tools"><a href="settings.html" data-icon="gear" aria-label="Settings"></a></div>
    </div>
    <a class="item primary" href="game.html"><span data-icon="next"></span>Continue</a>
    <a class="item" href="?pick=friend"><span data-icon="friend"></span>A friend</a>
    <a class="item" href="?pick=computer"><span data-icon="computer"></span>The computer<small>medium</small></a>
    <a class="item" href="puzzles.html"><span data-icon="puzzle"></span>Puzzles<small>23 / 90</small></a>
    <a class="item settings" href="settings.html"><span data-icon="gear"></span>Settings</a>
  </nav>
  <div class="stage"><div id="board"></div></div>
</main>
<script>
  // The title screen always shows the photograph and the 3D board.
  Draughts.settings.bg = 'photo';
  const params = new URLSearchParams(location.search);
  const pick = params.get('pick');
  if (pick) {
    // The setup's choices, kept in the query: v (variant), level, clock.
    const v = params.get('v') || 'intl', level = params.get('level') || 'medium', clock = params.get('clock') || 'none';
    const link = (k, val) => { const p = new URLSearchParams(location.search); p.set(k, val); return `?${p}`; };
    const tile = (k, val, on, inner) => `<a class="pick${on ? ' on' : ''}" href="${link(k, val)}">${inner}</a>`;
    const pips = (n) => `<span class="pips">${[0, 1, 2].map((i) => `<i class="${i < n ? 'full' : ''}"></i>`).join('')}</span>`;
    const computer = pick === 'computer';
    document.querySelector('.menu').innerHTML =
      `<div class="head"><a class="back" href="home.html" aria-label="Back">${Draughts.icon('back')}</a>` +
      `${Draughts.icon(computer ? 'computer' : 'friend')}${computer ? 'The computer' : 'A friend'}</div>` +
      '<div class="choose"><h2>Draughts</h2><div class="tiles">' +
      tile('v', 'intl', v === 'intl', 'International<small>10 × 10</small>') +
      tile('v', 'russian', v === 'russian', 'Russian<small>8 × 8</small>') +
      tile('v', 'brazilian', v === 'brazilian', 'Brazilian<small>8 × 8</small>') + '</div>' +
      (computer ? '<h2>Level</h2><div class="tiles">' +
        tile('level', 'easy', level === 'easy', `${pips(1)}Easy`) +
        tile('level', 'medium', level === 'medium', `${pips(2)}Medium`) +
        tile('level', 'hard', level === 'hard', `${pips(3)}Hard`) + '</div>' : '') +
      '<h2>Clock</h2><div class="tiles">' +
      tile('clock', 'none', clock === 'none', `${Draughts.icon('clock')}<small>No clock</small>`) +
      tile('clock', '5', clock === '5', '5 min<small>+3 s a move</small>') +
      tile('clock', '10', clock === '10', '10 min<small>+5 s a move</small>') + '</div></div>' +
      `<a class="item primary play" href="game.html${clock === 'none' ? '' : '?clock=on'}"><span data-icon="next"></span>Play</a>`;
  }
  Draughts.init();
  Draughts.board(document.getElementById('board'), {
    view: '3d',
    white: ['a1', 'c1', 'e1', 'g1', 'b2', 'f2', 'h2', 'c3', 'e3', 'd4', 'h6'],
    black: ['b8', 'd8', 'f8', 'h8', 'a7', 'c7', 'b6', 'e5', 'g5'],
    kings: ['h6'],
  });
</script>
</body>
</html>

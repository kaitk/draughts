<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: home</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* Home as built (docs/architecture/rendering.md, "Home"): the sharp photograph and the
     board, a glass column at the left with the wordmark and rows of an icon and a word,
     88 dp tall; the player's chip at the board's top left, a bare X at the screen's top
     right. Portrait: the board on top, the column a sheet under it, settings a gear
     beside the wordmark. New game is outlined under Continue, its note the opponent the
     setup keeps. */
  .home { display: grid; grid-template-columns: 440px 1fr; padding: 0; }
  .menu { --r: 0 32px 32px 0; display: flex; flex-direction: column; justify-content: center; gap: 2px;
    margin-left: calc(-1 * var(--il)); padding: 24px 32px 24px calc(32px + var(--il)); }
  .mark { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .mark .piece { width: 56px; }
  .mark h1 { font-size: 64px; letter-spacing: 0.06em; }
  .gear { display: none; margin-left: auto; }
  .gear .icon { width: 40px; height: 40px; opacity: 0.85; }
  .item { display: flex; align-items: center; gap: 18px; min-height: 88px; padding: 0 18px; border-radius: 20px; font-size: 30px; }
  .item .icon { width: 34px; height: 34px; opacity: 0.85; }
  .item.primary { background: color-mix(in srgb, var(--glow) 24%, transparent); }
  .item small { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .item small .icon { width: 24px; height: 24px; opacity: 0.66; }
  .item small .dots .icon, .item small .streak .icon { opacity: 1; }
  .item.outlined { box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.25); }
  .stage { position: relative; display: grid; place-items: center; padding: 112px 40px 40px; }
  #board { width: min(100%, var(--h) - 88px); }
  .chip { position: absolute; left: 24px; top: 24px; display: flex; align-items: center; }
  .chip .badge { width: 64px; margin: 12px; }
  .chip span:last-child { --r: 22px; padding: 10px 16px 10px 28px; margin-left: -24px; font-size: 30px; }
  .badge { position: relative; display: grid; place-items: center; flex: none; aspect-ratio: 1; }
  .badge .piece { position: absolute; inset: 0; }
  .badge img { position: relative; z-index: 2; width: 56%; opacity: 0.8; }
  .x { position: absolute; right: calc(24px + var(--ir)); top: calc(24px + var(--it)); width: 88px; height: 88px;
    display: grid; place-items: center; opacity: 0.8; }
  .x .icon { width: 34px; height: 34px; stroke-width: 2.8; }
  @container (orientation: portrait) {
    .home { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .stage { grid-row: 1; padding: 112px 24px 24px; }
    #board { width: clamp(128px, var(--h) - 620px, 100%); }
    /* The rows scroll under the wordmark where they do not fit (cut off here). */
    .menu { --r: 32px 32px 0 0; justify-content: start; max-height: calc(var(--h) * 0.62);
      overflow: hidden; margin: 0 calc(-1 * var(--ir)) calc(-1 * var(--ib)) calc(-1 * var(--il));
      padding: 24px calc(32px + var(--ir)) calc(24px + var(--ib)) calc(32px + var(--il)); }
    .gear { display: block; }
    .item.settings { display: none; }
  }
  @container (max-width: 420px) {
    .mark h1 { font-size: 48px; }
  }
  @container (max-height: 599px) and (orientation: landscape) {
    .mark { margin-bottom: 0; }
    .mark h1 { font-size: 48px; }
    .gear { display: block; }
    .item.settings, .item.results { display: none; }
  }
</style>
</head>
<body>
<main class="screen home">
  <nav class="menu glass">
    <div class="mark"><span class="piece solo white king"></span><h1>Draughts</h1>
      <a class="gear" href="settings.html" data-icon="gear" aria-label="Settings"></a></div>
    <a class="item primary" href="game.html" data-icon="next">Continue<small>easy</small></a>
    <a class="item outlined new-game" href="setup.html" data-icon="newGame">New game<small><span data-icon="computer"></span>easy</small></a>
    <a class="item" href="puzzles.html" data-icon="puzzle">Puzzles<small>93 / 222</small></a>
    <a class="item results" href="results.html" data-icon="bars">Results<small>800</small></a>
    <a class="item settings" href="settings.html" data-icon="gear">Settings</a>
  </nav>
  <div class="stage">
    <a class="chip" href="players.html"><span class="badge"><span class="piece solo white"></span>
      <img src="../assets/badges/fox.svg" alt=""></span><span class="glass">Alex</span></a>
    <div id="board"></div>
  </div>
  <a class="x" data-icon="x" aria-label="Close"></a>
</main>
<script>
  Draughts.board(document.getElementById('board'), Draughts.start(8));
  // Task 087's takes: ?daily=a puts today's dots in Puzzles' row in place of the course's
  // count, ?daily=b the dots and the streak of days; ?today=N puzzles solved (2), of 4.
  // ?locked=1, before Today opens: the puzzles solved in the player's draughts, not stars.
  const daily = Draughts.params.get('daily'), today = Number(Draughts.params.get('today') ?? 2);
  if (Draughts.params.get('locked') === '1') {
    document.querySelector('.item[href="puzzles.html"] small').textContent = '31 / 74';
  } else if (daily === 'a' || daily === 'b') {
    document.querySelector('.item[href="puzzles.html"] small').innerHTML =
      (daily === 'b' ? `<span class="streak">${Draughts.icon('flame')}5</span>` : '') + Draughts.dots(today, 4);
  }
  Draughts.init();
</script>
</body>
</html>

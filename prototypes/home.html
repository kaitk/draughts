<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kabe: home</title>
<link rel="stylesheet" href="kabe.css">
<script src="kabe.js"></script>
<style>
  .home {
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100%;
    padding: 48px;
    gap: 32px;
  }
  h1 {
    margin: 0;
    font-size: 64px;
    font-weight: 400;
    letter-spacing: 0.06em;
    text-shadow: 0 2px 18px rgb(0 0 0 / 0.35);
  }
  .tiles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
    align-self: center;
  }
  .tile {
    display: grid;
    place-items: center;
    align-content: center;
    gap: 20px;
    aspect-ratio: 1 / 1.08;
    color: var(--fg);
    text-decoration: none;
    transition: transform 140ms;
  }
  .tile:active { transform: scale(0.97); }
  .tile .icon { width: 120px; height: 120px; stroke-width: 2; }
  /* The computer's level: three dots, the chosen ones filled, the rest rings. */
  .levels { display: flex; gap: 12px; }
  .levels span { width: 18px; height: 18px; border-radius: 50%; background: var(--fg); }
  .levels span.off { background: none; box-shadow: inset 0 0 0 2.5px var(--fg); }
  @media (orientation: portrait) {
    .tiles { grid-template-columns: 1fr; width: min(100%, 520px); justify-self: center; }
    .tile { aspect-ratio: auto; height: 300px; }
  }
</style>
</head>
<body>
<main class="home">
  <h1>Kabe</h1>
  <div class="tiles">
    <a class="tile glass" href="game.html" aria-label="Mängi sõbraga">
      <span data-icon="friend"></span>
    </a>
    <a class="tile glass" href="game.html" aria-label="Mängi arvutiga">
      <span data-icon="computer"></span>
      <span class="levels"><span></span><span></span><span class="off"></span></span>
    </a>
    <a class="tile glass" href="puzzles.html" aria-label="Ülesanded">
      <span data-icon="puzzle"></span>
    </a>
  </div>
</main>
<script>Kabe.init();</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: the player's name</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* Takes on keeping the bare player's chip's name readable on a bright photograph (spring
     and autumn in landscape): ?take=a to e, &season= for one season full size; without
     &season the four seasons at half size, 2 x 2. Home in landscape, 1280 x 800, as
     src/shell/home.goose lays it out: the column's content 360 dp from x 40, the board's side
     from x 440, the chip EDGE (24) from its left and the top, 88 tall, the 64 dp badge in
     its first 88, the name in the rows' face (30) beside it; the bare X top right.

     a: as built, bare.
     b: a soft dark shadow under the name only, wide and faint, as photo apps caption.
        Native: the coverage atlas has no blur, but a ring of six to eight dark copies
        3 dp out at about 10% each comes close: more gui::write calls of three glyphs,
        drawn only when home changes. Cheap. Proposed, if e is not enough on autumn.
     c: a faint dark scrim down from the top edge, behind the chip and the X. Native: one
        gradient quad over the scene before the glass, about as cheap as anything gets,
        but it darkens the photograph's sky on every season.
     d: the name on a small glass pill, the badge bare. Native: gui's glass panel as it
        is, one rounded rect; free in code, but it brings back a shape the bare chip lost.
     e: the pieces' short shadow: the name drawn twice, a dark copy 2 dp down at 50% with
        a touch of spread from the atlas's own soft edge. Native: one more gui::write
        call with an offset and a dark color; nothing new in the shader. The cheapest; it
        sharpens the letters' edges but leaves the bright bokeh behind them. */
  .menu { position: fixed; left: -32px; top: 0; width: 472px; height: 800px; }
  .menu.glass { --r: 32px; }
  .content { position: absolute; left: 72px; top: 123px; width: 360px; display: grid; gap: 2px; }
  .mark { display: flex; align-items: center; gap: 14px; height: 72px; margin-bottom: 34px; }
  .mark .piece { position: relative; inset: auto; width: 56px; height: 56px; --u: 5px; flex: none; }
  .mark h1 { margin: 0; font-size: 64px; font-weight: 400; letter-spacing: 0.06em; white-space: nowrap; }
  .item { display: flex; align-items: center; gap: 18px; height: 88px; padding: 0 18px; border-radius: 20px;
    color: var(--fg); text-decoration: none; font-size: 30px; }
  .item > [data-icon] { display: grid; }
  .item .icon { width: 34px; height: 34px; stroke-width: 2.4; opacity: 0.85; }
  .item.primary { background: color-mix(in srgb, var(--glow) 24%, transparent); }
  .item small { margin-left: auto; font-size: 17px; color: var(--fg-dim); }
  /* The X, bare (gear.html?x=d). */
  .corner { position: fixed; right: 24px; top: 24px; width: 88px; height: 88px; display: grid; place-items: center;
    color: var(--fg); z-index: 3; }
  .corner svg { width: 34px; height: 34px; stroke-width: 2.8; opacity: 0.8; }
  /* The chip: the badge in its first 88 dp, the name beside it. */
  .chip { position: fixed; left: 464px; top: 24px; height: 88px; display: flex; align-items: center; z-index: 3;
    color: var(--fg); font-size: 30px; padding-right: 24px; }
  .chip .face { width: 88px; height: 88px; display: grid; place-items: center; flex: none; }
  .chip .b { position: relative; width: 64px; height: 64px; }
  .chip .b .piece { inset: 0; }
  /* The fox, black in its file, a little faded towards the crown's dark (a mask can't read a file:// image). */
  .chip .b .inlay { position: absolute; inset: 21%; width: 58%; height: 58%; z-index: 1; opacity: 0.8; }
  .chip .name { line-height: 1; white-space: nowrap; position: relative; }
  .scrim { position: fixed; left: 0; right: 0; top: 0; height: 200px; z-index: 0; pointer-events: none;
    background: linear-gradient(rgb(0 0 0 / 0.34), rgb(0 0 0 / 0.16) 45%, transparent); }
  .take-b .name { text-shadow: 0 1px 14px rgb(0 0 0 / 0.55), 0 0 4px rgb(0 0 0 / 0.25); }
  .take-d .name { --r: 22px; padding: 9px 16px 10px; margin-left: -4px; }
  .take-d .name::after { background: color-mix(in srgb, var(--glass-tint), rgb(255 255 255 / 0.06)); }
  .take-e .name { text-shadow: 0 2px 1.5px rgb(0 0 0 / 0.5); }
  /* The four seasons at half size. */
  .grid { position: fixed; inset: 0; display: grid; grid-template-columns: 640px 640px; grid-template-rows: 400px 400px; background: #000; z-index: 10; }
  .grid div { position: relative; overflow: hidden; }
  .grid iframe { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; border: 0; transform: scale(0.5); transform-origin: 0 0; }
  .grid b { position: absolute; left: 8px; bottom: 6px; font: 13px/1 system-ui; color: #fff; background: rgb(0 0 0 / 0.5); padding: 3px 6px; border-radius: 4px; }
</style>
</head>
<body>
<nav class="menu glass"><div class="content">
  <div class="mark"><div class="piece white king"></div><h1>Draughts</h1></div>
  <a class="item primary"><span data-icon="next"></span><span>Continue</span></a>
  <a class="item"><span data-icon="friend"></span><span>A friend</span></a>
  <a class="item"><span data-icon="computer"></span><span>The computer</span><small>medium</small></a>
  <a class="item"><span data-icon="puzzle"></span><span>Puzzles</span><small>23 / 90</small></a>
  <a class="item"><span data-icon="gear"></span><span>Settings</span></a>
</div></nav>
<div class="scrim" hidden></div>
<a class="chip"><span class="face"><span class="b"><span class="piece white"></span><img class="inlay" src="../assets/badges/fox.svg" alt=""></span></span><span class="name">Mia</span></a>
<a class="corner" data-icon="close"></a>
<script>
  const params = new URLSearchParams(location.search);
  const TAKES = ['a', 'b', 'c', 'd', 'e'];
  const take = TAKES.includes(params.get('take')) ? params.get('take') : 'a';
  document.body.classList.add(`take-${take}`);
  document.querySelector('.scrim').hidden = take !== 'c';
  if (take === 'd') document.querySelector('.name').classList.add('glass');
  Draughts.ICONS.close = '<path d="M6 6l12 12"/><path d="M18 6 6 18"/>';
  Draughts.settings.bg = 'photo';
  Draughts.init();
  const bar = document.querySelector('.proto-bar');
  bar.insertAdjacentHTML('afterbegin', `<select aria-label="take">${TAKES.map((k) =>
    `<option${k === take ? ' selected' : ''}>${k}</option>`).join('')}</select>`);
  bar.querySelector('select').onchange = (e) => {
    e.stopPropagation();
    params.set('take', e.target.value);
    location.search = params.toString();
  };
  if (!params.has('season')) {
    const seasons = ['spring', 'summer', 'autumn', 'winter'];
    document.body.insertAdjacentHTML('beforeend', `<div class="grid">${seasons.map((s) =>
      `<div><iframe src="chip.html?take=${take}&season=${s}"></iframe><b>${take}: ${s}</b></div>`).join('')}</div>`);
    document.body.appendChild(bar);
    bar.style.zIndex = 20;
  }
  document.title = `Draughts: the player's name, take ${take}`;
</script>
</body>
</html>

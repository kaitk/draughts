<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: game panel takes</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* Takes on the game screen's controls (task 019), against game.html as it is: the
     user found its four icon tiles confusing in landscape, where undo, restart, and
     back are three arrows and the four dots say nothing. Every take gives each control
     a word beside its icon, as home's rows do, and says whose turn it is in words.
       a: the same controls, labelled; back becomes home, with a house.
       b: no hint button, settings reachable from the game.
       c: the board in the middle; leaving the game (home, settings, start over) on the
          left, playing it (whose turn, take back, move hints) on the right.
       d: c without move hints (they stay in settings), so the right side holds only
          whose turn it is, or the two clocks, and take back.
     ?take=a|b|c, also from the switcher. */
  .game {
    --gap: 24px;
    --panel: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--gap);
    height: 100%;
    padding: var(--gap);
  }
  #board { flex: none; width: min(100vh - 2 * var(--gap), 100vw - var(--panel) - 3 * var(--gap)); }
  .panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: none;
    width: var(--panel);
    height: min(100vh - 2 * var(--gap), 100vw - var(--panel) - 3 * var(--gap));
    padding: 24px;
  }
  .panel .rule { flex: none; height: 1px; margin: 6px 0; background: rgb(255 255 255 / 0.18); }
  .panel .space { flex: 1; }

  /* Whose turn: the piece with its glow ring, and the words. */
  .turn { display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 0 6px; font-size: 28px; }
  .turn .piece { --u: 5px; position: relative; inset: auto; flex: none; width: 52px; height: 52px;
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--glow) 80%, transparent),
      0 0 22px 4px color-mix(in srgb, var(--glow) 45%, transparent); }

  /* A control: a glass tile as wide as the panel, its icon and its word. */
  .row { display: flex; align-items: center; justify-content: flex-start; gap: 16px; min-height: 72px;
    padding: 0 18px; font-size: 26px; text-align: left; white-space: nowrap; }
  .row.button svg { flex: none; width: 34px; height: 34px; stroke-width: 2.2; }
  .row.quiet { padding: 0 6px; background: none; box-shadow: none; }
  .row.quiet:hover { background: var(--button); }

  /* Move hints as a switch: on shows the moves, off marks only mistakes. */
  .switch { position: relative; flex: none; width: 64px; height: 36px; margin-left: auto; border-radius: 18px;
    background: rgb(255 255 255 / 0.12); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.2); }
  .switch::after { content: ''; position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 50%;
    background: rgb(255 255 255 / 0.7); transition: left 150ms; }
  .on .switch { background: color-mix(in srgb, var(--glow) 40%, transparent); box-shadow: inset 0 0 0 1px var(--glow); }
  .on .switch::after { left: 32px; background: var(--glow); }
  .hints svg { opacity: 0.85; }

  /* Take c: two narrower panels either side of the board. */
  .take-c { --side: 232px; }
  .take-c #board { width: min(100vh - 2 * var(--gap), 100vw - 2 * var(--side) - 4 * var(--gap)); }
  .take-c .panel { width: var(--side); height: min(100vh - 2 * var(--gap), 100vw - 2 * var(--side) - 4 * var(--gap)); padding: 20px 16px; }
  .take-c .row { padding: 0 14px; font-size: 24px; gap: 12px; }
  .take-c .turn { flex-direction: column; justify-content: center; gap: 18px; padding: 18px 0 10px; text-align: center; font-size: 26px; }
  .take-c .turn .piece { width: 72px; height: 72px; --u: 7px; }
  .take-c .row.big { flex-direction: column; justify-content: center; gap: 8px; min-height: 132px; font-size: 26px; }
  .take-c .row.big svg { width: 48px; height: 48px; }
  .take-c .hints { flex-wrap: wrap; justify-content: center; row-gap: 14px; padding: 12px 0; }
  .take-c .hints .switch { margin: 0 auto; }
  .take-c .left { order: -1; }

  /* Portrait: the board fills the width; the controls go below it (and in take c,
     the way out goes above it, as a slim bar). */
  @media (orientation: portrait) {
    .game { --panel: 296px; flex-direction: column; }
    #board { width: min(100vw - 2 * var(--gap), 100vh - var(--panel) - 3 * var(--gap)); }
    .panel { display: grid; grid-template-columns: 1fr 1fr; align-content: start; gap: 12px 16px;
      width: min(100vw - 2 * var(--gap), 100vh - var(--panel) - 3 * var(--gap)); height: auto; padding: 20px 24px 24px; }
    .panel .rule, .panel .space { display: none; }
    .turn, .hints { grid-row: 1; }
    .hints { background: none; box-shadow: none; }
    .take-c { --top: 104px; --panel: 200px; }
    .take-c #board { width: min(100vw - 2 * var(--gap), 100vh - var(--panel) - var(--top) - 4 * var(--gap)); }
    .take-c .panel { width: min(100vw - 2 * var(--gap), 100vh - var(--panel) - var(--top) - 4 * var(--gap)); height: auto; padding: 16px 20px; }
    .take-c .left { grid-template-columns: repeat(3, 1fr); }
    .take-c .left .row { justify-content: center; }
    .take-c .right { grid-template-columns: 1fr 1fr; }
    .take-c .turn { flex-direction: row; padding: 0 6px; text-align: left; }
    .take-c .turn .piece { width: 52px; height: 52px; --u: 5px; }
    .take-c .row.big { grid-column: 1 / -1; flex-direction: row; min-height: 80px; }
    .take-c .row.big svg { width: 36px; height: 36px; }
  }
  /* Clocks (?clock=on, or low for white under ten seconds): each side's piece and time.
     The running clock is lit in the glow color and its piece has the glow ring; the
     other is dim. Under ten seconds the running clock turns red. Black's clock is on
     top, as black's side of the board is. In portrait black's clock stands above the
     board, turned to face across the table with ?flip=1, and white's in the panel. */
  .clocks { display: grid; gap: 10px; }
  .clock { display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 0 18px; border-radius: 20px;
    font-size: 40px; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; color: var(--fg-dim);
    background: rgb(255 255 255 / 0.06); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.12); }
  .clock .piece { --u: 4px; position: relative; inset: auto; flex: none; width: 44px; height: 44px; opacity: 0.7; }
  .clock .time { margin-left: auto; }
  .clock.run { color: var(--fg); background: color-mix(in srgb, var(--glow) 18%, transparent); box-shadow: inset 0 0 0 2px var(--glow); }
  .clock.run .piece { opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, var(--glow) 80%, transparent),
      0 0 18px 3px color-mix(in srgb, var(--glow) 45%, transparent); }
  .clock.low { color: var(--forced); background: color-mix(in srgb, var(--forced) 16%, transparent); box-shadow: inset 0 0 0 2px var(--forced); }
  .clock.top { display: none; }
  .take-c .clock { padding: 0 14px; font-size: 36px; }
  @media (orientation: portrait) {
    .game.timed { --top: 72px; }
    .game.timed #board { width: min(100vw - 2 * var(--gap), 100vh - var(--panel) - var(--top) - 4 * var(--gap)); }
    .game.timed .panel { width: min(100vw - 2 * var(--gap), 100vh - var(--panel) - var(--top) - 4 * var(--gap)); }
    .game.timed.take-c { --top: 176px; }
    .clock.top { display: flex; order: -1; flex: none; width: 320px; margin-bottom: calc(-0.5 * var(--gap)); }
    .clock.top.flip { rotate: 180deg; }
    .take-c .left { order: -2; }
    .game.timed.take-d { --top: 104px; }
    .take-d .clock.top { display: none; }
    .take-d .panel .clock.black { display: flex; }
    .take-d .right .clocks { grid-column: 1 / -1; grid-template-columns: 1fr 1fr; }
    .take-d .right .row.big { grid-row: 2; }
    .panel .clocks { grid-row: 1; }
    .panel .clock.black { display: none; }
  }
</style>
</head>
<body data-screen="board">
<main class="game" id="game">
  <div id="board"></div>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const take = params.get('take') || 'a';
  const words = { turn: "White's turn", undo: 'Take back', hint: 'Hint', restart: 'Start over',
    home: 'Home', settings: 'Settings', hints: 'Move hints' };
  const row = (icon, word, cls = '') => `<button class="row button ${cls}"><span data-icon="${icon}"></span>${word}</button>`;
  const clock = params.get('clock');
  const clockOf = (side, t, cls = '') => `<div class="clock ${side} ${cls}"><div class="piece ${side}"></div><span class="time" data-t="${t}"></span></div>`;
  const white = clock === 'low' ? clockOf('white', 9, 'run low') : clockOf('white', 277, 'run');
  const turn = clock ? `<div class="clocks">${clockOf('black', 192)}${white}</div>`
    : `<div class="turn"><div class="piece white"></div>${words.turn}</div>`;
  const hints = () => `<button class="row button quiet hints ${Draughts.settings.assist === 'moves' ? 'on' : ''}" id="assist">` +
    `<span data-icon="dots"></span>${words.hints}<span class="switch"></span></button>`;
  const panel = (cls, html) => `<aside class="panel glass ${cls}">${html}</aside>`;
  const TAKES = {
    a: panel('', turn + '<div class="rule"></div>' + row('undo', words.undo) + row('hint', words.hint) +
      row('restart', words.restart) + '<div class="space"></div><div class="rule"></div>' + hints() +
      row('home', words.home)),
    b: panel('', turn + '<div class="rule"></div>' + row('undo', words.undo) + row('restart', words.restart) +
      '<div class="space"></div><div class="rule"></div>' + hints() + row('gear', words.settings) +
      row('home', words.home)),
    c: panel('left', row('home', words.home) + row('gear', words.settings) + '<div class="space"></div>' +
      row('restart', words.restart)) +
      panel('right', turn + row('undo', words.undo, 'big') + '<div class="space"></div>' + hints()),
    d: panel('left', row('home', words.home) + row('gear', words.settings) + '<div class="space"></div>' +
      row('restart', words.restart)) +
      panel('right', turn + '<div class="space"></div>' + row('undo', words.undo, 'big')),
  };
  const game = document.getElementById('game');
  game.classList.add(`take-${take}`);
  if (take === 'd') game.classList.add('take-c');
  game.insertAdjacentHTML('beforeend', TAKES[take]);
  if (clock) {
    game.classList.add('timed');
    game.insertAdjacentHTML('afterbegin', clockOf('black', 192, `top ${params.get('flip') ? 'flip' : ''}`));
  }
  // The clocks show m:ss; the running one counts down once a second (natively, one
  // frame a second while a clock runs).
  const show = () => document.querySelectorAll('.time').forEach((e) => {
    const t = +e.dataset.t;
    e.textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  });
  show();
  setInterval(() => {
    document.querySelectorAll('.run .time').forEach((e) => { e.dataset.t = Math.max(0, e.dataset.t - 1); });
    show();
  }, 1000);
  game.querySelector('[data-icon="home"]').parentNode.onclick = () => { location.href = 'home-menu.html'; };
  Draughts.init();
  const assist = document.getElementById('assist');
  if (assist) assist.onclick = () => {
    params.set('assist', Draughts.settings.assist === 'moves' ? 'mistakes' : 'moves');
    location.search = params.toString();
  };
  // The take, from the switcher.
  document.querySelector('.proto-bar').insertAdjacentHTML('afterbegin',
    `<select aria-label="take">${Object.keys(TAKES).map((t) => `<option${t === take ? ' selected' : ''}>${t}</option>`).join('')}</select>`);
  document.querySelector('.proto-bar').insertAdjacentHTML('afterbegin',
    `<select aria-label="clock">${['off', 'on', 'low'].map((c) => `<option${c === (clock || 'off') ? ' selected' : ''}>${c}</option>`).join('')}</select>`);
  document.querySelector('.proto-bar select[aria-label="clock"]').onchange = (e) => {
    e.stopPropagation();
    if (e.target.value === 'off') params.delete('clock'); else params.set('clock', e.target.value);
    location.search = params.toString();
  };
  document.querySelector('.proto-bar select[aria-label="take"]').onchange = (e) => {
    e.stopPropagation();
    params.set('take', e.target.value);
    location.search = params.toString();
  };
  // The position of game.html: white must capture; d4 is selected.
  const mistakes = Draughts.settings.assist === 'mistakes';
  Draughts.board(document.getElementById('board'), {
    error: mistakes ? ['c5'] : [],
    white: ['a1', 'c1', 'e1', 'g1', 'b2', 'f2', 'h2', 'c3', 'e3', 'd4', 'h6'],
    black: ['b8', 'd8', 'f8', 'h8', 'a7', 'c7', 'b6', 'e5', 'g5'],
    kings: ['h6'],
    selected: 'd4',
    forced: ['h6'],
    via: ['f6'],
    targets: ['h4'],
    last: ['h4', 'g5'],
  });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: puzzles</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  .puzzles {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 24px;
    height: 100%;
    padding: 24px;
  }
  /* One glass row per theme: capture, become a king, the only safe move. Each row is
     its mark and ten tiles; a tile shows 0 to 3 stars, the next unsolved one a glow
     ring, a locked one a lock. */
  .tiers { display: grid; gap: 20px; align-content: center; }
  .tier { display: grid; grid-template-columns: 88px 1fr; gap: 16px; align-items: center; padding: 16px 18px; }
  .tier .mark { display: grid; place-items: center; }
  .tier .mark .icon { width: 60px; height: 60px; stroke-width: 1.8; }
  .row { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; }
  .puzzle {
    display: grid;
    place-items: center;
    aspect-ratio: 1;
    min-width: 64px;
    border-radius: 18px;
    background: var(--button);
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.1);
  }
  .puzzle .stars { display: flex; gap: 2px; color: var(--glow); }
  .puzzle .stars .icon { width: 18px; height: 18px; stroke-width: 1.5; filter: drop-shadow(0 0 4px color-mix(in srgb, var(--glow) 50%, transparent)); }
  .puzzle .stars .icon.off { color: rgb(255 255 255 / 0.28); filter: none; }
  .puzzle.locked { color: rgb(255 255 255 / 0.3); }
  .puzzle.locked .icon { width: 26px; height: 26px; }
  .puzzle.current { box-shadow: 0 0 0 3px var(--glow), 0 0 18px color-mix(in srgb, var(--glow) 40%, transparent); }
  @media (orientation: portrait) {
    .puzzles { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .puzzles > div:first-child { justify-self: start; }
    .tier { grid-template-columns: 1fr; padding: 14px; gap: 10px; }
    .tier .mark { justify-content: start; }
    .tier .mark .icon { width: 48px; height: 48px; }
    .row { gap: 7px; }
    .puzzle { min-width: 0; border-radius: 14px; }
    .puzzle .stars { gap: 0; }
    .puzzle .stars .icon { width: 14px; height: 14px; }
  }
</style>
</head>
<body>
<main class="puzzles">
  <div><a class="button glass" href="home.html" data-icon="back" aria-label="Back"></a></div>
  <div class="tiers" id="tiers"></div>
</main>
<script>
  Draughts.init();
  // Three themes of ten: the first all done, the second under way, the third locked.
  const stars = [[3, 3, 2, 3, 3, 1, 3, 2, 3, 3], [3, 2, 1, 0, -1, -1, -1, -1, -1, -1], Array(10).fill(-2)];
  const tierIcons = ['target', 'crownLine', 'shield'];
  document.getElementById('tiers').innerHTML = stars.map((row, t) => `
    <section class="tier glass">
      <div class="mark">${Draughts.icon(tierIcons[t])}</div>
      <div class="row">${row.map((s, i) => s === -2
        ? `<div class="puzzle locked">${Draughts.icon('lock')}</div>`
        : `<div class="puzzle${s === 0 ? ' current' : ''}"><span class="stars">${[0, 1, 2].map((k) =>
            Draughts.icon(k < s ? 'star' : 'starOff', k < s ? '' : 'off')).join('')}</span></div>`).join('')}</div>
    </section>`).join('');
</script>
</body>
</html>

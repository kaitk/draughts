<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: puzzles</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* The puzzle picker by theme (task 037): ?take=a, b, c, or now; &view=library or theme;
     &theme=learn, captures, ...; &themes=first or all; &solved=0 to 12 (Learn's solved
     puzzles: the other themes open at 6); &lang=et; &guides outlines each tap.

     a: a list like a library. One glass row per theme (icon, name, n / total, a bar);
        a row opens the theme's page: its name over three level rows of tiles.
     b: large theme tiles. A grid of square glass tiles (a large icon, the name, the
        count and the bar); a tile opens the theme's page, its three levels side by side.
     c: library and theme together. The themes as a column at the left (a strip across
        the top in portrait), the chosen theme's levels beside it; one tap switches.
     now: today's picker, three tiers of ten (task 007).

     Every tap is at least 88 dp (1 px here). Inside a theme everything is open and the
     first puzzle without stars is lit. */
  main { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 24px; }
  .phone main { padding: 16px; }
  h1, h2 { margin: 0; font-weight: 400; }
  .icon { stroke-width: 2.2; }

  /* The header: back, then the screen's title. */
  .head { display: flex; align-items: center; gap: 16px; min-height: 88px; min-width: 0; }
  .head h1 { font-size: 40px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head .count { margin-left: auto; font-size: 22px; color: var(--fg-dim); white-space: nowrap; padding-right: 8px; }
  .head .mark { width: 64px; height: 64px; }
  .head .mark .icon { width: 38px; height: 38px; }
  .phone .head h1 { font-size: 32px; }

  /* A theme's mark: its icon on a disc lit with the glow. Natively an SDF disc and an
     icon. A locked theme's disc is plain, with a lock badge. */
  .mark { position: relative; flex: none; display: grid; place-items: center; border-radius: 50%;
    background: color-mix(in srgb, var(--glow) 20%, transparent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--glow) 45%, transparent); }
  .mark .icon { stroke-width: 2.2; }
  .locked .mark { background: rgb(255 255 255 / 0.06); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.16); }
  .locked .mark > .icon { opacity: 0.45; }
  .badge { position: absolute; right: -4px; bottom: -4px; width: 30px; height: 30px; border-radius: 50%; display: grid;
    place-items: center; background: color-mix(in srgb, var(--glass-tint), rgb(255 255 255 / 0.25)); }
  .badge .icon { width: 18px; height: 18px; stroke-width: 2.4; }

  /* Progress: a bar, the glow's colour over a faint track. */
  .bar { display: block; height: 8px; border-radius: 4px; background: rgb(255 255 255 / 0.14); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: var(--glow);
    box-shadow: 0 0 8px color-mix(in srgb, var(--glow) 60%, transparent); }
  .num { font-size: 22px; color: var(--fg-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hint { font-size: 17px; color: var(--fg-dim); }

  /* A theme as a row (a and c). */
  .theme { display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: 18px; row-gap: 10px;
    align-items: center; min-height: 104px; padding: 14px 22px 14px 18px; color: var(--fg); text-decoration: none; }
  .theme .mark { grid-row: 1 / 3; width: 72px; height: 72px; }
  .theme .mark > .icon { width: 42px; height: 42px; }
  .theme h2 { font-size: 30px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; align-self: end; }
  .theme .num { align-self: end; }
  .theme .bar, .theme .hint { grid-column: 2 / 4; align-self: start; }
  .theme.locked h2 { color: var(--fg-dim); }
  .theme:active { background: rgb(255 255 255 / 0.08); }

  /* a: the library, one column of rows (two in landscape when all eight are shown). */
  .library { display: grid; gap: 12px; align-content: start; }
  .take-a .wrap { max-width: 1180px; min-height: 100%; margin: 0 auto; display: grid; grid-template-columns: 88px 1fr; gap: 24px;
    align-items: start; }
  .take-a .library { grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); max-width: calc(var(--cols, 1) * 600px); width: 100%;
    justify-self: center; align-self: center; gap: 14px; }
  .take-a:not(.phone) .library .theme { min-height: 124px; padding: 18px 26px 18px 20px; column-gap: 22px; }
  .take-a:not(.phone) .library .theme .mark { width: 88px; height: 88px; }
  .take-a:not(.phone) .library .theme .mark > .icon { width: 50px; height: 50px; }
  .take-a:not(.phone) .library .theme h2 { font-size: 34px; }
  .take-a:not(.phone) .library .theme .num { font-size: 24px; }
  .take-a.phone .library .theme { min-height: 96px; padding: 10px 18px 10px 12px; }
  .take-a.phone .library .theme .mark { width: 64px; height: 64px; }
  .take-a.phone .library .theme .mark > .icon { width: 38px; height: 38px; }
  .take-a .library .title { grid-column: 1 / -1; }

  /* A theme's page (a and b): the levels, each a glass row of tiles. */
  .levels { display: grid; gap: 14px; align-content: start; }
  .level { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center; padding: 14px 16px; }
  .lv { display: grid; justify-items: center; gap: 4px; color: var(--fg-dim); font-size: 17px; text-align: center; }
  .lv .icon { width: 40px; height: 40px; color: var(--fg); }
  .tiles { display: flex; flex-wrap: wrap; gap: 10px; }
  .puzzle { display: grid; place-items: center; width: var(--tile); height: var(--tile); flex: none; border-radius: 18px;
    background: var(--button); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.1); color: var(--fg); text-decoration: none; }
  .puzzle .stars { display: flex; gap: 2px; color: var(--glow); }
  .puzzle .stars .icon { width: 20px; height: 20px; stroke-width: 1.5;
    filter: drop-shadow(0 0 4px color-mix(in srgb, var(--glow) 50%, transparent)); }
  .puzzle .stars .icon.off { color: rgb(255 255 255 / 0.28); filter: none; }
  .puzzle.current { box-shadow: 0 0 0 3px var(--glow), 0 0 18px color-mix(in srgb, var(--glow) 40%, transparent); }
  .puzzle:active { background: var(--button-down); }
  .take-b .page { max-width: 1240px; min-height: 100%; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto 1fr; gap: 16px; }
  .take-b .levels { align-content: center; }
  .take-b .levels:not(.cols) { grid-template-columns: minmax(0, max-content); justify-content: center; }
  /* a's theme page: back in the corner, the theme's name over its levels in a column as
     wide as the longest level. */
  .take-a .page { min-height: 100%; display: grid; grid-template-columns: 88px minmax(0, 1fr) 88px; gap: 24px; align-items: start; }
  .take-a .page .col { display: grid; gap: 14px; justify-self: center; align-self: center; max-width: 100%; }
  .take-a .page .col .head { min-height: 72px; padding: 0 4px; }
  .take-a .page .col .head .mark { width: 60px; height: 60px; }
  .take-a.portrait .page { grid-template-columns: minmax(0, 1fr); align-content: start; }
  .take-a.portrait .page .col { align-self: start; justify-self: stretch; }
  .take-a.portrait .page .col .head { padding: 0; }
  .short .col .head { min-height: 64px; }
  .short .levels { gap: 6px; }
  .short .level { padding: 4px 12px; grid-template-columns: 96px 1fr; }
  .short .tiles { gap: 8px; }
  .short.take-a .page .col { gap: 6px; }
  .short.take-a .page .col .head { min-height: 52px; }
  .short.take-a .page .col .head .mark { width: 52px; height: 52px; }
  .short.take-a .page .col .head h1 { font-size: 32px; }
  .narrow .level { grid-template-columns: 1fr; gap: 8px; padding: 12px; }
  .narrow .lv { display: flex; gap: 10px; justify-items: start; }
  .narrow .lv .icon { width: 30px; height: 30px; }

  /* b: the library as a grid of large tiles. */
  .take-b .wrap { display: grid; grid-template-columns: 88px 1fr; gap: 24px; align-items: start; min-height: 100%; }
  .grid { display: grid; grid-template-columns: repeat(var(--cols), var(--card)); gap: 18px; justify-content: center; align-self: center; }
  .grid .title { grid-column: 1 / -1; }
  .card { display: grid; grid-template-rows: 1fr auto auto; justify-items: center; gap: 10px; width: var(--card); height: var(--card-h);
    padding: 18px 20px 20px; color: var(--fg); text-decoration: none; text-align: center; }
  .card .mark { width: calc(var(--card) * 0.46); height: calc(var(--card) * 0.46); align-self: center; max-height: 100%; }
  .card .mark > .icon { width: 58%; height: 58%; stroke-width: 1.8; }
  .card .mark .badge { width: 38px; height: 38px; right: 0; bottom: 0; }
  .card .mark .badge .icon { width: 22px; height: 22px; }
  .card h2 { font-size: 28px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .foot { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; width: 100%; }
  .card .num { font-size: 20px; }
  .card.locked h2 { color: var(--fg-dim); }
  .card .hint { font-size: 16px; grid-column: 1 / -1; }
  .card:active { background: rgb(255 255 255 / 0.08); }
  /* b's theme page: the theme's card opened into a header, the levels as columns. */
  .take-b .levels.cols { grid-template-columns: repeat(var(--lcols, 3), auto); justify-content: center; align-items: start; }
  .take-b .cols .level { grid-template-columns: 1fr; gap: 12px; padding: 16px; align-content: start; }
  .take-b .cols .lv { display: flex; gap: 10px; justify-content: start; }
  .take-b .cols .lv .icon { width: 30px; height: 30px; }
  .take-b .cols .tiles { display: grid; grid-template-columns: repeat(var(--per), var(--tile)); }
  .hero { display: flex; align-items: center; gap: 20px; padding: 0; min-width: 0; }
  .hero .mark { width: 88px; height: 88px; }
  .hero .mark .icon { width: 52px; height: 52px; }
  .hero .text { display: grid; gap: 10px; flex: 1; min-width: 0; max-width: 420px; }
  .hero .text .row { display: flex; align-items: baseline; gap: 16px; min-width: 0; }
  .hero h1 { font-size: 40px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero .num { margin-left: auto; }
  .phone .hero h1 { font-size: 32px; }
  .phone .hero .mark { width: 72px; height: 72px; }

  /* c: library and theme on one screen. */
  /* In landscape the themes and the levels scroll each on their own where they don't fit
     (all eight themes, or Shots' thirty). */
  .take-c:not(.portrait) main { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); grid-template-rows: 100%; gap: 20px;
    overflow: hidden; }
  .take-c:not(.portrait) .side, .take-c:not(.portrait) .levels { max-height: 100%; overflow-y: auto; overflow-x: hidden;
    margin: -6px; padding: 6px; }
  .take-c:not(.portrait) .levels { grid-template-columns: minmax(0, max-content); justify-content: center; align-content: safe center; }
  .side { display: grid; gap: 10px; align-content: start; }
  .side .themes { display: grid; gap: 10px; }
  .side .themes.chips { grid-template-columns: repeat(var(--ccols), 1fr); }
  .side .theme { min-height: 96px; padding: 10px 18px 10px 12px; column-gap: 14px; row-gap: 8px; border-radius: 22px; }
  .side .theme .mark { width: 64px; height: 64px; }
  .side .theme .mark > .icon { width: 38px; height: 38px; }
  .side .theme h2 { font-size: 26px; }
  .side .theme .num { font-size: 19px; }
  .side .theme .hint { font-size: 15px; }
  .side .theme.on { background: color-mix(in srgb, var(--glow) 16%, transparent); box-shadow: inset 0 0 0 2px var(--glow); }
  .side .theme.on h2 { color: var(--fg); }
  .take-c .levels { gap: 14px; }
  .take-c .levels .head h1 { font-size: 34px; }
  .take-c .levels .head .mark { display: none; }
  .take-c .levels .head { min-height: 56px; padding: 0 4px; }
  /* c in portrait: the themes as a strip of square chips across the top. */
  .take-c.portrait main { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr; gap: 16px; }
  .strip { display: grid; grid-template-columns: repeat(var(--n), minmax(88px, 1fr)); gap: 10px; }
  .chip { display: grid; justify-items: center; gap: 8px; padding: 12px 8px 12px; min-height: 88px; border-radius: 22px;
    color: var(--fg); text-decoration: none; }
  .chip .mark { width: 56px; height: 56px; }
  .chip .mark > .icon { width: 34px; height: 34px; }
  .chip .mark .badge { width: 26px; height: 26px; right: -6px; bottom: -6px; }
  .chip .mark .badge .icon { width: 16px; height: 16px; }
  .chip .num { font-size: 17px; }
  .chip .bar { width: 100%; height: 6px; }
  .chip.on { background: color-mix(in srgb, var(--glow) 16%, transparent); box-shadow: inset 0 0 0 2px var(--glow); }
  .chip:active, .side .theme:active { background: rgb(255 255 255 / 0.1); }
  .take-c .topbar { display: flex; align-items: center; gap: 16px; }
  .take-c .topbar h1 { font-size: 34px; }

  /* now: today's picker, three tiers of ten (task 007). */
  .now { display: grid; grid-template-columns: auto 1fr; gap: 24px; height: 100%; }
  .tiers { display: grid; gap: 20px; align-content: center; }
  .tier { display: grid; grid-template-columns: 88px 1fr; gap: 16px; align-items: center; padding: 16px 18px; }
  .tier .tmark { display: grid; place-items: center; }
  .tier .tmark .icon { width: 60px; height: 60px; stroke-width: 1.8; }
  .tier .row { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; }
  .tier .puzzle { width: auto; height: auto; aspect-ratio: 1; min-width: 64px; }
  .tier .puzzle .stars .icon { width: 18px; height: 18px; }
  .tier .puzzle.locked { color: rgb(255 255 255 / 0.3); }
  .tier .puzzle.locked .icon { width: 26px; height: 26px; }
  .portrait .now { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .now > div:first-child { justify-self: start; }
  .portrait .tier { grid-template-columns: 1fr; padding: 14px; gap: 10px; }
  .portrait .tier .tmark { justify-content: start; }
  .portrait .tier .tmark .icon { width: 48px; height: 48px; }
  .portrait .tier .row { gap: 7px; }
  .portrait .tier .puzzle { min-width: 0; border-radius: 14px; }
  .portrait .tier .puzzle .stars { gap: 0; }
  .portrait .tier .puzzle .stars .icon { width: 14px; height: 14px; }

  .guides a, .guides .button { outline: 1px dashed rgb(255 120 120 / 0.8); }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const params = new URLSearchParams(location.search);
  const TAKES = ['a', 'b', 'c', 'now'], VIEWS = ['library', 'theme'];
  const take = TAKES.includes(params.get('take')) ? params.get('take') : 'a';
  const view = VIEWS.includes(params.get('view')) ? params.get('view') : 'library';
  const all = params.get('themes') === 'all';
  const solved = Math.max(0, Math.min(12, +(params.get('solved') ?? 8)));
  const lang = params.get('lang') === 'et' ? 'et' : 'en';
  const S = {
    en: { puzzles: 'Puzzles', back: 'Back', levels: ['Easy', 'Harder', 'Hardest'],
      more: (k) => `Solve ${k} more in Learn`,
      names: { learn: 'Learn', captures: 'Captures', crowning: 'Crowning', shots: 'Shots', kings: 'King shots',
        safe: 'Safe move', endgame: 'Endgame', traps: 'Opening traps' } },
    et: { puzzles: 'Ülesanded', back: 'Tagasi', levels: ['Kerge', 'Raskem', 'Kõige raskem'],
      more: (k) => `Lahenda Õpis veel ${k}`,
      names: { learn: 'Õpi', captures: 'Löömine', crowning: 'Tammiks', shots: 'Kombinatsioonid', kings: 'Tammi löögid',
        safe: 'Ohutu käik', endgame: 'Lõppmäng', traps: 'Avangulõksud' } },
  }[lang];
  document.documentElement.lang = lang;
  document.body.classList.add(`take-${take}`);
  document.body.classList.toggle('guides', params.has('guides'));

  // The themes' icons, on the 24-unit grid of the others.
  Object.assign(Draughts.ICONS, {
    book: '<path d="M12 6.5C10 5 7 4.4 3 4.8v13.4c4-.4 7 .1 9 1.6 2-1.5 5-2 9-1.6V4.8c-4-.4-7 .2-9 1.7z"/><path d="M12 6.5v13.3"/>',
    jumps: '<circle cx="7.5" cy="18" r="2.8"/><circle cx="16.5" cy="18" r="2.8"/><path d="M2.5 15.5C3.5 7.5 11 7.5 12 14.5 13 7.5 20.5 7.5 21.5 15.5"/><path d="M19 14.2l2.5 1.6 1.3-2.7"/>',
    king: '<circle cx="12" cy="12" r="9.5"/><path d="M7 16.2 6.3 9.6l3.1 2.5L12 8l2.6 4.1 3.1-2.5-.7 6.6z"/>',
    shieldOk: '<path d="M12 2.5 4 5.5v6c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10v-6z"/><path d="M8.3 12.2l2.6 2.6 4.8-5"/>',
    flag: '<path d="M5.5 21.5V3"/><path d="M5.5 4h12.5l-2.8 4.3L18 12.6H5.5"/>',
    trap: '<path d="M2.5 15h19"/><path d="M4.5 15a7.5 7.5 0 0 0 15 0"/><path d="M5.5 15l1.6-4 1.6 4 1.6-4 1.7 4 1.6-4 1.6 4 1.6-4 1.7 4"/>',
    level1: '<rect class="solid" x="3" y="14" width="4.6" height="7" rx="1"/><rect x="9.7" y="9.5" width="4.6" height="11.5" rx="1" opacity="0.4"/><rect x="16.4" y="4" width="4.6" height="17" rx="1" opacity="0.4"/>',
    level2: '<rect class="solid" x="3" y="14" width="4.6" height="7" rx="1"/><rect class="solid" x="9.7" y="9.5" width="4.6" height="11.5" rx="1"/><rect x="16.4" y="4" width="4.6" height="17" rx="1" opacity="0.4"/>',
    level3: '<rect class="solid" x="3" y="14" width="4.6" height="7" rx="1"/><rect class="solid" x="9.7" y="9.5" width="4.6" height="11.5" rx="1"/><rect class="solid" x="16.4" y="4" width="4.6" height="17" rx="1"/>',
  });
  const icon = Draughts.icon;

  // The first International set (task 037): the first release's four, then the later
  // four. levels: puzzles per level; done: puzzles solved (stars over 0) in this sample.
  const THEMES = [
    { id: 'learn', icon: 'book', levels: [4, 4, 4], done: solved },
    { id: 'captures', icon: 'jumps', levels: [4, 3, 3], done: 5 },
    { id: 'crowning', icon: 'crownLine', levels: [4, 4, 4], done: 2 },
    { id: 'shots', icon: 'target', levels: all ? [10, 10, 10] : [10, 10], done: 0 },
    { id: 'kings', icon: 'king', levels: [4, 3, 3], done: 0, later: true },
    { id: 'safe', icon: 'shieldOk', levels: [4, 3, 3], done: 0, later: true },
    { id: 'endgame', icon: 'flag', levels: [4, 3, 3], done: 0, later: true },
    { id: 'traps', icon: 'trap', levels: [3, 3, 2], done: 0, later: true },
  ].filter((t) => all || !t.later);
  const OPEN_AT = 6;  // half of Learn
  for (const t of THEMES) {
    t.total = t.levels.reduce((a, b) => a + b, 0);
    t.locked = t.id !== 'learn' && solved < OPEN_AT;
    if (t.locked) t.done = 0;
    // Stars in a pattern a child might leave: mostly 3, some 2, a 1; solved from the start.
    const pat = [3, 3, 2, 3, 1, 3, 2, 3, 3, 2, 3, 3];
    t.stars = Array.from({ length: t.total }, (_, i) => (i < t.done ? pat[(i + t.id.length) % pat.length] : 0));
  }
  const byId = Object.fromEntries(THEMES.map((t) => [t.id, t]));
  const cur = byId[params.get('theme')] && !byId[params.get('theme')].locked ? byId[params.get('theme')] : THEMES[0];

  const go = (changes) => {
    const p = new URLSearchParams(location.search);
    for (const [k, v] of Object.entries(changes)) { if (v === null) p.delete(k); else p.set(k, v); }
    location.search = p.toString();
  };

  // Parts.
  const W = innerWidth, H = innerHeight, landscape = W >= H, phone = Math.min(W, H) < 600;
  document.body.classList.toggle('phone', phone);
  document.body.classList.toggle('portrait', !landscape);
  document.body.classList.toggle('short', landscape && H < 600);
  const tileSize = phone ? 88 : 96;
  document.body.style.setProperty('--tile', `${tileSize}px`);
  const back = (act) => `<a class="button glass" href="#" data-act="${act}" data-icon="back" aria-label="${S.back}"></a>`;
  const bar = (t) => `<span class="bar"><i style="width:${(100 * t.done / t.total).toFixed(1)}%"></i></span>`;
  const mark = (t) => `<span class="mark">${icon(t.icon)}${t.locked ? `<span class="badge">${icon('lock')}</span>` : ''}</span>`;
  const num = (t) => `<span class="num">${t.done} / ${t.total}</span>`;
  const lockHint = () => `<span class="hint">${S.more(OPEN_AT - solved)}</span>`;
  const row = (t, cls = '') => `<a class="theme glass${t.locked ? ' locked' : ''} ${cls}" href="#" data-theme="${t.id}">` +
    `${mark(t)}<h2>${S.names[t.id]}</h2>${t.locked ? '<span></span>' : num(t)}${t.locked ? lockHint() : bar(t)}</a>`;
  const firstOpen = (t) => t.stars.findIndex((s) => s === 0);
  function tiles(t, level) {
    const start = t.levels.slice(0, level).reduce((a, b) => a + b, 0), lit = firstOpen(t);
    let out = '';
    for (let i = start; i < start + t.levels[level]; i++) {
      const s = t.stars[i];
      out += `<a class="puzzle${i === lit ? ' current' : ''}" href="puzzle.html" aria-label="${i + 1}"><span class="stars">${[0, 1, 2].map((k) =>
        icon(k < s ? 'star' : 'starOff', k < s ? '' : 'off')).join('')}</span></a>`;
    }
    return out;
  }
  const levelRow = (t, l) => `<section class="level glass"><div class="lv">${icon(`level${l + 1}`)}<span>${S.levels[l]}</span></div>` +
    `<div class="tiles">${tiles(t, l)}</div></section>`;

  const app = document.getElementById('app');

  function takeA() {
    if (view === 'theme') {
      app.innerHTML = `<div class="page">${landscape ? back('library') : ''}<div class="col"><div class="head">` +
        `${landscape ? '' : back('library')}${mark(cur)}<h1>${S.names[cur.id]}</h1>` +
        `<span class="count">${cur.done} / ${cur.total}</span></div>` +
        `<div class="levels">${cur.levels.map((_, l) => levelRow(cur, l)).join('')}</div></div></div>`;
      fitLevels();
      return;
    }
    // Two columns where all eight rows wouldn't fit in one.
    const cols = landscape && THEMES.length > 4 && W >= 960 ? 2 : 1;
    document.body.style.setProperty('--cols', cols);
    const title = landscape && H < 600 ? '' : `<div class="head title"><h1>${S.puzzles}</h1></div>`;
    app.innerHTML = `<div class="wrap">${back('home')}<div class="library">${title}${THEMES.map((t) => row(t)).join('')}</div></div>`;
    if (!landscape) {
      const wrap = app.querySelector('.wrap');
      wrap.style.gridTemplateColumns = '1fr';
      const lib = app.querySelector('.library');
      if (lib.querySelector('.title')) lib.querySelector('.title').prepend(app.querySelector('.wrap > .button'));
    }
  }

  function takeB() {
    if (view === 'theme') {
      app.innerHTML = `<div class="page"><div class="head">${back('library')}<div class="hero">${mark(cur)}<div class="text">` +
        `<div class="row"><h1>${S.names[cur.id]}</h1>${num(cur)}</div>${bar(cur)}</div></div></div>` +
        `<div class="levels cols">${cur.levels.map((_, l) => levelRow(cur, l)).join('')}</div></div>`;
      // Levels side by side where three columns of at least two tiles fit, else stacked.
      const n = cur.levels.length, room = W - 2 * (phone ? 16 : 24);
      const gap = 14, pad = 32, tg = 10;
      let per = Math.floor(((room - (n - 1) * gap) / n - pad + tg) / (tileSize + tg));
      const most = Math.max(...cur.levels);
      const levels = app.querySelector('.levels');
      if (per >= 2 && Math.ceil(most / Math.min(per, most)) <= 3) {
        // As square as the room allows: the fewest rows for the longest level.
        per = Math.min(per, most);
        const rows = Math.ceil(most / per);
        per = Math.ceil(most / rows);
        levels.style.setProperty('--per', per);
      } else {
        levels.classList.remove('cols');
        fitLevels();
      }
      return;
    }
    const n = THEMES.length;
    const room = W - 2 * (phone ? 16 : 24), roomH = H - 2 * (phone ? 16 : 24);
    let cols, card;
    if (landscape) {
      cols = Math.min(4, n);
      card = Math.floor((room - 88 - 24 - (cols - 1) * 18) / cols);
      const rows = Math.ceil(n / cols);
      card = Math.min(card, 300, Math.floor((roomH - (rows - 1) * 18 - (H < 600 ? 0 : 88 + 18)) / rows / 1.0));
    } else {
      cols = 2;
      const rows = Math.ceil(n / cols);
      card = Math.min(320, Math.floor((room - 18) / 2), Math.floor((roomH - 88 - 18 - (rows - 1) * 18) / rows));
    }
    // A card may be wider than tall where the height is short.
    const cardH = landscape && H < 600 ? Math.min(card, Math.floor((roomH - (Math.ceil(n / cols) - 1) * 18) / Math.ceil(n / cols))) : card;
    document.body.style.setProperty('--cols', cols);
    document.body.style.setProperty('--card', `${card}px`);
    document.body.style.setProperty('--card-h', `${Math.max(cardH, 176)}px`);
    const cardOf = (t) => `<a class="card glass${t.locked ? ' locked' : ''}" href="#" data-theme="${t.id}">${mark(t)}<h2>${S.names[t.id]}</h2>` +
      `<div class="foot">${t.locked ? lockHint() : bar(t) + num(t)}</div></a>`;
    const title = landscape && H < 600 ? '' : `<div class="head title">${landscape ? '' : back('home')}<h1>${S.puzzles}</h1></div>`;
    app.innerHTML = `<div class="wrap">${landscape ? back('home') : ''}<div class="grid">${title}${THEMES.map(cardOf).join('')}</div></div>`;
    if (!landscape) app.querySelector('.wrap').style.gridTemplateColumns = '1fr';
  }

  function takeC() {
    // A theme as a chip: its mark, the count, and the bar; lit when chosen.
    const chip = (t) => `<a class="chip glass${t.locked ? ' locked' : ''}${t === cur ? ' on' : ''}" href="#" data-theme="${t.id}">` +
      `${mark(t)}${t.locked ? '' : `<span class="num">${t.done} / ${t.total}</span>`}${t.locked ? '' : bar(t)}</a>`;
    const levels = `<div class="levels"><div class="head"><h1>${S.names[cur.id]}</h1><span class="count">${cur.done} / ${cur.total}</span></div>` +
      `${cur.levels.map((_, l) => levelRow(cur, l)).join('')}</div>`;
    if (landscape) {
      // The themes as rows where they fit under back, else as chips in a grid (a phone in
      // landscape, or all eight); a chip is about 124 dp tall.
      const n = THEMES.length, roomH = H - 2 * (phone ? 16 : 24) - 88 - 10;
      const rowsFit = n * 96 + (n - 1) * 10 <= roomH;
      let ccols = 2;
      while (Math.ceil(n / ccols) * 134 - 10 > roomH && ccols < 4) ccols++;
      document.body.style.setProperty('--ccols', ccols);
      const side = Math.max(rowsFit ? (phone ? 300 : 380) : (phone ? 0 : 300), ccols * 92 + (ccols - 1) * 10);
      document.body.style.setProperty('--side', `${side}px`);
      app.innerHTML = `<div class="side"><div class="head">${back('home')}${H < 600 ? '' : `<h1>${S.puzzles}</h1>`}</div>` +
        `<div class="themes${rowsFit ? '' : ' chips'}">${THEMES.map((t) => rowsFit ? row(t, t === cur ? 'on' : '') : chip(t)).join('')}</div></div>${levels}`;
    } else {
      const n = THEMES.length, perRow = n > 4 && W < 700 ? 4 : n;
      document.body.style.setProperty('--n', perRow);
      app.innerHTML = `<div class="topbar">${back('home')}<h1>${S.puzzles}</h1></div>` +
        `<div class="strip">${THEMES.map(chip).join('')}</div>${levels}`;
    }
    fitLevels();
  }

  // Today's picker (task 007), as it was.
  function takeNow() {
    const stars = [[3, 3, 2, 3, 3, 1, 3, 2, 3, 3], [3, 2, 1, 0, -1, -1, -1, -1, -1, -1], Array(10).fill(-2)];
    const tierIcons = ['target', 'crownLine', 'shield'];
    app.innerHTML = `<div class="now"><div>${back('home')}</div><div class="tiers">${stars.map((r, t) => `
      <section class="tier glass">
        <div class="tmark">${icon(tierIcons[t])}</div>
        <div class="row">${r.map((s) => s === -2
          ? `<div class="puzzle locked">${icon('lock')}</div>`
          : `<div class="puzzle${s === 0 ? ' current' : ''}"><span class="stars">${[0, 1, 2].map((k) =>
              icon(k < s ? 'star' : 'starOff', k < s ? '' : 'off')).join('')}</span></div>`).join('')}</div>
      </section>`).join('')}</div></div>`;
  }

  // Where the level's mark and its tiles don't fit side by side, the mark goes above.
  function fitLevels() {
    const pad = phone ? 16 : 24, side = take === 'a' && landscape ? 2 * (88 + 24) : take === 'c' && landscape ? parseFloat(
      getComputedStyle(document.body).getPropertyValue('--side')) + 20 : 0;
    for (const lv of app.querySelectorAll('.levels:not(.cols) .level')) {
      const room = W - 2 * pad - side - 32 - 120 - 14;
      if (room < 4 * tileSize + 3 * 10) lv.closest('.levels').classList.add('narrow');
    }
  }

  ({ a: takeA, b: takeB, c: takeC, now: takeNow })[take]();
  balance();
  shrink();

  // A level's tiles in even rows: ten that fit nine to a row go five and five.
  function balance() {
    for (const el of app.querySelectorAll('.levels:not(.cols) .tiles')) {
      el.style.maxWidth = '';
      const gap = parseFloat(getComputedStyle(el).columnGap);
      const count = el.children.length, fit = Math.max(1, Math.floor((el.clientWidth + gap) / (tileSize + gap)));
      if (count <= fit) continue;
      const per = Math.ceil(count / Math.ceil(count / fit));
      el.style.maxWidth = `${per * tileSize + (per - 1) * gap}px`;
    }
  }
  // A name too long for its place gets smaller, down to two thirds, before it is cut.
  function shrink() {
    for (const el of app.querySelectorAll('h1, h2')) {
      const size = parseFloat(getComputedStyle(el).fontSize);
      if (el.scrollWidth <= el.clientWidth + 1) continue;
      el.style.fontSize = `${Math.max(size * 2 / 3, Math.floor(size * el.clientWidth / el.scrollWidth))}px`;
    }
  }

  Draughts.settings.bg = 'photo';
  Draughts.init();
  for (const el of app.querySelectorAll('[data-theme]')) {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      const t = byId[el.dataset.theme];
      if (t.locked) return;
      go(take === 'c' ? { theme: t.id } : { view: 'theme', theme: t.id });
    });
  }
  for (const el of app.querySelectorAll('[data-act]')) {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      if (el.dataset.act === 'home') location.href = 'home.html';
      else go({ view: null });
    });
  }
  addEventListener('resize', () => location.reload());
  // The title says whether the page fits: its content's height, and anything past the
  // right edge or clipped (text cut with an ellipsis).
  let right = 0, bottom = 0, cut = 0, wide = '';
  for (const el of app.querySelectorAll('*')) {
    const r = el.getBoundingClientRect();
    if (r.right > W + 0.5 && !wide) wide = `${el.tagName.toLowerCase()}.${el.getAttribute('class')}`;
    right = Math.max(right, r.right); bottom = Math.max(bottom, r.bottom + app.scrollTop);
    if (/^H[12]$/.test(el.tagName) && el.scrollWidth > el.clientWidth + 1) cut++;
  }
  document.title = `Draughts: puzzles, take ${take}, ${take === 'c' ? cur.id : view}${view === 'theme' && take !== 'c' ? ` ${cur.id}` : ''}` +
    `: content ${Math.round(bottom)} of ${H} dp${right > W + 0.5 ? `, too wide ${Math.round(right)} (${wide})` : ''}${cut ? `, ${cut} cut` : ''}`;

  // The take, view, theme, themes, solved, and language, from the switcher.
  const sw = document.querySelector('.proto-bar');
  const sel = (key, values, v) => `<select aria-label="${key}" data-q="${key}">${values.map((x) =>
    `<option${String(x) === String(v) ? ' selected' : ''}>${x}</option>`).join('')}</select>`;
  sw.insertAdjacentHTML('afterbegin', sel('take', TAKES, take) + sel('view', VIEWS, view) +
    sel('theme', THEMES.map((t) => t.id), cur.id) + sel('themes', ['first', 'all'], all ? 'all' : 'first') +
    sel('solved', [0, 3, 6, 8, 12], solved) + sel('lang', ['en', 'et'], lang));
  for (const s of sw.querySelectorAll('[data-q]')) {
    s.onchange = (e) => { e.stopPropagation(); go({ [s.dataset.q]: e.target.value }); };
  }
</script>
</body>
</html>

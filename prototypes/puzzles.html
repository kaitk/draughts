<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: puzzles</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* The puzzles' library as built (docs/architecture/rendering.md, "Puzzle picker"): back,
     the title bare on the photograph over a dark halo, the draughts switch (the setup's
     tiles joined on one glass), and a glass row per theme: its mark on a disc of the
     glow, its name, its stars, and a bar of them. Two columns in landscape, one in
     portrait, where the switch goes under the title. */
  .lib { display: flex; flex-direction: column; gap: 20px; }
  .top h1 { text-shadow: 0 0 6px rgb(0 0 0 / 0.5), 0 2px 4px rgb(0 0 0 / 0.5); }
  .joined .tile { flex-direction: column; gap: 0; font-size: 20px; border-radius: 22px; }
  .joined .tile small { font-size: 15px; }
  .rows { flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 420px)); justify-content: center; align-content: center; gap: 16px 24px; }
  .theme { --r: 24px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 20px; min-height: 124px; padding: 0 24px; }
  .disc { grid-row: span 2; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center;
    background: color-mix(in srgb, var(--glow) 20%, transparent); }
  .disc .icon { width: 38px; height: 38px; }
  .theme b { font-weight: 400; font-size: 30px; align-self: end; }
  .theme small { align-self: end; display: flex; align-items: center; gap: 6px; }
  .theme small .icon { width: 16px; height: 16px; color: var(--glow); }
  /* How to play's row, and the Today row: across the columns, heading them. */
  .wide { grid-column: 1 / -1; min-height: 104px; }
  .wide .disc { background: color-mix(in srgb, var(--glow) 40%, transparent); }
  .wide.locked .disc { background: rgb(255 255 255 / 0.1); }
  .wide.locked b, .wide.locked .disc .icon { opacity: 0.45; }
  .theme.locked .disc { background: rgb(255 255 255 / 0.1); }
  .theme.locked b, .theme.locked .disc .icon { opacity: 0.45; }
  .theme .note { grid-column: 2; align-self: start; }
  .top .how { padding: 0; }
  .theme.how-end { display: none; }
  .wide .note { grid-column: 2; align-self: start; }
  .mini { grid-row: span 2; display: flex; gap: 10px; }
  .mini .tile { min-width: 0; width: 76px; min-height: 76px; padding: 0; flex-direction: column; gap: 6px; }
  .mini .tile .icon { width: 18px; height: 18px; }
  .mini .rise { display: flex; align-items: end; gap: 3px; height: 18px; }
  .mini .rise i { width: 5px; border-radius: 2px; background: rgb(255 255 255 / 0.3); }
  .mini .rise i.on { background: var(--fg); }
  .mini .st { display: flex; color: var(--glow); }
  .bar { grid-column: 2 / 4; align-self: start; height: 8px; border-radius: 4px; background: rgb(255 255 255 / 0.12); }
  .bar i { display: block; height: 100%; border-radius: inherit; background: var(--glow); }
  @container (max-height: 599px) and (orientation: landscape) {
    .theme { min-height: 96px; }
    .disc { width: 60px; height: 60px; }
    .rows { gap: 12px 16px; }
  }
  @container (orientation: portrait) {
    .top { flex-wrap: wrap; flex: none; }
    .top .end { width: 100%; margin: 0; }
    .joined .tile { flex: 1; min-width: 0; }
    .rows { grid-template-columns: minmax(0, 600px); }
    .theme { min-height: 96px; }
    .rows { align-content: start; }
    .top .how { display: none; }
    .theme.how-end { display: grid; }
    .mini { grid-column: 1 / -1; grid-row: auto; justify-content: space-between; padding-bottom: 16px; }
  }
</style>
</head>
<body>
<main class="screen lib">
  <div class="top">
    <a class="tile glass" href="home.html" data-icon="back">Back</a><h1>Puzzles</h1>
    <div class="end joined glass"><a class="tile on">International<small>10 × 10</small></a>
      <a class="tile">Brazilian<small>8 × 8</small></a><a class="tile">Russian<small>8 × 8</small></a></div>
  </div>
  <div class="rows" id="rows"></div>
</main>
<script>
  const THEMES = [['book', 'Learn', 26, 36], ['captures', 'Captures', 21, 45], ['crown', 'Crowning', 12, 36],
    ['target', 'Shots', 9, 45], ['crown', 'King shots', 3, 30], ['shield', 'Safe move', 22, 30]];
  document.getElementById('rows').innerHTML = THEMES.map(([ic, name, n, all]) =>
    `<a class="theme glass" href="puzzle.html"><span class="disc">${Draughts.icon(ic)}</span><b>${name}</b>` +
    `<small>${Draughts.icon('star')}${n} / ${all}</small><span class="bar"><i style="width:${100 * n / all}%"></i></span></a>`).join('');
  const rows = document.getElementById('rows'), P = Draughts.params, icon = Draughts.icon;
  const howRow = (wide) => `<a class="theme glass${wide ? ' wide' : ''}" href="tutorial.html"><span class="disc">${icon('hint')}</span>` +
    `<b>How to play</b><small>${icon('check')}8 / 8 steps</small><span class="bar"><i style="width:100%"></i></span></a>`;
  // A Today row heads the library with today's puzzles in it as tiles, each its level's
  // bars and its stars, a tile opening its puzzle; ?today=N solved (2) of 4, all solved
  // the moon and "New puzzles tomorrow". How to play is a tile beside the title (the last
  // row in portrait). ?locked=1 before Learn is solved: How to play heads the list and
  // the locked Today ends it.
  const today = Number(P.get('today') ?? 2), locked = P.get('locked') === '1';
  const STARS = [3, 2, 1, 2], LEVEL = [1, 2, 2, 3];
  const left = today >= 4 ? 'New puzzles tomorrow' : `${4 - today} to go`;
  let row = '';
  if (locked) {
    rows.insertAdjacentHTML('beforeend', `<a class="theme glass wide locked"><span class="disc">${icon('lock')}</span><b>Today</b>` +
      `<small class="note">Solve 10 more in Learn</small></a>`);
  } else {
    const tiles = LEVEL.map((lv, i) => {
      const won = i < today ? STARS[i] : 0, lit = i === today ? ' on' : '';
      return `<a class="tile${lit}" href="puzzle.html?daily=1"><span class="rise">${[1, 2, 3].map((k) =>
        `<i class="${k <= lv ? 'on' : ''}" style="height:${6 * k}px"></i>`).join('')}</span>` +
        `<span class="st">${[0, 1, 2].map((k) => icon(k < won ? 'star' : 'starOff')).join('')}</span></a>`;
    }).join('');
    row = `<div class="theme glass wide"><span class="disc">${icon(today >= 4 ? 'moon' : 'today')}</span><b>Today</b>` +
      `<span class="mini">${tiles}</span><small class="note">${left}</small></div>`;
  }
  if (row && !locked) {
    document.querySelector('.top h1').insertAdjacentHTML('afterend',
      `<a class="tile glass how" href="tutorial.html" data-icon="hint" aria-label="How to play"></a>`);
  }
  rows.insertAdjacentHTML('afterbegin', row || howRow(true));
  // In portrait, where the title row has no room for it, How to play ends the list.
  if (row && !locked) rows.insertAdjacentHTML('beforeend', howRow(false).replace('class="theme glass"', 'class="theme glass how-end"'));
  Draughts.init();
</script>
</body>
</html>

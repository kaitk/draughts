<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kabe: puzzles</title>
<link rel="stylesheet" href="kabe.css">
<script src="kabe.js"></script>
<style>
  .puzzles {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 24px;
    height: 100%;
    padding: 24px;
  }
  .tiers { display: grid; gap: 20px; align-content: center; }
  .tier { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; padding: 18px; }
  .tier .mark { display: grid; place-items: center; gap: 6px; }
  .tier .mark .icon { width: 56px; height: 56px; color: var(--glow); }
  .row { display: grid; grid-template-columns: repeat(10, 1fr); gap: 12px; }
  .puzzle {
    display: grid;
    place-items: center;
    gap: 4px;
    aspect-ratio: 1;
    min-width: 64px;
    padding: 6px 0;
    border-radius: 18px;
    background: var(--button);
    font-size: 22px;
  }
  .puzzle .stars { display: flex; gap: 1px; color: var(--glow); }
  .puzzle .stars .icon { width: 16px; height: 16px; stroke-width: 1.5; }
  .puzzle .stars .icon.off { color: rgb(255 255 255 / 0.3); }
  .puzzle.locked { color: rgb(255 255 255 / 0.3); }
  .puzzle.locked .icon { width: 26px; height: 26px; }
  .puzzle.current { box-shadow: 0 0 0 3px var(--glow), 0 0 18px rgb(255 211 110 / 0.4); }
  @media (orientation: portrait) {
    .puzzles { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .puzzles > div:first-child { justify-self: start; }
    .row { gap: 8px; }
    .puzzle { font-size: 20px; border-radius: 14px; }
    .puzzle .stars .icon { width: 13px; height: 13px; }
    .tier { grid-template-columns: 1fr; padding: 14px; }
    .tier .mark { grid-auto-flow: column; justify-content: start; align-items: center; }
  }
</style>
</head>
<body>
<main class="puzzles">
  <div><a class="button glass" href="home.html" data-icon="back" aria-label="Back"></a></div>
  <div class="tiers" id="tiers"></div>
</main>
<script>
  Kabe.init();
  // Three tiers of ten: the first all done, the second under way, the third locked.
  const stars = [[3, 3, 2, 3, 3, 1, 3, 2, 3, 3], [3, 2, 1, 0, -1, -1, -1, -1, -1, -1], Array(10).fill(-2)];
  const tierIcons = ['star', 'crown', 'hint'];
  document.getElementById('tiers').innerHTML = stars.map((row, t) => `
    <section class="tier glass">
      <div class="mark">${Kabe.icon(tierIcons[t])}<span class="caption">${row.filter((s) => s > 0).reduce((a, s) => a + s, 0)} / 30</span></div>
      <div class="row">${row.map((s, i) => s === -2
        ? `<div class="puzzle locked">${Kabe.icon('lock')}</div>`
        : `<div class="puzzle${s === 0 ? ' current' : ''}">${i + 1}<span class="stars">${[0, 1, 2].map((k) =>
            Kabe.icon(k < s ? 'star' : 'starOff', k < s ? '' : 'off')).join('')}</span></div>`).join('')}</div>
    </section>`).join('');
</script>
</body>
</html>

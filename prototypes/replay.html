<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: replay</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* A past game's replay as built (docs/architecture/rendering.md, "A game's replay"), at
     move 20 of the shared game, white's blunder: the steps a column at the board's left,
     the board with the move's mark on its square, and a column with back, the title and
     "Doesn't count", and a glass with the move shown, each side's accuracy, the whole
     list, and the marks' legend. Portrait: the head, the board, the steps in a row, the
     glass. */
  .rep { display: grid; grid-template-columns: 88px auto minmax(300px, 1fr); gap: 24px; }
  .steps { display: flex; flex-direction: column; justify-content: center; gap: 16px; }
  .steps .tile { padding: 0; }
  #board { place-self: center; width: min(var(--h), var(--w) - 88px - 300px - 48px); }
  .col { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .top h1 { font-size: 30px; }
  .pill { white-space: nowrap; padding: 4px 12px; border-radius: 14px; font-size: 17px; background: color-mix(in srgb, var(--glow) 20%, transparent); }
  .list { --r: 24px; flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 14px 16px; font-size: 20px; }
  .shown { display: flex; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid rgb(255 255 255 / 0.12); font-size: 18px; }
  .shown .piece { width: 22px; margin-top: 2px; }
  .acc { display: grid; grid-template-columns: 30px 1fr 1fr; padding: 8px 0 4px; font-size: 17px; }
  .acc span { display: flex; gap: 6px; align-items: center; }
  .acc .piece { width: 20px; }
  .rows { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
  .mrow { display: grid; grid-template-columns: 30px 1fr 1fr; align-items: center; height: 34px; flex: none; }
  .mrow .n { font-size: 17px; color: var(--fg-dim); }
  .mv { justify-self: start; display: flex; gap: 3px; padding: 2px 8px; border-radius: 9px; white-space: nowrap; }
  .mv.lit { background: color-mix(in srgb, var(--glow) 22%, transparent); }
  .mv.after { opacity: 0.55; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; padding-top: 8px; font-size: 15px; color: var(--fg-dim); }
  @container (max-height: 599px) and (orientation: landscape) {
    .top h1 { font-size: 24px; }
    .top .tile { flex-direction: column; gap: 2px; font-size: 20px; padding: 0; }
    .legend { display: none; }
  }
  @container (orientation: portrait) {
    .rep { grid-template-columns: 1fr; grid-template-rows: auto auto auto minmax(0, 1fr); gap: 16px; }
    .col { display: contents; }
    .top { order: -1; }
    .steps { flex-direction: row; justify-content: space-between; }
    .steps .tile { flex: 1; }
    #board { width: min(var(--w), var(--h) - 88px - 88px - 220px - 64px); }
  }
</style>
</head>
<body data-screen="board">
<main class="screen rep">
  <div class="steps">
    <a class="tile glass" data-icon="first"></a><a class="tile glass" data-icon="left"></a>
    <a class="tile glass" data-icon="right"></a><a class="tile glass" data-icon="last"></a>
  </div>
  <div id="board"></div>
  <div class="col">
    <div class="top"><a class="tile glass" href="results.html" data-icon="back">Back</a><h1>Replay</h1><span class="pill">Doesn't count</span></div>
    <section class="list glass">
      <div class="shown"><span class="piece solo white"></span><span>20. 33-29 <i class="mk q2">??</i> Blunder: this move lost much of the chance to win</span></div>
      <div class="acc"><span></span><span><span class="piece solo white"></span>89%</span><span><span class="piece solo black"></span>91%</span></div>
      <div class="rows" id="rows"></div>
      <div class="legend" id="legend"></div>
    </section>
  </div>
</main>
<script>
  const D = Draughts, P = D.PLIES, PLY = 39;
  const mv = (i) => (P[i] ? `<span class="mv${i === PLY - 1 ? ' lit' : i >= PLY ? ' after' : ''}">${P[i].m}${D.mark(P[i].k)}</span>` : '<span></span>');
  let html = '';
  for (let i = 26; i < 52; i += 2) html += `<div class="mrow"><span class="n">${i / 2 + 1}</span>${mv(i)}${mv(i + 1)}</div>`;
  document.getElementById('rows').innerHTML = html;
  document.getElementById('legend').innerHTML = [['*', 'best'], ['?!', 'not the best'], ['?', 'a mistake'], ['??', 'a blunder']]
    .map(([k, w]) => `<span>${D.mark(k)} ${w}</span>`).join('');
  const pos = D.game(PLY);
  D.board(document.getElementById('board'), { ...pos, view: 'flat',
    marks: { [pos.last[1]]: '<span class="mark" style="--c: var(--forced); color: #fff">??</span>' } });
  D.init();
</script>
</body>
</html>

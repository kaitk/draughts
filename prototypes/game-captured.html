<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: captured pieces</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* What each side has captured (task 052), on the game screen as built, flat and raised,
     at every size; and the flat screen in the raised one's look (task 054), which
     game-unified.html sets side by side.
       ?cap=a   in the left side: a third row in the left panel (landscape), a row under
                the bar's tiles (portrait), the bar's middle (compact);
       ?cap=b   on the table at the board's left: a slim tray down the board's left edge
                (landscape, flat now), the free corner under the left panel (corners),
                a strip over and one under the board at the left (portrait), a column
                beside the board (compact);
       ?cap=off none.
     &look=row (the app's pieces, overlapping), pile (stacked discs, seen from the side),
     count (a piece and a number); &state=early (one taken each) or late (12, a king
     among them). Black's catch (the white pieces) sits toward black's side, white's
     toward white's.
     &flat=now (the 2D screen as built), a (framed like the 3D board, seen from above, in
     the built layout, the 3D screen's background), b (a, in the 3D screen's corners
     layout with its floating button); &frame=a (2.4% of the board) or b (4%, as the 3D
     frame reads); &btns=raise or none. &grid shows the sizes side by side. */
  main { position: fixed; inset: 0; }
  .bgl { position: fixed; inset: -80px; z-index: -1; background: var(--page) var(--scene) center / cover no-repeat; }
  .bg-heavy .bgl { filter: blur(30px) brightness(0.72) saturate(0.95); }
  .bg-soft .bgl { filter: blur(9px) brightness(0.92) saturate(1.05); }
  .at { position: absolute; }
  .bare .proto-bar { display: none; }

  /* Tiles, as built (back.html's take b). */
  .panel { display: flex; flex-direction: column; gap: 12px; padding: 20px 16px; }
  .panel .space { flex: 1; }
  .row { display: flex; align-items: center; justify-content: flex-start; gap: 12px; min-height: 88px;
    padding: 0 14px; font-size: 24px; text-align: left; white-space: nowrap; }
  .row.button svg { flex: none; width: 34px; height: 34px; stroke-width: 2.2; }
  .back { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 24px; text-decoration: none; }
  .back svg { width: 34px; height: 34px; stroke-width: 2.2; }
  .row.big { flex-direction: column; justify-content: center; gap: 8px; min-height: 132px; font-size: 24px; text-align: center; }
  .row.big svg { width: 48px; height: 48px; }
  .turn { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 14px 0 6px; font-size: 24px; }
  .turn .piece, .tp { --u: 7px; position: relative; inset: auto; flex: none; width: 72px; height: 72px;
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--glow) 80%, transparent), 0 0 22px 4px color-mix(in srgb, var(--glow) 45%, transparent); }
  .bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 16px; padding: 16px 20px; }
  .bar .row { justify-content: center; }
  .stacked .bar .row { flex-direction: column; justify-content: center; gap: 2px; min-height: 96px; padding: 0 8px; font-size: 20px; }
  .stacked .bar .row svg { width: 32px; height: 32px; }
  .stacked .bar { padding: 12px; gap: 10px; }
  .playp { display: grid; gap: 12px; padding: 16px 20px; align-content: start; }
  .playp .turn { flex-direction: row; justify-content: center; padding: 0; gap: 16px; }
  .playp .turn .piece { width: 52px; height: 52px; --u: 5px; }
  .playp .row.big { flex-direction: row; min-height: 88px; }
  .playp .row.big svg { width: 36px; height: 36px; }
  /* Compact (a small window's portrait): icon-only tiles 72 × 64, the play one row. */
  .cbar { display: flex; align-items: center; gap: 10px; padding: 12px; }
  .cbar .tile { width: 72px; height: 64px; min-height: 64px; min-width: 72px; }
  .cbar .tile svg { width: 32px; height: 32px; }
  .cbar .mid { flex: 1; display: grid; justify-items: center; align-content: center; gap: 4px; min-width: 0; }
  .cplay { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 18px; }
  .cplay .turn { flex-direction: row; padding: 0; gap: 12px; font-size: 22px; flex: 1; }
  .cplay .turn .piece { width: 44px; height: 44px; --u: 4px; }
  .cplay .row.big { flex-direction: row; min-height: 88px; font-size: 22px; padding: 0 18px; }
  .cplay .row.big svg { width: 32px; height: 32px; }

  /* The floating buttons round the board (rendering.md, "The camera buttons"): a shaded
     disc with a hairline and a line icon, no panel. */
  .fb { display: grid; place-items: center; }
  .fb i { display: grid; place-items: center; border-radius: 50%; color: var(--fg);
    background: color-mix(in srgb, var(--glass-tint), rgb(8 14 24 / 0.55));
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.28), 0 4px 10px -2px rgb(0 0 0 / 0.45); }
  .fb svg { width: 56%; height: 56%; stroke-width: 2.4; }

  /* The flat board in the raised one's frame, seen from above (task 054): the frame's
     material as the 3D look's (the theme's frame color, a soft sheen, its rounded
     corners), a light line on its outer edge, the squares set in it by the 2D board's
     own lip, and the 3D board's long soft shadow on the photograph. */
  .frame2d { isolation: isolate; border-radius: 2.2%; background:
      radial-gradient(120% 90% at 20% 10%, rgb(255 255 255 / 0.12), transparent 55%),
      linear-gradient(150deg, color-mix(in srgb, var(--frame), var(--dark) 30%), var(--frame) 55%, color-mix(in srgb, var(--frame), #000 25%));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--light) 30%, transparent),
      inset calc(0.004 * var(--B)) calc(0.004 * var(--B)) calc(0.004 * var(--B)) rgb(255 255 255 / 0.14),
      inset calc(-0.004 * var(--B)) calc(-0.004 * var(--B)) calc(0.005 * var(--B)) rgb(0 0 0 / 0.3),
      0 calc(0.03 * var(--B)) calc(0.045 * var(--B)) calc(-0.004 * var(--B)) rgb(0 0 0 / 0.6),
      0 calc(0.008 * var(--B)) calc(0.014 * var(--B)) rgb(0 0 0 / 0.35); }
  .frame2d .board::before { inset: 0; background-size: 111.11% 111.11%; background-position: 50% 50%; }
  .frame2d .vein { position: absolute; inset: 0; z-index: -2; border-radius: inherit; pointer-events: none; opacity: 0.14;
    background: repeating-radial-gradient(140% 70% at 30% 120%, transparent 0 2.6%, rgb(255 255 255 / 0.35) 2.8% 3%, transparent 3.2% 6.5%); }

  /* What a side has taken: the app's pieces in a row, overlapping. */
  .catch { position: relative; display: block; flex: none; }
  .mini { position: absolute; }
  .mini .piece { inset: 0; }
  /* As piles of discs seen from the side, the men's and the kings'. */
  .pile { position: absolute; bottom: 0; }
  .pile .sh { position: absolute; left: -8%; right: -8%; bottom: -10%; height: 40%; border-radius: 50%;
    background: rgb(0 0 0 / 0.45); filter: blur(3px); }
  .pile .d { position: absolute; left: 0; right: 0; border-radius: 50%;
    background: linear-gradient(90deg, color-mix(in srgb, var(--side), #fff 14%), var(--side) 40%, color-mix(in srgb, var(--side), #000 35%));
    box-shadow: inset 0 -1px 0 rgb(0 0 0 / 0.3); }
  .pile .f { position: absolute; left: 0; right: 0; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgb(255 255 255 / 0.25), transparent 45%),
      radial-gradient(closest-side, var(--face) 0 66%, var(--ring) 70% 78%, var(--face) 82% 92%, var(--rim) 100%);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--face), #fff 25%); }
  .pile .f svg { position: absolute; inset: 14% 26%; width: 48%; height: 72%; color: var(--crown-w); }
  .pile.black .f svg { color: #e9c46a; }
  .pile.white { --face: var(--w-face); --side: color-mix(in srgb, var(--face), #000 30%);
    --ring: color-mix(in srgb, var(--face), #000 13%); --rim: color-mix(in srgb, var(--face), #000 6%); }
  .pile.black { --face: var(--b-face); --side: color-mix(in srgb, var(--face), #000 45%);
    --ring: color-mix(in srgb, var(--face), #fff 16%); --rim: color-mix(in srgb, var(--face), #000 18%); }
  /* As a count: a piece and its number. */
  .count { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .count .mini { position: relative; flex: none; }
  .count b { font-weight: 400; min-width: 1ch; }
  .count .pair { display: flex; align-items: center; gap: 6px; }
  .count.v, .count.v .pair { flex-direction: column; gap: 4px; }
  .count.v { gap: 12px; }
  .tray { display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 14px 0; }
  .tray.glass { --r: 22px; }
  .cappanel { display: grid; gap: 10px; padding: 14px 16px; align-content: center; }
  .caprow { display: flex; align-items: center; gap: 12px; min-height: 36px; }
  .caprow.end { justify-content: flex-end; }
  .loose { display: flex; flex-direction: column; justify-content: space-between; }

  /* The overview: the sizes side by side, each a frame of the page. */
  .sheet { position: static; overflow: auto; height: 100%; padding: 16px 20px 60px; font: 15px/1.4 system-ui, sans-serif; color: #dde; }
  body.sheet-body { overflow: auto; background: #0d1219; }
  .sheet header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 14px; }
  .sheet header h1 { font: 400 22px var(--font); margin: 0 12px 0 0; }
  .sheet select { font: inherit; background: #1d2733; color: #ddd; border: 0; border-radius: 6px; padding: 4px; }
  .shots { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
  .shot { display: grid; gap: 6px; }
  .shot a { color: #9cf; font-size: 13px; }
  .shot .fr { overflow: hidden; border-radius: 10px; box-shadow: 0 0 0 1px #2a3442; }
  .shot iframe { border: 0; transform-origin: 0 0; display: block; }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const P = new URLSearchParams(location.search);
  const get = (k, vals, def) => (vals.includes(P.get(k)) ? P.get(k) : def);
  const cap = get('cap', ['off', 'a', 'b'], 'a');
  const look = get('look', ['row', 'pile', 'count'], 'row');
  const state = get('state', ['early', 'late'], 'late');
  const flat = get('flat', ['now', 'a', 'b'], 'now');
  const frame = get('frame', ['a', 'b'], 'b');
  const btns = get('btns', ['raise', 'none'], 'raise');
  const icon = Draughts.icon;
  Object.assign(Draughts.ICONS, {
    view: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 4v16M4 12h16"/>',
    zoom: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20M10.5 7.5v6M7.5 10.5h6"/>',
    showcase: '<path d="M4.5 12.5 12 9l7.5 3.5L12 16z"/><path d="M3.5 16.5c2.2 2 5.2 3 8.5 3s6.3-1 8.5-3"/><path d="M17.8 20.3l2.7-3.8-4.6-.6"/>',
    raise: '<path d="M12 3 4 7.5v9L12 21l8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/>',
  });

  if (P.has('grid')) sheet(); else screen();

  // The overview: the tablet in landscape, a phone in portrait (the Pixel 7a at the
  // density floor, about 548 × 1218 dp), and the smallest iPad window (499 × 645 dp,
  // compact), flat and raised, each a frame of this page at that size.
  function sheet() {
    document.body.classList.add('sheet-body');
    const app = document.getElementById('app');
    app.className = 'sheet';
    const sel = (k, vals, cur) => `<label>${k} <select data-k="${k}">${vals.map((v) => `<option${v === cur ? ' selected' : ''}>${v}</option>`).join('')}</select></label>`;
    const season = P.get('season') || 'winter';
    const SIZES = [['tablet', 1280, 800, 0.42], ['phone', 548, 1218, 0.36], ['compact', 499, 645, 0.6]];
    const url = (view, w, h) => {
      const q = new URLSearchParams(P); q.delete('grid'); q.set('view', view); q.set('bare', '1'); q.set('season', season);
      return `game-captured.html?${q}`;
    };
    let shots = '';
    for (const [name, w, h, s0] of SIZES) for (const view of ['2d', '3d']) {
      const s = Math.min(s0, (innerWidth - 40) / w);
      const u = url(view, w, h);
      shots += `<div class="shot"><div>${name} ${w} × ${h}, ${view === '3d' ? 'raised' : 'flat'} · <a href="${u.replace('&bare=1', '')}" target="_blank">open</a></div>` +
        `<div class="fr" style="width:${Math.round(w * s)}px;height:${Math.round(h * s)}px"><iframe src="${u}" width="${w}" height="${h}" style="transform:scale(${s})"></iframe></div></div>`;
    }
    app.innerHTML = `<header><h1>Captured pieces</h1>${sel('cap', ['a', 'b', 'off'], cap)}${sel('look', ['row', 'pile', 'count'], look)}` +
      `${sel('state', ['early', 'late'], state)}${sel('flat', ['now', 'a', 'b'], flat)}${sel('season', ['autumn', 'winter', 'spring', 'summer'], season)}` +
      `<a href="game-unified.html" style="color:#9cf">2D and 3D unified →</a></header><div class="shots">${shots}</div>`;
    app.querySelectorAll('select').forEach((s) => s.onchange = () => { P.set(s.dataset.k, s.value); location.search = P.toString(); });
  }

  function screen() {
    if (P.has('bare')) document.body.classList.add('bare');
    Draughts.init();
    const W = innerWidth, H = innerHeight, landscape = W >= H, phone = Math.min(W, H) < 600;
    const three = Draughts.settings.view === '3d';
    const framed = !three && flat !== 'now';
    const corners = landscape && (three || flat === 'b');
    const compact = !landscape && H < 760;
    // The flat screen in the 3D one's portrait order (buttons between the board and the play).
    const order3 = three || flat === 'b';
    document.body.classList.add(three || framed ? 'bg-soft' : 'bg-heavy');
    const app = document.getElementById('app');
    let html = '<div class="bgl"></div>';
    const box = (r, cls, inner = '', extra = '') =>
      `<div class="at ${cls}" style="left:${r[0]}px;top:${r[1]}px;width:${r[2]}px;height:${r[3]}px;${extra}">${inner}</div>`;
    const tile = (ic, word, cls = '') => `<button class="row button ${cls}">${icon(ic)}<span>${word}</span></button>`;

    // The game: early, one piece taken each; late, 12 taken, a black king among them.
    const POS = {
      early: { white: ['a1', 'c1', 'e1', 'g1', 'b2', 'd2', 'f2', 'h2', 'a3', 'e3', 'g3'],
        black: ['b8', 'd8', 'f8', 'h8', 'a7', 'c7', 'e7', 'g7', 'b6', 'd6', 'h6'], kings: [], last: ['d4', 'f6'],
        took: { white: [1, 0], black: [1, 0] } },
      late: { white: ['c1', 'e1', 'g3', 'b4', 'd4', 'h4', 'f6'], black: ['b8', 'd8', 'a7', 'g7', 'c5'], kings: ['f6'],
        last: ['e5', 'f6'], took: { white: [6, 1], black: [5, 0] } },
    }[state];
    // Black's catch is white pieces, white's black ones.
    const caught = { black: { color: 'white', men: POS.took.black[0], kings: POS.took.black[1] },
      white: { color: 'black', men: POS.took.white[0], kings: POS.took.white[1] } };
    // Small kings wear the crown in both views: a stack that small reads as a shadow.
    const kingStyle = 'crown';
    const d = compact ? 22 : phone ? 26 : 32;   // a small piece, dp
    const dt = phone ? 34 : 42;                   // one lying on the table beside the 3D board

    // A side's catch as html with its size: dir h (a row) or v (a column, growing down).
    function catchOf(side, dir = 'h', size = d) {
      const c = caught[side];
      const n = c.men + c.kings;
      if (look === 'count') {
        const one = (king, k) => `<span class="pair"><span class="mini${king && kingStyle === 'stack' ? ' stack' : ''}" style="width:${size}px;height:${size}px">` +
          `<div class="piece ${c.color}${king ? ' king' : ''}"></div></span><b>${k}</b></span>`;
        const fs = Math.round(size * 0.8);
        const v = dir === 'v' ? ' v' : '';
        return { html: `<span class="count${v}" style="font-size:${fs}px">${one(false, c.men)}${c.kings ? one(true, c.kings) : ''}</span>`, w: 0, h: 0 };
      }
      if (look === 'pile') {
        size *= 1.25;
        const e = size * 0.44, t = size * 0.17;
        const pile = (k, king, x, y = 0) => {
          let s = `<span class="pile ${c.color}" style="left:${x}px;bottom:${y}px;width:${size}px;height:${e + k * t}px"><i class="sh"></i>`;
          for (let i = 0; i < k; i++) s += `<i class="d" style="bottom:${i * t}px;height:${e + t}px"></i>`;
          return s + `<i class="f" style="top:0;height:${e}px">${king ? `<svg viewBox="0 0 24 24">${Draughts.ICONS.crown}</svg>` : ''}</i></span>`;
        };
        // The kings' pile beside the men's, or on top of it in a column (a slim tray).
        const hm = c.men ? e + c.men * t : 0, hk = c.kings ? e + c.kings * t : 0;
        const both = c.men && c.kings;
        let s = c.men ? pile(c.men, false, 0) : '';
        if (c.kings) s += dir === 'v' ? pile(c.kings, true, 0, both ? hm + 10 : 0) : pile(c.kings, true, both ? size + 8 : 0);
        const w = dir === 'v' ? size : (c.men ? size : 0) + (c.kings ? size + (both ? 8 : 0) : 0);
        const h = dir === 'v' ? hm + hk + (both ? 10 : 0) : Math.max(hm, hk);
        return { html: `<span class="catch" style="width:${w}px;height:${h}px">${s}</span>`, w, h };
      }
      // A row: men then kings after a small gap, each covering half the one before.
      const step = size * 0.52, gap = size * 0.3;
      let s = '', at = 0;
      for (let i = 0; i < n; i++) {
        const king = i >= c.men;
        if (king && i === c.men && c.men) at += gap;
        const p = dir === 'h' ? `left:${at}px;top:0` : `top:${at}px;left:0`;
        s += `<span class="mini${king && kingStyle === 'stack' ? ' stack' : ''}" style="${p};width:${size}px;height:${size}px;z-index:${i}">` +
          `<div class="piece ${c.color}${king ? ' king' : ''}"></div></span>`;
        at += step;
      }
      const len = n ? at - step + size : 0;
      return { html: `<span class="catch" style="width:${dir === 'h' ? len : size}px;height:${dir === 'h' ? size : len}px">${s}</span>`,
        w: dir === 'h' ? len : size, h: dir === 'h' ? size : len };
    }

    const turn = (cls = '') => `<div class="turn ${cls}"><div class="piece white"></div>White's turn</div>`;
    const undoBig = tile('undo', 'Undo move', 'big');
    const fbuttons = (r, list, touch, disc, row) => {
      let s = '';
      list.forEach((ic, i) => {
        const x = r[0] + (row ? i * (touch + 8) : 0), y = r[1] + (row ? 0 : i * (touch + 8));
        s += box([x, y, touch, touch], 'fb', `<i style="width:${disc}px;height:${disc}px">${icon(ic)}</i>`);
      });
      return s;
    };
    const flatBtns = btns === 'raise' ? ['raise'] : [];
    let boardRect = null;   // flat: the board's square; 3D: the box to fit its bounds in
    let board3dAlign = 'bottom';

    if (landscape && !corners) {
      // The flat screen as built: the board between two panels as tall as it (narrowed to
      // 192 where the board would be under 720); cap b takes a 44 dp tray beside the board.
      const g = 24, tray = cap === 'b' ? 56 : 0;
      let side = 232;
      let B = Math.min(H - 2 * g, W - 2 * side - 4 * g - tray);
      if (B < 720) { side = 192; B = Math.min(H - 2 * g, W - 2 * side - 4 * g - tray); }
      const x0 = (W - (2 * side + 2 * g + tray + B)) / 2, y0 = (H - B) / 2;
      let left = tile('gear', 'Settings') + '<div class="space"></div>';
      if (cap === 'a') {
        left += `<div class="caprow">${catchOf('black').html}</div><div class="caprow">${catchOf('white').html}</div><div class="space"></div>`;
      }
      left += tile('restart', 'Start over');
      html += box([x0, y0, side, 88], 'button glass back', `${icon('back')}<span>Back</span>`);
      html += box([x0, y0 + 100, side, B - 100], 'panel glass', left);
      if (cap === 'b') {
        const v = 'v';
        html += box([x0 + side + g, y0, 44, B], 'tray glass', `${catchOf('black', v).html}${catchOf('white', v).html}`);
      }
      boardRect = [x0 + side + g + tray, y0, B, B];
      html += box([x0 + side + 2 * g + tray + B, y0, side, B], 'panel glass', `${turn()}<div class="space"></div>${undoBig}`);
    } else if (corners) {
      // The 3D screen's corners layout (panel::corners_in): short panels in the top
      // corners, the floating buttons a column under the play panel.
      const g = 24, side = phone ? 192 : 232, tall = Math.min(352, H - 2 * g);
      const touch = phone ? 48 : 56, disc = phone ? 40 : 44;
      html += box([g, g, side, 88], 'button glass back', `${icon('back')}<span>Back</span>`);
      html += box([g, g + 100, side, tall - 100], 'panel glass', `${tile('gear', 'Settings')}<div class="space"></div>${tile('restart', 'Start over')}`);
      html += box([W - g - side, g, side, tall], 'panel glass', `${turn()}<div class="space"></div>${undoBig}`);
      const list = three ? ['view', 'zoom', 'showcase'] : flatBtns;
      html += fbuttons([W - g - touch, g + tall + 12], list, touch, disc, false);
      const under = g + tall + 12;
      if (cap === 'a') {
        html += box([g, under, side, Math.min(124, H - g - under)], 'cappanel glass',
          `<div class="caprow">${catchOf('black').html}</div><div class="caprow">${catchOf('white').html}</div>`);
      } else if (cap === 'b') {
        // On the table under the left panel: black's catch higher, white's by the near edge.
        html += box([g + 6, under + 24, side, H - g - under - 24], 'loose', `<div>${catchOf('black', 'h', dt).html}</div><div>${catchOf('white', 'h', dt).html}</div>`);
      }
      if (three) boardRect = [g, g, W - 2 * g, H - 2 * g];
      else {
        const B = Math.min(H - 2 * g, W - 2 * (g + side + 12));
        boardRect = [(W - B) / 2, (H - B) / 2, B, B];
      }
    } else if (!compact) {
      // Portrait: the bar, the board, (the buttons,) the play, centered down the screen.
      const g = 24;
      const stacked = (W - 2 * g - 72) / 3 < 170;
      document.body.classList.toggle('stacked', stacked);
      const capA = cap === 'a' ? 52 : 0;
      const top = (stacked ? 128 : 120) + capA, bottom = 204;
      const w = W - 2 * g;
      const touch = phone ? 52 : 56, disc = phone ? 42 : 44;
      const list = three ? ['view', 'showcase'] : (flat === 'b' ? flatBtns : []);
      const strip = cap === 'b' ? d + 12 : 0;            // a strip of pieces over the board
      const under = list.length ? touch + 24 : (cap === 'b' ? d + 24 : g);   // between the board and the play
      // The board: flat, a square; raised, about 1.27 times as wide as tall at 65° down.
      const room = H - top - bottom - g - strip - under - 2 * g;
      const bh = three ? Math.min(w / 1.27, room) : Math.min(w, room);
      const bw = three ? w : bh;
      const pw = three || order3 ? w : bw;
      const y0 = (H - (top + g + strip + bh + under + bottom)) / 2;
      const x0 = (W - pw) / 2;
      let bar = `<a class="row button back" href="#">${icon('back')}<span>Back</span></a>${tile('gear', 'Settings')}${tile('restart', 'Start over')}`;
      if (cap === 'a') bar += `<div class="caprow" style="grid-column:1/3">${catchOf('white').html}</div><div class="caprow end">${catchOf('black').html}</div>`;
      html += box([x0, y0, pw, top], 'bar glass', bar);
      const by = y0 + top + g + strip;
      boardRect = [(W - bw) / 2, by, bw, bh];
      board3dAlign = 'middle';
      if (cap === 'b') {
        html += box([x0 + 4, by - strip - 6, pw, d], 'loose', catchOf('black').html, 'justify-content:flex-end');
        html += box([x0 + 4, by + bh + 12, pw, d], 'loose', catchOf('white').html);
      }
      html += fbuttons([x0 + pw - (list.length * touch + (list.length - 1) * 8), by + bh + 12], list, touch, disc, true);
      html += box([x0, by + bh + under, pw, bottom], 'playp glass', `${turn()}${tile('undo', 'Undo move', 'big')}`);
    } else {
      // Compact: icon-only bar (back left, settings and start over right), the play one row.
      const g = 16, top = 88, bottom = 112;
      const touch = 52, disc = 42;
      const list = three ? ['view', 'showcase'] : (flat === 'b' ? flatBtns : []);
      const under = list.length ? touch + 24 : g;
      const side = cap === 'b' ? d + 14 : 0;   // a column of pieces beside the board
      const w = W - 2 * g;
      const room = H - top - bottom - g - under - 2 * g;
      const bh = three ? Math.min(w / 1.27, room) : Math.min(w - 2 * side, room);
      const bw = three ? w : bh;
      const y0 = (H - (top + g + bh + under + bottom)) / 2;
      let mid = '';
      if (cap === 'a') mid = `<div class="caprow" style="min-height:0">${catchOf('black').html}</div><div class="caprow" style="min-height:0">${catchOf('white').html}</div>`;
      html += box([g, y0, w, top], 'cbar glass',
        `<button class="button tile">${icon('back')}</button><div class="mid">${mid}</div><button class="button tile">${icon('gear')}</button><button class="button tile">${icon('restart')}</button>`);
      const by = y0 + top + g;
      boardRect = [(W - bw) / 2, by, bw, bh];
      board3dAlign = 'middle';
      if (cap === 'b') {
        const v = 'v';
        const cx = three ? g : boardRect[0] - side;
        html += box([cx, by + (three ? bh * 0.35 : 0), d, three ? bh * 0.65 : bh], 'loose', `<div>${catchOf('black', v).html}</div><div>${catchOf('white', v).html}</div>`, 'align-items:flex-start');
      }
      html += fbuttons([g + w - (list.length * touch + (list.length - 1) * 8), by + bh + 12], list, touch, disc, true);
      html += box([g, by + bh + under, w, bottom], 'cplay glass', `${turn()}${tile('undo', 'Undo move', 'big')}`);
    }

    // The board.
    const opts = { white: POS.white, black: POS.black, kings: POS.kings, last: POS.last, view: three ? '3d' : '2d' };
    if (three) {
      // In a container of its width, so the stand-in's cqw (its perspective) scale with it.
      html += '<div id="wrap3" class="at" style="left:0;top:0;width:1000px;container-type:inline-size"><div id="board" style="width:100%"></div></div>';
    } else if (framed) {
      const f = (frame === 'a' ? 0.024 : 0.04) * boardRect[2];
      html += box(boardRect, 'frame2d', `<div class="vein"></div><div id="board" style="position:absolute;inset:${f}px"></div>`, `--B:${boardRect[2]}px`);
    } else {
      html += box(boardRect, '', '<div id="board" style="width:100%"></div>');
    }
    app.innerHTML = html;
    const el = document.getElementById('board');
    Draughts.board(el, opts);
    if (three) {
      // Fit the CSS stand-in's bounds into the box: as large as fits, landscape's near edge
      // on the bottom margin and its far edge between the corner panels.
      el.style.transform = `perspective(170cqw) rotateX(${landscape ? 40 : 28}deg)`;
      const wrap = document.getElementById('wrap3');
      const r0 = el.getBoundingClientRect();
      const [bx, byy, bw, bh] = boardRect;
      let k = Math.min(bw / r0.width, bh / (r0.height * 1.04));
      if (landscape) k *= 0.84;   // the far edge clear of the corner panels, as the app's fit leaves it
      wrap.style.width = `${1000 * k}px`;
      const r1 = el.getBoundingClientRect();
      const dx = bx + (bw - r1.width) / 2 - r1.left;
      const dy = (board3dAlign === 'bottom' ? byy + bh - r1.height * 1.04 : byy + (bh - r1.height * 1.04) / 2) - r1.top;
      wrap.style.left = `${dx}px`;
      wrap.style.top = `${dy}px`;
    }
    Draughts.paint();
    Draughts.syncGlass();
    requestAnimationFrame(() => { Draughts.paint(); Draughts.syncGlass(); });

    // The takes, from the switcher.
    const bar = document.querySelector('.proto-bar');
    const sel = (key, values, current) => `<select data-k="${key}" aria-label="${key}">${values.map((v) =>
      `<option${v === current ? ' selected' : ''}>${v}</option>`).join('')}</select>`;
    bar.insertAdjacentHTML('afterbegin', sel('cap', ['a', 'b', 'off'], cap) + sel('look', ['row', 'pile', 'count'], look) +
      sel('state', ['early', 'late'], state) + sel('flat', ['now', 'a', 'b'], flat) + sel('frame', ['a', 'b'], frame) +
      sel('btns', ['raise', 'none'], btns));
    bar.querySelectorAll('select[data-k]').forEach((s) => s.onchange = (e) => {
      e.stopPropagation();
      P.set(s.dataset.k, s.value);
      location.search = P.toString();
    });
  }
</script>
</body>
</html>

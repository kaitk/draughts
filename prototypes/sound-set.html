<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: the sound set</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<script src="samples/samples.js"></script>
<script src="sound.js"></script>
<style>
  /* The sound set (task 089): every sound the first version makes, each to play, then
     the takes on the five not chosen by ear (a puzzle solved, a game won, lost or drawn,
     the clock at gold and at red), each one tap to choose; the choice shows in the set
     and in the URL (&solved= &win= &end= &gold= &red=), to send back. The move and the
     take are Freesound hits (samples/samples.js, tools/sound_samples.py); the rest are
     synthesized in sound.js, as the app would. */
  body { overflow: hidden; }
  .set { position: fixed; inset: 0; display: grid; place-items: start center; padding: 16px; }
  .panel { --r: 28px; border-radius: 28px; width: min(860px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 16px 22px 24px;
    scrollbar-width: thin; }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 6px; }
  .head h1 { margin: 0; font-size: 32px; font-weight: 400; flex: 1; }
  .head label { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--fg-dim); }
  .head input { width: 160px; accent-color: var(--glow); }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 52px; padding: 0 20px; border-radius: 26px; border: 0; cursor: pointer;
    color: var(--fg); font: inherit; font-size: 17px; text-decoration: none; white-space: nowrap; background: var(--button); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.16); }
  .pill .icon { width: 22px; height: 22px; stroke-width: 2.2; }
  .lead { margin: 4px 0 10px; font-size: 15px; line-height: 1.35; color: var(--fg-dim); }
  h2 { margin: 18px 0 2px; font-size: 22px; font-weight: 400; }
  h2 small { font-size: 15px; color: var(--fg-dim); margin-left: 6px; }
  .row { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; padding: 8px 0; }
  .row + .row { border-top: 1px solid rgb(255 255 255 / 0.08); }
  .row.on { background: linear-gradient(90deg, color-mix(in srgb, var(--glow) 12%, transparent), transparent 70%); border-radius: 14px; }
  .play { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; border: 0;
    color: var(--fg); background: var(--button); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.16); }
  .play .icon { width: 24px; height: 24px; }
  .row b { font-weight: 400; font-size: 18px; }
  .row p { margin: 2px 0 0; font-size: 15px; line-height: 1.3; color: var(--fg-dim); }
  .tag { padding: 4px 12px; border-radius: 10px; font-size: 14px; white-space: nowrap; border: 0; font: inherit; font-size: 14px; color: var(--fg); }
  .tag.chosen { background: color-mix(in srgb, var(--glow) 30%, transparent); }
  .tag.choose { background: rgb(255 255 255 / 0.12); cursor: pointer; }
  .tag.from { background: rgb(0 0 0 / 0.25); color: var(--fg-dim); }
  ul.skipped { margin: 6px 0 0; padding-left: 20px; font-size: 15px; line-height: 1.5; color: var(--fg-dim); }
  .warn { padding: 10px 14px; border-radius: 12px; background: rgb(160 40 30 / 0.35); font-size: 15px; }
</style>
</head>
<body>
<main class="set"><div class="panel glass" id="panel"></div></main>
<script>
  const P = new URLSearchParams(location.search);
  const icon = Draughts.icon;
  const playIcon = '<svg class="icon" viewBox="0 0 24 24"><path class="solid" d="M8 5.5v13l10.5-6.5z"/></svg>';

  // ---- Playing -----------------------------------------------------------------------
  let ctx = null, level = Math.max(0, Math.min(1, +(P.get('level') || 0.5)));
  const gainOf = (v) => (v <= 0 ? 0 : Math.pow(10, (v - 1) * 36 / 20));   // as the Volume slider
  function start(t, gain, when = 0) {
    if (!ctx) ctx = new AudioContext({ sampleRate: RATE });
    if (ctx.state === 'suspended') ctx.resume();
    const buf = ctx.createBuffer(1, t.x.length, t.rate || RATE); buf.copyToChannel(t.x, 0);
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = buf; src.playbackRate.value = t.pitch || 1; g.gain.value = gainOf(level) * gain;
    src.connect(g).connect(ctx.destination); src.start(ctx.currentTime + when);
  }
  const cache = {};
  const made = (key, make) => (cache[key] = cache[key] || make());
  const pick = (list) => list[Math.floor(Math.random() * list.length)];

  // ---- The takes on the five chosen by ear here ----------------------------------------
  // Each [title, what, make]; made once, matched in loudness (even), played at M.
  const M = 0.1;
  const H = HZ;
  const thrice = (b) => at(0.17, [b, b, b]);
  const OPTIONS = {
    solved: {
      mallet: ['Mallet notes', 'Three soft marimba notes up', () => at(0.12, [note(H.D5, 0.45), note(H['F#5'], 0.45), note(H.A5, 0.8)])],
      harp: ['Harp', 'Four notes swept up, quick, left to ring', () => at(0.08, [H.D5, H['F#5'], H.A5, H.D6].map((f, k) => harp(f, 2, 201 + k)))],
      celesta: ['Celesta', 'Two small bright notes, up a fourth', () => at(0.12, [celesta(H.A5), celesta(H.D6)])],
      kannel: ['Kannel', 'Three plucks up, as the crowning\'s instrument', () => at(0.12, [H.D5, H['F#5'], H.A5].map((f, k) => pluck(f, 1.6, 211 + k)))],
      kalimba: ['Kalimba', 'Three thumb-piano notes up', () => at(0.12, [H.D5, H['F#5'], H.A5].map(kalimba))],
      lute: ['Lute', 'Two plucks, up a fifth', () => at(0.14, [lute(H.A4), lute(H.E5)])],
      pizz: ['Pizzicato strings', 'Three plucked string notes up', () => at(0.1, [H.D5, H.A5, H.D6].map((f, k) => pizz(f, 221 + k)))],
      bell: ['A soft bell', 'One quiet ring', () => bell(H.D6)],
    },
    win: {
      marimba: ['Marimba', 'Three soft mallet notes up', () => at(0.14, [note(H.D4, 0.5), note(H.A4, 0.5), note(H.D5, 0.7)])],
      treasure: ['Harp sweep and horns', 'A quick harp sweep up, soft horns swelling under it: an old strategy game\'s treasure, our own notes',
        () => mix([[0, at(0.035, [H.D4, H.E4, H['F#4'], H.A4, H.B4, H.D5, H.E5, H['F#5'], H.A5].map((f, k) => harp(f, 2.2, 231 + k)))],
          [0.25, horn(H.D4, 0.8), 0.5], [0.25, horn(H.A4, 0.8), 0.4], [0.25, horn(H['F#4'], 0.8), 0.3]])],
      horns: ['Soft horns', 'A short call up a fourth over a low D', () => mix([[0, horn(H.A4, 0.16)], [0.22, horn(H.D5, 0.7)], [0.22, horn(H.D4, 0.7), 0.55]])],
      harp: ['Harp, slowly', 'Five notes up, unhurried, the last left to ring', () => at(0.14, [H.D4, H.A4, H.D5, H['F#5'], H.A5].map((f, k) => harp(f, 2.4, 241 + k)))],
      lute: ['Lute', 'A strummed chord, then one high note', () => mix([[0, at(0.03, [H.D4, H.A4, H.D5, H['F#5']].map((f, k) => lute(f, 1.6, 251 + k)))], [0.32, lute(H.A5, 1.4, 259)]])],
      strings: ['Strings', 'A D major chord swelling and fading, a second long', () => pad([H.D4, H['F#4'], H.A4, H.D5], 0.9)],
      kannel: ['Kannel, a strum', 'Five strings plucked upward, quickly, left to ring', () => at(0.07, [H.D4, H['F#4'], H.A4, H.D5, H['F#5']].map((f, k) => pluck(f, 2.2, 11 + k)))],
      celesta: ['Harp and celesta', 'Two harp notes with a celesta over them', () => mix([[0, harp(H.D5, 2, 261)], [0.12, harp(H.A5, 2, 262)], [0.12, celesta(H.D6), 0.6], [0.24, celesta(H['F#6']), 0.5]])],
      pizz: ['Pizzicato strings', 'A run of five up', () => at(0.09, [H.D5, H.E5, H['F#5'], H.A5, H.D6].map((f, k) => pizz(f, 271 + k)))],
      flute: ['Harp and flute', 'A harp chord and a wooden flute\'s note held over it', () => mix([[0, at(0.04, [H.D4, H.A4, H.D5].map((f, k) => harp(f, 2.2, 281 + k)))], [0.08, flute(H['F#5'], 0.7), 0.7]])],
    },
    end: {
      marimba: ['Marimba', 'Two low notes together', () => mix([[0, note(H.A3, 0.8)], [0.02, note(H.E4, 0.8, 0.7)]])],
      harp: ['Harp', 'Down a fifth, gently, left to ring', () => at(0.3, [harp(H.D4, 2.4, 301), harp(H.A3 * 1, 2.6, 302)])],
      strings: ['Strings', 'An open chord (A, D, E), neither glad nor sad, swelling and fading', () => pad([H.A3, H.D4, H.E4], 1.0, 0.45)],
      horn: ['A soft horn', 'One low note with its fifth', () => mix([[0, horn(H.D3 * 2, 0.9)], [0.02, horn(H.A3, 0.9), 0.6]])],
      kannel: ['Kannel', 'Two low strings, let ring', () => at(0.09, [pluck(H.D3, 2.4, 41), pluck(H.A3, 2.4, 42)])],
      lute: ['Lute', 'A low chord, strummed slowly', () => at(0.06, [H.D3, H.A3, H.D4].map((f, k) => lute(f, 1.8, 311 + k)))],
    },
    gold: {
      note: ['A mallet note', 'One soft marimba note', () => note(H.A4, 0.4)],
      harp: ['Harp', 'One plucked note', () => harp(H.A4, 1.2, 321)],
      kannel: ['Kannel', 'One string, as the crowning', () => pluck(H.A4, 1.2, 331)],
      celesta: ['Celesta', 'One small bright note', () => celesta(H.A5)],
      block: ['Temple block', 'One hollow wooden knock', () => block(H.A4)],
      bell: ['A soft bell', 'One quiet ring', () => bell(H.A5)],
      pizz: ['Pizzicato', 'One plucked string note', () => pizz(H.A4, 341)],
    },
    red: {
      note: ['Mallet notes', 'The same note three times', () => thrice(note(H.A4, 0.3))],
      harp: ['Harp', 'One note plucked three times', () => thrice(harp(H.A4, 1, 351))],
      kannel: ['Kannel', 'One string three times', () => thrice(pluck(H.A4, 1, 361))],
      celesta: ['Celesta', 'Three small bright notes', () => thrice(celesta(H.A5))],
      block: ['Temple block', 'Three hollow knocks', () => thrice(block(H.A4))],
      bell: ['A soft bell', 'Three quiet rings', () => thrice(bell(H.A5))],
      pizz: ['Pizzicato', 'Three plucked notes', () => thrice(pizz(H.A4, 371))],
    },
  };
  const DEFAULT = { solved: 'mallet', win: 'marimba', end: 'marimba', gold: 'note', red: 'note' };
  const chosen = {};
  for (const k of Object.keys(OPTIONS)) chosen[k] = OPTIONS[k][P.get(k)] ? P.get(k) : DEFAULT[k];
  const playOption = (kind, key, when = 0) => start({ x: made(`${kind}.${key}`, () => even(OPTIONS[kind][key][2]())) }, M, when);

  // ---- The set -----------------------------------------------------------------------
  // The chosen sounds as the app would play them (task 089): the move and the take from
  // Freesound, the rest from sound.js.
  const MOVE = sampleHits('765866'), TAKE = sampleHits('733927');
  const knocks = (second) => made(`knocks${second}`, () => phrase([[0, knock(TIMBRES.felt, 41, 0.7)], [0.14, knock(TIMBRES.felt, 42, second).map((v) => v * 0.6)]]));
  const SET = [
    ['move', 'A piece set down', 'As it lands: yours, the computer\'s, a friend\'s. MattyCauldron\'s "Chess Pieces" (Freesound 765866, CC0), a hit at random', 'Chosen',
      (w) => start({ ...pick(MOVE) }, 0.9, w)],
    ['stops', 'A capture, stop by stop', 'Each stop before the last a step up; the last plays the take in place of its knock (two stops shown)', 'Chosen',
      (w) => { start({ ...pick(MOVE) }, 0.9, w); start({ ...pick(MOVE), pitch: Math.pow(2, 2 / 12) }, 0.9, w + 0.45); start({ ...pick(TAKE) }, 0.5, w + 0.9); }],
    ['take', 'The taken pieces', 'Once, as the capture ends and they come off together. JJTaynos\'s "Chess Pieces Move (Close)" (Freesound 733927, CC0), a hit at random', 'Chosen',
      (w) => start({ ...pick(TAKE) }, 0.5, w)],
    ['crown', 'Crowned', 'A kannel\'s two plucks up, in place of the landing\'s sound', 'Chosen',
      (w) => start({ x: made('crown', () => even(at(0.12, [pluck(H.A4), pluck(H.E5)]))) }, 0.12, w)],
    ['wrong', 'A wrong move', 'Two low soft knocks as the piece slides back, the second lower', 'Chosen', (w) => start({ x: knocks(0.66) }, 0.4, w)],
    ['must', 'A capture due elsewhere', 'The same knocks, the second pitched up: a warning, but another one', 'Chosen', (w) => start({ x: knocks(0.84) }, 0.4, w)],
    ['gold', 'The clock turns gold', 'Once, as a person\'s clock goes under a minute', 'gold', (w) => playOption('gold', chosen.gold, w)],
    ['red', 'The clock turns red', 'Once, at 0:20; nothing after it, no tick a second', 'red', (w) => playOption('red', chosen.red, w)],
    ['solved', 'A puzzle solved', 'As the stars show', 'solved', (w) => playOption('solved', chosen.solved, w)],
    ['win', 'A game won', 'As the result shows; a game\'s last move plays this alone', 'win', (w) => playOption('win', chosen.win, w)],
    ['end', 'A game lost or drawn', 'A plain close, never a sad one', 'end', (w) => playOption('end', chosen.end, w)],
  ];
  const TITLE = { solved: 'A puzzle solved', win: 'A game won', end: 'A game lost or drawn', gold: 'The clock turns gold', red: 'The clock turns red' };

  function render() {
    const panel = document.getElementById('panel');
    const missing = !MOVE.length ? '<p class="warn">The Freesound hits are missing: run <code>python3 tools/sound_samples.py</code> for the move and the take.</p>' : '';
    panel.innerHTML = `<div class="head"><a class="pill" href="sound.html">${icon('back')}Settings</a><h1>The sound set</h1>` +
      `<label>Volume <input type="range" id="vol" min="0" max="1" step="0.01" value="${level}"></label>` +
      `<button class="pill" id="all">${playIcon}Play the set</button></div>` +
      `<p class="lead">Every sound the first version makes, as the app would play it at this volume. Under it, the takes on the five chosen ` +
      `by default; choose one and it moves into the set (and the page's link, to send back).</p>${missing}` +
      `<h2>The set</h2>` + SET.map(([id, title, what, from], k) => {
        const tag = OPTIONS[from] ? `<span class="tag from">${OPTIONS[from][chosen[from]][0]}</span>` : `<span class="tag chosen">${from}</span>`;
        return `<div class="row"><button class="play" data-set="${k}">${playIcon}</button><div><b>${title}</b><p>${what}</p></div>${tag}</div>`;
      }).join('') +
      Object.keys(OPTIONS).map((kind) => `<h2>${TITLE[kind]}<small>${Object.keys(OPTIONS[kind]).length} takes</small></h2>` +
        Object.entries(OPTIONS[kind]).map(([key, [title, what]]) =>
          `<div class="row${chosen[kind] === key ? ' on' : ''}"><button class="play" data-kind="${kind}" data-key="${key}">${playIcon}</button>` +
          `<div><b>${title}</b><p>${what}</p></div>` +
          (chosen[kind] === key ? '<span class="tag chosen">Chosen</span>' : `<button class="tag choose" data-kind="${kind}" data-key="${key}">Choose</button>`) +
          '</div>').join('')).join('') +
      `<h2>Not making a sound</h2><ul class="skipped">` +
      ['Picking up a piece; buttons, menus, tiles, scrolling', 'The hint and the lookout', 'A tick every second, and the flag (the end\'s sound says it)',
        'A note per star (the solved sound is one phrase)', 'The taken pieces counted with notes', 'A season\'s own sound', 'Music (later, if ever: off by default, its own slider)',
        'Voice (the lessons\' own decision)'].map((t) => `<li>${t}</li>`).join('') + '</ul>';
    panel.querySelectorAll('[data-set]').forEach((b) => b.addEventListener('click', () => SET[+b.dataset.set][4](0)));
    panel.querySelectorAll('.play[data-kind]').forEach((b) => b.addEventListener('click', () => playOption(b.dataset.kind, b.dataset.key)));
    panel.querySelectorAll('.choose').forEach((b) => b.addEventListener('click', () => {
      chosen[b.dataset.kind] = b.dataset.key;
      const p = new URLSearchParams(location.search);
      for (const k of Object.keys(OPTIONS)) { if (chosen[k] === DEFAULT[k]) p.delete(k); else p.set(k, chosen[k]); }
      history.replaceState(null, '', `?${p}`);
      const top = panel.scrollTop; render(); panel.scrollTop = top;
      playOption(b.dataset.kind, b.dataset.key);
    }));
    document.getElementById('vol').addEventListener('input', (e) => { level = +e.target.value; });
    // The set in a row, as a short game would bring them: 1.3 s apart, the long ones more.
    document.getElementById('all').addEventListener('click', () => {
      let w = 0;
      SET.forEach(([id, , , , fn]) => { fn(w); w += id === 'stops' ? 2 : id === 'win' || id === 'end' || id === 'solved' ? 2.6 : 1.3; });
    });
    Draughts.sync();
  }
  render();
  Draughts.init();
</script>
</body>
</html>

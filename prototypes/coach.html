<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: coach and hint</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* Takes on the coach and the hint as one feature (task 040). The coach shows the
     player's danger just past their own horizon: their pieces the computer would take if
     it were its turn, what a held piece's move would leave open, and a crowning only when
     it is a real threat within reach. It never shows the answer. The hint gives the
     answer in two presses, a few a game: the piece to move, then where it goes.

     The board already uses red (a piece that must capture pulses, a wrong move flashes)
     and the glow (the selected piece, move dots, the stop on the way, the last move's
     squares, the puzzles' hint ring). The coach gets its own color, a soft violet, and
     never pulses; the hint keeps the glow, as the puzzles' hint does.

       a: rings. A piece in danger wears a still, dashed violet ring; a crowning square a
          dashed ring with a crown. The hint is a tile in the play panel with its pips
          (hints left); its second press puts a ghost of the piece where it goes. The
          coach is a setting beside move hints: on or off.
       b: lines. The danger is drawn as the computer's jump: a dashed violet line from its
          piece over the player's to where it lands, a crowning as a line to a crown. The
          hint's second press is a solid arrow in the glow. The coach is a tile on the
          game screen beside the hint, lit while on.
       c: badges and one Help tile. A piece in danger carries a small violet badge with
          "!"; a crowning square a badge with a crown. One tile does it all, its word the
          next step: Help shows the danger (free), Which piece lights the piece and spends
          a hint, Where to shows the ghost. A setting picks whether the coach shows
          always or only when asked.

     ?take=a|b|c, &state=calm|held|king|hint1|hint2|control (control: how the coach is
     turned on and off), &view=sheet for every take and state's board side by side. */
  main { position: fixed; inset: 0; }
  :root { --coach: #c7a6ff; --coach-ink: #24123f; }

  .game { --gap: 24px; --side: 232px; --b: min(100vh - 2 * var(--gap), 100vw - 2 * var(--side) - 4 * var(--gap));
    display: flex; align-items: center; justify-content: center; gap: var(--gap); height: 100%; padding: var(--gap); }
  #board { flex: none; width: var(--b); isolation: isolate; }
  .panel { display: flex; flex-direction: column; gap: 12px; flex: none; width: var(--side); height: var(--b); padding: 20px 16px; }
  .panel .space { flex: 1; }
  .out { order: -1; display: flex; flex-direction: column; gap: 12px; width: var(--side); height: var(--b); flex: none; }
  .out .panel { flex: 1; height: auto; }
  .back { position: relative; flex: none; display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 0 26px 0 18px; font-size: 26px; white-space: nowrap; text-decoration: none; }
  .back svg { width: 38px; height: 38px; }
  .row { display: flex; align-items: center; justify-content: flex-start; gap: 12px; min-height: 88px;
    padding: 0 14px; font-size: 24px; text-align: left; white-space: nowrap; }
  .row.button svg { flex: none; width: 34px; height: 34px; stroke-width: 2.2; }
  .row.big { flex-direction: column; justify-content: center; gap: 8px; min-height: 132px; font-size: 26px; }
  .row.big svg { width: 48px; height: 48px; }
  .turn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 18px 0 10px; text-align: center; font-size: 26px; }
  .turn .piece { --u: 7px; position: relative; inset: auto; flex: none; width: 72px; height: 72px;
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--glow) 80%, transparent), 0 0 22px 4px color-mix(in srgb, var(--glow) 45%, transparent); }

  /* The hint's tile: the bulb, the word, and a pip a hint left; lit while it shows. */
  .pips { display: flex; gap: 7px; margin-left: auto; }
  .pips i { width: 12px; height: 12px; border-radius: 50%; background: var(--glow);
    box-shadow: 0 0 7px color-mix(in srgb, var(--glow) 50%, transparent); }
  .pips i.out { background: none; box-shadow: inset 0 0 0 2px rgb(255 255 255 / 0.25); }
  /* c: the word over the pips, as its words are longer. */
  .row.steps .lbl { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .row.steps .pips { margin-left: 0; }
  .row.lit { background: color-mix(in srgb, var(--glow) 22%, transparent);
    box-shadow: inset 0 0 0 2px var(--glow), 0 6px 14px -8px rgb(0 0 0 / 0.5); }
  .row.spent { opacity: 0.5; }
  /* b: the coach's tile and the hint's, side by side, each an icon over its word. */
  .twin { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .twin .row { flex-direction: column; justify-content: center; gap: 4px; min-height: 104px; padding: 6px 4px; font-size: 21px; }
  .twin .row .pips { margin: 2px 0 0; gap: 5px; }
  .twin .row .pips i { width: 10px; height: 10px; }
  .row.coach-on { background: color-mix(in srgb, var(--coach) 24%, transparent);
    box-shadow: inset 0 0 0 2px var(--coach), 0 6px 14px -8px rgb(0 0 0 / 0.5); }
  .row.coach-on svg { color: var(--coach); }

  /* The coach's marks, in violet and still. a: a dashed ring round the piece. */
  .cring { position: absolute; inset: 3%; z-index: 2; border-radius: 50%; pointer-events: none;
    background: repeating-conic-gradient(var(--coach) 0 20deg, transparent 20deg 30deg);
    -webkit-mask: radial-gradient(closest-side, transparent 85%, #000 87% 98%, transparent 100%);
    mask: radial-gradient(closest-side, transparent 85%, #000 87% 98%, transparent 100%);
    filter: drop-shadow(0 0 calc(0.6 * var(--u)) rgb(0 0 0 / 0.6)); }
  .ccrown { position: absolute; inset: 24%; z-index: 2; display: grid; place-items: center; color: var(--coach);
    filter: drop-shadow(0 0 calc(0.6 * var(--u)) rgb(0 0 0 / 0.6)); }
  .ccrown svg { width: 100%; height: 100%; opacity: 0.9; }
  /* b: the jump as a dashed line, over a dark underlay so it reads on light squares. */
  .lines { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; overflow: visible; }
  /* c: a badge at the piece's upper right. */
  .badge { position: absolute; right: -2%; top: -2%; z-index: 3; display: grid; place-items: center;
    width: 40%; height: 40%; border-radius: 50%; background: var(--coach); color: var(--coach-ink);
    font: 700 calc(2.9 * var(--u) * 8 / var(--n)) / 1 system-ui, sans-serif;
    box-shadow: 0 0 0 calc(0.3 * var(--u)) rgb(255 255 255 / 0.85), 0 calc(0.3 * var(--u)) calc(1 * var(--u)) rgb(0 0 0 / 0.5); }
  .badge.mid { right: 28%; top: 28%; width: 44%; height: 44%; }
  .badge svg { width: 62%; height: 62%; }
  .badge .icon .solid { fill: var(--coach-ink); }

  /* The hint, in the glow: the piece to move pulses a ring as in the puzzles; where it
     goes, a ghost of it (a and c). */
  .piece.hinted::after { content: ''; position: absolute; inset: -14%; border-radius: 50%;
    border: calc(0.9 * var(--u)) solid var(--glow);
    box-shadow: 0 0 calc(3 * var(--u)) color-mix(in srgb, var(--glow) 70%, transparent),
      inset 0 0 calc(1.2 * var(--u)) color-mix(in srgb, var(--glow) 40%, transparent);
    animation: pulse 1.4s ease-in-out infinite; }
  .piece.ghost { opacity: 0.45; }
  .piece.ghost::after { content: ''; position: absolute; inset: -6%; border-radius: 50%;
    box-shadow: 0 0 0 calc(0.45 * var(--u)) color-mix(in srgb, var(--glow) 80%, transparent),
      0 0 calc(2.4 * var(--u)) color-mix(in srgb, var(--glow) 60%, transparent); }

  /* The settings screen (state=control, takes a and c): the Game group with the new
     row beside move hints, and the board as the choice makes it. */
  .set { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; height: 100%; padding: 24px 32px; }
  .set .side { display: grid; grid-template-rows: auto 1fr; gap: 14px; min-height: 0; }
  .set .top { display: flex; align-items: center; gap: 20px; }
  .set .top h1 { margin: 0; font-size: 34px; font-weight: 400; }
  .set .top .button { min-width: 72px; min-height: 72px; }
  .group { --r: 24px; display: grid; gap: 12px; padding: 14px 20px 16px; align-self: center; }
  .group h2 { margin: 0 0 2px; display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 400; }
  .group h2 .icon { width: 30px; height: 30px; opacity: 0.85; }
  .setting { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 14px; }
  .setting h3 { margin: 0; font-size: 18px; font-weight: 400; color: var(--fg-dim); letter-spacing: 0.03em; }
  .setting.new h3 { color: var(--fg); }
  .tiles { display: flex; gap: 10px; flex-wrap: wrap; }
  .tile { display: grid; place-items: center; min-width: 88px; min-height: 56px; padding: 4px 16px 6px; border: 0;
    border-radius: 16px; color: var(--fg); font: inherit; font-size: 19px; background: var(--button);
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.12); }
  .tile.on { background: color-mix(in srgb, var(--glow) 22%, transparent); box-shadow: inset 0 0 0 2px var(--glow); }
  .preview { container-type: size; display: grid; place-items: center; min-height: 0; }
  .preview #board { width: calc(min(100cqw, 100cqh) * 0.94); }

  /* Every take and state at once. */
  .sheet { display: grid; grid-template-columns: auto repeat(5, 1fr); gap: 10px 14px; align-content: center;
    height: 100%; padding: 16px 24px; overflow: auto; }
  .sheet h3 { margin: 0; font-size: 18px; font-weight: 400; color: var(--fg-dim); text-align: center; }
  .sheet .take { align-self: center; font-size: 28px; }
  .sheet .cell { display: grid; place-items: center; }
  .sheet .cell .board { width: min(100%, (100vh - 120px) / 3 - 16px); }

  @media (orientation: portrait) {
    .game { --top: 104px; --bottom: 200px; --b: min(100vw - 2 * var(--gap), 100vh - var(--top) - var(--bottom) - 4 * var(--gap));
      flex-direction: column; }
    .panel { display: grid; gap: 12px 16px; align-content: start; height: auto; width: var(--b); padding: 16px 20px; }
    .panel .space { display: none; }
    .out { flex-direction: row; height: auto; width: var(--b); }
    .out .panel { grid-template-columns: repeat(3, 1fr); }
    .out .row { justify-content: center; }
    .out .panel .back { width: auto; justify-self: stretch; padding: 0 10px; }
    .turn { flex-direction: row; justify-content: flex-start; gap: 18px; padding: 0 6px; min-height: 72px; text-align: left; }
    .turn .piece { width: 52px; height: 52px; --u: 5px; }
    .row.big { flex-direction: row; min-height: 88px; }
    .row.big svg { width: 36px; height: 36px; }
    /* The hint (or Help) beside undo; b's coach tile at the turn row's end. */
    .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .duo .row { justify-content: center; }
    .duo .row .pips { margin-left: 4px; }
    .turnrow { display: flex; align-items: center; gap: 16px; }
    .turnrow .turn { flex: 1; }
    .turnrow .row { min-height: 72px; padding: 0 16px; }
    .set { grid-template-columns: 1fr; grid-template-rows: auto auto minmax(0, 1fr); gap: 16px; padding: 20px 16px; }
    .set .side { display: contents; }
    .set .preview { order: 3; }
    .setting { grid-template-columns: 1fr; gap: 6px; }
    .sheet { grid-template-columns: repeat(3, 1fr); grid-auto-flow: column; grid-template-rows: auto repeat(5, auto); }
    .sheet .label { display: none; }
    .sheet .cell .board { width: min(100%, (100vh - 120px) / 5 - 16px); }
  }
  /* A phone in portrait: the bar's tiles each an icon over its word, as built. */
  .phone .out .row, .phone .out .back { flex-direction: column; justify-content: center; gap: 2px; min-height: 96px;
    padding: 0 10px; font-size: 20px; }
  .phone .out .row svg, .phone .out .back svg { width: 32px; height: 32px; }
  .phone .out .panel { padding: 12px; gap: 10px; }
  .phone .game { --gap: 16px; --top: 120px; }
  .phone .panel.play { padding: 12px; gap: 10px; }
  .phone .row.big, .phone .duo .row { font-size: 20px; padding: 0 8px; gap: 6px; }
  .phone .row.big svg, .phone .duo .row svg { width: 28px; height: 28px; }
  .phone .duo { gap: 10px; }
  .phone .turn { font-size: 22px; gap: 12px; }
  .phone .turnrow .row { font-size: 18px; padding: 0 12px; gap: 6px; }
  .phone .turnrow .row svg { width: 26px; height: 26px; }
  .phone .set .top h1 { font-size: 28px; }
  .phone .tile { min-width: 0; padding: 4px 12px 6px; font-size: 17px; }
</style>
</head>
<body data-screen="board">
<main id="app"></main>
<script>
  const params = new URLSearchParams(location.search);
  const pick = (k, list) => (list.includes(params.get(k)) ? params.get(k) : list[0]);
  const TAKES = ['a', 'b', 'c'], STATES = ['calm', 'held', 'king', 'hint1', 'hint2', 'control'];
  const take = pick('take', TAKES);
  const state = pick('state', STATES);
  const sheet = params.get('view') === 'sheet';

  // The proposed strings (task 040).
  const S = {
    back: 'Back', settings: 'Settings', restart: 'Start over', undo: 'Undo move', turn: "White's turn",
    hint: 'Hint', coach: 'Coach', help: 'Help', piece: 'Which piece', where: 'Where to',
    game: 'Game', moveHints: 'Move hints', mistakes: 'Mistakes only', moves: 'All moves',
    on: 'On', off: 'Off', always: 'Always', asked: 'When asked',
  };
  const HINTS = 3;  // a game's hints

  // The positions, Russian 8 × 8, white (the player) to move, no capture to make.
  //   calm: black would take d4 (e5 to c3) and g3 (h4 to f2) if it were its turn. The
  //         hint's move is d2 to c3, which covers d4.
  //   held: b4 held over a5, its only move. It would open c5 and c3 to d6's double jump
  //         (d6, b4, d2); b4 is what keeps them safe now.
  //   king: black's man on d2 crowns on e1 next move, and nothing of white's can stop it
  //         by taking it.
  const POS = {
    calm: { white: ['a1', 'c1', 'e1', 'g1', 'b2', 'd2', 'h2', 'a3', 'e3', 'g3', 'd4'],
      black: ['b8', 'd8', 'f8', 'h8', 'a7', 'c7', 'e7', 'g7', 'b6', 'f6', 'e5', 'h4'], last: ['g5', 'h4'] },
    held: { white: ['a1', 'c1', 'e1', 'g1', 'b2', 'f2', 'h2', 'c3', 'g3', 'a5', 'c5'], selected: 'a5',
      black: ['b8', 'd8', 'f8', 'h8', 'a7', 'e7', 'g7', 'd6', 'f6', 'h6'], last: ['c7', 'd6'] },
    king: { white: ['c1', 'g1', 'h2', 'a3', 'g3', 'b4', 'c5'],
      black: ['d2', 'e3', 'd6', 'a7', 'c7', 'e7', 'f8', 'h8'], last: ['c3', 'd2'] },
  };
  // What the coach sees in each: the pieces in danger and the jumps that take them, or
  // the crowning (the man and its square).
  const COACH = {
    calm: { danger: ['d4', 'g3'], jumps: [['e5', 'd4', 'c3'], ['h4', 'g3', 'f2']] },
    held: { danger: ['c5', 'c3'], jumps: [['d6', 'c5', 'b4', 'c3', 'd2']] },
    king: { crown: ['d2', 'e1'] },
  };
  const posOf = (st) => (st === 'held' || st === 'king' ? st : 'calm');

  const W = innerWidth, H = innerHeight, landscape = W >= H, phone = Math.min(W, H) < 600;
  document.body.classList.toggle('phone', phone);
  const icon = Draughts.icon;
  Draughts.ICONS.eye = '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
  Draughts.init();

  // The coach shows, by take and state: in b's control state it is off (the tile shows
  // how it is turned on); in c it shows once Help is pressed, which every state but
  // control has been.
  const coachOn = (t, st) => !(t === 'b' && st === 'control');

  const sqIndex = (sq, n = 8) => { const x = sq.charCodeAt(0) - 97, y = +sq.slice(1) - 1; return (n - 1 - y) * n + x; };
  const centre = (sq, n = 8) => [sq.charCodeAt(0) - 97 + 0.5, n - (+sq.slice(1)) + 0.5];

  // Draws a state's board into el with the take's marks.
  function draw(el, t, st) {
    const pos = POS[posOf(st)];
    Draughts.board(el, { ...pos, assist: 'mistakes' });
    const sq = (s) => el.querySelectorAll('.sq')[sqIndex(s)];
    const pieceAt = (s) => sq(s).querySelector('.piece');
    const c = COACH[posOf(st)];
    let svg = '';
    if (coachOn(t, st)) {
      if (t === 'a') {
        for (const s of c.danger || []) sq(s).insertAdjacentHTML('beforeend', '<div class="cring"></div>');
        if (c.crown) sq(c.crown[1]).insertAdjacentHTML('beforeend', `<div class="cring"></div><div class="ccrown">${icon('crownLine')}</div>`);
      } else if (t === 'b') {
        for (const j of c.jumps || []) svg += path(j, 'jump');
        if (c.crown) {
          svg += path(c.crown, 'jump', false);
          const [x, y] = centre(c.crown[1]);
          svg += `<g transform="translate(${x - 0.27} ${y - 0.27}) scale(${0.54 / 24})" class="crownmark">${Draughts.ICONS.crownLine}</g>`;
        }
      } else {
        for (const s of c.danger || []) pieceAt(s).insertAdjacentHTML('beforeend', '<div class="badge">!</div>');
        if (c.crown) sq(c.crown[1]).insertAdjacentHTML('beforeend', `<div class="badge mid">${icon('crown')}</div>`);
      }
    }
    // The hint: the piece to move, then where it goes.
    if (st === 'hint1' || st === 'hint2') pieceAt('d2').classList.add('hinted');
    if (st === 'hint2') {
      if (t === 'b') svg += path(['d2', 'c3'], 'arrow');
      else sq('c3').insertAdjacentHTML('beforeend', '<div class="piece white ghost"></div>');
    }
    if (svg) {
      el.querySelector('.squares').insertAdjacentHTML('beforeend',
        `<svg class="lines" viewBox="0 0 8 8" preserveAspectRatio="none">${DEFS}${svg}</svg>`);
    }
  }

  // b's lines in square units: a jump from its piece over each piece taken to where it
  // lands, which gets a small open ring; the hint's arrow is solid, in the glow.
  const DEFS = `<defs><marker id="head" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
    <path d="M0 0 10 5 0 10z" fill="var(--glow)"/></marker></defs>
    <style>.lines .under{fill:none;stroke:rgb(0 0 0 / 0.45);stroke-width:0.17;stroke-linecap:round;stroke-linejoin:round}
    .lines .jump{fill:none;stroke:var(--coach);stroke-width:0.08;stroke-dasharray:0.16 0.11;stroke-linecap:round;stroke-linejoin:round}
    .lines .land{fill:none;stroke:var(--coach);stroke-width:0.07}
    .lines .arrow{fill:none;stroke:var(--glow);stroke-width:0.11;stroke-linecap:round}
    .lines .crownmark path{fill:none;stroke:var(--coach);stroke-width:2.2;stroke-linejoin:round}</style>`;
  function path(squares, cls, ring = true) {
    const pts = squares.map((s) => centre(s));
    if (cls === 'arrow') {
      // From the piece's edge to short of the square's centre.
      const [[x0, y0], [x1, y1]] = pts, dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy);
      const a = [x0 + dx / l * 0.42, y0 + dy / l * 0.42], b = [x1 - dx / l * 0.18, y1 - dy / l * 0.18];
      return `<path class="under" d="M${a} L${b}"/><path class="arrow" d="M${a} L${b}" marker-end="url(#head)"/>`;
    }
    // From the jumping piece's edge, its end short of the landing ring or the crown.
    const [x0, y0] = pts[0], [x1, y1] = pts[1], d0 = Math.hypot(x1 - x0, y1 - y0);
    pts[0] = [x0 + (x1 - x0) / d0 * 0.4, y0 + (y1 - y0) / d0 * 0.4];
    const n = pts.length - 1, [xa, ya] = pts[n - 1], [xb, yb] = pts[n], dn = Math.hypot(xb - xa, yb - ya);
    const end = pts[n];
    pts[n] = [xb - (xb - xa) / dn * (ring ? 0.2 : 0.32), yb - (yb - ya) / dn * (ring ? 0.2 : 0.32)];
    const d = 'M' + pts.map((p) => p.join(' ')).join(' L');
    return `<path class="under" d="${d}"/><path class="${cls}" d="${d}"/>` +
      (ring ? `<circle class="land" cx="${end[0]}" cy="${end[1]}" r="0.2"/>` : '');
  }

  const row = (name, word, cls = '', extra = '') => cls.includes('steps')
    ? `<button class="row button ${cls}">${icon(name)}<span class="lbl"><span>${word}</span>${extra}</span></button>`
    : `<button class="row button ${cls}">${icon(name)}<span>${word}</span>${extra}</button>`;
  const pips = (left) => `<span class="pips">${Array.from({ length: HINTS }, (_, i) => `<i class="${i < left ? '' : 'out'}"></i>`).join('')}</span>`;

  // The play panel by take: the hint's tile (a), the coach's and the hint's (b), or one
  // Help tile (c), and undo.
  function play() {
    const lit = state === 'hint1' || state === 'hint2';
    const left = lit ? HINTS - 1 : HINTS;
    const turn = `<div class="turn"><div class="piece white"></div><span>${S.turn}</span></div>`;
    const undo = row('undo', S.undo, 'big');
    let tile;
    if (take === 'c') {
      // The word is what the next press gives: Help (the danger), Which piece, Where to.
      const step = { control: 0, calm: 1, held: 1, king: 1, hint1: 2, hint2: 3 }[state];
      tile = step === 0 ? row('eye', S.help, 'steps', pips(left))
        : step === 1 ? row('hint', S.piece, 'steps', pips(left))
        : step === 2 ? row('hint', S.where, 'steps lit', pips(left))
        : row('hint', S.help, 'steps lit spent', pips(left));
    } else {
      tile = row('hint', S.hint, lit ? 'lit' : '', pips(left));
    }
    const coach = row('eye', S.coach, coachOn(take, state) ? 'coach-on' : '');
    if (landscape) {
      if (take === 'b') return `${turn}<div class="space"></div><div class="twin">${coach}${tile}</div>${undo}`;
      return `${turn}<div class="space"></div>${tile}${undo}`;
    }
    const top = take === 'b' ? `<div class="turnrow">${turn}${coach}</div>` : turn;
    return `${top}<div class="duo">${tile}${undo}</div>`;
  }

  function gameScreen() {
    const out = `<div class="out"><a class="button glass back" href="home.html">${icon('back')}<span>${S.back}</span></a>` +
      `<aside class="panel glass">${row('gear', S.settings)}<div class="space"></div>${row('restart', S.restart)}</aside></div>`;
    document.getElementById('app').innerHTML = `<div class="game">${out}<div id="board"></div>` +
      `<aside class="panel glass play">${play()}</aside></div>`;
    if (!landscape) {
      const b = document.querySelector('.out > .back');
      b.classList.remove('glass');
      document.querySelector('.out .panel').prepend(b);
    }
    draw(document.getElementById('board'), take, state);
  }

  // Settings' Game group with the coach's row under move hints: on or off (a), always or
  // when asked (c); the preview shows the calm position as the choice makes it.
  function settingsScreen() {
    const tile = (on, word) => `<button class="tile${on ? ' on' : ''}">${word}</button>`;
    const coachRow = take === 'a'
      ? `<div class="setting new"><h3>${S.coach}</h3><div class="tiles">${tile(true, S.on)}${tile(false, S.off)}</div></div>`
      : `<div class="setting new"><h3>${S.coach}</h3><div class="tiles">${tile(false, S.always)}${tile(true, S.asked)}</div></div>`;
    document.getElementById('app').innerHTML = `<div class="set"><div class="side">
      <div class="top"><a class="button glass" href="#" aria-label="${S.back}">${icon('back')}</a><h1>${S.settings}</h1></div>
      <section class="group glass"><h2>${icon('target')}${S.game}</h2>
        <div class="setting"><h3>${S.moveHints}</h3><div class="tiles">${tile(true, S.mistakes)}${tile(false, S.moves)}</div></div>
        ${coachRow}</section></div>
      <div class="preview"><div id="board"></div></div></div>`;
    draw(document.getElementById('board'), take, 'calm');
  }

  function sheetScreen() {
    const cols = ['calm', 'held', 'king', 'hint1', 'hint2'];
    let html = `<span class="label"></span>${cols.map((c) => `<h3 class="label">${c}</h3>`).join('')}`;
    for (const t of TAKES) {
      html += `<span class="take label">${t}</span>`;
      for (const c of cols) html += `<div class="cell"><div class="board" data-t="${t}" data-s="${c}"></div></div>`;
    }
    document.getElementById('app').innerHTML = `<div class="sheet">${html}</div>`;
    document.querySelectorAll('.sheet .board').forEach((el) => draw(el, el.dataset.t, el.dataset.s));
  }

  if (sheet) sheetScreen();
  else if (state === 'control' && take !== 'b') settingsScreen();
  else gameScreen();

  Draughts.paint();
  addEventListener('load', () => document.fonts.ready.then(() => { Draughts.paint(); Draughts.syncGlass(); }));
  addEventListener('resize', () => setTimeout(() => location.reload(), 200));

  // The take, state, and view, from the switcher.
  const bar = document.querySelector('.proto-bar');
  const sel = (key, values, current) => `<select data-k="${key}" aria-label="${key}">${values.map((v) =>
    `<option${v === current ? ' selected' : ''}>${v}</option>`).join('')}</select>`;
  bar.insertAdjacentHTML('afterbegin', sel('take', TAKES, take) + sel('state', STATES, state) +
    sel('view', ['game', 'sheet'], sheet ? 'sheet' : 'game'));
  bar.querySelectorAll('select[data-k]').forEach((s) => s.onchange = (e) => {
    e.stopPropagation();
    params.set(s.dataset.k, s.value);
    location.search = params.toString();
  });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: lookout and hint</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* Round 3 of the coach and the hint (task 040, 2026-11-09). Two controls, not one: the
     lookout, a toggle that while on shows the danger by itself, and the hint, its own
     button that lights the piece to move and then where it goes, a pip spent a hint.
     The danger is marked on the pieces themselves, dark and still; the hint is light and
     breathes in the glow, so the two never read alike.

       a: a round toggle. The lookout is a disc like the 3D board's camera buttons, on
          whose turn's line: at its right end in portrait, under the words with its word
          in the right column. The hint is a tile beside undo (halves of the row in
          portrait, over undo in the right column, between them in compact).
       b: a tile. The lookout is a tile among the way-out ones: the bar's second in
          portrait, under settings in the left panel, an icon tile in compact's bar. The
          hint is as in a.

     Marks (&mark=): shade, the piece darkened; drain, its color drained and a little
     darker; shadow, the threatening piece's shadow falling across it from where the jump
     comes. A crowning (&king=): square, the crowning square shaded with a dark, still
     ghost of the king; piece, the man that would crown shaded, a crown line on it. The
     hint: the piece to move pulses the glow ring, then a light, translucent ghost of it
     breathes on its square.

     ?take=a|b, &mark=shade|drain|shadow, &king=square|piece,
     &state=calm|held|king|hint1|hint2|control (control: every state of both controls
     and the names), &lookout=on|off, &name=lookout|guard|danger|eagle, &lang=en|et,
     &you=white|black (the same positions from black's side), &view=game|sheet. Layouts
     as built: landscape, a phone's portrait, and compact (portrait under 760 px tall). */
  main { position: fixed; inset: 0; }
  .proto-bar { flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 24px); }
  /* In portrait the switcher would cover the play: it folds into a small Options button
     at the bottom left, and opens over the page when pressed. */
  .proto-fold { display: none; position: fixed; left: 6px; bottom: 6px; z-index: 11; padding: 4px 8px; border: 0;
    border-radius: 8px; background: rgb(0 0 0 / 0.55); color: #ddd; font: 12px system-ui, sans-serif; opacity: 0.6; }
  @media (orientation: portrait) {
    .proto-fold { display: block; }
    body:not(.bar-open) .proto-bar { display: none; }
    .proto-bar { left: 6px; right: 6px; bottom: 36px; opacity: 1; justify-content: flex-start; }
  }

  .game { --gap: 24px; --side: 232px; --b: min(100vh - 2 * var(--gap), 100vw - 2 * var(--side) - 4 * var(--gap));
    display: flex; align-items: center; justify-content: center; gap: var(--gap); height: 100%; padding: var(--gap); }
  #board { flex: none; width: var(--b); isolation: isolate; }
  .panel { position: relative; display: flex; flex-direction: column; gap: 12px; flex: none; width: var(--side); height: var(--b); padding: 20px 16px; }
  .panel .space { flex: 1; }
  .out { order: -1; display: flex; flex-direction: column; gap: 12px; width: var(--side); height: var(--b); flex: none; }
  .out .panel { flex: 1; height: auto; }
  .back { position: relative; flex: none; display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 0 26px 0 18px; font-size: 26px; white-space: nowrap; text-decoration: none; }
  .back svg { width: 38px; height: 38px; }
  .row { display: flex; align-items: center; justify-content: flex-start; gap: 12px; min-height: 88px;
    padding: 0 14px; font-size: 24px; text-align: left; white-space: nowrap; }
  .row.button svg { flex: none; width: 34px; height: 34px; stroke-width: 2.2; }
  .row.big { flex-direction: column; justify-content: center; gap: 8px; min-height: 132px; font-size: 26px; }
  .row.big svg { width: 48px; height: 48px; }
  .turn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 18px 0 10px; text-align: center; font-size: 26px; }
  .turn .piece { --u: 7px; position: relative; inset: auto; flex: none; width: 72px; height: 72px;
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--glow) 80%, transparent), 0 0 22px 4px color-mix(in srgb, var(--glow) 45%, transparent); }

  /* The hint: the bulb, its word, and a pip a hint left; lit while it shows, as a
     running clock is. */
  .pips { display: flex; gap: 7px; }
  .pips i { width: 12px; height: 12px; border-radius: 50%; background: var(--glow);
    box-shadow: 0 0 7px color-mix(in srgb, var(--glow) 50%, transparent); }
  .pips i.out { background: none; box-shadow: inset 0 0 0 2px rgb(255 255 255 / 0.25); }
  .lbl { display: flex; flex-direction: column; align-items: flex-start; gap: 7px; }
  .lit { background: color-mix(in srgb, var(--glow) 18%, transparent);
    box-shadow: inset 0 0 0 2px var(--glow), 0 6px 14px -8px rgb(0 0 0 / 0.5); }
  .lit:hover { background: color-mix(in srgb, var(--glow) 24%, transparent); }
  .spent { color: var(--fg-dim); }
  .spent svg { opacity: 0.55; }

  /* The lookout. a: a disc, a 56 dp target round a 48 dp disc of shade with a hairline,
     as the camera buttons are; on, lit in the glow with the open eye; off, the eye struck
     through and dim. b: a tile, lit as a pressed row is while on. */
  .eye { position: relative; flex: none; display: grid; place-items: center; width: 56px; height: 56px; padding: 0;
    border: 0; background: none; color: var(--fg-dim); cursor: pointer; }
  .eye::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: rgb(0 0 0 / 0.3);
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.22), 0 2px 8px -3px rgb(0 0 0 / 0.5); }
  .eye.on { color: var(--fg); }
  .eye.on::before { background: color-mix(in srgb, var(--glow) 30%, rgb(0 0 0 / 0.3));
    box-shadow: inset 0 0 0 2px var(--glow), 0 0 12px -2px color-mix(in srgb, var(--glow) 60%, transparent); }
  .eye svg { position: relative; width: 30px; height: 30px; stroke-width: 2.4; }
  .eyeline { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 20px; color: var(--fg-dim); }
  .eyeline.on { color: var(--fg); }
  .turnline { display: flex; align-items: center; gap: 12px; }
  .turnline .turn { flex: 1; min-width: 0; }
  .row.look:not(.lit) { color: var(--fg-dim); }
  .row.look:not(.lit) svg { opacity: 0.75; }

  /* The danger, on the piece and still. */
  .piece.d-shade, .p3.d-shade > .layer, .p3.d-shade > .face { filter: brightness(0.46); }
  .piece.d-drain, .p3.d-drain > .layer, .p3.d-drain > .face { filter: grayscale(1) brightness(0.66) contrast(0.85); }
  .piece.d-shadow::after, .p3.d-shadow > .face::after { content: ''; position: absolute; inset: -3%; border-radius: 50%;
    background: linear-gradient(var(--ang), rgb(8 4 2 / 0.82) 0 30%, rgb(8 4 2 / 0.45) 58%, rgb(8 4 2 / 0.08) 92%);
    pointer-events: none; }
  .piece.d-shadow { filter: brightness(0.85); }
  /* The crowning: the square shaded and a dark, still king on it; or a crown line on
     the man that would crown. */
  .sq.kshade { box-shadow: inset 0 0 calc(2.6 * var(--u)) calc(1.2 * var(--u)) rgb(0 0 0 / 0.62); }
  .piece.kghost { opacity: 0.62; filter: brightness(0.5) saturate(0.6); }
  .kline { position: absolute; inset: 22%; z-index: 2; color: rgb(255 248 236 / 0.85); pointer-events: none;
    filter: drop-shadow(0 0 calc(0.4 * var(--u)) rgb(0 0 0 / 0.8)); }
  .kline svg { width: 100%; height: 100%; stroke-width: 2.6; }

  /* The hint, light and breathing: the piece to move pulses the puzzles' glow ring;
     where it goes, a light, translucent ghost of it in the glow. */
  .piece.hinted::after, .p3.hinted::after { content: ''; position: absolute; inset: -14%; border-radius: 50%;
    border: calc(0.9 * var(--u)) solid var(--glow);
    box-shadow: 0 0 calc(3 * var(--u)) color-mix(in srgb, var(--glow) 70%, transparent),
      inset 0 0 calc(1.2 * var(--u)) color-mix(in srgb, var(--glow) 40%, transparent);
    animation: pulse 1.4s ease-in-out infinite; }
  .piece.ghost { filter: brightness(1.25) saturate(0.8); animation: breathe 1.4s ease-in-out infinite; }
  .piece.ghost::after { content: ''; position: absolute; inset: -6%; border-radius: 50%;
    box-shadow: 0 0 0 calc(0.45 * var(--u)) color-mix(in srgb, var(--glow) 85%, transparent),
      0 0 calc(2.4 * var(--u)) color-mix(in srgb, var(--glow) 65%, transparent); }
  @keyframes breathe { 0%, 100% { opacity: 0.6; } 50% { opacity: 0.32; } }

  /* Every state of both controls, and the names. */
  .ctlsheet { display: grid; place-items: safe center; height: 100%; padding: 16px 16px 72px; overflow: auto; }
  .card { display: grid; gap: 14px; padding: 20px 22px; max-width: 980px; }
  .card h2 { margin: 6px 0 0; font-size: 20px; font-weight: 400; color: var(--fg-dim); }
  .card .line { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
  .card figure { display: grid; justify-items: center; gap: 6px; margin: 0; }
  .card figcaption { font-size: 14px; color: var(--fg-dim); text-align: center; }
  .card .row { min-width: 168px; }
  .names { display: grid; grid-template-columns: auto auto auto auto; gap: 8px 16px; align-items: center; font-size: 20px; }
  .names svg { width: 28px; height: 28px; stroke-width: 2.2; }
  .names .cur { color: var(--glow); }
  .names .note { font-size: 14px; color: var(--fg-dim); }

  /* Every mark and state at once. */
  .sheet { display: grid; grid-template-columns: auto repeat(6, 1fr); gap: 6px 12px; align-content: center;
    height: 100%; padding: 12px 24px 48px; overflow: auto; }
  .sheet h3 { margin: 0; font-size: 16px; font-weight: 400; color: var(--fg-dim); text-align: center; }
  .sheet .take { align-self: center; font-size: 18px; white-space: nowrap; }
  .sheet .cell { display: grid; place-items: center; }
  .sheet .cell .board { width: min(100%, (100vh - 110px) / 3 - 8px); }

  @media (orientation: portrait) {
    .game { flex-direction: column; }
    .panel { display: grid; gap: 12px 16px; align-content: start; height: auto; width: var(--b); padding: 16px 20px; }
    .panel .space { display: none; }
    .out { flex-direction: row; height: auto; width: var(--b); }
    .out .panel { grid-template-columns: repeat(var(--tiles, 3), 1fr); }
    .out .row { justify-content: center; }
    .out .panel .back { width: auto; justify-self: stretch; padding: 0 10px; }
    .turn { flex-direction: row; justify-content: flex-start; gap: 18px; padding: 0 6px; min-height: 72px; text-align: left; }
    .turn .piece { width: 52px; height: 52px; --u: 5px; }
    .row.big { flex-direction: row; min-height: 88px; }
    .row.big svg { width: 36px; height: 36px; }
    .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .duo .row { justify-content: center; }
    .sheet { grid-template-columns: auto repeat(3, 1fr); padding: 12px 8px 64px; gap: 6px 8px; align-content: start; }
    .sheet .take { font-size: 13px; white-space: normal; }
    .sheet h3 { font-size: 13px; }
    .sheet .cell .board { width: 100%; }
  }
  /* A phone in portrait: the bar's tiles each an icon over its word, as built. */
  .phone .out .row, .phone .out .back { flex-direction: column; justify-content: center; gap: 2px; min-height: 96px;
    padding: 0 6px; font-size: 20px; }
  /* b's four tiles on a phone: narrower, a long word on two lines. */
  .phone.four .out .panel { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 10px; }
  .phone.four .out .row, .phone.four .out .back { padding: 0 4px; font-size: 17px; line-height: 1.1;
    white-space: normal; text-align: center; }
  .phone .out .row svg, .phone .out .back svg { width: 32px; height: 32px; }
  .phone .out .panel { padding: 12px; gap: 10px; }
  .phone .game { --gap: 16px; }
  .phone .panel.play { padding: 12px; gap: 10px; }
  .phone .row.big, .phone .duo .row { font-size: 20px; padding: 0 8px; gap: 8px; }
  .phone .row.big svg, .phone .duo .row svg { width: 28px; height: 28px; }
  .phone .duo { gap: 10px; }
  .phone .turn { font-size: 22px; gap: 12px; }

  /* Compact, a small window in portrait (task 050): icon tiles 72 × 64 in an 88 bar
     (back at the left, the rest at the right), the play one 112 row. */
  .compact .game { --gap: 16px; gap: 16px; }
  .compact .out, .compact .panel.play { width: calc(100vw - 32px); }
  .compact .out .panel { grid-template-columns: 72px 1fr 72px 72px; gap: 8px; padding: 12px; align-items: center; }
  .compact.four .out .panel { grid-template-columns: 72px 1fr 72px 72px 72px; }
  .compact .out .row, .compact .out .back { min-width: 0; min-height: 64px; height: 64px; padding: 0; justify-content: center; }
  .compact .out .back { grid-column: 1; }
  .compact .out .panel > :nth-child(2) { grid-column: 3; }
  .compact .out span { display: none; }
  .compact .out svg { width: 32px; height: 32px; }
  .compact .panel.play { display: flex; flex-direction: row; align-items: center; gap: 10px; min-height: 112px; padding: 12px; }
  .compact .play .turnline, .compact .play > .turn { flex: 1; min-width: 0; }
  .compact .play .turn { gap: 12px; padding: 0; font-size: 21px; white-space: nowrap; }
  .compact .play .turn .piece { width: 44px; height: 44px; --u: 4px; }
  .compact .play .turnline { gap: 6px; }
  .compact .play .row { flex-direction: column; justify-content: center; gap: 4px; min-height: 88px; padding: 0 10px;
    font-size: 18px; }
  .compact .play .row svg { width: 28px; height: 28px; }
  .compact .play .row .lbl { align-items: center; gap: 5px; }
  .compact .play .row .pips i { width: 9px; height: 9px; }
  .compact .play .row.big { min-width: 104px; }
  .compact .play .turn span.word { overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body data-screen="board">
<main id="app"></main>
<script>
  const params = new URLSearchParams(location.search);
  const pick = (k, list) => (list.includes(params.get(k)) ? params.get(k) : list[0]);
  const TAKES = ['a', 'b'];
  const MARKS = ['shade', 'drain', 'shadow'];
  const KINGS = ['square', 'piece'];
  const STATES = ['calm', 'held', 'king', 'hint1', 'hint2', 'control'];
  const NAMES = ['lookout', 'guard', 'danger', 'eagle'];
  const take = pick('take', TAKES);
  const mark = pick('mark', MARKS);
  const kingMark = pick('king', KINGS);
  const state = pick('state', STATES);
  const lookoutOn = pick('lookout', ['on', 'off']) === 'on';
  const name = pick('name', NAMES);
  const lang = pick('lang', ['en', 'et']);
  const you = pick('you', ['white', 'black']);
  const sheet = params.get('view') === 'sheet';
  document.documentElement.lang = lang;

  // The proposed strings (task 040), with the Estonian beside them in strings/et.txt's
  // tone: one short noun, as Vihjed and Tammid are.
  const S = {
    en: { back: 'Back', settings: 'Settings', restart: 'Start over', undo: 'Undo move',
      turn: { white: "White's turn", black: "Black's turn" }, hint: 'Hint', where: 'Where to?',
      lookout: 'Lookout', guard: 'Guard', danger: 'Dangers', eagle: 'Eagle eye' },
    et: { back: 'Tagasi', settings: 'Seaded', restart: 'Alusta uuesti', undo: 'Võta käik tagasi',
      turn: { white: 'Valgete käik', black: 'Mustade käik' }, hint: 'Vihje', where: 'Kuhu?',
      lookout: 'Valvur', guard: 'Kaitse', danger: 'Ohud', eagle: 'Kotkasilm' },
  };
  const T = S[lang];
  const HINTS = 3;  // a game's hints

  // The lookout's icons by name, and the slash across them while off.
  Object.assign(Draughts.ICONS, {
    eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    warn: '<path d="M12 3 2 20.5h20z"/><path d="M12 10v4.5"/><circle class="solid" cx="12" cy="17.4" r="1.1"/>',
    slash: '<path d="M3.5 3.5l17 17"/>',
  });
  const NAME_ICON = { lookout: 'eye', guard: 'shield', danger: 'warn', eagle: 'eye' };
  const lookIcon = (on, n = name) => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">` +
    `${Draughts.ICONS[NAME_ICON[n]]}${on ? '' : Draughts.ICONS.slash}</svg>`;

  // The positions of rounds 1 and 2, Russian 8 × 8, white (the player) to move, no capture.
  //   calm: black would take d4 (e5 to c3) and g3 (h4 to f2) if it were its turn. The
  //         hint's move is d2 to c3, which covers d4.
  //   held: b4 held over a5, its only move. It would open c5 and c3 to d6's double jump
  //         (d6, b4, d2); b4 is what keeps them safe now.
  //   king: black's man on d2 crowns on e1 next move, and nothing of white's can stop it.
  // &you=black turns each round: the same position from black's side, black's pieces
  // where white's were.
  const POS = {
    calm: { white: ['a1', 'c1', 'e1', 'g1', 'b2', 'd2', 'h2', 'a3', 'e3', 'g3', 'd4'],
      black: ['b8', 'd8', 'f8', 'h8', 'a7', 'c7', 'e7', 'g7', 'b6', 'f6', 'e5', 'h4'], last: ['g5', 'h4'] },
    held: { white: ['a1', 'c1', 'e1', 'g1', 'b2', 'f2', 'h2', 'c3', 'g3', 'a5', 'c5'], selected: 'a5',
      black: ['b8', 'd8', 'f8', 'h8', 'a7', 'e7', 'g7', 'd6', 'f6', 'h6'], last: ['c7', 'd6'] },
    king: { white: ['c1', 'g1', 'h2', 'a3', 'g3', 'b4', 'c5'],
      black: ['d2', 'e3', 'd6', 'a7', 'c7', 'e7', 'f8', 'h8'], last: ['c3', 'd2'] },
  };
  // What the lookout sees: each piece in danger with the jump that takes it (from, to),
  // or the crowning (the man and its square).
  const COACH = {
    calm: { danger: { d4: ['e5', 'c3'], g3: ['h4', 'f2'] } },
    held: { danger: { c5: ['d6', 'b4'], c3: ['b4', 'd2'] } },
    king: { crown: ['d2', 'e1'] },
  };
  const HINT = ['d2', 'c3'];
  const posOf = (st) => (st === 'held' || st === 'king' ? st : 'calm');
  const other = you === 'white' ? 'black' : 'white';
  // A square as the player sees it: turned round when the player has black.
  const R = (sq) => (you === 'white' ? sq : String.fromCharCode(97 + 104 - sq.charCodeAt(0)) + (9 - +sq.slice(1)));

  const W = innerWidth, H = innerHeight, landscape = W >= H, phone = Math.min(W, H) < 600;
  const compact = !landscape && H < 760;
  document.body.classList.toggle('phone', phone && !compact);
  document.body.classList.toggle('compact', compact);
  document.body.classList.toggle('four', take === 'b');
  const icon = Draughts.icon;
  Draughts.init();

  const sqIndex = (sq, n = 8) => { const x = sq.charCodeAt(0) - 97, y = +sq.slice(1) - 1; return (n - 1 - y) * n + x; };
  const xy = (sq) => [sq.charCodeAt(0) - 97, -(+sq.slice(1))];  // x right, y down on screen

  // Draws a state's board into el with the marks: the danger while the lookout is on,
  // the hint in hint1 and hint2.
  function draw(el, m, km, st, on = lookoutOn) {
    const p = POS[posOf(st)];
    const map = (l) => (l || []).map(R);
    Draughts.board(el, { [you]: map(p.white), [other]: map(p.black), selected: p.selected && R(p.selected),
      last: map(p.last), assist: 'mistakes' });
    const sq = (s) => el.querySelectorAll('.sq')[sqIndex(R(s))];
    const pieceAt = (s) => sq(s).querySelector('.piece, .p3');
    const c = COACH[posOf(st)];
    if (on) {
      for (const [s, [from]] of Object.entries(c.danger || {})) {
        const pc = pieceAt(s);
        pc.classList.add(`d-${m}`);
        // The shadow falls from the threatening piece's side.
        const [x0, y0] = xy(R(from)), [x1, y1] = xy(R(s));
        pc.style.setProperty('--ang', `${Math.round(Math.atan2(x1 - x0, -(y1 - y0)) * 180 / Math.PI)}deg`);
      }
      if (c.crown) {
        const [man, to] = c.crown;
        if (km === 'square') {
          sq(to).classList.add('kshade');
          sq(to).insertAdjacentHTML('beforeend', `<div class="piece ${other} king kghost"></div>`);
        } else {
          const pc = pieceAt(man);
          pc.classList.add(`d-${m}`);
          pc.style.setProperty('--ang', you === 'white' ? '180deg' : '0deg');
          pc.insertAdjacentHTML('beforeend', `<div class="kline">${icon('crownLine')}</div>`);
        }
      }
    }
    if (st === 'hint1' || st === 'hint2') pieceAt(HINT[0]).classList.add('hinted');
    if (st === 'hint2') sq(HINT[1]).insertAdjacentHTML('beforeend', `<div class="piece ${you} ghost"></div>`);
    Draughts.paint();
  }

  const row = (ic, word, cls = '') =>
    `<button class="row button ${cls}">${icon(ic)}<span>${word}</span></button>`;
  const pips = (left) => `<span class="pips">${Array.from({ length: HINTS }, (_, i) => `<i class="${i < left ? '' : 'out'}"></i>`).join('')}</span>`;

  // The hint button: Hint; pressed once, it lights the piece, spends a hint, and asks
  // Where to?; pressed again, it shows the square and stays lit until the move. With no
  // hints left it is dim.
  function hintButton(st, extra = '') {
    const lit = st === 'hint1' || st === 'hint2';
    const left = st === 'spent' ? 0 : lit ? HINTS - 1 : HINTS;
    const word = st === 'hint1' ? T.where : T.hint;
    return `<button class="row button hint ${lit ? 'lit' : ''} ${st === 'spent' ? 'spent' : ''} ${extra}">${icon('hint')}` +
      `<span class="lbl"><span>${word}</span>${pips(left)}</span></button>`;
  }
  const eyeDisc = (on) => `<button class="eye ${on ? 'on' : ''}" aria-label="${T[name]}">${lookIcon(on)}</button>`;
  const lookTile = (on) => `<button class="row button look ${on ? 'lit' : ''}">${lookIcon(on)}<span>${T[name]}</span></button>`;

  // The play panel by take and layout.
  function play() {
    const turnPiece = `<div class="piece ${you}"></div>`;
    const turnWord = `<span class="word">${T.turn[you]}</span>`;
    const undo = row('undo', T.undo, 'big');
    const hint = hintButton(state);
    const turn = `<div class="turn">${turnPiece}${turnWord}</div>`;
    if (take === 'a') {
      if (landscape) {
        return `${turn}<div class="eyeline ${lookoutOn ? 'on' : ''}">${eyeDisc(lookoutOn)}<span>${T[name]}</span></div>` +
          `<div class="space"></div>${hint}${undo}`;
      }
      const line = `<div class="turnline">${turn}${eyeDisc(lookoutOn)}</div>`;
      if (compact) return `${line}${hint}${undo}`;
      return `${line}<div class="duo">${hint}${undo}</div>`;
    }
    if (landscape || compact) return `${turn}${landscape ? '<div class="space"></div>' : ''}${hint}${undo}`;
    return `${turn}<div class="duo">${hint}${undo}</div>`;
  }

  function gameScreen() {
    const look = take === 'b' ? lookTile(lookoutOn) : '';
    const out = `<div class="out"><a class="button glass back" href="home.html">${icon('back')}<span>${T.back}</span></a>` +
      `<aside class="panel glass">${landscape ? row('gear', T.settings) + look : look + row('gear', T.settings)}` +
      `<div class="space"></div>${row('restart', T.restart)}</aside></div>`;
    document.getElementById('app').innerHTML = `<div class="game">${out}<div id="board"></div>` +
      `<aside class="panel glass play">${play()}</aside></div>`;
    document.querySelector('.game').style.setProperty('--tiles', take === 'b' ? 4 : 3);
    if (!landscape) {
      const b = document.querySelector('.out > .back');
      b.classList.remove('glass');
      document.querySelector('.out .panel').prepend(b);
      if (compact) document.querySelectorAll('.out .row, .out .back').forEach((e) => e.setAttribute('aria-label', e.textContent));
    }
    draw(document.getElementById('board'), mark, kingMark, state);
    if (!landscape) fitPortrait();
  }

  // Portrait: the board as wide as the screen less the margins, or as tall as the room
  // the bar and the play leave, whichever is smaller.
  function fitPortrait() {
    const game = document.querySelector('.game');
    const gap = parseFloat(getComputedStyle(game).getPropertyValue('--gap'));
    for (let i = 0; i < 2; i++) {
      const used = document.querySelector('.out').offsetHeight + document.querySelector('.play').offsetHeight;
      game.style.setProperty('--b', `${Math.floor(Math.min(W - 2 * gap, H - used - 4 * gap))}px`);
    }
  }

  // Both controls in every state, in both takes' forms, and the names offered.
  function controlScreen() {
    const fig = (html, cap) => `<figure>${html}<figcaption>${cap}</figcaption></figure>`;
    const names = NAMES.map((n) => `<span class="${n === name ? 'cur' : ''}">${lookIcon(true, n)}</span>` +
      `<span class="${n === name ? 'cur' : ''}">${S.en[n]}</span><span class="${n === name ? 'cur' : ''}">${S.et[n]}</span>` +
      `<span class="note">${{ lookout: 'eye', guard: 'shield', danger: 'warning', eagle: 'eye' }[n]}</span>`).join('');
    document.getElementById('app').innerHTML = `<div class="ctlsheet"><section class="card glass">
      <h2>Lookout, a: a round toggle</h2>
      <div class="line">${fig(eyeDisc(false), 'off')}${fig(eyeDisc(true), 'on')}
        ${fig(`<div class="eyeline">${eyeDisc(false)}<span>${T[name]}</span></div>`, 'off, right column')}
        ${fig(`<div class="eyeline on">${eyeDisc(true)}<span>${T[name]}</span></div>`, 'on, right column')}</div>
      <h2>Lookout, b: a tile</h2>
      <div class="line">${fig(lookTile(false), 'off')}${fig(lookTile(true), 'on')}</div>
      <h2>Hint</h2>
      <div class="line">${fig(hintButton('calm'), 'ready')}${fig(hintButton('hint1'), 'first press: the piece')}
        ${fig(hintButton('hint2'), 'second press: where to')}${fig(hintButton('spent'), 'none left')}</div>
      <h2>Names</h2>
      <div class="names">${names}</div></section></div>`;
  }

  // Every mark in every state, the crowning both ways.
  function sheetScreen() {
    const cols = [['calm', 'calm', 'square'], ['held', 'held', 'square'], ['king', 'king square', 'square'],
      ['king', 'king piece', 'piece'], ['hint1', 'hint1', 'square'], ['hint2', 'hint2', 'square']];
    let html = '';
    if (landscape) {
      html = `<span></span>${cols.map((c) => `<h3>${c[1]}</h3>`).join('')}`;
      for (const m of MARKS) {
        html += `<span class="take">${m}</span>`;
        for (const [st, , km] of cols) html += `<div class="cell"><div class="board" data-m="${m}" data-k="${km}" data-s="${st}"></div></div>`;
      }
    } else {
      html = `<span></span>${MARKS.map((m) => `<h3>${m}</h3>`).join('')}`;
      for (const [st, label, km] of cols) {
        html += `<span class="take">${label}</span>`;
        for (const m of MARKS) html += `<div class="cell"><div class="board" data-m="${m}" data-k="${km}" data-s="${st}"></div></div>`;
      }
    }
    document.getElementById('app').innerHTML = `<div class="sheet">${html}</div>`;
    document.querySelectorAll('.sheet .board').forEach((el) => draw(el, el.dataset.m, el.dataset.k, el.dataset.s, true));
  }

  if (sheet) sheetScreen();
  else if (state === 'control') controlScreen();
  else gameScreen();

  Draughts.paint();
  addEventListener('load', () => document.fonts.ready.then(() => {
    if (!sheet && !landscape && state !== 'control') fitPortrait();
    Draughts.paint();
    Draughts.syncGlass();
  }));
  addEventListener('resize', () => setTimeout(() => location.reload(), 200));

  // Every option from the switcher.
  const bar = document.querySelector('.proto-bar');
  const sel = (key, values, current) => `<select data-k="${key}" aria-label="${key}">${values.map((v) =>
    `<option${v === current ? ' selected' : ''}>${v}</option>`).join('')}</select>`;
  bar.insertAdjacentHTML('afterbegin', sel('take', TAKES, take) +
    sel('mark', MARKS, mark) + sel('king', KINGS, kingMark) + sel('state', STATES, state) +
    sel('lookout', ['on', 'off'], lookoutOn ? 'on' : 'off') + sel('name', NAMES, name) + sel('lang', ['en', 'et'], lang) +
    sel('you', ['white', 'black'], you) + sel('view', ['game', 'sheet'], sheet ? 'sheet' : 'game'));
  document.body.insertAdjacentHTML('beforeend', '<button class="proto-fold">Options</button>');
  document.querySelector('.proto-fold').onclick = () => document.body.classList.toggle('bar-open');
  bar.querySelectorAll('select[data-k]').forEach((s) => s.onchange = (e) => {
    e.stopPropagation();
    params.set(s.dataset.k, s.value);
    location.search = params.toString();
  });
</script>
</body>
</html>

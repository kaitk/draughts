<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: settings' gear</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* Takes on home's settings in portrait, the gear beside the wordmark: ?take=now, a, or
     b, &lang=et for Estonian, &guides to outline each tap's 88 dp. Home is laid out as
     shell/home.goose lays it out in portrait, in dp (1 px here): the sharp photograph,
     the board, the X in the top right, and the sheet with the wordmark and four rows.

     now: as built, a quiet tile 88 dp square (radius 16) with a 44 dp gear, reaching 8 dp
          over and under the wordmark's row.
     a:   the gear alone, 40 dp at 85% (the rows' icons are 34), no tile; its tap is still
          88 dp round it, clear until pressed, then lit as a pressed row is (white at
          14%, round). The wordmark may run under the tap's empty left side, up to 12 dp
          from the gear, so on a phone its letters close up less.
     b:   the X's round glass button, 88 dp across with a 32 dp gear at 90%: one look for
          the two round controls at the top right. */
  .menu { position: fixed; display: grid; align-content: center; }
  .menu.glass { --r: 32px; }
  .content { position: absolute; display: grid; align-content: start; gap: 2px; }
  .mark { position: relative; display: flex; align-items: center; gap: 14px; height: 72px; }
  .mark .piece { position: relative; inset: auto; width: 56px; height: 56px; --u: 5px; flex: none; }
  .mark h1 { margin: 0; font-size: 64px; font-weight: 400; letter-spacing: 0.06em; white-space: nowrap; }
  .item { display: flex; align-items: center; gap: 18px; height: 88px; padding: 0 18px; border-radius: 20px;
    color: var(--fg); text-decoration: none; font-size: 30px; }
  .item > [data-icon] { display: grid; }
  .item .icon { width: 34px; height: 34px; stroke-width: 2.4; opacity: 0.85; }
  .item.primary { background: color-mix(in srgb, var(--glow) 24%, transparent); }
  .item:active { background: rgb(255 255 255 / 0.14); }
  .item small { margin-left: auto; font-size: 17px; color: var(--fg-dim); }
  #board { position: fixed; isolation: isolate; }
  /* The gear, its 88 dp tap at the wordmark row's right end, 8 dp over and under it. */
  .gear { position: absolute; right: 0; top: -8px; width: 88px; height: 88px; display: grid; place-items: center;
    color: var(--fg); transition: background 120ms, transform 120ms; }
  .gear:active { transform: scale(0.96); }
  .take-now .gear { border-radius: 16px; background: rgb(255 255 255 / 0.08);
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.18), 0 6px 14px -8px rgb(0 0 0 / 0.5); }
  .take-now .gear:active { background: rgb(255 255 255 / 0.22); }
  .take-now .gear svg { width: 44px; height: 44px; stroke-width: 2.4; }
  .take-a .gear { border-radius: 50%; }
  .take-a .gear:active { background: rgb(255 255 255 / 0.14); }
  .take-a .gear svg { width: 40px; height: 40px; stroke-width: 2.4; opacity: 0.85; }
  .take-b .gear { --r: 44px; border-radius: 50%; }
  .take-b .gear::after { background: color-mix(in srgb, var(--glass-tint), rgb(255 255 255 / 0.08)); }
  .take-b .gear svg { width: 32px; height: 32px; stroke-width: 2.4; opacity: 0.9; }
  /* The way out, as built. */
  .corner { --r: 44px; position: fixed; display: grid; place-items: center; width: 88px; height: 88px;
    border-radius: 50%; color: var(--fg); }
  .corner::after { background: color-mix(in srgb, var(--glass-tint), rgb(255 255 255 / 0.08)); }
  .corner svg { width: 32px; height: 32px; stroke-width: 2.4; opacity: 0.9; }
  /* ?x=a to d: takes on the X (task 035's button) beside the bare gear; a is as built. */
  .x-b .corner, .x-c .corner, .x-d .corner { transition: background 120ms, box-shadow 120ms, transform 120ms; }
  .x-b .corner:active, .x-c .corner:active { background: rgb(255 255 255 / 0.14); transform: scale(0.96); }
  .x-b .corner svg { width: 40px; height: 40px; stroke-width: 2.4; opacity: 0.85; }
  .x-c .corner svg { width: 32px; height: 32px; stroke-width: 2; opacity: 0.6; }
  .x-d .corner svg { width: 34px; height: 34px; stroke-width: 2.8; opacity: 0.8; }
  .x-d .corner:active { background: rgb(255 255 255 / 0.10); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.22); transform: scale(0.96); }
  .guides .gear, .guides .corner { outline: 1px dashed rgb(255 120 120 / 0.8); }
</style>
</head>
<body>
<nav class="menu glass"><div class="content">
  <div class="mark"><div class="piece white king"></div><h1 data-s="app"></h1>
    <a class="gear" href="settings.html" data-icon="gear" aria-label="Settings"></a></div>
  <div style="height: 10px"></div>
  <a class="item primary" href="game.html"><span data-icon="next"></span><span data-s="continue"></span></a>
  <a class="item" href="home.html?pick=friend"><span data-icon="friend"></span><span data-s="friend"></span></a>
  <a class="item" href="home.html?pick=computer"><span data-icon="computer"></span><span data-s="computer"></span><small data-s="medium"></small></a>
  <a class="item" href="puzzles.html"><span data-icon="puzzle"></span><span data-s="puzzles"></span><small>23 / 90</small></a>
</div></nav>
<div id="board"></div>
<a class="corner glass" href="#" data-icon="close" aria-label="Exit"></a>
<script>
  const params = new URLSearchParams(location.search);
  const TAKES = ['now', 'a', 'b'];
  const XS = ['a', 'b', 'c', 'd'];
  const x = XS.includes(params.get('x')) ? params.get('x') : 'a';
  const take = TAKES.includes(params.get('take')) ? params.get('take') : params.has('x') ? 'a' : 'now';
  const lang = params.get('lang') === 'et' ? 'et' : 'en';
  const S = {
    en: { app: 'Draughts', continue: 'Continue', friend: 'A friend', computer: 'The computer', medium: 'medium',
      puzzles: 'Puzzles' },
    et: { app: 'Kabe', continue: 'Jätka', friend: 'Sõbraga', computer: 'Arvutiga', medium: 'keskmine',
      puzzles: 'Ülesanded' },
  }[lang];
  document.documentElement.lang = lang;
  document.body.classList.add(`take-${take}`, `x-${x}`);
  if (x !== 'a') document.querySelector('.corner').classList.remove('glass');
  document.body.classList.toggle('guides', params.has('guides'));
  if (take === 'b') document.querySelector('.gear').classList.add('glass');
  Draughts.ICONS.close = '<path d="M6 6l12 12"/><path d="M18 6 6 18"/>';
  for (const el of document.querySelectorAll('[data-s]')) el.textContent = S[el.dataset.s];

  // Lays home out in portrait as shell/home.goose does, in dp.
  const MARK = 72, GAP = 14, ROW = 88, ROW_GAP = 2, CORNER = 88, EDGE = 24;
  function layout() {
    const W = innerWidth, H = innerHeight;
    const contentH = MARK + GAP + 4 * ROW + 3 * ROW_GAP;
    const menu = document.querySelector('.menu'), board = document.getElementById('board');
    const put = (el, x, y, w, h) => Object.assign(el.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px` });
    const sheetH = contentH + 64;
    put(menu, 0, H - sheetH, W, sheetH + 32);
    put(content, 32, 32, W - 64, contentH);
    const stageH = H - sheetH, clear = EDGE + CORNER + 16;
    const room = Math.max(stageH - 80, Math.min(stageH - 48, 0.4 * W));
    let size = Math.min(0.8 * W, 0.6 * H, room);
    let by = (stageH - size) / 2;
    if ((W + size) / 2 > W - clear && by < clear) {
      by = clear;
      size = Math.min(size, stageH - 24 - by);
    }
    put(board, (W - size) / 2, by, size, size);
    put(document.querySelector('.corner'), W - EDGE - CORNER, EDGE, CORNER, CORNER);
    // The name spaced out, less where the gear leaves too little room: it keeps 12 dp from
    // the gear's tile (now, b) or from the gear itself (a).
    const h1 = document.querySelector('.mark h1');
    h1.style.letterSpacing = '0px';
    const n = S.app.length, text = h1.scrollWidth;
    const icon = take === 'a' ? 40 : 88;
    const markW = W - 64 - 56 - 14 - (88 + icon) / 2;
    const spare = (markW - 12 - text) / Math.max(1, n - 1);
    h1.style.letterSpacing = `${Math.max(0, Math.min(spare, 0.06 * 64))}px`;
    Draughts.syncGlass();
    Draughts.paint();
    document.title = `Draughts: gear, take ${take}: board ${Math.round(size)} dp, name spaced ${spare.toFixed(1)} dp`;
  }
  const content = document.querySelector('.content');

  Draughts.settings.bg = 'photo';
  Draughts.init();
  for (const el of document.querySelectorAll('.corner, .gear')) {
    el.addEventListener('click', (e) => { e.preventDefault(); el.blur(); });
  }
  const bar = document.querySelector('.proto-bar');
  bar.insertAdjacentHTML('afterbegin', `<select aria-label="x">${XS.map((k) =>
    `<option${k === x ? ' selected' : ''}>${k}</option>`).join('')}</select>` + `<select aria-label="take">${TAKES.map((k) =>
    `<option${k === take ? ' selected' : ''}>${k}</option>`).join('')}</select>` +
    `<select aria-label="lang">${['en', 'et'].map((k) => `<option${k === lang ? ' selected' : ''}>${k}</option>`).join('')}</select>`);
  for (const [i, key] of [[0, 'x'], [1, 'take'], [2, 'lang']]) {
    bar.querySelectorAll('select')[i].onchange = (e) => {
      e.stopPropagation();
      params.set(key, e.target.value);
      location.search = params.toString();
    };
  }
  Draughts.board(document.getElementById('board'), { ...Draughts.start(10), view: '2d' });
  layout();
  addEventListener('resize', layout);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: players</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* Takes on local players (task 038): ?take=a, b, or c; &state=home, pick, add, edit, or
     hold; &lang=et; &n=1 to 4 players; &guides outlines each tap. A player is a picture (an
     animal on its own colour, which a child knows without reading), a name if wanted, and
     their own look, puzzle stars, computer levels, and game. Home is laid out as
     src/shell/home.goose lays it out, in dp (1 px here).

     a: the player beside the name. Home's king beside the wordmark becomes the player's
        face, 64 dp in an 88 dp tap; a tap opens "who's playing" on a card over home.
        The last player stays until switched.
     b: who's playing first. Every launch opens on the faces, large, over the photograph;
        a tap goes home, where the face beside the name (as in a) comes back here. With
        one player it is skipped.
     c: faces on home. A row of faces under the wordmark, the player lit; one tap switches.
        Tapping the lit face opens its sheet; + adds one.

     All three: the player's sheet (add, edit) picks the animal and an optional name;
     start again and remove are holds of 1.5 s, a ring filling round the tile, behind the
     picker's pencil (a and b) or the lit face (c). Switching changes the photograph,
     board, stars, level, and game to the player's own. */
  .menu { position: fixed; display: grid; }
  .menu.glass { --r: 32px; }
  .content { position: absolute; display: grid; align-content: start; gap: 2px; }
  .mark { position: relative; display: flex; align-items: center; gap: 6px; height: 72px; }
  .mark .piece { position: relative; inset: auto; width: 56px; height: 56px; --u: 5px; flex: none; margin-right: 8px; }
  .mark h1 { margin: 0; font-size: 64px; font-weight: 400; letter-spacing: 0.06em; white-space: nowrap; flex: none; }
  .item { display: flex; align-items: center; gap: 18px; height: 88px; padding: 0 18px; border-radius: 20px;
    color: var(--fg); text-decoration: none; font-size: 30px; }
  .item > [data-icon] { display: grid; }
  .item .icon { width: 34px; height: 34px; stroke-width: 2.4; opacity: 0.85; }
  .item.primary { background: color-mix(in srgb, var(--glow) 24%, transparent); }
  .item:active { background: rgb(255 255 255 / 0.14); }
  .item small { margin-left: auto; font-size: 17px; color: var(--fg-dim); }
  #board { position: fixed; isolation: isolate; }
  .gear { flex: none; width: 88px; height: 88px; margin-left: auto; display: grid; place-items: center; border-radius: 50%;
    color: var(--fg); }
  .gear svg { width: 40px; height: 40px; stroke-width: 2.4; opacity: 0.85; }
  .gear:active, .tap:active { background: rgb(255 255 255 / 0.14); }
  .corner { --r: 44px; position: fixed; display: grid; place-items: center; width: 88px; height: 88px;
    border-radius: 50%; color: var(--fg); z-index: 3; }
  .corner::after { background: color-mix(in srgb, var(--glass-tint), rgb(255 255 255 / 0.08)); }
  .corner svg { width: 32px; height: 32px; stroke-width: 2.4; opacity: 0.9; }

  /* A player's face: the animal in ivory on its colour, a disc. Natively a filled icon,
     as home's tiles' icons are, over an SDF disc with a gradient. */
  .face { --c: #d9793a; display: grid; place-items: center; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--c), #fff 14%), var(--c) 72%);
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.22), 0 6px 14px -8px rgb(0 0 0 / 0.55); }
  .face svg { width: 74%; height: 74%; }
  .face .f { fill: #fbf3e6; }
  .face .e { fill: #2a211c; }
  .face .c { fill: var(--c); }
  .face .m { fill: none; stroke: #2a211c; stroke-width: 1.2; stroke-linecap: round; }
  .face.add { background: rgb(255 255 255 / 0.08); box-shadow: inset 0 0 0 2px rgb(255 255 255 / 0.35); color: var(--fg); }
  .face.add svg { width: 44%; height: 44%; stroke-width: 2.4; }
  /* a and b: the face in the wordmark's row, where the king was: 64 dp in an 88 dp tap. */
  .chip { flex: none; width: 88px; height: 88px; display: grid; place-items: center; border-radius: 50%; margin: 0 -6px 0 -12px; }
  .chip .face { width: 64px; height: 64px; }
  /* c: the faces' row under the wordmark, each an 88 dp tile, the player lit. */
  .faces { display: flex; gap: 2px; margin: 4px 0 12px; }
  .faces .tap { width: 88px; height: 88px; display: grid; place-items: center; border-radius: 20px; }
  .faces .tap .face { width: 66px; height: 66px; }
  .faces .tap.on { background: color-mix(in srgb, var(--glow) 22%, transparent); box-shadow: inset 0 0 0 2px var(--glow); }
  .faces .gear { margin-left: auto; }

  /* Over home: the screen dimmed under a glass card. */
  .veil { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; padding: 16px;
    background: rgb(0 0 0 / 0.42); }
  .card { --r: 32px; display: grid; gap: 14px; padding: 20px 24px 24px; max-width: 100%; max-height: 100%; }
  .head { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .head h2 { margin: 0; font-size: 34px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head .face { width: 56px; height: 56px; }
  .head .end { margin-left: auto; display: flex; gap: 10px; }
  .button.on { background: color-mix(in srgb, var(--glow) 22%, transparent); box-shadow: inset 0 0 0 2px var(--glow); }
  /* Who's playing: a face and its name under it per player, then + while there is room. */
  .who { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .who .tap { position: relative; display: grid; justify-items: center; align-content: center; gap: 8px; width: var(--tile);
    min-height: var(--tile); padding: 12px 6px; border-radius: 24px; color: var(--fg); text-decoration: none; font-size: 22px; }
  .who .tap .face { width: calc(var(--tile) * 0.72); height: calc(var(--tile) * 0.72); }
  .who .tap span.name { min-height: 26px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who .tap.on .face { box-shadow: 0 0 0 4px var(--glow), 0 0 22px color-mix(in srgb, var(--glow) 50%, transparent); }
  .who .badge { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border-radius: 50%; display: grid;
    place-items: center; background: color-mix(in srgb, var(--glass-tint), rgb(255 255 255 / 0.22)); }
  .who .badge svg { width: 22px; height: 22px; stroke-width: 2.4; }
  .who .tap.editing { background: rgb(255 255 255 / 0.06); }

  /* b: the faces as the first screen, each a glass tile on the photograph. */
  .launch { position: fixed; inset: 0; z-index: 2; display: grid; place-content: center; justify-items: center; gap: 18px;
    padding: 24px 16px; }
  .launch .mark { height: 72px; }
  .launch h2 { margin: 0; font-size: 30px; font-weight: 400; color: var(--fg-dim); }
  .launch .who { gap: 16px; }
  .launch .who .tap { --r: 28px; }
  .launch .corner.left { left: 24px; top: 24px; }
  /* Home isn't drawn under the first screen: only the photograph. */
  .launching .menu, .launching #board { display: none; }

  /* The player's sheet. */
  .sheet .body, .sheet .col { display: grid; gap: 14px; align-content: start; }
  .sheet .col { gap: 10px; }
  /* A phone in landscape: the pictures at the left, the name and the holds at the right. */
  .wide .sheet .body { grid-template-columns: auto minmax(300px, 1fr); gap: 24px; }
  .phone .head h2 { font-size: 28px; }
  .sheet h3 { margin: 4px 4px 0; font-size: 18px; font-weight: 400; color: var(--fg-dim); letter-spacing: 0.03em; }
  .pics { display: grid; grid-template-columns: repeat(6, var(--pic)); gap: 10px; }
  .pics .tap { width: var(--pic); height: var(--pic); display: grid; place-items: center; border-radius: 20px;
    background: var(--button); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.12); }
  .pics .tap .face { width: calc(var(--pic) - 22px); height: calc(var(--pic) - 22px); }
  .pics .tap.on { background: color-mix(in srgb, var(--glow) 22%, transparent); box-shadow: inset 0 0 0 2px var(--glow); }
  .pics .tap.taken { opacity: 0.3; pointer-events: none; }
  .name-field { display: flex; align-items: center; gap: 14px; height: 88px; padding: 0 20px; border-radius: 20px;
    background: rgb(0 0 0 / 0.18); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.18); }
  .name-field .icon { width: 28px; height: 28px; opacity: 0.6; flex: none; }
  .name-field input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--fg); font: inherit; font-size: 30px; }
  .name-field input::placeholder { color: var(--fg-dim); opacity: 0.7; }
  .holds { display: flex; gap: 12px; }
  .hold { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; gap: 12px; height: 88px;
    min-width: 88px; padding: 0 16px; border: 0; border-radius: 20px; color: var(--fg); font: inherit; font-size: 22px;
    background: var(--button); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.12); cursor: pointer; touch-action: none; }
  .hold .icon { width: 30px; height: 30px; stroke-width: 2.4; opacity: 0.85; flex: none; }
  .hold small { display: block; font-size: 15px; color: var(--fg-dim); }
  .hold.remove { color: color-mix(in srgb, var(--forced), var(--fg) 45%); }
  .hold .ring { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .hold .ring rect { fill: none; stroke: var(--glow); stroke-width: 4; stroke-dasharray: 100; stroke-dashoffset: 100; }
  .hold.remove .ring rect { stroke: var(--forced); }
  .hold.held { background: rgb(255 255 255 / 0.2); }

  .guides .tap, .guides .gear, .guides .corner, .guides .chip, .guides .hold, .guides .button, .guides .item {
    outline: 1px dashed rgb(255 120 120 / 0.8); }
</style>
</head>
<body>
<nav class="menu glass"><div class="content" id="content"></div></nav>
<div id="board"></div>
<a class="corner glass" id="close" href="#" data-icon="close" aria-label="Exit"></a>
<div id="over"></div>
<script>
  const params = new URLSearchParams(location.search);
  const TAKES = ['a', 'b', 'c'], STATES = ['home', 'pick', 'add', 'edit', 'hold'];
  const take = TAKES.includes(params.get('take')) ? params.get('take') : 'a';
  let state = STATES.includes(params.get('state')) ? params.get('state') : (take === 'b' ? 'pick' : 'home');
  const lang = params.get('lang') === 'et' ? 'et' : 'en';
  const S = {
    en: { app: 'Draughts', continue: 'Continue', friend: 'A friend', computer: 'The computer', settings: 'Settings',
      puzzles: 'Puzzles', easy: 'easy', medium: 'medium', hard: 'hard', who: "Who's playing?", new: 'New player',
      picture: 'Picture', name: 'Name', again: 'Start again', remove: 'Remove', hold: 'Hold', names: ['Mia', '', 'Dad', ''] },
    et: { app: 'Kabe', continue: 'Jätka', friend: 'Sõbraga', computer: 'Arvutiga', settings: 'Seaded',
      puzzles: 'Ülesanded', easy: 'kerge', medium: 'keskmine', hard: 'raske', who: 'Kes mängib?', new: 'Uus mängija',
      picture: 'Pilt', name: 'Nimi', again: 'Alusta otsast', remove: 'Eemalda', hold: 'Hoia all', names: ['Mia', '', 'Isa', ''] },
  }[lang];
  document.documentElement.lang = lang;
  document.body.classList.toggle('guides', params.has('guides'));

  Draughts.ICONS.close = '<path d="M6 6l12 12"/><path d="M18 6 6 18"/>';
  Draughts.ICONS.plus = '<path d="M12 5v14"/><path d="M5 12h14"/>';
  Draughts.ICONS.pencil = '<path d="M4 20l1-4.5L15.5 5a2.1 2.1 0 0 1 3 3L8 18.5z"/><path d="M13.5 7l3 3"/>';
  Draughts.ICONS.check = '<path d="M4.5 12.5l5 5 10-11"/>';
  Draughts.ICONS.trash = '<path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/><path d="M6 7l1 13h10l1-13"/>';

  // The animals, front on, on the icons' 24-unit grid: f the face (ivory), e eyes and
  // nose, c a cut-out in the disc's colour, m a line. Six, each with its own colour, for
  // up to four players; a picture one player has is not offered to another.
  const ANIMALS = {
    fox: { c: '#d9793a', svg: '<path class="f" d="M3 3.5 8.5 8h7L21 3.5l-.6 8.6Q19 18.6 12 21.5 5 18.6 3.6 12.1z"/><circle class="e" cx="8.8" cy="12.6" r="1.25"/><circle class="e" cx="15.2" cy="12.6" r="1.25"/><circle class="e" cx="12" cy="18.6" r="1.4"/>' },
    hare: { c: '#6f9fcf', svg: '<ellipse class="f" cx="8.6" cy="6.4" rx="2.3" ry="5.4" transform="rotate(-10 8.6 6.4)"/><ellipse class="f" cx="15.4" cy="6.4" rx="2.3" ry="5.4" transform="rotate(10 15.4 6.4)"/><circle class="f" cx="12" cy="15.2" r="6.6"/><circle class="e" cx="9.5" cy="14.4" r="1.15"/><circle class="e" cx="14.5" cy="14.4" r="1.15"/><path class="e" d="M10.8 17.2h2.4L12 18.6z"/>' },
    bear: { c: '#8c6142', svg: '<circle class="f" cx="6.2" cy="6.8" r="3.2"/><circle class="f" cx="17.8" cy="6.8" r="3.2"/><circle class="c" cx="6.2" cy="6.8" r="1.3"/><circle class="c" cx="17.8" cy="6.8" r="1.3"/><circle class="f" cx="12" cy="13.6" r="8"/><circle class="e" cx="9" cy="12.2" r="1.2"/><circle class="e" cx="15" cy="12.2" r="1.2"/><ellipse class="e" cx="12" cy="16.2" rx="1.9" ry="1.35"/>' },
    owl: { c: '#8a74c4', svg: '<path class="f" d="M4.5 3.5 9 7q3-1 6 0l4.5-3.5.5 9.5Q19.6 20.8 12 21.5 4.4 20.8 4 13z"/><circle class="c" cx="8.9" cy="12" r="3"/><circle class="c" cx="15.1" cy="12" r="3"/><circle class="e" cx="8.9" cy="12" r="1.4"/><circle class="e" cx="15.1" cy="12" r="1.4"/><path class="e" d="M10.8 14.6h2.4L12 17z"/>' },
    frog: { c: '#5e9e5a', svg: '<circle class="f" cx="7.3" cy="8.8" r="3.6"/><circle class="f" cx="16.7" cy="8.8" r="3.6"/><ellipse class="f" cx="12" cy="15" rx="9.3" ry="6.2"/><circle class="e" cx="7.3" cy="8.6" r="1.5"/><circle class="e" cx="16.7" cy="8.6" r="1.5"/><path class="m" d="M7.6 16.2Q12 19.4 16.4 16.2"/>' },
    hedgehog: { c: '#c46f86', svg: '<path class="f" d="M12 2l2.2 3.2 3.6-1.6.4 3.8 3.6.6-1.5 3.1 2 2.6-3.1 1.6Q17.5 21.3 12 21.5 6.5 21.3 4.8 15.3L1.7 13.7l2-2.6L2.2 8l3.6-.6.4-3.8 3.6 1.6z"/><circle class="e" cx="9.4" cy="13.4" r="1.2"/><circle class="e" cx="14.6" cy="13.4" r="1.2"/><circle class="e" cx="12" cy="17.2" r="1.5"/>' },
  };
  const ORDER = Object.keys(ANIMALS);
  const face = (animal, cls = '') =>
    `<span class="face ${cls}" style="--c:${ANIMALS[animal].c}"><svg viewBox="0 0 24 24" aria-hidden="true">${ANIMALS[animal].svg}</svg></span>`;

  // The players, as the app would keep them: one file each (task 038). The query can
  // change their pictures and names (pics=, names=), as adding and removing does here.
  const DEFAULT = [
    { pic: 'fox', season: 'autumn', stars: 23, level: 'medium', game: 'start' },
    { pic: 'hare', season: 'winter', stars: 5, level: 'easy', game: 'middle' },
    { pic: 'owl', season: 'summer', stars: 52, level: 'hard', game: 'start' },
    { pic: 'hedgehog', season: 'spring', stars: 0, level: 'easy', game: 'start' },
  ];
  const n = Math.max(1, Math.min(4, +(params.get('n') || 2)));
  const pics = (params.get('pics') || '').split(',');
  const names = params.has('names') ? params.get('names').split(',') : S.names;
  const fresh = (params.get('fresh') || '').split(',');
  const players = Array.from({ length: n }, (_, i) => ({
    ...DEFAULT[i], pic: ANIMALS[pics[i]] ? pics[i] : DEFAULT[i].pic, name: names[i] || '',
    stars: fresh.includes(String(i)) ? 0 : DEFAULT[i].stars,
  }));
  const me = Math.max(0, Math.min(n - 1, +(params.get('p') || 0)));
  const who = Math.max(0, Math.min(n - 1, +(params.get('who') ?? me)));
  // The look is the player's: their season, unless the switcher picked one.
  if (!params.has('season')) { params.set('season', players[me].season); location.replace(`?${params}`); }

  // Goes to the page as it would be after a tap.
  const go = (changes) => {
    const p = new URLSearchParams(location.search);
    for (const [k, v] of Object.entries(changes)) { if (v === null) p.delete(k); else p.set(k, v); }
    location.search = p.toString();
  };
  const switchTo = (i) => go({ p: i, season: players[i].season, theme: null, state: 'home', who: null });

  // Home's column: the wordmark's row, the faces in c, and the menu.
  const content = document.getElementById('content');
  const pl = players[me];
  const mark = take === 'c'
    ? '<div class="piece white king"></div>'
    : `<a class="chip tap" href="#" data-act="pick" aria-label="${S.who}">${face(pl.pic)}</a>`;
  content.innerHTML =
    `<div class="mark">${mark}<h1>${S.app}</h1><a class="gear" href="settings.html" data-icon="gear" aria-label="${S.settings}"></a></div>` +
    (take === 'c' ? `<div class="faces">${players.map((q, i) =>
      `<a class="tap${i === me ? ' on' : ''}" href="#" data-act="${i === me ? 'edit' : 'switch'}" data-i="${i}">${face(q.pic)}</a>`).join('')}` +
      (n < 4 ? `<a class="tap" href="#" data-act="add">${'<span class="face add">' + Draughts.icon('plus') + '</span>'}</a>` : '') + '</div>' : '') +
    `<a class="item primary" href="game.html"><span data-icon="next"></span><span>${S.continue}</span></a>` +
    `<a class="item" href="home.html?pick=friend"><span data-icon="friend"></span><span>${S.friend}</span></a>` +
    `<a class="item" href="home.html?pick=computer"><span data-icon="computer"></span><span>${S.computer}</span><small>${S[pl.level]}</small></a>` +
    `<a class="item" href="puzzles.html"><span data-icon="puzzle"></span><span>${S.puzzles}</span><small>${pl.stars} / 64</small></a>` +
    `<a class="item settings" href="settings.html"><span data-icon="gear"></span><span>${S.settings}</span></a>`;

  // Who's playing: a, a card over home; b, the first screen.
  let editing = false;
  function whoTiles(tile) {
    return players.map((q, i) => `<a class="tap${i === me ? ' on' : ''}${editing ? ' editing' : ''}" href="#" data-act="${editing ? 'edit' : 'switch'}" data-i="${i}">` +
      `${face(q.pic)}<span class="name">${q.name}</span>${editing ? `<span class="badge">${Draughts.icon('pencil')}</span>` : ''}</a>`).join('') +
      (n < 4 ? `<a class="tap" href="#" data-act="add"><span class="face add">${Draughts.icon('plus')}</span><span class="name"></span></a>` : '');
  }
  function showPick() {
    const over = document.getElementById('over');
    if (take === 'a') {
      over.innerHTML = `<div class="veil" data-act="home"><div class="card glass"><div class="head">` +
        `<a class="button glass" href="#" data-act="home" data-icon="back" aria-label="Back"></a><h2>${S.who}</h2>` +
        `<div class="end"><a class="button glass${editing ? ' on' : ''}" href="#" data-act="pencil" data-icon="pencil"></a></div></div>` +
        `<div class="who">${whoTiles()}</div></div></div>`;
    } else {
      over.innerHTML = `<div class="launch"><div class="mark"><div class="piece white king"></div><h1>${S.app}</h1></div>` +
        `<h2>${S.who}</h2><div class="who">${whoTiles()}</div></div>` +
        `<a class="corner glass left${editing ? ' on' : ''}" href="#" data-act="pencil" data-icon="pencil" aria-label="Edit"></a>`;
      for (const t of over.querySelectorAll('.who .tap')) t.classList.add('glass');
      document.body.classList.add('launching');
    }
    finish(over);
  }

  // The player's sheet: the picture, a name if wanted, and in edit the two holds.
  function showSheet(edit, held) {
    const q = edit ? players[who] : null;
    const pic = edit ? q.pic : ORDER.find((a) => !players.some((x) => x.pic === a));
    const over = document.getElementById('over');
    over.innerHTML = `<div class="veil"><div class="card glass sheet"><div class="head">` +
      `<a class="button glass" href="#" data-act="${take === 'c' ? 'home' : 'pick'}" data-icon="back" aria-label="Back"></a>` +
      (edit ? `${face(q.pic)}<h2>${q.name}</h2>` : `<h2>${S.new}</h2>`) +
      `<div class="end"><a class="button glass primary" href="#" data-act="${edit ? 'save' : 'create'}" data-icon="check" aria-label="Done"></a></div></div>` +
      `<div class="body"><div class="col"><h3>${S.picture}</h3><div class="pics">${ORDER.map((a) => {
        const taken = players.some((x, i) => x.pic === a && !(edit && i === who));
        return `<a class="tap${a === pic ? ' on' : ''}${taken ? ' taken' : ''}" href="#" data-pic="${a}">${face(a)}</a>`;
      }).join('')}</div></div>` +
      `<div class="col"><h3>${S.name}</h3><label class="name-field">${Draughts.icon('pencil')}<input value="${edit ? q.name : ''}" placeholder="${S.name}" maxlength="12"></label>` +
      (edit ? `<div class="holds"><button class="hold" data-act="again">${Draughts.icon('restart')}<span>${S.again}<small>${S.hold}</small></span>` +
        '<svg class="ring" aria-hidden="true"><rect x="2" y="2" rx="18" pathLength="100"/></svg></button>' +
        (n > 1 ? `<button class="hold remove" data-act="remove">${Draughts.icon('trash')}<span>${S.remove}<small>${S.hold}</small></span>` +
          '<svg class="ring" aria-hidden="true"><rect x="2" y="2" rx="18" pathLength="100"/></svg></button>' : '') + '</div>' : '') +
      '</div></div></div></div>';
    finish(over);
    for (const t of over.querySelectorAll('[data-pic]')) {
      t.onclick = (e) => {
        e.preventDefault();
        over.querySelectorAll('[data-pic]').forEach((x) => x.classList.toggle('on', x === t));
      };
    }
    for (const b of over.querySelectorAll('.hold')) holdable(b);
    if (held) ring(over.querySelector('.hold.remove') || over.querySelector('.hold'), 0.6);
  }
  const chosenPic = () => document.querySelector('[data-pic].on')?.dataset.pic;
  const typedName = () => document.querySelector('.name-field input')?.value.replace(/,/g, '') || '';
  const list = (f) => players.map(f).join(',');

  // A hold: the ring fills over 1.5 s while pressed; let go early and nothing happens.
  const HOLD_MS = 1500;
  function ring(b, f) {
    const r = b.querySelector('.ring rect');
    r.setAttribute('width', b.offsetWidth - 4);
    r.setAttribute('height', b.offsetHeight - 4);
    r.style.strokeDashoffset = 100 * (1 - f);
    b.classList.toggle('held', f > 0);
  }
  function holdable(b) {
    let t0 = 0, raf = 0;
    const stop = () => { cancelAnimationFrame(raf); t0 = 0; ring(b, 0); };
    b.onpointerdown = (e) => {
      e.preventDefault();
      t0 = performance.now();
      const step = (t) => {
        const f = Math.min(1, (t - t0) / HOLD_MS);
        ring(b, f);
        if (f < 1) { raf = requestAnimationFrame(step); return; }
        t0 = 0;
        act(b.dataset.act);
      };
      raf = requestAnimationFrame(step);
    };
    b.onpointerup = b.onpointerleave = b.onpointercancel = stop;
    b.onclick = (e) => e.preventDefault();
  }

  function act(what, i) {
    if (what === 'pick') { editing = false; state = 'pick'; render(); }
    if (what === 'home') { state = 'home'; editing = false; render(); layout(); }
    if (what === 'pencil') { editing = !editing; showPick(); }
    if (what === 'switch') switchTo(i);
    if (what === 'edit') go({ state: 'edit', who: i });
    if (what === 'add') { state = 'add'; render(); }
    if (what === 'create') {
      go({ n: n + 1, p: n, pics: list((q) => q.pic) + ',' + chosenPic(), names: list((q) => q.name) + ',' + typedName(),
        season: DEFAULT[n].season, theme: null, state: 'home', who: null });
    }
    if (what === 'save') {
      const ps = players.map((q, k) => k === who ? chosenPic() : q.pic), ns = players.map((q, k) => k === who ? typedName() : q.name);
      go({ pics: ps.join(','), names: ns.join(','), state: take === 'c' ? 'home' : 'pick', who: null });
    }
    if (what === 'again') go({ fresh: [...fresh.filter(Boolean), who].join(','), state: 'edit' });
    if (what === 'remove') {
      const keep = players.filter((_, k) => k !== who);
      const p = me === who ? 0 : me > who ? me - 1 : me;
      go({ n: n - 1, p, pics: keep.map((q) => q.pic).join(','), names: keep.map((q) => q.name).join(','), fresh: null,
        season: keep[p].season, theme: null, state: take === 'c' ? 'home' : 'pick', who: null });
    }
  }
  // Taps, on whatever is showing.
  function finish(root) {
    for (const el of root.querySelectorAll('[data-icon]')) {
      if (!el.querySelector(':scope > svg')) el.insertAdjacentHTML('afterbegin', Draughts.icon(el.dataset.icon));
    }
    for (const el of root.querySelectorAll('[data-act]')) {
      if (el.classList.contains('hold')) continue;
      el.addEventListener('click', (e) => {
        if (el.classList.contains('veil') && e.target !== el) return;
        e.preventDefault();
        e.stopPropagation();
        act(el.dataset.act, +el.dataset.i);
      });
    }
    Draughts.syncGlass();
    sizeOver();
  }
  // The overlays' sizes: a tile of who's playing is 132 dp on a phone, 156 on a tablet
  // (b: 156 and 200); the sheet's pictures 88 to 112 dp, in one row of six where they fit,
  // else two rows of three.
  function sizeOver() {
    const W = innerWidth, H = innerHeight, phone = Math.min(W, H) < 600;
    document.body.style.setProperty('--tile', `${take === 'b' ? (phone ? 132 : 200) : (phone ? 120 : 156)}px`);
    const card = W - 32 - 48, wide = W > H && H < 600;
    document.body.classList.toggle('wide', wide);
    document.body.classList.toggle('phone', phone);
    let pic = Math.min(112, Math.floor((Math.min(card, 760) - 50) / 6));
    let cols = 6;
    if (wide) { cols = 3; pic = 88; }
    else if (pic < 88) { cols = 3; pic = Math.min(112, Math.floor((card - 20) / 3)); }
    document.body.style.setProperty('--pic', `${pic}px`);
    const pics = document.querySelector('.pics');
    if (pics) pics.style.gridTemplateColumns = `repeat(${cols}, var(--pic))`;
    for (const b of document.querySelectorAll('.hold rect')) {
      b.setAttribute('width', b.closest('.hold').offsetWidth - 4);
      b.setAttribute('height', b.closest('.hold').offsetHeight - 4);
    }
    // Who's playing in even rows: four tiles that don't fit in one row go two and two.
    const whoEl = document.querySelector('.who');
    if (whoEl) {
      const tile = parseFloat(getComputedStyle(document.body).getPropertyValue('--tile')), gap = take === 'b' ? 16 : 12;
      const count = whoEl.children.length, room = Math.min(W - 32 - 48, take === 'b' ? W - 32 : 900);
      const fit = Math.max(1, Math.floor((room + gap) / (tile + gap)));
      const per = count <= fit ? count : Math.ceil(count / Math.ceil(count / fit));
      whoEl.style.maxWidth = `${per * tile + (per - 1) * gap}px`;
      whoEl.style.justifySelf = 'center';
    }
    // b's first screen on a short landscape: the wordmark gives way to the faces.
    const launch = document.querySelector('.launch');
    if (launch) launch.querySelector('.mark').style.display = H < 600 && W > H ? 'none' : '';
  }

  // Lays home out as src/shell/home.goose does, in dp: a column at the left in landscape,
  // a sheet under the board in portrait, the X in the top right.
  const MARK = 72, ROW = 88, ROW_GAP = 2, CORNER = 88, EDGE = 24, FACES = 88 + 16;
  function layout() {
    const W = innerWidth, H = innerHeight, landscape = W >= H;
    const menu = document.querySelector('.menu'), board = document.getElementById('board');
    const put = (el, x, y, w, h) => Object.assign(el.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px` });
    const faces = take === 'c' ? FACES : 0;
    const height = (rows, markGap, withMark) => (withMark ? MARK + markGap : 0) + faces + rows * ROW + (rows - 1) * ROW_GAP;
    // Settings is a row in a tall enough landscape, else the gear beside the wordmark;
    // where even that doesn't fit (c on a phone in landscape), the faces take the
    // wordmark's row, the gear at their end.
    let rows = 5, markGap = 28, withMark = true, colW = 360;
    if (!landscape || height(rows, markGap, true) > H - 48) { rows = 4; markGap = 14; }
    if (landscape && rows === 4) colW = 440;
    if (landscape && height(rows, markGap, true) > H - 32) withMark = false;
    const markEl = content.querySelector('.mark'), gear = content.querySelector('.gear');
    markEl.style.display = withMark ? '' : 'none';
    markEl.style.marginBottom = `${markGap}px`;
    gear.style.display = rows === 4 ? '' : 'none';
    content.querySelector('.item.settings').style.display = rows === 5 ? '' : 'none';
    const row = document.querySelector('.faces');
    if (row) {
      if (!withMark && gear.parentNode !== row) row.appendChild(gear);
      if (withMark && gear.parentNode !== markEl) markEl.appendChild(gear);
      row.style.margin = withMark ? '' : '0 0 12px';
    }
    const contentH = height(rows, markGap, withMark);
    let size, bx, by;
    if (landscape) {
      const left = colW === 360 ? 72 : 40, menuW = left + colW + 40 + 32;
      put(menu, -32, 0, menuW, H);
      put(content, left + 32, Math.max(16, (H - contentH) / 2), colW, contentH);
      const free = menuW - 32;
      size = Math.min(0.7 * H, W - free - 80, H - 2 * (EDGE + 8));
      bx = free + (W - free - size) / 2; by = (H - size) / 2;
      if (bx + size > W - EDGE - CORNER - 16 && by < EDGE + CORNER + 8) bx = W - EDGE - CORNER - 28 - size;
    } else {
      const sheetH = contentH + 64;
      put(menu, 0, H - sheetH, W, sheetH + 32);
      put(content, 32, 32, W - 64, contentH);
      const stageH = H - sheetH, clear = EDGE + CORNER + 16;
      size = Math.min(0.8 * W, 0.6 * H, Math.max(stageH - 80, Math.min(stageH - 48, 0.4 * W)));
      by = (stageH - size) / 2;
      if ((W + size) / 2 > W - clear && by < clear) { by = clear; size = Math.min(size, stageH - 24 - by); }
      bx = (W - size) / 2;
    }
    board.style.display = size < 128 ? 'none' : '';
    put(board, bx, by, size, size);
    put(document.getElementById('close'), W - EDGE - CORNER, EDGE, CORNER, CORNER);
    // The name spaced out, less where the face and the gear leave too little room, and
    // smaller where even unspaced it runs into them (it may run under their taps' clear
    // sides, 12 dp from the gear's glyph).
    const h1 = markEl.querySelector('h1');
    h1.style.letterSpacing = '0px';
    h1.style.fontSize = '64px';
    const lead = take === 'c' ? 56 + 14 : 88 - 18;
    const avail = (landscape ? colW : W - 64) - lead - (rows === 4 ? 88 - 24 + 12 : 0);
    const text = h1.scrollWidth, k = S.app.length;
    const spare = (avail - text) / Math.max(1, k - 1);
    h1.style.letterSpacing = `${Math.max(0, Math.min(spare, 0.06 * 64))}px`;
    if (text > avail) h1.style.fontSize = `${Math.floor(64 * avail / text)}px`;
    Draughts.syncGlass();
    Draughts.paint();
    sizeOver();
    document.title = `Draughts: players, take ${take}, ${state}: board ${Math.round(size)} dp${size < 128 ? ' (hidden)' : ''}` +
      `, column ${Math.round(contentH)} of ${H} dp`;
  }

  function render() {
    const over = document.getElementById('over');
    over.innerHTML = '';
    document.body.classList.remove('launching');
    if (state === 'pick' && take !== 'c' && (take === 'a' || n > 1)) showPick();
    if (state === 'add') showSheet(false);
    if (state === 'edit' || state === 'hold') showSheet(true, state === 'hold');
  }

  Draughts.settings.bg = 'photo';
  Draughts.init();
  finish(content);
  document.getElementById('close').addEventListener('click', (e) => { e.preventDefault(); document.body.style.opacity = 0.2; });
  // The take, state, players, and language, from the switcher.
  const bar = document.querySelector('.proto-bar');
  const sel = (key, values, cur) => `<select aria-label="${key}" data-q="${key}">${values.map((v) =>
    `<option${String(v) === String(cur) ? ' selected' : ''}>${v}</option>`).join('')}</select>`;
  bar.insertAdjacentHTML('afterbegin', sel('take', TAKES, take) + sel('state', STATES, state) + sel('n', [1, 2, 3, 4], n) +
    sel('lang', ['en', 'et'], lang));
  for (const s of bar.querySelectorAll('[data-q]')) {
    s.onchange = (e) => {
      e.stopPropagation();
      const ch = { [s.dataset.q]: e.target.value };
      if (s.dataset.q === 'n') Object.assign(ch, { pics: null, names: null, p: 0, fresh: null });
      go(ch);
    };
  }
  // The player's own game: Mia's International from the start, the hare's Russian under
  // way (a game in progress is the player's: home's board and continue show it).
  const pos = pl.game === 'middle'
    ? { n: 8, white: ['a1', 'c1', 'e1', 'g1', 'b2', 'f2', 'h2', 'c3', 'e3', 'd4', 'h6'],
        black: ['b8', 'd8', 'f8', 'h8', 'a7', 'c7', 'b6', 'e5', 'g5'], kings: ['h6'] }
    : Draughts.start(10);
  Draughts.board(document.getElementById('board'), { ...pos, view: '2d' });
  render();
  layout();
  addEventListener('resize', layout);
</script>
</body>
</html>

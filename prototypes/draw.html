<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: a draw</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* Takes on a draw (task 049): the ending, and the countdown in the game before it. The
     game's layout as built (game.html, back.html take b): back over the panel of settings
     and start over, the board, the play panel. A draw is calm: no ripple, no lift, no
     crown; the board dims and the ending is still from 0.8 s.

       a: a card like the win's, with words. Both pieces side by side, "Draw", and why in
          a short line, over back and again. The countdown is words under whose turn, with
          a row of dots that go out one a move.
       b: no card. The play panel becomes the ending (both pieces, "Draw", why), play
          again is its big tile, the board dims only a little. The countdown is a tile
          like a clock's, a big number beside the side it concerns.
       c: the win's card as it is, wordless: both pieces over back and again; the words
          stay in the panel, as "White wins" does. The countdown is dots round the turn
          piece's ring, the words under it.

     Take a is built. With clocks on there is no whose-turn to go under, and two panels
     have no spare height: a portrait game panel (clocks 72 + 12 + undo 88 fill it) and
     the 3D board's corner panel on a tablet (26 dp left). Three takes for those two:

       fit a: the whole line. In portrait undo gives up half its width and the line
          stands beside it; in the corner undo takes the shorter tile (96 dp) and the
          line goes under the clocks.
       fit b: a short form between the clocks, "Draw in 3" or "Repeat 2/3": in portrait
          a small column that narrows both clocks a little; in the corner one line, undo 12 dp shorter (120).
       fit c: the dots alone between the clocks, a column in the gap in portrait, a row
          in the corner. No words.

     ?take=a|b|c, &state=draw|count, &reason=repeat|kings|endgame, &n=1..5 (the count's
     moves left), &lang=et, &t= seconds to hold one moment of the ending (a click plays it
     again), &clocks=on with &fit=a|b|c, &view=3d for the corner panels in landscape. */
  main { position: fixed; inset: 0; }

  .game { --gap: 24px; --side: 232px; --b: min(100vh - 2 * var(--gap), 100vw - 2 * var(--side) - 4 * var(--gap));
    display: flex; align-items: center; justify-content: center; gap: var(--gap); height: 100%; padding: var(--gap); }
  #board { flex: none; width: var(--b); isolation: isolate; }
  .panel { display: flex; flex-direction: column; gap: 12px; flex: none; width: var(--side); height: var(--b); padding: 20px 16px; }
  .panel .space { flex: 1; }
  .out { order: -1; display: flex; flex-direction: column; gap: 12px; width: var(--side); height: var(--b); flex: none; }
  .out .panel { flex: 1; height: auto; }
  .back { position: relative; flex: none; display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 0 26px 0 18px; font-size: 26px; white-space: nowrap; text-decoration: none; }
  .back svg { width: 38px; height: 38px; }
  .row { display: flex; align-items: center; justify-content: flex-start; gap: 12px; min-height: 88px;
    padding: 0 14px; font-size: 24px; text-align: left; white-space: nowrap; }
  .row.button svg { flex: none; width: 34px; height: 34px; stroke-width: 2.2; }
  .row.big { flex-direction: column; justify-content: center; gap: 8px; min-height: 132px; font-size: 26px;
    white-space: normal; text-align: center; line-height: 1.1; }
  .row.big svg { width: 48px; height: 48px; }

  /* Whose turn: the piece with its glow ring, and the words. */
  .turn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 18px 0 10px; text-align: center; font-size: 26px; }
  .turn .piece { --u: 7px; position: relative; inset: auto; flex: none; width: 72px; height: 72px; }
  .turn .piece.on { box-shadow: 0 0 0 4px color-mix(in srgb, var(--glow) 80%, transparent),
    0 0 22px 4px color-mix(in srgb, var(--glow) 45%, transparent); }
  .words { display: grid; gap: 6px; }
  .note, .tally-note, .card .say p, .ending p { text-wrap: balance; }
  .note { font-size: 19px; line-height: 1.2; color: var(--fg-dim); }
  .note b { font-weight: 400; color: var(--fg); }

  /* Both pieces, side by side and just touching: the draw's mark, wherever a winner's
     piece would be. */
  .pair { position: relative; flex: none; display: flex; justify-content: center; }
  .pair .piece { --u: 7px; position: relative; inset: auto; width: 72px; height: 72px; }
  .pair .piece + .piece { margin-left: -6px; }

  /* a: the countdown's dots, one a move left, out ones a faint ring; the repetition's
     three, the times the position has come. */
  .dots { display: flex; justify-content: center; gap: 9px; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--glow);
    box-shadow: 0 0 8px color-mix(in srgb, var(--glow) 50%, transparent); }
  .dots i.out { background: none; box-shadow: inset 0 0 0 2px rgb(255 255 255 / 0.25); }

  /* b: the count as a tile like a clock's: what it is about, and the moves left in the
     clocks' figures. Glow-lit as the running clock is. */
  .tally { display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 0 16px 0 14px; border-radius: 20px;
    background: color-mix(in srgb, var(--glow) 14%, transparent); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--glow) 70%, transparent); }
  .tally .piece { --u: 4px; position: relative; inset: auto; flex: none; width: 44px; height: 44px; }
  .tally .pair .piece { width: 34px; height: 34px; --u: 3px; }
  .tally .pair .piece + .piece { margin-left: -4px; }
  .tally > svg { flex: none; width: 40px; height: 40px; stroke-width: 2.2; color: var(--glow); }
  .tally .fig { margin-left: auto; font-size: 40px; font-variant-numeric: tabular-nums; line-height: 1; }
  .tally .fig small { font-size: 22px; color: var(--fg-dim); }
  .tally-note { font-size: 19px; line-height: 1.2; text-align: center; color: var(--fg-dim); }

  /* c: dots on the turn piece's ring, all round from the top, as the forced count's pips
     are (game.html ?count=a) but in the glow color. */
  .ringed { position: relative; }
  .ringed .pips { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .ringed .pips i { position: absolute; width: 20%; height: 20%; margin: -10% 0 0 -10%; border-radius: 50%; background: var(--glow);
    box-shadow: 0 0 calc(1.2 * var(--u)) color-mix(in srgb, var(--glow) 70%, transparent); }
  .ringed .pips i.out { background: color-mix(in srgb, var(--page) 70%, transparent); box-shadow: inset 0 0 0 calc(0.3 * var(--u)) rgb(255 255 255 / 0.35); }

  /* The clocks, as game.html's. */
  .clocks { display: grid; gap: 10px; }
  .clock { display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 0 14px; border-radius: 20px;
    font-size: 36px; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; color: var(--fg-dim);
    background: rgb(255 255 255 / 0.06); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.12); }
  .clock .piece { --u: 4px; position: relative; inset: auto; flex: none; width: 44px; height: 44px; opacity: 0.7; }
  .clock .time { margin-left: auto; }
  .clock.run { color: var(--fg); background: color-mix(in srgb, var(--glow) 18%, transparent); box-shadow: inset 0 0 0 2px var(--glow); }
  .clock.run .piece { opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, var(--glow) 80%, transparent),
    0 0 18px 3px color-mix(in srgb, var(--glow) 45%, transparent); }
  .note.small { font-size: 17px; }

  /* The raised board in landscape, as back.html's: short panels in the top corners. */
  .corners .game { display: block; position: relative; }
  .corners .game > .out { position: absolute; left: 24px; top: 24px; height: 352px; }
  .corners .play { position: absolute; right: 24px; top: 24px; height: 352px; }
  .corners #board { position: absolute; left: 50%; bottom: 40px; width: 700px; margin-left: -350px; }
  .corners .play { gap: 0; }
  .corners .play .note { margin-top: 10px; }
  .corners .row.big { min-height: 132px; }
  .corners .row.big.short { min-height: 96px; }
  .corners .row.big.short svg { width: 36px; height: 36px; }
  .corners .row.big.trim { min-height: 120px; }

  /* fit a: the line beside undo in portrait. */
  .beside { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center; }
  .beside .note { text-align: center; }
  /* fit b and c: what goes between the clocks. */
  .mid { display: flex; align-items: center; justify-content: center; white-space: nowrap; color: var(--fg); }
  .mid.stack { flex-direction: column; gap: 0; line-height: 1.1; }
  .mid.stack small { font-size: 17px; }
  .mid.stack b { font-weight: 400; font-size: 30px; font-variant-numeric: tabular-nums; }
  .mid.one { height: 26px; font-size: 17px; }
  .clocks.with-mid.one-line { gap: 5px; }
  .clocks .dots { display: flex; align-self: center; }
  .dots i { order: 0; }
  .dots.col { flex-direction: column; gap: 5px; }
  .dots.col i { width: 10px; height: 10px; }
  .clocks.with-dots { gap: 11px; }

  /* The ending: the board's dim (a black fill natively the board pass's, as the win's),
     and the card over the board. --fit shrinks it with a board under 720 dp, as the
     win's card does. */
  .dim { position: absolute; inset: 0; z-index: 2; border-radius: 1%; background: #000; opacity: 0; pointer-events: none; }
  .card { --fit: 1; position: fixed; z-index: 5; display: grid; justify-items: center; opacity: 0;
    gap: calc(28px * var(--fit)); padding: calc(40px * var(--fit)) calc(56px * var(--fit));
    width: calc(132px * var(--fit) + 2 * max(88px, 112px * var(--fit))); translate: -50% -50%; }
  .card .spot { display: grid; place-items: center; height: calc(104px * var(--fit)); }
  .card .pair .piece { --u: calc(8.5px * var(--fit)); width: calc(88px * var(--fit)); height: calc(88px * var(--fit)); }
  .card .pair .piece + .piece { margin-left: calc(-8px * var(--fit)); }
  .card .say { display: grid; gap: 6px; justify-items: center; text-align: center; margin-top: calc(-10px * var(--fit)); }
  .card .say h2 { margin: 0; font-weight: 400; font-size: 34px; line-height: 1; }
  .card .say p { margin: 0; font-size: 19px; line-height: 1.2; color: var(--fg-dim); }
  .actions { display: flex; gap: calc(20px * var(--fit)); }
  .actions .button { width: max(88px, 112px * var(--fit)); }

  /* b: the panel's ending. */
  .ending { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 0 0; text-align: center; }
  .ending h2 { margin: 0; font-weight: 400; font-size: 30px; line-height: 1; }
  .ending p { margin: 0; font-size: 19px; line-height: 1.2; color: var(--fg-dim); }
  .row.primary { background: color-mix(in srgb, var(--glow) 22%, transparent); }
  .fade { opacity: 0; }

  @media (orientation: portrait) {
    .game { --top: 104px; --bottom: 200px; --b: min(100vw - 2 * var(--gap), 100vh - var(--top) - var(--bottom) - 4 * var(--gap));
      flex-direction: column; }
    .panel { display: grid; gap: 12px 16px; align-content: start; height: auto; width: var(--b); padding: 16px 20px; }
    .panel .space { display: none; }
    .out { flex-direction: row; height: auto; width: var(--b); }
    .out .panel { grid-template-columns: repeat(3, 1fr); }
    .out .row { justify-content: center; }
    .out .panel .back { width: auto; justify-self: stretch; padding: 0 10px; }
    .turn { flex-direction: row; justify-content: center; gap: 18px; padding: 0 6px; min-height: 72px; text-align: left; }
    .turn .piece { width: 52px; height: 52px; --u: 5px; }
    .words { gap: 2px; }
    .note { font-size: 18px; }
    .dots { display: none; }
    .row.big { flex-direction: row; min-height: 88px; }
    .row.big svg { width: 36px; height: 36px; }
    .pair .piece { width: 52px; height: 52px; --u: 5px; }
    .pair .piece + .piece { margin-left: -4px; }
    .play-row { display: flex; align-items: center; gap: 16px; min-height: 72px; }
    .play-row .turn { flex: 1; justify-content: flex-start; }
    .play-row .tally { flex: none; }
    .ending { flex-direction: row; justify-content: center; gap: 18px; padding: 0 6px; min-height: 72px; text-align: left; }
    .ending .words { gap: 2px; }
    .ending h2 { font-size: 28px; }
    .ending p { font-size: 18px; }
    .pairs-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .clocks { grid-template-columns: 1fr 1fr; gap: 16px; }
    .clocks.with-mid { grid-template-columns: 1fr auto 1fr; gap: 12px; }
    .clocks.with-dots { grid-template-columns: 1fr auto 1fr; gap: 8px; }
  }
  /* A phone in portrait: the bar's tiles each an icon over its word, as built. */
  .phone .out .row, .phone .out .back { flex-direction: column; justify-content: center; gap: 2px; min-height: 96px;
    padding: 0 10px; font-size: 20px; }
  .phone .out .row svg, .phone .out .back svg { width: 32px; height: 32px; }
  .phone .out .panel { padding: 12px; gap: 10px; }
  .phone .game { --gap: 16px; --top: 120px; }
  .phone .tally { gap: 8px; padding: 0 12px 0 10px; }
  .phone .tally .fig { font-size: 34px; }
  .phone .tally .pair .piece { width: 28px; height: 28px; }
  .phone .note { font-size: 17px; }
  .phone .play-row { gap: 10px; }
  .phone .play-row .turn { gap: 12px; }
  .phone .clock { gap: 8px; }
  .phone .row.big { font-size: 22px; padding: 0 8px; gap: 8px; }
  .phone .row.big svg { width: 30px; height: 30px; }
  .phone .pairs-row .row.big { flex-direction: column; gap: 2px; font-size: 20px; }
  .phone .pairs-row .row.big svg { width: 28px; height: 28px; }
  /* a on a small board: the words say it, so the card drops the pieces to keep off the
     board's pieces. */
  .card.small .spot { display: none; }
</style>
</head>
<body data-screen="board">
<main id="app"></main>
<script>
  const params = new URLSearchParams(location.search);
  const pick = (k, list) => (list.includes(params.get(k)) ? params.get(k) : list[0]);
  const take = pick('take', ['a', 'b', 'c']);
  const state = pick('state', ['draw', 'count']);
  const reason = pick('reason', ['repeat', 'kings', 'endgame']);
  const lang = pick('lang', ['en', 'et']);
  const n = Math.max(1, Math.min(5, +(params.get('n') || (reason === 'repeat' ? 2 : 5)) || 5));
  const hold = params.has('t') ? +params.get('t') : null;
  const clocked = params.get('clocks') === 'on';
  const fit = pick('fit', ['a', 'b', 'c']);

  // The proposed strings (task 049). KINGS is the variant's kings-only count: 25 in
  // International (6.2), 15 in Brazilian, 15 or 25 by pieces in Russian.
  const KINGS = 25;
  const S = {
    en: { back: 'Back', settings: 'Settings', restart: 'Start over', undo: 'Undo move', again: 'Play again',
      turn: "White's turn", draw: 'Draw',
      why: { repeat: 'Same position three times', kings: `${KINGS} moves by kings only`, endgame: 'The lone king held out' },
      soon: (k) => (k === 1 ? 'Draw in 1 move' : `Draw in ${k} moves`),
      win: (k) => (k === 1 ? 'White must win in 1 move' : `White must win in ${k} moves`),
      twice: 'Same position twice', third: 'A third time is a draw', drawin: 'Draw in', repeated: 'Repeat' },
    et: { back: 'Tagasi', settings: 'Seaded', restart: 'Alusta uuesti', undo: 'Võta käik tagasi', again: 'Mängi uuesti',
      turn: 'Valgete käik', draw: 'Viik',
      why: { repeat: 'Sama seis kolm korda', kings: `${KINGS} käiku ainult tammidega`, endgame: 'Üksik tamm pidas vastu' },
      soon: (k) => (k === 1 ? 'Viigini 1 käik' : `Viigini ${k} käiku`),
      win: (k) => `Valged peavad võitma ${k} käiguga`,
      twice: 'Sama seis teist korda', third: 'Kolmas kord on viik', drawin: 'Viigini', repeated: 'Kordus' },
  }[lang];
  document.documentElement.lang = lang;

  // The positions, white to move. repeat: Russian, kings on both sides chasing; kings:
  // International, only kings moving; endgame: International, three white kings against
  // black's lone king on the long diagonal (6.3, 16 moves).
  const POS = {
    repeat: { n: 8, white: ['a1', 'e5', 'g3'], black: ['h8', 'b6', 'c7'], kings: ['a1', 'e5', 'h8', 'b6'], last: ['d6', 'b6'] },
    kings: { n: 10, white: ['b2', 'f6', 'h4', 'c3'], black: ['c9', 'j8', 'a7'], kings: ['b2', 'f6', 'h4', 'c9', 'j8'], last: ['e9', 'c9'] },
    endgame: { n: 10, white: ['c1', 'a5', 'h2'], black: ['f6'], kings: ['c1', 'a5', 'h2', 'f6'], last: ['d4', 'f6'] },
  }[reason];

  const W = innerWidth, H = innerHeight, landscape = W >= H, phone = Math.min(W, H) < 600;
  document.body.classList.toggle('phone', phone);
  document.body.classList.add(`take-${take}`);
  const icon = Draughts.icon;
  const corners = Draughts.settings.view === '3d' && landscape;
  document.body.classList.toggle('corners', corners);
  Draughts.ICONS.repeat = '<path d="M17 2.5 20.5 6 17 9.5"/><path d="M3.5 11.5V10a4 4 0 0 1 4-4h13"/><path d="M7 21.5 3.5 18 7 14.5"/><path d="M20.5 12.5V14a4 4 0 0 1-4 4h-13"/>';
  Draughts.init();

  const piece = (side, cls = '') => `<div class="piece ${side} ${cls}"></div>`;
  const pair = () => `<div class="pair">${piece('white')}${piece('black')}</div>`;
  const row = (name, word, cls = '') => `<button class="row button ${cls}">${icon(name)}<span>${word}</span></button>`;

  // What the countdown says, and how many dots: moves left (out of five), or the times
  // the position has come (out of three).
  const count = {
    repeat: { line: S.twice, more: S.third, lit: 2, of: 3 },
    kings: { line: S.soon(n), lit: n, of: 5 },
    endgame: { line: S.win(n), lit: n, of: 5 },
  }[reason];
  const dots = () => `<div class="dots">${Array.from({ length: count.of }, (_, i) => `<i class="${i < count.lit ? '' : 'out'}"></i>`).join('')}</div>`;
  const noteHTML = () => `<div class="note"><b>${count.line}</b>${count.more ? `<br>${count.more}` : ''}</div>`;

  // The play panel with clocks: as built where the line fits (landscape round the flat
  // board), else by `fit`, only while counting.
  const clockOf = (side, t, run) => `<div class="clock ${run ? 'run' : ''}">${piece(side)}<span class="time">${t}</span></div>`;
  function clockedPlay() {
    const undo = (cls = '') => row('undo', S.undo, `big ${cls}`);
    const a = clockOf('black', '3:12', false), b = clockOf('white', '4:37', true);
    const plain = `<div class="clocks">${a}${b}</div>`;
    if (state !== 'count') return `${plain}<div class="space"></div>${undo()}`;
    const short = reason === 'repeat' ? [S.repeated, '2/3'] : [S.drawin, n];
    const words = (cls = '') => `<div class="note ${cls}"><b>${count.line}</b>${count.more ? `<br>${count.more}` : ''}</div>`;
    if (landscape && !corners) return `${plain}${dots()}<div style="text-align:center">${words()}</div><div class="space"></div>${undo()}`;
    if (fit === 'a') {
      if (landscape) return `${plain}<div style="text-align:center">${words('small')}</div><div class="space"></div>${undo('short')}`;
      return `${plain}<div class="beside">${words(phone ? 'small' : '')}${undo()}</div>`;
    }
    if (fit === 'b') {
      const mid = landscape ? `<div class="mid one">${short[0]} ${short[1]}</div>`
        : `<div class="mid stack"><small>${short[0]}</small><b>${short[1]}</b></div>`;
      return `<div class="clocks with-mid ${landscape ? 'one-line' : ''}">${a}${mid}${b}</div><div class="space"></div>${undo('trim')}`;
    }
    const d = dots().replace('class="dots"', `class="dots ${landscape ? '' : 'col'}"`);
    return `<div class="clocks with-dots">${a}${d}${b}</div><div class="space"></div>${undo('trim')}`;
  }

  // The play panel while the game goes on, with the countdown by take.
  function playing() {
    if (clocked) return clockedPlay();
    const words = `<div class="words"><span>${S.turn}</span>${take !== 'b' && state === 'count' && !landscape ? noteHTML() : ''}</div>`;
    let turnPiece = piece('white', 'on');
    if (take === 'c' && state === 'count') {
      const pips = Array.from({ length: count.of }, (_, i) => {
        const a = (i * 360 / count.of) * Math.PI / 180, r = 1.3;
        return `<i class="${i < count.lit ? '' : 'out'}" style="left:${50 + 50 * r * Math.sin(a)}%;top:${50 - 50 * r * Math.cos(a)}%"></i>`;
      }).join('');
      turnPiece = `<div class="piece white on ringed"><div class="pips">${pips}</div></div>`;
    }
    const turn = `<div class="turn">${turnPiece}${words}</div>`;
    let extra = '';
    if (state === 'count' && landscape && take === 'a') extra = `${dots()}<div class="note" style="text-align:center">` +
      `<b>${count.line}</b>${count.more ? `<br>${count.more}` : ''}</div>`;
    if (state === 'count' && landscape && take === 'c') extra = `<div class="note" style="text-align:center">` +
      `<b>${count.line}</b>${count.more ? `<br>${count.more}` : ''}</div>`;
    if (state === 'count' && take === 'b') {
      const what = reason === 'endgame' ? piece('white') : reason === 'kings' ? pair() : icon('repeat');
      const fig = reason === 'repeat' ? `2<small> / 3</small>` : n;
      const tally = `<div class="tally">${what}<span class="fig">${fig}</span></div>`;
      const line = reason === 'repeat' ? `${S.twice}<br>${S.third}` : count.line;
      if (landscape) extra = `${tally}<div class="tally-note">${line}</div>`;
      else return `<div class="play-row">${turn}${tally}</div>${row('undo', S.undo, 'big')}`;
    }
    return `${turn}${extra}<div class="space"></div>${row('undo', S.undo, 'big')}`;
  }

  // The play panel at the end: "Draw" where "White wins" goes; in b, why and play again.
  function ended() {
    if (take === 'b') {
      const end = `<div class="ending fade">${pair()}<div class="words"><h2>${S.draw}</h2><p>${S.why[reason]}</p></div></div>`;
      return landscape
        ? `${end}<div class="space"></div>${row('undo', S.undo, 'fade')}${row('restart', S.again, 'big primary fade')}`
        : `${end}<div class="pairs-row">${row('undo', S.undo, 'big fade')}${row('restart', S.again, 'big primary fade')}</div>`;
    }
    const why = take === 'c' ? `<p class="note">${S.why[reason]}</p>` : '';
    return `<div class="ending">${pair()}<div class="words"><h2>${S.draw}</h2>${why}</div></div><div class="space"></div>${row('undo', S.undo, 'big')}`;
  }

  const out = `<div class="out"><a class="button glass back" href="home.html">${icon('back')}<span>${S.back}</span></a>` +
    `<aside class="panel glass">${row('gear', S.settings)}<div class="space"></div>${row('restart', S.restart)}</aside></div>`;
  document.getElementById('app').innerHTML = `<div class="game">${out}<div id="board"></div>` +
    `<aside class="panel glass play">${state === 'draw' ? ended() : playing()}</aside></div>`;
  if (!landscape) {
    // In portrait back is the bar's first tile, on its glass.
    const b = document.querySelector('.out > .back');
    b.classList.remove('glass');
    document.querySelector('.out .panel').prepend(b);
  }
  const boardEl = document.getElementById('board');
  Draughts.board(boardEl, POS);
  const dim = document.createElement('div');
  dim.className = 'dim';
  boardEl.appendChild(dim);

  // a and c: the card, with words in a.
  let card = null;
  if (state === 'draw' && take !== 'b') {
    card = document.createElement('div');
    card.className = 'card glass';
    card.innerHTML = `<div class="spot">${pair()}</div>` +
      (take === 'a' ? `<div class="say"><h2>${S.draw}</h2><p>${S.why[reason]}</p></div>` : '') +
      `<div class="actions"><a class="button" aria-label="${S.back}">${icon('back')}</a>` +
      `<a class="button primary" aria-label="${S.again}">${icon('restart')}</a></div>`;
    document.body.appendChild(card);
  }

  function layout() {
    if (!card) return;
    const b = boardEl.getBoundingClientRect();
    card.style.setProperty('--fit', Math.min(1, b.width / 720));
    card.classList.toggle('small', take === 'a' && b.width < 540);
    card.style.left = `${b.left + b.width / 2}px`;
    card.style.top = `${b.top + b.height / 2}px`;
    // Off the piece that made the last move, as the win's card keeps off the winning
    // piece: into the half away from it, as near the middle as clears it.
    const p = boardEl.querySelectorAll('.sq')[sqIndex(POS.last[1])].querySelector('.piece');
    if (!p) return;
    const r = p.getBoundingClientRect(), c = card.getBoundingClientRect();
    if (r.right > c.left && r.left < c.right && r.bottom > c.top && r.top < c.bottom) {
      const mid = b.top + b.height / 2, h = c.height;
      const top = r.top + r.height / 2 >= mid ? Math.max(b.top, Math.min(mid, r.top) - h) : Math.min(b.bottom - h, Math.max(mid, r.bottom));
      card.style.top = `${top + h / 2}px`;
    }
  }
  function sqIndex(sq) { const x = sq.charCodeAt(0) - 97, y = +sq.slice(1) - 1; return (POS.n - 1 - y) * POS.n + x; }

  // The ending in time: a function of the seconds since the drawing move has shown.
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const span = (t, a, b) => clamp((t - a) / (b - a));
  const smooth = (x) => x * x * (3 - 2 * x);
  const ease = (x) => 1 - (1 - x) ** 3;
  const END = 0.8;
  function show(t) {
    if (state !== 'draw') return;
    if (card) {
      // The board dims to 55% over 0.6 s; the card slides up 28 dp as it fades in.
      dim.style.opacity = 0.45 * smooth(span(t, 0, 0.6));
      const k = ease(span(t, 0.1, 0.8));
      card.style.opacity = k;
      card.style.translate = `-50% calc(-50% + ${(1 - k) * 28}px)`;
    } else {
      // b: the board dims to 80% only; the panel's ending fades in.
      dim.style.opacity = 0.2 * smooth(span(t, 0, 0.6));
      document.querySelectorAll('.fade').forEach((e) => { e.style.opacity = smooth(span(t, 0.2, 0.8)); });
    }
    Draughts.syncGlass();
  }
  let t0 = 0;
  function frame(now) {
    const t = (now - t0) / 1000;
    show(t);
    if (t < END + 0.2) requestAnimationFrame(frame);
  }
  function play() { t0 = performance.now(); requestAnimationFrame(frame); }
  Draughts.paint();
  addEventListener('load', () => document.fonts.ready.then(() => {
    Draughts.paint();
    layout();
    Draughts.syncGlass();
    if (hold !== null) show(hold); else setTimeout(play, 400);
    document.addEventListener('click', (e) => { if (!e.target.closest('button, a, select, .proto-bar')) play(); });
  }));
  addEventListener('resize', () => setTimeout(() => location.reload(), 200));

  // The take, state, reason, and language, from the switcher.
  const bar = document.querySelector('.proto-bar');
  const sel = (key, values, current) => `<select data-k="${key}" aria-label="${key}">${values.map((v) =>
    `<option${v === current ? ' selected' : ''}>${v}</option>`).join('')}</select>`;
  bar.insertAdjacentHTML('afterbegin', sel('take', ['a', 'b', 'c'], take) + sel('state', ['draw', 'count'], state) +
    sel('reason', ['repeat', 'kings', 'endgame'], reason) + sel('n', ['1', '2', '3', '4', '5'], String(n)) +
    sel('lang', ['en', 'et'], lang) + sel('clocks', ['off', 'on'], clocked ? 'on' : 'off') + sel('fit', ['a', 'b', 'c'], fit));
  bar.querySelectorAll('select[data-k]').forEach((s) => s.onchange = (e) => {
    e.stopPropagation();
    params.set(s.dataset.k, s.value);
    params.delete('t');
    location.search = params.toString();
  });
</script>
</body>
</html>

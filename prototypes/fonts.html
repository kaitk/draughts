<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kabe: fonts</title>
<link rel="stylesheet" href="kabe.css">
<script src="kabe.js"></script>
<style>
  body { overflow: auto; }
  .fonts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 24px; }
  .font { padding: 24px 28px; display: grid; gap: 10px; }
  .font h2 { margin: 0; font-size: 44px; font-weight: 400; letter-spacing: 0.04em; }
  .font .line { font-size: 26px; }
  .font .small { font-size: 18px; color: var(--fg-dim); }
  .font .meta { font: 13px system-ui, sans-serif; color: var(--fg-dim); }
  .font .missing { color: var(--forced); }
  @media (orientation: portrait) { .fonts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="fonts" id="fonts"></main>
<script>
  Kabe.init();
  const notes = {
    tenor: 'Tenor Sans, Denis Masharov. SIL OFL 1.1. Used by the proof of concept.',
    libertinus: 'Libertinus Sans, Caleb Maclennan and contributors, a fork of Linux Biolinum. SIL OFL 1.1. Has a bold.',
    belleza: 'Belleza, Eduardo Tunni. SIL OFL 1.1.',
    marcellus: 'Marcellus, Brian J. Bonislawsky (Astigmatic). SIL OFL 1.1. Small serifs, closer to a roman than Optima.',
  };
  const ESTONIAN = 'õäöüšž ÕÄÖÜŠŽ';
  const root = document.getElementById('fonts');
  for (const [key, f] of Object.entries(Kabe.FONTS)) {
    const family = Kabe.loadFont(key);
    const el = document.createElement('section');
    el.className = 'font glass';
    el.style.fontFamily = family;
    el.innerHTML = `
      <h2>Kabe</h2>
      <div class="line">Kabe — mängi sõbraga, õpi ülesannetest</div>
      <div class="small">Šašlõkk ja žürii: õun, äädikas, öökull, üllatus. 0123456789</div>
      <div class="small">Play a friend · Puzzles · Well done!</div>
      <div class="meta">${notes[key]} <span class="check" data-family="${f.family}"></span></div>`;
    root.appendChild(el);
  }
  // Whether each font draws the Estonian letters itself: a letter the font lacks falls
  // back, so its width differs between a monospace and a serif fallback.
  document.fonts.ready.then(async () => {
    const g = document.createElement('canvas').getContext('2d');
    for (const span of document.querySelectorAll('.check')) {
      const family = span.dataset.family;
      await document.fonts.load(`40px '${family}'`, ESTONIAN);
      const width = (ch, fallback) => { g.font = `40px '${family}', ${fallback}`; return g.measureText(ch).width; };
      const missing = [...ESTONIAN.replace(' ', '')].filter((ch) => width(ch, 'monospace') !== width(ch, 'serif'));
      span.textContent = missing.length ? `Lacks ${missing.join(' ')}.` : 'Has õ ä ö ü š ž.';
      span.dataset.missing = missing.join('');
      if (missing.length) span.classList.add('missing');
    }
    document.body.dataset.checked = 'yes';
  });
</script>
</body>
</html>

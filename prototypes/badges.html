<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: badges</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* Takes on a player's picture (task 038), in place of profiles.html's animals as flat
     filled icons on bright discs, which don't sit with the photographs, the glass, and
     the wooden pieces. Five directions, each six badges at home's face (64 dp, beside the
     wordmark as there) and at the picker's (112 dp, the face in a 156 dp tile), the first
     lit as the playing player is. ?disc=wood puts 2 and 3 on a dark piece instead of glass.

     1 carved pieces: a draughtsman in one of six woods, an animal inlaid on its face as
       the crown is on a king (dark in pale wood, straw in dark wood).
     2 nature tokens: leaf, acorn, pinecone, snowflake, feather, mushroom as fine ivory
       lines on a glass disc, in the icons' language.
     3 animal lines: fox, hare, owl, hedgehog, bear, frog front on, one line weight, the
       same ink on glass; the shapes tell them apart.
     4 coloured rims: a piece in one of six muted colours, its centre the board's light
       wood, with the player's initial in the wordmark's face.
     5 at dusk: the animal, whole and side on, a dark silhouette against a low light on a
       glass disc, as the trees stand against the sky in the photographs.

     Everything is what the native renderer draws cheaply: SDF discs and their union
     outlines, gradients, one baked shape per animal, the painted piece.

     ?home=1 to 4 is home with the carved badge placed four ways, ?home=first the first
     start's "pick your badge"; the page shows them in frames at 1280 x 800 and 800 x 1280.
       1 the badge replaces the king beside the wordmark.
       2 the king stays; the badge and the name are a glass chip in the top left corner,
         mirroring the X.
       3 the king stays, a small badge set over its lower right edge.
       4 as 2, with the other players' pieces stacked under the badge, peeking out: a
         child sees a sibling's animal there and knows the chip changes who plays. */
  body { overflow: auto; overflow-x: hidden; }
  main { width: 1232px; margin: 24px auto 80px; display: grid; gap: 20px; }
  .top { --r: 28px; padding: 20px 28px; }
  .top h1 { margin: 0; font-size: 40px; font-weight: 400; letter-spacing: 0.04em; }
  .top p { margin: 4px 0 0; color: var(--fg-dim); font-size: 17px; line-height: 1.4; }
  .dir { --r: 28px; display: grid; grid-template-columns: 400px 1fr; gap: 32px; align-items: center; padding: 22px 24px; }
  .dir h2 { margin: 0; font-size: 30px; font-weight: 400; }
  .dir h2 b { font-weight: 400; color: var(--fg-dim); margin-right: 10px; }
  .dir p { margin: 6px 0 10px; color: var(--fg-dim); font-size: 17px; line-height: 1.4; }
  .sets { display: grid; gap: 18px; }
  .row { display: flex; gap: 12px; align-items: center; }
  .row.small { gap: 21px; padding-left: 24px; }
  /* Home's wordmark row with the player's face where the king was: 64 dp in an 88 dp tap. */
  .mark { display: flex; align-items: center; height: 88px; }
  .mark .tap { width: 88px; height: 88px; display: grid; place-items: center; margin: 0 -6px 0 -12px; flex: none; }
  .mark h1 { margin: 0; font-size: 64px; font-weight: 400; letter-spacing: 0.06em; white-space: nowrap; }

  /* A badge: --s across. Lit: a ring in the glow colour a little out, as a selected piece. */
  .b { --s: 112px; position: relative; width: var(--s); height: var(--s); flex: none; border-radius: 50%; color: var(--fg); }
  .small .b, .mark .b { --s: 64px; }
  .b.on::after { content: ''; position: absolute; inset: calc(var(--s) * -0.075); border-radius: 50%; pointer-events: none;
    box-shadow: 0 0 0 3px var(--glow), 0 0 18px 2px color-mix(in srgb, var(--glow) 45%, transparent); }
  .b > svg { position: absolute; overflow: visible; }
  .b > .piece { position: absolute; inset: 0; z-index: 0; }
  .b > .piece + * { z-index: 1; }

  /* 1: the inlay inside the piece's groove, set a hair into the face. */
  .inlay { inset: 19%; width: 62%; height: 62%; filter: drop-shadow(0 0.6px 0 rgb(255 255 255 / 0.22)); }

  /* 2, 3: a glass disc, as a button is: a light fill, a 1 px border and top highlight. */
  .disc { background: color-mix(in srgb, var(--glass-tint), rgb(255 255 255 / 0.1));
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.22), inset 0 2px 0 -1px rgb(255 255 255 / 0.2), 0 6px 14px -8px rgb(0 0 0 / 0.5); }
  .ink { inset: 18%; width: 64%; height: 64%; color: var(--fg); opacity: 0.92; }
  .wood .ink { color: color-mix(in srgb, var(--fg), #e9c46a 35%); }

  /* 4: the coloured piece, its centre the board's light wood, set in. */
  .centre { position: absolute; inset: 22%; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--w-face), #fff 12%), var(--w-face) 70%);
    box-shadow: inset 0 calc(var(--s) * 0.02) calc(var(--s) * 0.03) rgb(0 0 0 / 0.35), 0 0 0 1px rgb(0 0 0 / 0.12);
    font-size: calc(var(--s) * 0.34); line-height: 1; padding-top: calc(var(--s) * 0.02); }

  /* 5: a low light behind the animal, the ground under it. */
  .dusk { overflow: hidden;
    background:
      radial-gradient(circle at 50% 74%, color-mix(in srgb, var(--glow) 40%, var(--fg)) 0, color-mix(in srgb, var(--glow) 30%, transparent) 26%, transparent 64%),
      color-mix(in srgb, var(--glass-tint), rgb(255 255 255 / 0.08));
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.22), inset 0 2px 0 -1px rgb(255 255 255 / 0.2), 0 6px 14px -8px rgb(0 0 0 / 0.5); }
  .dusk svg { inset: 0; width: 100%; height: 100%; }
  .dusk .ground, .dusk .shape { fill: color-mix(in srgb, var(--page), #000 25%); }
  /* The placements: frames of home at the tablet's two sizes, scaled to 0.3. */
  .places { --r: 28px; padding: 22px 24px; display: grid; gap: 18px; }
  .places h2 { margin: 0; font-size: 30px; font-weight: 400; }
  .places > p { margin: 0; color: var(--fg-dim); font-size: 17px; line-height: 1.4; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 28px; }
  .place h3 { margin: 0 0 4px; font-size: 22px; font-weight: 400; }
  .place h3 b { font-weight: 400; color: var(--fg-dim); margin-right: 8px; }
  .place h3 a { color: inherit; }
  .place p { margin: 0 0 10px; color: var(--fg-dim); font-size: 15px; line-height: 1.4; min-height: 42px; }
  .frames { display: flex; gap: 14px; align-items: start; }
  .frame { position: relative; overflow: hidden; border-radius: 10px; flex: none; box-shadow: 0 0 0 1px rgb(255 255 255 / 0.16); }
  .frame iframe { position: absolute; left: 0; top: 0; border: 0; transform: scale(0.3); transform-origin: 0 0; }

  /* Home, as profiles.html lays it out (shell/home.goose), for the placements. */
  .menu { position: fixed; display: grid; }
  .menu.glass { --r: 32px; }
  .content { position: absolute; display: grid; align-content: start; gap: 2px; }
  .content .mark { position: relative; gap: 6px; height: 72px; }
  .content .mark > .piece { position: relative; inset: auto; width: 56px; height: 56px; --u: 5px; flex: none; margin-right: 8px; }
  .item { display: flex; align-items: center; gap: 18px; height: 88px; padding: 0 18px; border-radius: 20px;
    color: var(--fg); text-decoration: none; font-size: 30px; }
  .item > [data-icon] { display: grid; }
  .item .icon { width: 34px; height: 34px; stroke-width: 2.4; opacity: 0.85; }
  .item.primary { background: color-mix(in srgb, var(--glow) 24%, transparent); }
  .item small { margin-left: auto; font-size: 17px; color: var(--fg-dim); }
  #board { position: fixed; isolation: isolate; }
  .gear { flex: none; width: 88px; height: 88px; margin-left: auto; display: grid; place-items: center; color: var(--fg); }
  .gear svg { width: 40px; height: 40px; stroke-width: 2.4; opacity: 0.85; }
  .corner { --r: 44px; position: fixed; display: grid; place-items: center; width: 88px; height: 88px;
    border-radius: 50%; color: var(--fg); z-index: 3; top: 24px; right: 24px; }
  .corner::after { background: color-mix(in srgb, var(--glass-tint), rgb(255 255 255 / 0.08)); }
  .corner svg { width: 32px; height: 32px; stroke-width: 2.4; opacity: 0.9; }
  /* 2 and 4: the player's chip, top left, as tall as the X. */
  .chip { --r: 44px; position: fixed; left: 24px; top: 24px; z-index: 3; display: flex; align-items: center; gap: 14px;
    height: 88px; padding: 0 30px 0 12px; color: var(--fg); font-size: 30px; }
  .chip .stack { position: relative; width: 64px; height: 64px; flex: none; }
  .chip .stack .b { position: absolute; }
  .chip .stack .peek { --s: 52px; top: 6px; }
  .chip.fan { padding-left: 12px; }
  .chip.fan .stack { width: 112px; }
  /* 3: the badge over the king's lower right edge. */
  .medal { position: absolute; left: 30px; top: 34px; z-index: 2; }
  .medal .b { --s: 36px; box-shadow: 0 0 0 2px rgb(30 20 14 / 0.55); }
  /* The first start: pick a badge, and a name if wanted. */
  .first { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 22px; padding: 24px; }
  .first .mark { height: 88px; }
  .first .mark > .piece { position: relative; inset: auto; width: 56px; height: 56px; --u: 5px; margin-right: 14px; }
  .first .card { --r: 32px; display: grid; gap: 18px; padding: 24px 28px 28px; justify-items: center; }
  .first h2 { margin: 0; font-size: 36px; font-weight: 400; }
  .first .pics { display: grid; grid-template-columns: repeat(var(--cols), 120px); gap: 14px; }
  .first .pics .tap { width: 120px; height: 120px; display: grid; place-items: center; border-radius: 24px; }
  .first .pics .tap.on { background: color-mix(in srgb, var(--glow) 22%, transparent); box-shadow: inset 0 0 0 2px var(--glow); }
  .first .pics .b { --s: 96px; }
  .first .foot { display: flex; gap: 14px; width: 100%; }
  .name-field { flex: 1; display: flex; align-items: center; gap: 14px; height: 88px; padding: 0 20px; border-radius: 20px;
    background: rgb(0 0 0 / 0.18); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.18); color: var(--fg-dim); font-size: 30px; }
  .name-field .icon { width: 28px; height: 28px; opacity: 0.7; }
  .first .button { width: 88px; }
</style>
</head>
<body>
<main id="main">
  <section class="top glass">
    <h1>Badges</h1>
    <p>A player's picture (task 038) in five styles over the photograph and glass: home's face at 64 dp beside the wordmark and in a row, the picker's at 112 dp, the first player lit. The switcher changes the season; <code>?disc=wood</code> puts 2 and 3 on a dark piece.</p>
  </section>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const onWood = params.get('disc') === 'wood';
  let uid = 0;

  // Animals whole and side on, facing left, on a 48-unit grid with the feet at y 40:
  // one filled shape each (holes by even-odd), for the inlay (1) and the silhouettes (5).
  const ring = (cx, cy, r) => `M${cx - r} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0z`;
  function spikes(cx, cy, rx, ry, a0, a1, n, depth) {
    let d = '';
    for (let i = 0; i <= 2 * n; i++) {
      const a = (a0 + (a1 - a0) * i / (2 * n)) * Math.PI / 180, k = i % 2 ? 1 : 1 - depth;
      d += `${i ? 'L' : 'M'}${(cx + Math.cos(a) * rx * k).toFixed(2)} ${(cy + Math.sin(a) * ry * k).toFixed(2)}`;
    }
    return d;
  }
  const SIL = {
    fox: 'M7.4 15.6L12.8 11.6L14.4 3.8L17.9 9.8L19.8 5.2L21.2 12.2C22 16 22.6 19.8 24.2 22.8C28.4 25.8 33 28.6 34.6 33.6C38.6 30.6 43.6 30.4 45.8 33C47.6 35.6 45 40.4 40.6 41H12.2C10.8 41 10.8 39.4 12.2 39.2L14.2 39L14.4 27.2C12.8 24.8 12.2 21.4 12.6 19L9.8 18.4C8.2 18 7.2 16.8 7.4 15.6Z' + ring(15, 13.4, 0.8) + 'M18.6 41C24 38.6 31 38.2 36 39.6L34 41Z',
    hare: 'M8.6 27.2C8.6 23.2 11.6 20.4 15.6 19.6L18.6 6.2C19.2 3.6 21.8 3.8 21.6 6.4L20.6 18.8L24.4 8.2C25.4 5.8 27.8 6.6 26.9 9L22.9 20.6C24.4 21.6 25.4 22.6 26.4 24C33 22.4 41.2 26 41.2 33.4C41.2 37.4 39.2 40 36 40H20.2C18.6 40 18.6 37.8 20.2 37.6L23 37.4C21 35.6 20 33.6 19.6 31.6C17 32 14 31.8 12 30.6C10 30 8.6 29 8.6 27.2Z' + ring(13.6, 25.4, 0.9),
    bear: 'M2.6 28C2.6 26.6 3.8 25.6 5.6 25.2L10 22C10.4 20 11.8 19 13.2 19.6C14.8 19 16.2 19.4 17.2 20.4C20.4 16.6 25.4 14.6 30.4 15C36.2 15.6 41.4 18 43.6 22.2C45 25 45 28.6 43.8 31.2L44 41H39.4L38.6 33.8C35 34.8 29.2 35 25.2 34.2L24.6 41H20L19.2 31.6C16.8 30.6 14.8 29.4 13.2 28.6C10 29.4 5.4 29.6 2.6 28Z' + ring(10.6, 23.8, 0.75),
    owl: 'M13 9.6L16.8 13C20.4 11.6 27.6 11.6 31.2 13L35 9.6L35.6 17.4C37.2 22.4 37.2 30 33.2 35C30.4 38.4 17.6 38.4 14.8 35C10.8 30 10.8 22.4 12.4 17.4Z' +
      ring(19.6, 20.2, 3.8) + ring(28.4, 20.2, 3.8) + 'M22.4 24.4L25.6 24.4L24 27.4Z' + 'M6 38.4H42V40.6H6Z',
    frog: 'M5 31C5 27.4 7.6 24.4 11.4 23.2C11.8 19.6 15.4 18.2 17.8 20.6C18.8 21.8 19.8 23.2 22 23.6C30 23.6 37.6 27.6 40 33C40.8 35 40.6 37 39.6 38.2L44.4 39.4C45.6 39.8 45.4 41 44 41H31C29.6 41 29.6 39.4 31 39.2L34 38.6C32 37.4 29.6 36.6 27.4 36.4L25.8 39L28 39.4C29.2 39.8 29 41 27.6 41H18.6C17.4 41 17.4 39.6 18.6 39.4L22 38.8L22.4 35.6C16 35.4 8.6 34.4 5 31Z' + ring(15.2, 22.8, 1.4) + 'M6.4 30.4Q12 31.6 17 30.2L17 30.9Q12 32.4 6.4 31.1Z',
    hedgehog: spikes(26, 39, 18.5, 17.5, 192, 352, 9, 0.2) + 'L43.6 40H14.4C11.6 39.4 9.8 37.6 8 36.6L3.2 34.6C3 33.6 5 32.4 8.4 31.4C9.6 30 10.4 29.2 11.8 28.4Z' + ring(11.6, 32.6, 0.95),
  };
  const ORDER = ['fox', 'hare', 'owl', 'hedgehog', 'bear', 'frog'];

  // Animals front on, on the icons' 24-unit grid, in one line weight: closed shapes whose
  // union's outline is drawn (natively |SDF of the union| under the width), then lines
  // and dots (a dot is a line of no length) on top.
  const ellipse = (cx, cy, rx, ry) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>`;
  const circle = (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}"/>`;
  const path = (d) => `<path d="${d}"/>`;
  const dot = (x, y) => `M${x} ${y}h0`;
  const LINE = {
    fox: { shapes: path('M4 4.2L9 8.4H15L20 4.2L19.3 12.2Q17.8 17.8 12 20.8Q6.2 17.8 4.7 12.2Z'),
      lines: 'M4.9 12.6Q8.6 13.2 12 16.8Q15.4 13.2 19.1 12.6' + dot(9, 11.2) + dot(15, 11.2) + 'M11.2 18.6h1.6' },
    hare: { shapes: circle(12, 15.2, 6) + ellipse(9.2, 6.6, 1.9, 4.9) + ellipse(14.8, 6.6, 1.9, 4.9),
      lines: dot(9.8, 14.4) + dot(14.2, 14.4) + 'M11 16.9L12 17.6L13 16.9M12 17.6V18.7' },
    owl: { shapes: path('M5.2 4.6L8.6 7.6Q12 6.6 15.4 7.6L18.8 4.6L19 13Q19 20 12 21Q5 20 5 13Z'),
      lines: 'M11.1 12a2.3 2.3 0 1 0-4.6 0a2.3 2.3 0 1 0 4.6 0M17.5 12a2.3 2.3 0 1 0-4.6 0a2.3 2.3 0 1 0 4.6 0' + dot(8.8, 12) + dot(15.2, 12) + 'M11 15.2L12 17L13 15.2' },
    hedgehog: { shapes: path(spikes(12, 13.4, 8.8, 9, 180, 360, 7, 0.24) + 'Z') + path('M3.4 13.4Q6 19.6 12 21.4Q18 19.6 20.6 13.4Z'),
      lines: 'M5.6 12.8Q12 8.6 18.4 12.8' + dot(9.4, 14.6) + dot(14.6, 14.6) + 'M11.4 19.2h1.2' },
    bear: { shapes: circle(12, 13.8, 7.4) + circle(6.4, 7.2, 2.7) + circle(17.6, 7.2, 2.7),
      lines: 'M14.9 16.9a2.9 2.3 0 1 0-5.8 0a2.9 2.3 0 1 0 5.8 0' + dot(9.2, 12.2) + dot(14.8, 12.2) + 'M11.3 15.9h1.4' },
    frog: { shapes: ellipse(12, 15.4, 9, 5.8) + circle(7.4, 9.4, 3) + circle(16.6, 9.4, 3),
      lines: dot(7.4, 9.4) + dot(16.6, 9.4) + 'M7 16.4Q12 19.6 17 16.4' + dot(10.6, 13.6) + dot(13.4, 13.6) },
  };

  // Nature tokens, the same 24-unit grid and line, open paths only.
  function flake() {
    let d = '';
    for (let k = 0; k < 6; k++) {
      const a = (k * 60 - 90) * Math.PI / 180, x = (r) => (12 + Math.cos(a) * r).toFixed(2), y = (r) => (12 + Math.sin(a) * r).toFixed(2);
      d += `M12 12L${x(9.6)} ${y(9.6)}`;
      for (const [at, len] of [[5, 2.8], [7.6, 1.8]]) {
        for (const s of [-1, 1]) {
          const b = a + s * 0.75;
          d += `M${x(at)} ${y(at)}l${(Math.cos(b) * len).toFixed(2)} ${(Math.sin(b) * len).toFixed(2)}`;
        }
      }
    }
    return d;
  }
  const NATURE = {
    leaf: 'M4.6 19.4C4.4 11.2 10.4 4.6 19.8 4.2C20 13.6 13.2 19.6 4.6 19.4ZM4.6 19.4L2.8 21.2M6.4 17.6Q11 13.4 16.4 7.6M9.6 14.4L9.4 10.6M9.6 14.4L13.4 14.6M12.8 11.2L12.8 7.8M12.8 11.2L16.4 11.4',
    acorn: 'M4.8 11.2C4.8 6.6 19.2 6.6 19.2 11.2ZM12 7.8V5.6Q12.2 4 14.4 3.4M6.4 11.2C6.4 16.8 9.4 20.4 12 21C14.6 20.4 17.6 16.8 17.6 11.2M8.6 9.2L10 11M12 8.6V11M15.4 9.2L14 11',
    pinecone: 'M12 3C16.8 5 18.4 11.6 17 15.8C15.8 19.4 13.6 21 12 21C10.4 21 8.2 19.4 7 15.8C5.6 11.6 7.2 5 12 3ZM12 3V1.4M8.4 8.6L12 10.6L15.6 8.6M7 12.4L12 15L17 12.4M8 16.4L12 18.6L16 16.4M12 10.6V15M12 18.6V21',
    snowflake: flake(),
    feather: 'M5 21L18.4 3.4M7.4 17.8C5.4 11.4 10.8 5 18.4 3.4C19.4 10.6 14.6 16.2 7.4 17.8ZM9.6 15C9.4 12.6 10.6 10.6 11.6 9.6M12.4 11.4C13.8 11.4 15.6 10.8 16.6 9.8M16.6 6.2L16.8 8',
    mushroom: 'M3.6 12C3.6 5.4 20.4 5.4 20.4 12ZM9 12C8.8 15.6 8.6 18.4 8 21H16C15.4 18.4 15.2 15.6 15 12M3.4 21H20.6M8.4 8.2Q10 7.2 11.6 7.4',
  };
  const NATURE_ORDER = ['leaf', 'acorn', 'pinecone', 'snowflake', 'feather', 'mushroom'];

  // Line weight in px on screen: fine lines, 2 px at 64 dp and 3 at 112 (home's icons
  // are 3.4 px), the glyph 64% of the badge.
  const weight = (s) => (s < 80 ? 2 : 3) * 24 / (0.64 * s);
  function lineArt(def, s) {
    const w = weight(s), id = `m${uid++}`;
    return `<svg class="ink" viewBox="0 0 24 24" aria-hidden="true"><defs><mask id="${id}" maskUnits="userSpaceOnUse" x="-4" y="-4" width="32" height="32">` +
      `<rect x="-4" y="-4" width="32" height="32" fill="#fff"/><g fill="#000">${def.shapes}</g></mask></defs>` +
      `<g fill="none" stroke="currentColor" stroke-width="${2 * w}" stroke-linejoin="round" mask="url(#${id})">${def.shapes}</g>` +
      `<path d="${def.lines}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  const strokes = (d, s) => `<svg class="ink" viewBox="0 0 24 24" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" ` +
    `stroke-width="${weight(s)}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const under = (inner) => onWood ? `<span class="piece black"></span>${inner}` : inner;

  // 1: the board's light piece, home's king without its crown: the season's wood and
  // finish, the animal inlaid in the crown's colour (--crown-w). ?pieces=both alternates
  // with the dark piece, its animal in the dark king's gold.
  const bothKinds = params.get('pieces') === 'both';
  // 4: six muted colours from the photographs; the initials from the players' names.
  const RIMS = [
    { face: '#6f7c4c', name: 'moss' }, { face: '#8b4a47', name: 'lingonberry' }, { face: '#cfc4a6', name: 'birch', ink: '#5d5440' },
    { face: '#4e6b7c', name: 'lake' }, { face: '#a8823f', name: 'amber' }, { face: '#7a6382', name: 'heather' },
  ];
  const INITIALS = ['M', 'O', 'D', 'E', 'L', 'K'];

  const DIRS = [
    { title: 'Carved pieces', text: 'Home\'s king without its crown: the same light piece, wood, and finish, the animal inlaid where the crown sits and in its colour. <code>?pieces=both</code> alternates the dark piece with the gold.',
      badge: (i) => {
        const dark = bothKinds && i % 2 === 1;
        return `<span class="piece ${dark ? 'black' : 'white'}"></span>` +
          `<svg class="inlay" viewBox="2 1 44 44" aria-hidden="true"><path d="${SIL[ORDER[i]]}" fill="${dark ? '#e9c46a' : 'var(--crown-w)'}" fill-rule="evenodd"/></svg>`;
      } },
    { title: 'Nature tokens', text: 'Leaf, acorn, pinecone, snowflake, feather, mushroom: fine ivory lines on a glass disc, in the language of the app\'s icons.',
      cls: () => onWood ? 'wood' : 'disc', badge: (i, s) => under(strokes(NATURE[NATURE_ORDER[i]], s)) },
    { title: 'Animal lines', text: 'Fox, hare, owl, hedgehog, bear, frog front on, one line weight in the same ink on glass: the shapes tell them apart, not colours.',
      cls: () => onWood ? 'wood' : 'disc', badge: (i, s) => under(lineArt(LINE[ORDER[i]], s)) },
    { title: 'Coloured rims', text: 'A piece in one of six muted colours (moss, lingonberry, birch, lake, amber, heather), its centre the board\'s light wood with the initial in the wordmark\'s face.',
      badge: (i, s) => {
        const r = RIMS[i];
        return `<span class="piece white" style="--w-face:${r.face}"></span>` +
          `<span class="centre" style="color:${r.ink || `color-mix(in srgb, ${r.face}, #000 30%)`}">${INITIALS[i]}</span>`;
      } },
    { title: 'At dusk', text: 'The animal whole and side on, a dark silhouette against a low light on glass, as the trees stand against the sky in the photographs.',
      cls: () => 'dusk', badge: (i) => `<svg viewBox="0 0 48 48" aria-hidden="true"><path class="ground" d="M-2 42Q24 37.6 50 42V50H-2Z"/>` +
        `<path class="shape" d="${SIL[ORDER[i]]}" fill-rule="evenodd" transform="translate(4.8 3.4) scale(0.8)"/></svg>` },
  ];

  const badge = (d, i, s, on) => `<span class="b ${d.cls ? d.cls(i) : ''}${on ? ' on' : ''}" style="--s:${s}px">${d.badge(i, s)}</span>`;
  const main = document.getElementById('main');
  const carved = (i, s = 64) => badge(DIRS[0], i, s, false);
  const home = params.get('home');
  const PROMPT = `A single draughts piece seen straight from above, matching the attached king piece exactly: the same pale honey-coloured turned wood with calm, barely visible grain, the same flat matte top, the fine groove at 70% of the radius and the narrow rounded outer edge, the same soft light from the top left and a short soft shadow below. In place of the crown, a [fox sitting side on, its tail curled round its feet] is inlaid flat in the crown's dark walnut brown: an elegant, finely drawn silhouette as on a woodcut or a seal, not a cartoon, filling the area inside the groove. Centred, the piece filling the frame, on a plain transparent background. No text, no border, no colours other than the two woods. 1024 x 1024.

Then the same piece, light, finish, and inlay style for each of: a hare sitting upright with long ears; an owl perched on a short branch, front on; a hedgehog side on; a brown bear walking side on; a frog sitting side on.`;

  if (!home) {
    DIRS.forEach((d, k) => {
      main.insertAdjacentHTML('beforeend', `<section class="dir glass" id="d${k + 1}"><div><h2><b>${k + 1}</b>${d.title}</h2><p>${d.text}</p>` +
        `<div class="mark"><span class="tap">${badge(d, 0, 64, false)}</span><h1>Draughts</h1></div></div>` +
        `<div class="sets"><div class="row">${[0, 1, 2, 3, 4, 5].map((i) => badge(d, i, 112, i === 0)).join('')}</div>` +
        `<div class="row small">${[0, 1, 2, 3, 4, 5].map((i) => badge(d, i, 64, i === 0)).join('')}</div></div></section>`);
    });
    // Where the player shows on home, with the carved badge, and the first start.
    const PLACES = [
      ['1', 'The badge replaces the king', 'One face beside the name, as profiles.html\'s take a. Loses the king; nothing says it can be tapped.'],
      ['2', 'A chip in the top left', 'The king stays; the badge and the name on round glass, mirroring the X. Says who is playing, but reads as a label, not a control.'],
      ['3', 'A medallion on the king', 'The king stays, a 36 dp badge over its lower right edge; the tap is the king\'s. Quiet, and the least obvious to a child.'],
      ['4', 'The players\' pieces, stacked', 'As 2, with the siblings\' pieces tucked under the player\'s, peeking out: a child sees a sibling\'s animal there and taps to reach it. Proposed.'],
      ['first', 'First start: pick your badge', 'Only while no player exists, once: the six pieces, a name if wanted, done. More players come from the chip later.'],
    ];
    const season = Draughts.settings.season;
    main.insertAdjacentHTML('beforeend', `<section class="places glass" id="places"><h2>Where the player shows on home</h2>` +
      `<p>The carved badge (1) on home at the tablet's 1280 × 800 and 800 × 1280, shown at 0.3; each title opens it full size.</p>` +
      `<div class="grid">${PLACES.map(([q, t, x]) => {
        const src = `badges.html?home=${q}&season=${season}`;
        return `<div class="place"><h3><b>${q === 'first' ? '' : q}</b><a href="${src}" target="_blank">${t}</a></h3><p>${x}</p><div class="frames">` +
          `<div class="frame" style="width:384px;height:240px"><iframe src="${src}" width="1280" height="800"></iframe></div>` +
          `<div class="frame" style="width:240px;height:384px"><iframe src="${src}" width="800" height="1280"></iframe></div></div></div>`;
      }).join('')}</div></section>`);
    main.insertAdjacentHTML('beforeend', `<section class="places glass" id="prompt"><h2>If the art wants an image model</h2>` +
      `<p>Direction 1 at its best wants finer animals than hand-drawn paths give. One image per badge, for ChatGPT's image generator, with a close-up of home's king attached:</p>` +
      `<p style="font: 15px/1.5 ui-monospace, monospace; color: var(--fg); user-select: text; white-space: pre-wrap">${PROMPT}</p></section>`);
  } else {
    main.remove();
    Draughts.ICONS.close = '<path d="M6 6l12 12"/><path d="M18 6 6 18"/>';
    Draughts.ICONS.pencil = '<path d="M4 20l1-4.5L15.5 5a2.1 2.1 0 0 1 3 3L8 18.5z"/><path d="M13.5 7l3 3"/>';
    Draughts.ICONS.check = '<path d="M4.5 12.5l5 5 10-11"/>';
    const king = '<div class="piece white king"></div>';
    if (home === 'first') {
      const cols = innerWidth > innerHeight ? 6 : 3;
      document.body.insertAdjacentHTML('afterbegin', `<div class="first"><div class="mark">${king}<h1>Draughts</h1></div>` +
        `<div class="card glass"><h2>Pick your badge</h2><div class="pics" style="--cols:${cols}">` +
        [0, 1, 2, 3, 4, 5].map((i) => `<span class="tap${i === 0 ? ' on' : ''}">${carved(i, 96)}</span>`).join('') +
        `</div><div class="foot"><span class="name-field">${Draughts.icon('pencil')}Name</span>` +
        `<a class="button glass primary" data-icon="check"></a></div></div></div>`);
    } else {
      const lead = home === '1' ? `<span class="tap" style="width:88px;height:88px;display:grid;place-items:center;margin:0 -6px 0 -12px;flex:none">${carved(0)}</span>`
        : home === '3' ? `<span style="position:relative;width:56px;height:56px;flex:none;margin-right:8px">${king.replace('king"', 'king" style="position:absolute;inset:0;margin:0"')}<span class="medal">${carved(0, 36)}</span></span>` : king;
      const peeks = [2, 1].map((o, k) => `<span class="peek" style="position:absolute;left:${60 - k * 26}px;top:6px">${carved(o, 52)}</span>`).join('');
      document.body.insertAdjacentHTML('afterbegin', `<nav class="menu glass"><div class="content" id="content"><div class="mark">${lead}<h1>Draughts</h1><a class="gear" data-icon="gear"></a></div>` +
        `<a class="item primary"><span data-icon="next"></span><span>Continue</span></a>` +
        `<a class="item"><span data-icon="friend"></span><span>A friend</span></a>` +
        `<a class="item"><span data-icon="computer"></span><span>The computer</span><small>medium</small></a>` +
        `<a class="item"><span data-icon="puzzle"></span><span>Puzzles</span><small>23 / 64</small></a>` +
        `<a class="item settings"><span data-icon="gear"></span><span>Settings</span></a></div></nav><div id="board"></div>` +
        (home === '2' ? `<a class="chip glass"><span class="stack">${carved(0)}</span>Mia</a>` : '') +
        (home === '4' ? `<a class="chip glass fan"><span class="stack">${peeks}<span style="position:absolute;left:0;top:0">${carved(0)}</span></span>Mia</a>` : '') +
        `<a class="corner glass" data-icon="close"></a>`);
      Draughts.settings.bg = 'photo';
      Draughts.init();
      Draughts.board(document.getElementById('board'), { ...Draughts.start(10), view: '2d' });
      layout();
    }
  }

  // Home's layout, after profiles.html: a column at the left in landscape, a sheet under
  // the board in portrait (settings then the gear), the X in the top right.
  function layout() {
    const W = innerWidth, H = innerHeight, landscape = W >= H;
    const menu = document.querySelector('.menu'), board = document.getElementById('board'), content = document.getElementById('content');
    const put = (el, x, y, w, h) => Object.assign(el.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px` });
    const rows = landscape ? 5 : 4, markGap = landscape ? 28 : 14, colW = 360;
    const contentH = 72 + markGap + rows * 88 + (rows - 1) * 2;
    content.querySelector('.mark').style.marginBottom = `${markGap}px`;
    content.querySelector('.gear').style.display = rows === 4 ? '' : 'none';
    content.querySelector('.item.settings').style.display = rows === 5 ? '' : 'none';
    let size, bx, by;
    if (landscape) {
      const menuW = 72 + colW + 72;
      put(menu, -32, 0, menuW, H);
      put(content, 72 + 32, Math.max(16, (H - contentH) / 2), colW, contentH);
      const free = menuW - 32;
      size = Math.min(0.7 * H, W - free - 80);
      bx = free + (W - free - size) / 2; by = (H - size) / 2;
    } else {
      const sheetH = contentH + 64;
      put(menu, 0, H - sheetH, W, sheetH + 32);
      put(content, 32, 32, W - 64, contentH);
      const stageH = H - sheetH, clear = 24 + 88 + 16;
      size = Math.min(0.8 * W, 0.6 * H, stageH - 48);
      by = Math.max(clear, (stageH - size) / 2);
      size = Math.min(size, stageH - 24 - by);
      bx = (W - size) / 2;
    }
    put(board, bx, by, size, size);
    content.querySelector('h1').style.letterSpacing = landscape ? '0.06em' : '0.04em';
  }
  if (!document.querySelector('.proto-bar')) { Draughts.settings.bg = 'photo'; Draughts.init(); }
  if (home) document.querySelector('.proto-bar')?.remove();
</script>
</body>
</html>

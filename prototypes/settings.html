<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: settings</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* Settings, reached from the title menu. Few choices, each a row of large tiles that
     show what they pick: the background (by the date, or one season), the board (2D or
     3D), move hints, and the language. A tap applies it at once; there is no save. */
  .settings { display: grid; grid-template-columns: auto 1fr; gap: 24px; height: 100%; padding: 24px 32px; }
  .list { display: grid; gap: 14px; align-content: center; max-width: 980px; }
  .group { --r: 24px; display: grid; grid-template-columns: 200px 1fr; align-items: center; gap: 20px; padding: 16px 20px; }
  .group h2 { margin: 0; display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 400; }
  .group h2 .icon { width: 34px; height: 34px; stroke-width: 2; opacity: 0.85; }
  .tiles { display: flex; gap: 12px; flex-wrap: wrap; }
  .tile { display: grid; justify-items: center; gap: 6px; padding: 6px 6px 8px; border: 0; border-radius: 16px; cursor: pointer;
    color: var(--fg); font: inherit; font-size: 16px; background: var(--button); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.12); }
  .tile.on { background: color-mix(in srgb, var(--glow) 22%, transparent); box-shadow: inset 0 0 0 2px var(--glow); }
  .tile .pic { width: 104px; height: 64px; border-radius: 11px; background: center / cover; display: grid; place-items: center; }
  .tile .pic .icon { width: 30px; height: 30px; }
  .tile.text { min-width: 104px; min-height: 64px; place-content: center; font-size: 20px; padding: 0 18px; }
  @media (orientation: portrait) {
    .settings { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .settings > div:first-child { justify-self: start; }
    .group { grid-template-columns: 1fr; gap: 12px; }
    .tile .pic { width: 88px; height: 56px; }
  }
</style>
</head>
<body>
<main class="settings">
  <div><a class="button glass" href="home.html" data-icon="back" aria-label="Back"></a></div>
  <div class="list" id="list"></div>
</main>
<script>
  Draughts.init();
  const S = Draughts.settings, params = new URLSearchParams(location.search);
  const now = params.get('season') === null;
  const photo = (s) => `../design/backgrounds/masters/${s}-01-2048.jpg`;
  // A choice reloads the page with it in the query, as the switcher does.
  const go = (key, value) => {
    const p = new URLSearchParams(location.search);
    if (value === null) p.delete(key); else p.set(key, value);
    if (key === 'season') p.delete('theme');
    location.search = p.toString();
  };
  const tile = (on, key, value, inner, label) =>
    `<button class="tile${inner ? '' : ' text'}${on ? ' on' : ''}" data-k="${key}" data-v="${value}">${inner || ''}${label}</button>`;
  const group = (iconName, title, tiles) =>
    `<section class="group glass"><h2>${Draughts.icon(iconName)}${title}</h2><div class="tiles">${tiles}</div></section>`;
  const seasons = [['winter', 'Winter'], ['spring', 'Spring'], ['summer', 'Summer'], ['autumn', 'Autumn']];
  document.getElementById('list').innerHTML =
    group('sun', 'Background',
      tile(now, 'season', '', `<span class="pic" style="background: color-mix(in srgb, var(--glow) 18%, rgb(255 255 255 / 0.06))">${Draughts.icon('sun')}</span>`, 'By the date') +
      seasons.map(([s, name]) => tile(!now && S.season === s, 'season', s, `<span class="pic" style="background-image: url(${photo(s)})"></span>`, name)).join('')) +
    group('dots', 'Board',
      tile(S.view === '2d', 'view', '2d', '', '2D') + tile(S.view === '3d', 'view', '3d', '', '3D')) +
    group('target', 'Move hints',
      tile(S.assist === 'mistakes', 'assist', 'mistakes', '', 'Mistakes only') + tile(S.assist === 'moves', 'assist', 'moves', '', 'All moves')) +
    group('globe', 'Language', tile(params.get('lang') !== 'et', 'lang', 'en', '', 'English') +
      tile(params.get('lang') === 'et', 'lang', 'et', '', 'Eesti'));
  document.querySelectorAll('.tile').forEach((t) => t.onclick = () => go(t.dataset.k, t.dataset.v || null));
  Draughts.syncGlass();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: settings</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* Settings, reached from home and the game, in three groups by what they change and
     how often: the game (which draughts a new game starts on, move hints, the tutorial
     again), the look (background, board, kings), and the language, set once. Each
     setting is a label over a row of large tiles that show what they pick; a tap applies
     at once, there is no save. In landscape game and look stand side by side over the
     language; in portrait they stack. */
  .settings { display: grid; grid-template-rows: auto 1fr; gap: 18px; height: 100%; padding: 24px 32px; }
  .top { display: flex; align-items: center; gap: 20px; }
  .top h1 { margin: 0; font-size: 34px; font-weight: 400; }
  .groups { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; gap: 16px; align-content: center;
    max-width: 1180px; width: 100%; justify-self: center; }
  .group { --r: 24px; display: grid; align-content: start; gap: 6px; padding: 18px 22px 22px; }
  .group.wide { grid-column: 1 / -1; grid-template-columns: auto 1fr; align-items: center; gap: 24px; }
  .group h2 { margin: 0 0 6px; display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 400; }
  .group.wide h2 { margin: 0; }
  .group h2 .icon { width: 32px; height: 32px; stroke-width: 2; opacity: 0.85; }
  .setting { display: grid; gap: 8px; }
  .setting + .setting { margin-top: 12px; }
  .setting h3 { margin: 0 2px; font-size: 18px; font-weight: 400; color: var(--fg-dim); letter-spacing: 0.03em; }
  .tiles { display: flex; gap: 10px; flex-wrap: wrap; }
  .tile { display: grid; justify-items: center; align-content: center; gap: 4px; min-width: 96px; min-height: 64px; padding: 6px 16px 8px;
    border: 0; border-radius: 16px; cursor: pointer; color: var(--fg); font: inherit; font-size: 19px; text-decoration: none;
    background: var(--button); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.12); }
  .tile small { font-size: 14px; color: var(--fg-dim); }
  .tile.on { background: color-mix(in srgb, var(--glow) 22%, transparent); box-shadow: inset 0 0 0 2px var(--glow); }
  .tile.pic { padding: 6px 6px 8px; font-size: 15px; }
  .tile .thumb { width: 96px; height: 60px; border-radius: 11px; background: center / cover; display: grid; place-items: center; }
  .tile .thumb .icon { width: 28px; height: 28px; }
  .tile.action { display: flex; align-items: center; justify-content: center; gap: 10px; }
  /* A variant's tile shows its board at the start. */
  .tile .mini { width: 72px; margin-bottom: 4px; }
  .tile.action .icon { width: 26px; height: 26px; }
  /* A king as each style draws it top down: a crown on the face, or a second disc. */
  .kp { position: relative; width: 34px; height: 38px; }
  .kp .piece { --u: 3px; inset: 4px 0 0; }
  /* The board's tiles show a corner of the board as it is drawn, flat or raised. */
  .tile .view { width: 112px; height: 88px; overflow: hidden; display: grid; place-items: center; margin-bottom: 2px; }
  .tile .view .board { width: 76px; }
  /* Its own stacking context, so the painted board isn't drawn behind the tile. */
  .tile .board { isolation: isolate; }
  @media (orientation: portrait) {
    .settings { overflow: auto; }
    .groups { grid-template-columns: 1fr; grid-template-rows: none; align-content: start; }
    .group.wide { grid-template-columns: 1fr; gap: 6px; }
    .tile .thumb { width: 84px; height: 54px; }
  }
</style>
</head>
<body>
<main class="settings">
  <div class="top"><a class="button glass" href="home.html" data-icon="back" aria-label="Back"></a><h1>Settings</h1></div>
  <div class="groups" id="groups"></div>
</main>
<script>
  Draughts.init();
  const S = Draughts.settings, params = new URLSearchParams(location.search);
  const now = params.get('season') === null;
  const v = params.get('v') || 'intl';
  const photo = (s) => `../design/backgrounds/masters/${s}-01-2048.jpg`;
  // A choice reloads the page with it in the query, as the switcher does.
  const go = (key, value) => {
    const p = new URLSearchParams(location.search);
    if (value === null) p.delete(key); else p.set(key, value);
    if (key === 'season') p.delete('theme');
    location.search = p.toString();
  };
  const tile = (on, key, value, label, cls = '') =>
    `<button class="tile ${cls}${on ? ' on' : ''}" data-k="${key}" data-v="${value}">${label}</button>`;
  const setting = (title, tiles) => `<div class="setting"><h3>${title}</h3><div class="tiles">${tiles}</div></div>`;
  const group = (iconName, title, body, cls = '') =>
    `<section class="group glass ${cls}"><h2>${Draughts.icon(iconName)}${title}</h2>${body}</section>`;
  // A king as the style draws it: the painter draws a king inside .stack as two plain discs.
  const king = (stack) => `<span class="kp${stack ? ' stack' : ''}"><span class="piece white king"></span></span>`;
  const seasons = [['winter', 'Winter'], ['spring', 'Spring'], ['summer', 'Summer'], ['autumn', 'Autumn']];
  document.getElementById('groups').innerHTML =
    group('target', 'Game',
      setting('Draughts for a new game',
        tile(v === 'intl', 'v', 'intl', '<span class="mini" data-n="10"></span>International<small>10 × 10</small>') +
        tile(v === 'russian', 'v', 'russian', '<span class="mini" data-n="8"></span>Russian<small>8 × 8</small>') +
        tile(v === 'brazilian', 'v', 'brazilian', '<span class="mini" data-n="8"></span>Brazilian<small>8 × 8</small>')) +
      setting('Move hints',
        tile(S.assist === 'mistakes', 'assist', 'mistakes', 'Mistakes only') +
        tile(S.assist === 'moves', 'assist', 'moves', 'All moves')) +
      setting('Tutorial',
        `<a class="tile action" href="first-start.html?page=1&v=${v}">${Draughts.icon('hint')}Learn the moves</a>`)) +
    group('sun', 'Look',
      setting('Background',
        tile(now, 'season', '', `<span class="thumb" style="background: color-mix(in srgb, var(--glow) 18%, rgb(255 255 255 / 0.06))">${Draughts.icon('sun')}</span>By the date`, 'pic') +
        seasons.map(([s, name]) => tile(!now && S.season === s, 'season', s, `<span class="thumb" style="background-image: url(${photo(s)})"></span>${name}`, 'pic')).join('')) +
      setting('Board',
        tile(S.view === '2d', 'view', '2d', '<span class="view"><span class="board" data-view="2d"></span></span>Flat<small>2D</small>') +
        tile(S.view === '3d', 'view', '3d', '<span class="view"><span class="board" data-view="3d"></span></span>Raised<small>3D</small>')) +
      setting('Kings',
        tile(S.king === 'auto', 'king', 'auto', 'Auto<small>crown flat, stack raised</small>') +
        tile(S.king === 'crown', 'king', 'crown', `${king(false)}Crown`) +
        tile(S.king === 'stack', 'king', 'stack', `${king(true)}Stack`))) +
    group('globe', 'Language',
      `<div class="tiles">${tile(params.get('lang') !== 'et', 'lang', 'en', 'English')}${tile(params.get('lang') === 'et', 'lang', 'et', 'Eesti')}</div>`, 'wide');
  for (const el of document.querySelectorAll('[data-n]')) Draughts.board(el, Draughts.start(+el.dataset.n));
  // A few pieces and a king, on the board as each view draws it.
  for (const el of document.querySelectorAll('[data-view]')) {
    Draughts.board(el, { n: 6, view: el.dataset.view, white: ['a1', 'c1', 'b2', 'd4'], black: ['f6', 'b6', 'e5'], kings: ['d4'] });
  }
  document.querySelectorAll('button.tile').forEach((t) => t.onclick = () => go(t.dataset.k, t.dataset.v || null));
  Draughts.paint();
  Draughts.syncGlass();
</script>
</body>
</html>

<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kabe: boards</title>
<link rel="stylesheet" href="kabe.css">
<script src="kabe.js"></script>
<style>
  body { overflow: auto; }
  .boards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 24px; }
  figure { margin: 0; display: grid; gap: 10px; justify-items: center; }
  figure > div { width: 100%; }
  figcaption { color: var(--fg-dim); }
  @media (orientation: portrait) { .boards { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<main class="boards" id="boards"></main>
<script>
  Kabe.init();
  const pos = {
    white: ['a1', 'c1', 'e1', 'g1', 'b2', 'f2', 'h2', 'c3', 'e3', 'd4', 'h6'],
    black: ['b8', 'd8', 'f8', 'h8', 'a7', 'c7', 'b6', 'e5', 'g5', 'a5'],
    kings: ['h6', 'a5'], selected: 'd4', forced: ['h6'], via: ['f6'], targets: ['h4'], last: ['h4', 'g5'],
  };
  const items = [];
  for (const theme of Kabe.THEMES) items.push({ theme, king: 'crown', caption: `${theme}, crowned king` });
  for (const theme of Kabe.THEMES) items.push({ theme, king: 'stack', caption: `${theme}, stacked king` });
  const root = document.getElementById('boards');
  for (const it of items) {
    const fig = document.createElement('figure');
    fig.innerHTML = `<div></div><figcaption>${it.caption}</figcaption>`;
    root.appendChild(fig);
    Kabe.board(fig.firstChild, { ...pos, theme: it.theme, king: it.king });
  }
  const ten = document.createElement('figure');
  ten.innerHTML = '<div></div><figcaption>10×10, stone</figcaption>';
  root.appendChild(ten);
  const w = [], b = [];
  for (let y = 0; y < 10; y++) for (let x = 0; x < 10; x++) if ((x + y) % 2 === 0) {
    const sq = String.fromCharCode(97 + x) + (y + 1);
    if (y < 4) w.push(sq); else if (y > 5) b.push(sq);
  }
  Kabe.board(ten.firstChild, { n: 10, white: w, black: b, theme: 'stone' });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: games' history</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* The games' history (task 074): the moves of the game in progress with their marks,
     the games played with a rating, and the per-player Moves setting. One International
     game (10 × 10, PDN numbers), played out legally by a script, is the data everywhere:
     the child plays white against the computer at Medium and loses on move 55.
       ?view=game     the game screen as built (the flat board between the corner panels,
                      panel.goose's flat_corners) with the moves panel:
                      &take=a  (built) the moves panel in the right column under the
                               play panel: 388 dp at the tablet, 8 rows;
                      Portrait: a one-line strip of the last moves under the play row,
                      where it costs the board under 5% (12 dp at 800 × 1280); else none.
                      A phone in landscape (480 dp tall): no room under the play panel
                      (52 dp), so no panel in take a; a note says so.
                      &take=d  a phone (else take a). In landscape a line of the
                               last move under the left column, opening a sheet over the
                               screen's left part (to the board's edge) with the moves,
                               the board left whole and playable. &open=1 the sheet open;
                               &fit=row (back and settings side by side, start over under
                               them: the line a full tap, the captured pieces under it) or
                               slim (the left column as built; the line in the captured
                               pieces' place, as tall as the room under the column, the
                               catch as counts in it; on the iPhone 13 mini the tiles 88
                               high and the catch as counts at the line's head, task 078);
                               &device=pixel (the Pixel 7a's cutout at the left, 52 dp,
                               and gesture bar, 37 dp, at 480 dp), a33 (its cutout at the
                               left, 36 dp, and its three-button bar at the right, 60 dp:
                               assumed, not measured), iphone (812 × 375: 50 at each side,
                               21 at the foot; portrait 50 at the top, 34 at the foot),
                               none; by default from the window's size; &board=flat or 3d;
                               &grid=1 sets both fits closed and open on the phones side
                               by side. In portrait (task 078's A) the last move in a tap
                               that opens the moves as a sheet from the foot: &port=strip
                               (a strip under the play row) or bar (in the bar between
                               what each side has taken); &open=1.
       Marks explained (task 078's B), anywhere a mark shows: &explain=pop (a tip on a
                      touch of the marked move, or under the mouse) or legend (the
                      marks' words at the list's foot); &tip=N pins ply N's tip open,
                      &tip=foot the foot's ??, &tip=games the results' first ??.
       ?view=settings settings with the Moves row (Off, List, Marks) in the Game group.
       ?view=games    the games screen for the player: the rating, by level, the games.
       ?view=replay   one past game (task 078's C), from its row on the results screen:
                      the board at a move (&ply=0..110) beside the whole list, the steps
                      (to the start, back, on, to the end) a column at the board's left in
                      landscape and a row under it in portrait, a move's tap jumping
                      there; "Doesn't count" by the title.
       ?view=entry    where the games screen is reached from: a Games row on home.
     &marks=on|off|hidden (the setting: the list with marks, the list alone, no panel);
     &state=early|late (6 moves, or 30 with the list scrolled to its end); &lang=et. */
  main { position: fixed; inset: 0; }
  .bgl { position: fixed; inset: -80px; z-index: -1; background: var(--page) var(--scene) center / cover no-repeat;
    filter: blur(30px) brightness(0.72) saturate(0.95); }
  .at { position: absolute; }
  .num { font-variant-numeric: tabular-nums; }

  /* The game's tiles, as built (game-captured.html). */
  .panel { display: flex; flex-direction: column; gap: 12px; padding: 20px 16px; }
  .panel .space { flex: 1; }
  .row { display: flex; align-items: center; justify-content: flex-start; gap: 12px; min-height: 88px;
    padding: 0 14px; font-size: 24px; text-align: left; white-space: nowrap; }
  .row.button svg { flex: none; width: 34px; height: 34px; stroke-width: 2.2; }
  .back { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 24px; text-decoration: none; }
  .back svg { width: 34px; height: 34px; stroke-width: 2.2; }
  .playp { display: flex; flex-direction: column; padding: 18px 16px 16px; }
  .spot { position: relative; display: flex; justify-content: center; align-items: center; height: 72px; flex: none; }
  .spot .piece, .tp { --u: 7px; position: relative; inset: auto; flex: none; width: 72px; height: 72px;
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--glow) 80%, transparent), 0 0 22px 4px color-mix(in srgb, var(--glow) 45%, transparent); }
  .spot .eye { position: absolute; right: -4px; top: 8px; }
  .words { text-align: center; font-size: 24px; margin: 16px 0 0; flex: none; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: none; }
  .duo .row { flex-direction: column; justify-content: center; gap: 6px; min-height: 132px; padding: 6px 4px;
    font-size: 22px; line-height: 1.05; white-space: normal; text-align: center; }
  .duo .row svg { width: 36px; height: 36px; }
  /* A phone's narrow panels: the hint over undo move, each a row, the piece left of
     centre clear of the eye; the left panel's icons over their words. */
  .phone .duo { grid-template-columns: 1fr; gap: 10px; }
  .phone .duo .row { min-height: 88px; flex-direction: row; gap: 10px; padding: 0 12px; justify-content: flex-start; text-align: left; }
  .phone .duo .row svg { width: 32px; height: 32px; }
  .phone .spot { justify-content: flex-start; padding-left: 14px; }
  .phone .words { margin-top: 10px; }
  .phone .panel .row { flex-direction: column; justify-content: center; gap: 4px; min-height: 96px; font-size: 20px; }
  .phone .playp { padding-top: 12px; }
  .duo.short .row { min-height: 88px; flex-direction: row; font-size: 22px; }
  .pips { display: flex; gap: 7px; justify-content: center; }
  .pips i { width: 12px; height: 12px; border-radius: 50%; background: var(--glow);
    box-shadow: 0 0 7px color-mix(in srgb, var(--glow) 50%, transparent); }
  .eye { position: relative; flex: none; display: grid; place-items: center; width: 56px; height: 56px; padding: 0;
    border: 0; background: none; color: var(--fg); }
  .eye::before { content: ''; position: absolute; inset: 4px; border-radius: 50%;
    background: color-mix(in srgb, var(--glow) 30%, rgb(0 0 0 / 0.3));
    box-shadow: inset 0 0 0 2px var(--glow), 0 0 12px -2px color-mix(in srgb, var(--glow) 60%, transparent); }
  .eye svg { position: relative; width: 30px; height: 30px; stroke-width: 2.4; }
  .bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 16px; padding: 16px 20px; align-content: start; }
  .bar .row { justify-content: center; }
  .prow { display: flex; flex-direction: column; gap: 12px; padding: 14px 20px 20px; }
  .prow .turnline { display: flex; align-items: center; gap: 16px; justify-content: center; position: relative; height: 72px; }
  .prow .turnline .piece { position: relative; inset: auto; flex: none; width: 52px; height: 52px; --u: 5px;
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--glow) 80%, transparent), 0 0 18px 3px color-mix(in srgb, var(--glow) 45%, transparent); }
  .prow .turnline .eye { position: absolute; right: 0; }
  .prow .duo .row { min-height: 88px; flex-direction: row; gap: 12px; }
  .prow .duo .row .pips { margin-left: 4px; }

  /* What each side has taken, under the left panel (task 052, as built). */
  .taken { display: grid; gap: 10px; padding: 14px 16px; align-content: center; }
  .caprow { display: flex; align-items: center; min-height: 32px; }
  .caprow.end { justify-content: flex-end; }
  .catch { position: relative; display: block; flex: none; }
  .mini { position: absolute; }
  .mini .piece { inset: 0; }

  /* The moves panel: numbered rows, white's move and black's side by side, in the 20 dp
     face (read, not tapped). A mark is a small glyph after its move: best a star in the
     glow, ?! autumn's gold, ? orange, ?? the forced-capture red; good and an only move
     nothing. The last move lit as a chosen tile is. A line per side at the foot: its
     accuracy and its marks counted. */
  .moves { display: flex; flex-direction: column; padding: 12px 10px 12px 12px; font-size: 20px; }
  .mhead, .mrow { display: grid; grid-template-columns: 30px 1fr 1fr; align-items: center; column-gap: 4px; }
  .mhead { height: 32px; padding-bottom: 4px; flex: none; color: var(--fg-dim); font-size: 17px; }
  .mhead .dot { justify-self: start; margin-left: 8px; }
  .mlist { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none;
    mask-image: linear-gradient(transparent, #000 18px, #000 calc(100% - 6px), transparent); }
  .mlist::-webkit-scrollbar { display: none; }
  .mrow { height: 31px; }
  .mrow .n { color: var(--fg-dim); text-align: right; padding-right: 2px; font-size: 17px; }
  .mv { justify-self: start; min-width: 76px; display: flex; align-items: center; gap: 3px; height: 28px; padding: 0 8px; border-radius: 9px; white-space: nowrap; }
  .mv.lit { background: color-mix(in srgb, var(--glow) 24%, transparent); box-shadow: inset 0 0 0 1.5px var(--glow); }
  .mv.dim { color: var(--fg-dim); }
  .mk { font-style: normal; font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
  .mk.q0 { color: #ffd75a; }
  .mk.q1 { color: #ff9a3c; }
  .mk.q2 { color: var(--forced); }
  .mk.best { display: inline-grid; width: 15px; height: 15px; color: var(--glow); }
  .mk.best svg { width: 15px; height: 15px; }
  .mfoot { flex: none; display: grid; gap: 2px; padding-top: 8px; margin-top: 4px; border-top: 1px solid rgb(255 255 255 / 0.12); }
  .sum { display: flex; align-items: center; gap: 8px; height: 30px; font-size: 20px; }
  .sum b { font-weight: 400; min-width: 46px; }
  .sum .cnt { display: flex; gap: 10px; margin-left: auto; font-size: 17px; color: var(--fg); }
  .sum .cnt span.zero { opacity: 0.35; }
  .sum .cnt > span { display: flex; align-items: baseline; gap: 2px; }
  .dot { position: relative; display: inline-block; flex: none; width: 22px; height: 22px; }
  .dot .piece { inset: 0; --u: 2px; }
  /* Portrait's strip: the last moves on one line, the oldest fading out at the left. */
  .strip { display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding: 0 18px; font-size: 20px; overflow: hidden;
    mask-image: linear-gradient(90deg, transparent 12px, #000 120px); white-space: nowrap; }
  .strip .n { color: var(--fg-dim); font-size: 17px; margin-left: 10px; }
  .strip .mv { min-width: 0; }
  /* The switcher folds under Options in portrait, as coach.html's does. */
  .proto-fold { display: none; position: fixed; right: 6px; bottom: 6px; z-index: 11; padding: 4px 8px; border: 0;
    border-radius: 8px; background: rgb(0 0 0 / 0.55); color: #ddd; font: 12px system-ui, sans-serif; opacity: 0.6; }
  @media (orientation: portrait) {
    .proto-fold { display: block; }
    body:not(.bar-open) .proto-bar, body:not(.bar-open) .note { display: none; }
    .proto-bar { left: 6px; right: 6px; bottom: 36px; opacity: 1; flex-wrap: wrap; }
  }
  .note { position: fixed; left: 12px; bottom: 12px; z-index: 9; opacity: 0.5; padding: 6px 10px; border-radius: 10px;
    background: rgb(0 0 0 / 0.55); color: #ddd; font: 13px system-ui, sans-serif; max-width: 60vw; }

  /* The board's mark on a replayed move: the glyph in a disc at the square's corner. */
  .badge { position: absolute; z-index: 4; right: -10%; top: -12%; width: 46%; height: 46%; border-radius: 50%;
    display: grid; place-items: center; font: 700 calc(var(--bw) * 0.017) var(--font); color: #1a1208;
    box-shadow: 0 2px 6px rgb(0 0 0 / 0.5); }
  .badge.q0 { background: #ffd75a; }
  .badge.q1 { background: #ff9a3c; }
  .badge.q2 { background: var(--forced); color: #fff; }
  .badge.best { background: var(--glow); }
  .badge svg { width: 60%; height: 60%; }

  /* Screens with a title row: settings, the games, a replay. */
  .page { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 16px; padding: 24px; }
  .top { display: flex; align-items: center; gap: 18px; flex: none; min-height: 88px; }
  .top h1 { margin: 0; font-size: 34px; font-weight: 400; white-space: nowrap; }
  .top .back { padding: 0 24px 0 18px; height: 88px; }
  .top .end { margin-left: auto; display: flex; gap: 10px; }
  .face { --c: #d9793a; display: grid; place-items: center; border-radius: 50%; flex: none; width: 56px; height: 56px;
    background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--c), #fff 14%), var(--c) 72%);
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.22), 0 6px 14px -8px rgb(0 0 0 / 0.55); }
  .face svg { width: 74%; height: 74%; }
  .face .f { fill: #fbf3e6; } .face .e { fill: #2a211c; }
  .tile { display: grid; justify-items: center; align-content: center; gap: 2px; min-width: 88px; min-height: 88px; padding: 4px 16px 6px;
    border: 0; border-radius: 16px; cursor: pointer; color: var(--fg); font: inherit; font-size: 22px; text-decoration: none;
    background: var(--button); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.12); }
  .tile small { font-size: 16px; color: var(--fg-dim); }
  .tile.on { background: color-mix(in srgb, var(--glow) 22%, transparent); box-shadow: inset 0 0 0 2px var(--glow); }
  .tile.on small { color: var(--fg); }
  .card { --r: 24px; padding: 16px 20px; min-height: 0; }
  .card h2 { margin: 0 0 6px; font-size: 18px; font-weight: 400; color: var(--fg-dim); letter-spacing: 0.03em; }

  /* The games screen. */
  .gbody { flex: 1; min-height: 0; display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 20px; }
  .stats { display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .rating { display: flex; align-items: baseline; gap: 14px; }
  .rating .big { font-size: 84px; line-height: 0.95; letter-spacing: 0.01em; }
  .rating .delta { font-size: 24px; color: var(--glow); }
  .rating .of { font-size: 18px; color: var(--fg-dim); margin-left: auto; white-space: nowrap; }
  .spark { width: 100%; height: 76px; flex: 1; min-height: 48px; max-height: 220px; margin: 8px 0 16px; }
  .rate { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .spark path.l { fill: none; stroke: var(--glow); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
  .spark path.a { fill: color-mix(in srgb, var(--glow) 14%, transparent); }
  .spark circle { fill: var(--glow); }
  .levels { display: grid; gap: 4px; margin-top: auto; }
  .lv { display: grid; grid-template-columns: 34px 1fr repeat(3, 58px); align-items: center; gap: 6px; height: 56px; font-size: 22px; }
  .lv .ic svg { width: 30px; height: 30px; opacity: 0.85; }
  .lv small { display: block; line-height: 1; font-size: 16px; color: var(--fg-dim); }
  .lv .c { display: flex; align-items: center; gap: 6px; }
  .lv .c .res { width: 26px; height: 26px; }
  .lvhead { display: grid; grid-template-columns: 34px 1fr repeat(3, 58px); gap: 6px; font-size: 16px; color: var(--fg-dim); }
  .list { display: flex; flex-direction: column; padding: 12px; overflow: hidden; }
  .list .scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: grid; gap: 4px; align-content: start; }
  .grow { display: grid; grid-template-columns: 60px minmax(0, 1fr) auto 76px 60px; align-items: center; gap: 14px;
    min-height: 88px; padding: 0 16px 0 12px; border-radius: 18px; color: var(--fg); text-decoration: none; font-size: 22px;
    background: rgb(255 255 255 / 0.05); }
  .grow:active, .grow.on { background: rgb(255 255 255 / 0.14); }
  .grow .who { display: flex; flex-direction: column; min-width: 0; }
  .grow .who span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grow .who small { font-size: 16px; color: var(--fg-dim); white-space: nowrap; }
  .grow .side { display: flex; align-items: center; gap: 8px; }
  .grow .chg { text-align: right; font-size: 22px; }
  .grow .chg.up { color: var(--glow); }
  .grow .chg.down, .grow .chg.none { color: var(--fg-dim); }
  .grow .bl { text-align: right; font-size: 18px; }
  .grow .bl.zero { opacity: 0.3; }
  /* A result a child reads without reading: a crown on a lit disc (won), a disc half
     filled (a draw), an empty piece (lost). */
  .res { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; flex: none; }
  .res svg { width: 62%; height: 62%; }
  .res.won { background: color-mix(in srgb, var(--glow) 26%, transparent); box-shadow: inset 0 0 0 2px var(--glow); color: var(--glow); }
  .res.drawn, .res.lost { color: var(--fg-dim); }
  .res.drawn svg, .res.lost svg { width: 74%; height: 74%; }

  /* A replay. */
  .rsum { display: flex; flex-direction: column; gap: 10px; padding: 18px 16px; }
  .rsum .result { display: flex; align-items: center; gap: 12px; font-size: 26px; }
  .rsum .meta { font-size: 18px; color: var(--fg-dim); line-height: 1.35; }
  .rsum .acc { display: grid; gap: 6px; }
  .rsum .acc .sum { height: 34px; }
  .rsum .acc .cnt { margin-left: 0; }
  .rsum .acc .line { display: flex; align-items: center; gap: 8px; font-size: 22px; }
  .rsum .chg { font-size: 22px; color: var(--fg-dim); }
  .steps { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: none; margin-top: 10px; }
  .steps .button { min-height: 88px; border-radius: 22px; }
  .steps .button svg { width: 40px; height: 40px; }
  .steps .button[disabled] { opacity: 0.35; }
  .phone .steps { gap: 4px; margin: 10px -6px 0 -8px; }
  .phone .steps .button { min-width: 88px; }
  .rbar { display: flex; align-items: center; gap: 16px; padding: 0 20px 0 0; }
  .rbar .back { flex: none; height: 88px; padding: 0 22px 0 16px; }
  .rbar .meta { font-size: 18px; color: var(--fg-dim); }
  .rbar .acc2 { margin-left: auto; display: grid; gap: 2px; }
  .rbar .acc2 .sum { height: 28px; font-size: 18px; }

  /* Settings (the app's sizes: 88 dp tiles, names in an 18 dp face at their left). */
  .sbody { flex: 1; min-height: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; }
  .groups { display: grid; gap: 10px; align-content: start; }
  .group { --r: 24px; display: grid; gap: 10px; padding: 12px 20px 14px; }
  .group h2 { margin: 0 0 2px; display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 400; }
  .group h2 .icon { width: 30px; height: 30px; stroke-width: 2; opacity: 0.85; }
  .group h2 small { margin-left: auto; font-size: 15px; color: var(--fg-dim); max-width: 280px; line-height: 1.25; }
  .setting { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 14px; }
  .setting h3 { margin: 0; font-size: 18px; font-weight: 400; color: var(--fg-dim); letter-spacing: 0.03em; }
  .setting.new h3 { color: var(--fg); }
  .tiles { display: flex; gap: 10px; flex-wrap: wrap; }
  .tiles .tile { font-size: 20px; }
  .tile .glyphs { display: flex; gap: 5px; align-items: center; }
  .tile.pic { padding: 4px 4px 5px; font-size: 15px; min-width: 88px; }
  .tile .thumb { width: 62px; height: 40px; border-radius: 11px; background: center / cover; }
  .tabs { display: flex; gap: 10px; }
  .tabs .tile { --r: 16px; display: flex; align-items: center; gap: 10px; font-size: 22px; padding: 0 18px; }
  .tabs .tile svg { width: 28px; height: 28px; }
  .lang { --r: 20px; display: flex; align-items: center; gap: 8px; padding: 0 0 0 14px; }
  .lang > .icon { width: 28px; height: 28px; opacity: 0.85; }
  .preview { position: relative; container-type: size; display: flex; align-items: center; justify-content: center; gap: 20px; min-height: 0; }
  .preview .moves { flex: none; }

  /* Home (the entry): the menu column as in profiles.html, a Games row added. */
  .menu { position: fixed; display: grid; align-content: center; --r: 0 32px 32px 0; border-radius: 0 32px 32px 0; }
  .menu .content { display: grid; gap: 2px; }
  .mark { display: flex; align-items: center; gap: 6px; height: 72px; margin-bottom: 20px; }
  .mark h1 { margin: 0 0 0 10px; font-size: 64px; font-weight: 400; letter-spacing: 0.06em; }
  .mark .face { width: 64px; height: 64px; margin: 0 6px 0 0; }
  .item { display: flex; align-items: center; gap: 18px; height: 88px; padding: 0 18px; border-radius: 20px;
    color: var(--fg); text-decoration: none; font-size: 30px; }
  .item .icon { width: 34px; height: 34px; stroke-width: 2.4; opacity: 0.85; }
  .item.primary { background: color-mix(in srgb, var(--glow) 24%, transparent); }
  .item.new { box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.25); }
  .item small { margin-left: auto; font-size: 17px; color: var(--fg-dim); }
  #hboard { position: fixed; isolation: isolate; }

  @media (orientation: portrait) {
    .gbody { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; }
    .stats .rate { grid-column: 1; }
    .stats .levels { grid-column: 2; grid-row: 1 / span 3; margin-top: 0; align-content: center; }
    .sbody { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
    .preview { order: -1; }
    .tiles .tile { padding: 4px 12px 6px; }
    .preview { order: -1; }
    .groups { grid-template-columns: 1fr 1fr; align-items: start; }
    .group { height: 100%; align-content: start; }
    .setting { grid-template-columns: 1fr; gap: 6px; }
  }
  /* A phone in landscape: everything a step smaller where it is read, taps kept. */
  .short .rating .big { font-size: 60px; }
  .short .spark { height: 48px; margin: 2px 0 4px; }
  .short .lv { height: 44px; font-size: 20px; }
  .short .gbody { grid-template-columns: 340px minmax(0, 1fr); gap: 16px; }
  .short .page { gap: 10px; padding: 16px 24px; }
  .short .stats { padding: 12px 16px; }

  /* Take d, a phone in landscape: the line under the left column (a tap: the last move
     and its mark, a chevron saying it opens) and the sheet it opens over the screen's left
     part, running off the screen's left edge, top, and bottom (gui::bleed), its words in

  const FOX = '<path class="f" d="M3 3.5 8.5 8h7L21 3.5l-.6 8.6Q19 18.6 12 21.5 5 18.6 3.6 12.1z"/><circle class="e" cx="8.8" cy="12.6" r="1.25"/><circle class="e" cx="15.2" cy="12.6" r="1.25"/><circle class="e" cx="12" cy="18.6" r="1.4"/>';

  const LOSS = { '*': 0, '': 0.02, '?!': 0.07, '?': 0.15, '??': 0.3 };
  const glyph = (k) => k === '*' ? `<i class="mk best">${icon('star')}</i>` :
    k === '?!' ? '<i class="mk q0">?!</i>' : k === '?' ? '<i class="mk q1">?</i>' : k === '??' ? '<i class="mk q2">??</i>' : '';
  function tally(n, side) {
    let acc = 0, cnt = 0; const c = { '??': 0, '?': 0, '?!': 0 };
    for (let i = side; i < n; i += 2) {
      const k = PLIES[i].k;
      if (k === '=') continue;
      acc += Math.max(0, Math.min(100, 103.17 * Math.exp(-4.354 * LOSS[k]) - 3.17)); cnt++;
      if (k in c) c[k]++;
    }
    return { acc: cnt ? Math.round(acc / cnt) : 100, c };
  }
  const dot = (c) => `<span class="dot"><span class="piece ${c}"></span></span>`;
  const sumLine = (n, side) => {
    const t = tally(n, side);
    const one = (k) => `<span class="${t.c[k] ? '' : 'zero'}" data-mk="${k}" data-ply="-1">${glyph(k)}<span class="num">${t.c[k]}</span></span>`;
    return `<div class="sum">${dot(side ? 'black' : 'white')}<b class="num">${t.acc}%</b><span class="cnt">${one('??')}${one('?')}${one('?!')}</span></div>`;
  };

  // The moves panel's inside: the heads (a piece for each side), the rows, and the foot.
  // A move with a shown mark carries it (data-mk) for its tip (task 078's B). opts: one
  // (the foot's two sides on one line, where the height is short), acc (each side's
  // accuracy in the head beside its piece, the replay's), tap (the rows a replay's taps).
  const shownMark = (k) => (k in MARKS ? k : '');
  function legend() {
    return `<div class="legend">${Object.keys(MARKS).map((k) => `<span>${glyph(k)}<span>${MARKS[k].short}</span></span>`).join('')}</div>`;
  }
  function movesInner(n, lit, withMarks, foot = withMarks, opts = {}) {
    let rows = '';
    for (let i = 0; i < n; i += 2) {
      const cell = (j) => {
        if (j >= n) return '<span></span>';
        const mk = withMarks ? shownMark(PLIES[j].k) : '';
        return `<span class="mv${j === lit ? ' lit' : ''}${j > lit ? ' dim' : ''}" data-ply="${j}"${mk ? ` data-mk="${mk}"` : ''}>${PLIES[j].m}${withMarks ? glyph(PLIES[j].k) : ''}</span>`;
      };
      rows += `<div class="mrow num"><span class="n">${i / 2 + 1}</span>${cell(i)}${cell(i + 1)}</div>`;
    }
    const head = opts.acc
      ? `<div class="mhead acc"><span></span><span class="hacc">${dot('white')}<b class="num">${tally(n, 0).acc}%</b></span><span class="hacc">${dot('black')}<b class="num">${tally(n, 1).acc}%</b></span></div>`
      : `<div class="mhead"><span></span>${dot('white')}${dot('black')}</div>`;
    const oneFoot = () => { const a = tally(n, 0), b = tally(n, 1);
      return `<div class="mfoot one"><div class="sum">${dot('white')}<b class="num">${a.acc}%</b>${dot('black')}<b class="num">${b.acc}%</b></div></div>`; };
    return `${head}<div class="mlist${opts.tap ? ' tap' : ''}">${rows}</div>` +
      (foot ? (opts.one ? oneFoot() : `<div class="mfoot">${sumLine(n, 0)}${sumLine(n, 1)}</div>`) : '') +
      (withMarks && explain === 'legend' ? legend() : '');
  }
  const scrollLists = () => document.querySelectorAll('.mlist').forEach((l) => {
    const lit = l.querySelector('.lit');
    if (lit) l.scrollTop = lit.offsetTop - l.offsetTop - l.clientHeight / 2 + 20;
  });

  const box = (r, cls, inner = '', extra = '') =>
    `<div class="at ${cls}" style="left:${r[0]}px;top:${r[1]}px;width:${r[2]}px;height:${r[3]}px;${extra}">${inner}</div>`;
  const tile = (ic, word, cls = '') => `<button class="row button ${cls}">${icon(ic)}<span>${word}</span></button>`;
  const W = innerWidth, H = innerHeight, landscape = W >= H, phone = Math.min(W, H) < 600;
  document.body.classList.toggle('short', landscape && H < 600);
  document.body.classList.toggle('phone', phone);
  let note = '';

  // What a side has taken, as the app's pieces in a row (game-captured.html's row).
  function catchOf(color, k, size) {
    let s = '', x = 0;
    for (let i = 0; i < k; i++) { s += `<span class="mini" style="left:${x}px;width:${size}px;height:${size}px;z-index:${i}"><div class="piece ${color}"></div></span>`; x += size * 0.52; }
    return `<span class="catch" style="width:${k ? x - size * 0.52 + size : 0}px;height:${size}px">${s}</span>`;
  }

  // Take d's layout on a phone in landscape, in dp, the page W × H: the safe area less the
  // device's insets (gui::safe), the flat board and the panels as panel.goose's
  // flat_corners and corners_in place them (NARROW 192 panels, the phone's play panel
  // CORNER_PLAY 368, left_h() 336, under_left's catch at TAKEN_PHONE 26), and the line,
  // the catch, and the sheet by the fit. The insets at 480 dp (2.25 px a dp): the Pixel
  // 7a's 118 px cutout and 84 px gesture bar (test/shell/sizes.goose); the A33's assumed,
  // its notch about 80 px and its three-button bar 135 px (48 dp at its density), at the
  // right in landscape.
  // The iPhone 13 mini at 812 × 375 pt: its notch's side and the other kept clear alike
  // (50 pt each) and the home indicator's 21 pt in landscape; 50 at the top and 34 at the
  // foot in portrait. PORTRAIT holds each device's insets turned upright.
  const DEVICES = { pixel: [118 / 2.25, 0, 0, 84 / 2.25], a33: [80 / 2.25, 0, 135 / 2.25, 0], iphone: [50, 0, 50, 21], none: [0, 0, 0, 0] };
  const PORTRAIT = { pixel: [0, 118 / 2.25, 0, 84 / 2.25], a33: [0, 80 / 2.25, 0, 135 / 2.25], iphone: [0, 50, 0, 34], none: [0, 0, 0, 0] };
  const insetsOf = (dev, land) => (land ? DEVICES : PORTRAIT)[dev];
  const DEVNAME = { pixel: 'Pixel 7a', a33: 'A33 (insets assumed)', iphone: 'iPhone 13 mini', none: 'no insets' };
  const LEFT_H = 336, PLAY_H = 368, SIDE = 192, TAP = 88, STACK = 96, GAP = 24, BACK_GAP = 12, ROW = 34;
  function underLeft(x, under, limit, side) {   // panel::under_left at TAKEN_PHONE
    const d = 26, room = limit - under, rows = 2.3 * d + 28, squeezed = (room - 16) / 2.3;
    if (room >= rows) return { r: [x, under, side, rows], d, two: true };
    if (squeezed >= 0.75 * d) return { r: [x, under, side, room], d: Math.min(d, squeezed), two: true };
    const one = Math.min(d, room - 16);
    return one > 0.5 * d ? { r: [x, under, side, one + 16], d: one, two: false } : null;
  }
  function dLayout(W, H, dev, fitting, raised) {
    const [l, t, r, b] = DEVICES[dev];
    const sx = l, sy = t, sw = W - l - r, sh = H - t - b, g = GAP, side = SIDE;
    const L = { ins: [l, t, r, b], safe: [sx, sy, sw, sh] };
    const B = Math.min(sh - 2 * g, sw - 2 * side - 4 * g);
    L.board = [sx + (sw - B) / 2, sy + (sh - B) / 2, B, B];
    L.play = [sx + sw - g - side, sy + g, side, Math.min(PLAY_H, sh - 2 * g)];
    if (raised) {   // corners_in: the camera's buttons a row at the right edge, the board between the columns
      const len = 3 * 48 + 16;
      L.buttons = [sx + sw - g - len, sy + Math.min(g + L.play[3] + 12, sh - 48), len, 48];
      L.board3 = [sx + g + side + 12, sy + g, sw - 2 * (g + side + 12), sh - 2 * g];
    }
    // The left side's right edge: the flat board's less a gap, or the 3D column's own.
    const edge = raised ? sx + g + side : L.board[0] - 12;
    const builtFoot = sy + g + Math.min(LEFT_H, sh - 2 * g);
    L.roomBuilt = sy + sh - g - (builtFoot + BACK_GAP);   // under the column as built
    L.gapToBoard = L.board[0] - (sx + g + side);
    if (fitting === 'row') {
      // Back and settings side by side (each a tile with its icon over its word), start
      // over under them on its own: the column 204 dp in place of 336.
      // Under them what each side has taken, then the line at the foot: the room left, at
      // least a tap, holding the last moves' rows as the sheet shows them, the older faded.
      // Where the catch doesn't fit (the iPhone 13 mini's 354 dp), the tiles a tap high
      // (88, not 96) and the catch as counts at the line's head.
      const w2 = (side - 12) / 2, at = (st) => {
        const foot = sy + g + 2 * st + 12;
        return { st, foot, taken: underLeft(sx + g, foot + BACK_GAP, sy + sh - g - TAP - 12, side) };
      };
      let k = at(STACK);
      if (!k.taken) { k = at(TAP); L.countsIn = true; }
      L.tiles = [[sx + g, sy + g, w2, k.st, 'back'], [sx + g + w2 + 12, sy + g, w2, k.st, 'gear'],
                 [sx + g, sy + g + k.st + 12, side, k.st, 'restart']];
      L.taken = k.taken;
      const top = L.taken ? L.taken.r[1] + L.taken.r[3] + 12 : k.foot + BACK_GAP;
      L.line = [sx + g, top, side, sy + sh - g - top];
      L.tap = L.line[3];
      L.spare = L.line[3] - TAP;
      L.lineRows = Math.max(1, Math.floor((L.line[3] - 16 - (L.countsIn ? 26 : 0)) / 31));
    } else {
      // The column as built; the line in the catch's place, as tall as the room under the
      // column (a tap at most), as wide as the left side, the catch as counts in it. Its
      // tap runs on to the safe area's foot through the bottom margin.
      L.back = [sx + g, sy + g, side, TAP];
      L.panel = [sx + g, sy + g + TAP + BACK_GAP, side, builtFoot - (sy + g + TAP + BACK_GAP)];
      const y = builtFoot + BACK_GAP;
      L.line = [sx + g, y, edge - (sx + g), Math.min(TAP, L.roomBuilt)];
      L.tap = sy + sh - y;
      // On the 3D board the left side is only the column's width, too narrow for the
      // counts: the catch goes to corners_in's fallback, a line at the top between the
      // panels, the board shrinking under it.
      if (raised) {
        const x0 = sx + g + side + g;
        L.bar = [x0, sy + g, L.play[0] - g - x0, 26 + 16];
        L.board3 = [L.board3[0], L.board3[1] + 42 + 12, L.board3[2], L.board3[3] - 54];
      }
    }
    // The sheet: from the screen's left edge to the board's edge (the 3D column's), top to
    // bottom; inside it, the safe area less 16 dp: its head a tap, the moves, the foot.
    L.sheet = [0, 0, (raised ? sx + g + side + 12 : L.board[0] - 12), H];
    L.sheetIn = [sx + 16, sy + 12, L.sheet[2] - sx - 32, sh - 24];
    L.sheetRows = Math.floor((L.sheetIn[3] - TAP - 36 - 76) / ROW);
    // Under five rows (the iPhone), the foot's two sides on one line.
    if (L.sheetRows < 5) { L.oneFoot = true; L.sheetRows = Math.floor((L.sheetIn[3] - TAP - 36 - 42) / ROW); }
    return L;
  }

  // The iPhone's notch and home indicator, and the safe area dashed, over any screen.
  function deviceMarks(dev, land, skipSafe) {
    const [l, t, r, b] = insetsOf(dev, land);
    let s = '';
    if (dev === 'iphone') s += land
      ? `<div class="cut" style="left:0;top:${H / 2 - 80}px;width:30px;height:160px;border-radius:0 20px 20px 0"></div>` +
        `<div class="gbar" style="left:${W / 2 - 70}px;width:140px;top:${H - 9}px"></div>`
      : `<div class="cut" style="left:${W / 2 - 80}px;top:0;width:160px;height:32px;border-radius:0 0 20px 20px"></div>` +
        `<div class="gbar" style="left:${W / 2 - 67}px;width:134px;top:${H - 13}px"></div>`;
    if (dev === 'pixel' && !land) s += `<div class="cut" style="left:${W / 2 - 11}px;top:${t / 2 - 11}px;width:22px;height:22px;border-radius:50%"></div>` +
      `<div class="gbar" style="left:${W / 2 - 60}px;top:${H - b / 2 - 2}px"></div>`;
    if (dev !== 'none' && !skipSafe) s += `<div class="safe" style="left:${l}px;top:${t}px;width:${W - l - r}px;height:${H - t - b}px"></div>`;
    return s;
  }

  // Take d's screen: the device's insets drawn (its cutout, its gesture bar, the safe area
  // dashed), the panels, the line or the sheet, and the board, flat or 3D.
  function takeD(ctx) {
    const { pos, tookW, tookB, withMarks, turn, hint, undo, eye } = ctx;
    const L = dLayout(W, H, device, fit, three);
    const [il, , ir, ib] = L.ins;
    let html = '';
    if (device === 'pixel') html += `<div class="cut" style="left:${il / 2 - 11}px;top:${H / 2 - 11}px;width:22px;height:22px;border-radius:50%"></div>` +
      `<div class="gbar" style="left:${il + (W - il - ir) / 2 - 60}px;top:${H - ib / 2 - 2}px"></div>`;
    if (device === 'a33') html += `<div class="cut" style="left:0;top:${H / 2 - 16}px;width:${il * 0.6}px;height:32px;border-radius:0 18px 18px 0"></div>`;
    html += deviceMarks(device, true);
    if (fit === 'row') {
      const word = { back: T.back, gear: T.settings, restart: T.restart };
      for (const [x, y, w, h, ic] of L.tiles) html += box([x, y, w, h], 'button glass dtile', `${icon(ic)}<span>${word[ic]}</span>`);
      if (L.taken) html += box(L.taken.r, 'taken glass', L.taken.two
        ? `<div class="caprow">${catchOf('white', tookB, L.taken.d)}</div><div class="caprow">${catchOf('black', tookW, L.taken.d)}</div>`
        : `<div class="caprow">${catchOf('white', tookB, L.taken.d)}<span style="width:10px"></span>${catchOf('black', tookW, L.taken.d)}</div>`, 'padding:8px 16px');
    } else {
      html += box(L.back, 'button glass back', `${icon('back')}<span>${T.back}</span>`);
      html += box(L.panel, 'panel glass', `${tile('gear', T.settings)}<div class="space"></div>${tile('restart', T.restart)}`);
    }
    // The line: the last move, its number, its mark, and the chevron (slim: the catch as counts).
    const i = shown - 1, no = Math.floor(i / 2) + 1;
    const last = `<span class="n num">${i % 2 ? `${no}…` : `${no}.`}</span><span class="mv num">${PLIES[i].m}${withMarks ? glyph(PLIES[i].k) : ''}</span>`;
    const counts = fit === 'slim' && !L.bar ? `<span class="cnt num">${dot('white')}${tookB}<span style="width:6px"></span>${dot('black')}${tookW}</span>` : '';
    if (!open && fit === 'row') {
      // The last rows of the moves, the newest at the foot, the older fading out above it.
      let rows = '';
      const first = Math.max(0, (Math.floor(i / 2) - L.lineRows + 1) * 2);
      for (let k = first; k <= i; k += 2) {
        const cell = (j) => j <= i ? `<span class="mv${j === i ? ' lit' : ''}">${PLIES[j].m}${withMarks ? glyph(PLIES[j].k) : ''}</span>` : '<span></span>';
        rows += `<div class="mrow num"><span class="n">${k / 2 + 1}</span>${cell(k)}${cell(k + 1)}</div>`;
      }
      const cin = L.countsIn ? `<span class="dcnt num">${dot('white')}${tookB}<span style="width:8px"></span>${dot('black')}${tookW}</span>` : '';
      html += box(L.line, `button glass dlist${L.countsIn ? ' cin' : ''}`, `${cin}<div class="drows">${rows}</div><span class="chev">${icon('fwd')}</span>`);
    } else if (!open) {
      html += box(L.line, 'button glass dline', `${last}${counts}<span class="chev">${icon('fwd')}</span>`);
      if (L.tap > L.line[3] + 0.5) html += box([L.line[0], L.line[1], L.line[2], L.tap], 'safe', '', 'position:absolute;border-color:rgb(255 210 120 / 0.55);border-radius:14px');
    }
    html += box(L.play, 'playp glass', `<div class="spot"><div class="piece ${turn === 'w' ? 'white' : 'black'}"></div>${eye}</div>` +
      `<div class="words">${T.turn[turn]}</div><div class="space" style="flex:1"></div><div class="duo">${hint}${undo}</div>`);
    if (L.bar) html += box(L.bar, 'taken glass', `<div class="caprow" style="justify-content:space-between">${catchOf('white', tookB, 26)}${catchOf('black', tookW, 26)}</div>`, 'padding:8px 16px');
    if (three) {
      const fb = ['view', 'zoom', 'showcase'].map((k, j) =>
        `<span class="at" style="left:${j * 56}px;top:0;width:48px;height:48px;display:grid;place-items:center"><i style="width:40px;height:40px;border-radius:50%;background:var(--button);box-shadow:inset 0 0 0 1px rgb(255 255 255 / 0.15)"></i></span>`).join('');
      html += box(L.buttons, '', fb);
    }
    if (open) {
      const [sx0, sy0, sw0, sh0] = L.sheetIn;
      html += box(L.sheet, 'glass dsheet', `<div style="position:absolute;left:${sx0}px;top:${sy0}px;width:${sw0}px;height:${sh0}px;display:flex;flex-direction:column">` +
        `<div class="dhead">${icon('prev')}<span>${T.moves}</span></div>` +
        `<div class="moves">${movesInner(shown, shown - 1, withMarks, withMarks, { one: L.oneFoot })}</div></div>`);
    }
    const n = (v) => Math.round(v);
    const where = `${DEVNAME[device]}, safe ${n(L.safe[2])} × ${n(L.safe[3])} dp`;
    let msg = `take d, ${fit}, ${where}: the built column leaves ${n(L.roomBuilt)} dp under it; `;
    if (open) msg += `the sheet ${n(L.sheet[2])} dp wide, ${L.sheetRows} rows, the board whole`;
    else if (fit === 'row') msg += `the column ${n(L.tiles[2][1] + L.tiles[2][3] - L.tiles[0][1])}, the catch ${L.taken ? `${n(L.taken.r[3])} dp (${L.taken.two ? 'two rows' : 'one line'})` : 'as counts in the line'}, the moves ${n(L.line[3])} dp at the foot, ${L.lineRows} rows, the board ${n(L.board[2])}`;
    else msg += `the line ${n(L.line[3])} dp tall${L.line[3] < TAP ? ` (${n(TAP - L.line[3])} under a tap)` : ''}, its tap ${n(L.tap)} to the safe foot, ${n(L.line[2])} wide`;
    return { html, br: L.board, b3: three ? L.board3 : null, note: msg };
  }

  // Take d on a phone in portrait (task 078's A): the portrait game as built (the bar of
  // three tiles and the catch, 172 dp; the board; the play row, 204) with the last move
  // in one of two places, a tap of 88 dp that opens the moves as a sheet from the foot:
  //   port=strip  a strip under the play row, 56 dp, the last moves on one line, the
  //               newest at the right by the chevron; its tap runs 8 dp up into the gap
  //               and on into the bottom margin. It costs the board only what the
  //               screen's slack doesn't hold.
  //   port=bar    in the bar's second row, between what each side has taken: no height
  //               of its own, its tap from the tiles' foot to the board's top (92 dp).
  // The sheet (&open=1) rises from the foot to the board's middle, a dim scrim above it;
  // its head, the scrim, or the line closes it.
  function takeP(ctx) {
    const { tookW, tookB, withMarks, turn, hint, undo, eye } = ctx;
    const [l, t, r, b] = insetsOf(device, false);
    const sx = l, sy = t, sw = W - l - r, sh = H - t - b, g = 24, top = 172, bottom = 204, w = sw - 2 * g;
    const STRIP = 56, SGAP = 8, strip = port === 'strip';
    const room = sh - 2 * g - top - g - g - bottom;
    const full = Math.min(w, room);
    const B = strip ? Math.min(w, room - SGAP - STRIP) : full;
    const total = top + g + B + g + bottom + (strip ? SGAP + STRIP : 0);
    const y0 = sy + (sh - total) / 2;
    const i = shown - 1, no = Math.floor(i / 2) + 1;
    const last = `<span class="n num">${i % 2 ? `${no}…` : `${no}.`}</span><span class="mv num">${PLIES[i].m}${withMarks ? glyph(PLIES[i].k) : ''}</span>`;
    let html = deviceMarks(device, false), tapR;
    const bx = sx + g;
    if (strip) {
      html += box([bx, y0, w, top], 'bar glass',
        `<a class="row button back" href="#">${icon('back')}<span>${T.back}</span></a>${tile('gear', T.settings)}${tile('restart', T.restart)}` +
        `<div class="caprow" style="grid-column:1/3">${catchOf('black', tookW, 32)}</div><div class="caprow end">${catchOf('white', tookB, 32)}</div>`);
    } else {
      // The catch beside the line: as pieces where both fit beside it, else as counts.
      const inner = w - 40, lineW = 176, pw = (k) => (k ? 32 + (k - 1) * 32 * 0.52 : 0);
      const pieces = pw(tookW) + pw(tookB) + lineW + 24 <= inner;
      const cw = (c, k) => pieces ? catchOf(c, k, 32) : `<span class="pcnt num">${dot(c)}${k}</span>`;
      html += box([bx, y0, w, top], 'bar glass',
        `<a class="row button back" href="#">${icon('back')}<span>${T.back}</span></a>${tile('gear', T.settings)}${tile('restart', T.restart)}` +
        `<div class="caprow pbar" style="grid-column:1/4">${cw('black', tookW)}<span class="pline">${last}<span class="chev">${icon(open ? 'down' : 'up')}</span></span>${cw('white', tookB)}</div>`);
      // The tap: the row's width less the catches, from under the tiles to the board.
      tapR = [bx + 20 + inner / 2 - lineW / 2 - 12, y0 + 16 + 88, lineW + 24, top - 104 + g];
    }
    const br = [sx + (sw - B) / 2, y0 + top + g, B, B];
    const py = br[1] + B + g;
    html += box([bx, py, w, bottom], 'prow glass',
      `<div class="turnline"><div class="piece ${turn === 'w' ? 'white' : 'black'}"></div><span style="font-size:24px">${T.turn[turn]}</span>${eye}</div>` +
      `<div class="duo short">${hint}${undo}</div>`);
    if (strip) {
      let s = '';
      const from = Math.max(0, shown - 8 - (shown % 2));
      for (let j = from; j < shown; j++) {
        if (j % 2 === 0) s += `<span class="n">${j / 2 + 1}.</span>`;
        s += `<span class="mv${j === shown - 1 ? ' lit' : ''}">${PLIES[j].m}${withMarks ? glyph(PLIES[j].k) : ''}</span>`;
      }
      const sy0 = py + bottom + SGAP;
      html += box([bx, sy0, w, STRIP], 'strip glass num pstrip', `<span class="sline">${s}</span><span class="chev">${icon(open ? 'down' : 'up')}</span>`);
      tapR = [bx, sy0 - SGAP, w, Math.min(STRIP + SGAP + g, sy + sh - (sy0 - SGAP))];
    }
    if (!open) html += box(tapR, 'safe', '', 'position:absolute;border-color:rgb(255 210 120 / 0.55);border-radius:14px');
    let rows = 0;
    if (open) {
      const top0 = br[1] + B / 2, ih = sy + sh - 12 - (top0 + 8);
      rows = Math.floor((ih - TAP - 36 - 76) / ROW);
      html += `<div class="scrim at" style="left:0;top:0;width:${W}px;height:${top0}px"></div>`;
      html += box([0, top0, W, H - top0 + 40], 'glass psheet', `<div style="position:absolute;left:${sx + 16}px;top:8px;width:${sw - 32}px;height:${ih}px;display:flex;flex-direction:column">` +
        `<div class="dhead">${icon('down')}<span>${T.moves}</span></div>` +
        `<div class="moves">${movesInner(shown, shown - 1, withMarks)}</div></div>`);
    }
    const n = (v) => Math.round(v);
    let msg = `portrait, ${port}, ${DEVNAME[device]}, safe ${n(sw)} × ${n(sh)} dp: `;
    if (open) msg += `the sheet from the board's middle, ${rows} rows`;
    else msg += `the board ${n(B)} dp (${n(full)} without the line; ${n(Math.min(w, room))} is its room), the tap ${n(tapR[2])} × ${n(tapR[3])}`;
    return { html, br, note: msg };
  }

  // A 3D board's CSS stand-in fitted into r, its near edge on r's foot (game-captured.html's).
  function fit3d(r) {
    const el = document.getElementById('board'), wrap = document.getElementById('wrap3');
    el.style.transform = 'perspective(170cqw) rotateX(40deg)';
    const r0 = el.getBoundingClientRect();
    const k = Math.min(r[2] / r0.width, r[3] / (r0.height * 1.04));
    wrap.style.width = `${1000 * k}px`;
    const r1 = el.getBoundingClientRect();
    wrap.style.left = `${r[0] + (r[2] - r1.width) / 2 - r1.left}px`;
    wrap.style.top = `${r[1] + r[3] - r1.height * 1.04 - r1.top}px`;
  }

  // &grid: both fits, closed and open, on both phones, each a frame of this page at
  // 1066 × 480 dp, a caption giving the room.
  function dGrid() {
    document.body.classList.add('sheet-body');
    const s = Math.min(0.62, (innerWidth - 60) / 2 / 1066);
    const n = (v) => Math.round(v);
    let rows = '';
    for (const dev of ['pixel', 'a33', 'iphone']) for (const f of (dev === 'iphone' ? ['row'] : ['row', 'slim'])) {
      const fw = dev === 'iphone' ? 812 : 1066, fh = dev === 'iphone' ? 375 : 480;
      const L = dLayout(fw, fh, dev, f, three);
      const cap = f === 'row'
        ? `the catch ${L.taken ? `${n(L.taken.r[3])} dp, ${L.taken.two ? 'two rows' : 'one line'}` : 'as counts in the line'}; under it the moves, ${n(L.line[3])} dp, ${L.lineRows} rows`
        : `the line ${n(L.line[3])} dp${L.line[3] < TAP ? `, ${n(TAP - L.line[3])} under a tap` : ''}; its tap ${n(L.tap)} to the safe foot`;
      let pair = '';
      for (const o of ['0', '1']) {
        const q = new URLSearchParams(P); q.delete('grid'); q.set('device', dev); q.set('fit', f); q.set('open', o); q.set('bare', '1');
        const u = `history.html?${q}`;
        pair += `<div class="shot"><div>${DEVNAME[dev]}, ${f}, ${o === '1' ? `open: the sheet ${n(L.sheet[2])} dp, ${L.sheetRows} rows` : `closed: ${cap}`} · <a href="${u.replace('&bare=1', '')}" target="_blank">open</a></div>` +
          `<div class="fr" style="width:${n(fw * s)}px;height:${n(fh * s)}px"><iframe src="${u}" width="${fw}" height="${fh}" style="transform:scale(${s})"></iframe></div></div>`;
      }

    const q3 = new URLSearchParams(P); q3.set('board', three ? 'flat' : '3d');
    document.getElementById('app').className = 'dgrid';
    document.getElementById('app').style.position = 'static';
    document.getElementById('app').innerHTML = `<h1>Take d: the moves on a phone in landscape, ${three ? '3D' : 'flat'} board</h1>` +
      `<p>1066 × 480 dp. Under the left column as built (336 dp) the Pixel 7a has ${n(dLayout(1066, 480, 'pixel', 'slim', three).roomBuilt)} dp and the A33 ${n(dLayout(1066, 480, 'a33', 'slim', three).roomBuilt)}: no tap-high line fits there beside what each side has taken. ` +
      `row: back and settings side by side free 132 dp, so the catch fits under them and the moves at the foot, a tap or more, their last rows showing, the older faded. slim: the column kept, the line takes the catch's place at the room's height, the catch as counts in it. ` +
      `<a style="color:#9cf" href="?${q3}">${three ? 'Flat' : '3D'} board</a></p>${rows}`;
  }

  function gameScreen() {
    document.body.insertAdjacentHTML('afterbegin', '<div class="bgl"></div>');
    const pos = at(shown);
    const tookW = 20 - pos.black.length, tookB = 20 - pos.white.length;
    const panelOn = marks !== 'hidden';
    const withMarks = marks === 'on';
    const turn = shown % 2 ? 'b' : 'w';
    const hint = `<button class="row button">${icon('hint')}<span>${T.hint}</span><span class="pips"><i></i><i></i><i></i></span></button>`;
    const undo = `<button class="row button">${icon('undo')}<span>${T.undo}</span></button>`;
    const eye = `<button class="eye" aria-label="${T.lookout}">${icon('eye')}</button>`;
    let html = '', B, br, b3 = null;
    if (landscape && take === 'd' && phone && panelOn) {
      const d = takeD({ pos, tookW, tookB, withMarks, turn, hint, undo, eye });
      html = d.html; br = d.br; b3 = d.b3; note = d.note;
    } else if (!landscape && take === 'd' && phone && panelOn) {
      const d = takeP({ tookW, tookB, withMarks, turn, hint, undo, eye });
      html = d.html; br = d.br; note = d.note;
    } else if (landscape) {
      if (take === 'd') note = 'take d is a phone\'s in landscape; here as take a. ';
      // panel.goose's flat_corners: the board a square of the height less the margins,
      // centered; the corner panels 232 dp (192 on a phone), the left 336 tall with back,
      // the play 352 (368 on a phone).
      const g = 24, side = phone ? 192 : 232, playH = Math.min(phone ? 368 : 352, H - 2 * g);
      B = H - 2 * g;
      br = [(W - B) / 2, g, B, B];
      const left = Math.min(336, H - 2 * g);
      html += box([g, g, side, 88], 'button glass back', `${icon('back')}<span>${T.back}</span>`);
      html += box([g, g + 100, side, left - 100], 'panel glass', `${tile('gear', T.settings)}<div class="space"></div>${tile('restart', T.restart)}`);
      // What each side has taken, on its glass under the left panel (two rows, 32 dp pieces).
      const d = phone ? 26 : 32, takenY = g + left + 12, takenH = 2.3 * d + 28;
      const takenFits = takenY + takenH <= H - g && tookW + tookB > 0;
      if (takenFits) html += box([g, takenY, side, takenH], 'taken glass',
        `<div class="caprow">${catchOf('white', tookB, d)}</div><div class="caprow">${catchOf('black', tookW, d)}</div>`);
      const play = (list) => `<div class="spot"><div class="piece ${turn === 'w' ? 'white' : 'black'}"></div>${eye}</div>` +
        `<div class="words">${T.turn[turn]}</div>${list || '<div class="space" style="flex:1"></div>'}<div class="duo">${hint}${undo}</div>`;
      const right = W - g - side;
      const ROWS = (h) => Math.floor((h - 24 - 36 - (withMarks ? 74 : 0)) / 31);
      html += box([right, g, side, playH], 'playp glass', play());
      if (panelOn) {
        const y = g + playH + 12, h = H - g - y;
        if (ROWS(h) >= 4) {
          html += box([right, y, side, h], 'moves glass', movesInner(shown, shown - 1, withMarks));
          note += `take a: the panel ${Math.round(h)} dp tall, ${ROWS(h)} rows`;
        } else {
          note += `Moves panel hidden: ${Math.round(h)} dp under the play panel, under four rows`;
        }
      }
    } else {
      // Portrait: the bar (three tiles and the taken row, 172 dp), the board, the play
      // (whose turn and the eye, hint and undo halves, 204 dp), and, where it costs the
      // board under 5%, a strip of the last moves under the play.
      const g = 24, top = 172, bottom = 204, w = W - 2 * g, stripH = 56;
      const room = H - 2 * g - top - g - g - bottom;
      const full = Math.min(w, room);
      const withStrip = Math.min(w, room - 12 - stripH);
      const strip = panelOn && withStrip >= 0.95 * full;
      B = strip ? withStrip : full;
      const total = top + g + B + g + bottom + (strip ? 12 + stripH : 0);
      const y0 = (H - total) / 2;
      html += box([g, y0, w, top], 'bar glass',
        `<a class="row button back" href="#">${icon('back')}<span>${T.back}</span></a>${tile('gear', T.settings)}${tile('restart', T.restart)}` +
        `<div class="caprow" style="grid-column:1/3">${catchOf('black', tookW, 32)}</div><div class="caprow end">${catchOf('white', tookB, 32)}</div>`);
      br = [(W - B) / 2, y0 + top + g, B, B];
      const py = y0 + top + g + B + g;
      html += box([g, py, w, bottom], 'prow glass',
        `<div class="turnline"><div class="piece ${turn === 'w' ? 'white' : 'black'}"></div><span style="font-size:24px">${T.turn[turn]}</span>${eye}</div>` +
        `<div class="duo short">${hint}${undo}</div>`);
      if (strip) {
        let s = '';
        const from = Math.max(0, shown - 8 - (shown % 2));
        for (let i = from; i < shown; i++) {
          if (i % 2 === 0) s += `<span class="n">${i / 2 + 1}.</span>`;
          s += `<span class="mv${i === shown - 1 ? ' lit' : ''}">${PLIES[i].m}${withMarks ? glyph(PLIES[i].k) : ''}</span>`;
        }
        html += box([g, py + bottom + 12, w, stripH], 'strip glass num', s);
        note = `portrait: a strip of the last moves, the board ${Math.round(B)} dp (${Math.round(full)} without it)`;
      } else if (panelOn) note = `portrait: no strip, it would cost the board over 5% (${Math.round(full)} to ${Math.round(withStrip)} dp)`;
    }
    if (b3) html += '<div id="wrap3" class="at" style="left:0;top:0;width:1000px;container-type:inline-size"><div id="board" style="width:100%"></div></div>';
    else html += box(br, '', '<div id="board" style="width:100%"></div>');
    document.getElementById('app').innerHTML = html;
    Draughts.board(document.getElementById('board'), { ...pos, view: b3 ? '3d' : '2d' });
    if (b3) fit3d(b3);
  }

  // The player's games: the rating per draughts with its last games, the computer's levels
  // won, drawn, lost, and the games, newest first; one opens its replay.
  const RATINGS = [812, 830, 822, 851, 868, 860, 884, 902, 896, 921, 940, 958, 949, 972, 990, 1004, 997, 1021, 1031, 1043];
  const res = (r) => `<span class="res ${r}">${icon(r === 'won' ? 'crown' : r === 'drawn' ? 'half' : 'ring')}</span>`;
  const GAMES = [
    ['won', 'medium', 1050, 'w', `${T.today} 18:40`, +12, 0],
    ['lost', 'medium', 1050, 'w', `${T.today} 18:05`, -8, 1],
    ['won', 'easy', 590, 'b', `${T.today} 17:30`, +2, 0],
    ['drawn', 'medium', 1050, 'b', `${T.yesterday} 19:12`, +1, 0],
    ['won', null, 0, 'w', `${T.yesterday} 18:20`, 0, 2],
    ['lost', 'hard', 1500, 'w', '9.11.', -3, 3],
    ['won', 'medium', 1050, 'b', '9.11.', +24, 1],
    ['won', 'easy', 590, 'w', '8.11.', +3, 0],
  ];
  function gamesScreen() {
    const lo = 780, hi = 1060, sw = 360, sh = 76;

      `<span class="c">${res('won')}${w}</span><span class="c">${res('drawn')}${d}</span><span class="c">${res('lost')}${l}</span></div>`;
    const rows = GAMES.map(([r, lvl, rr, side, when, chg, bl], i) => `<a class="grow${i === 1 ? ' on' : ''}" href="?${new URLSearchParams({ ...Object.fromEntries(P), view: 'replay' })}">${res(r)}` +
      `<span class="who"><span>${lvl ? `${T[lvl]} · ${rr}` : T.friend}</span><small>${when}</small></span>` +
      `<span class="side">${dot(side === 'w' ? 'white' : 'black')}</span>` +

    const dr = (k, r, on) => `<button class="tile${on ? ' on' : ''}">${T[k]}<small class="num">${r}</small></button>`;
    document.getElementById('app').innerHTML = `<div class="page">
      <div class="top"><a class="button glass back" href="?${new URLSearchParams({ ...Object.fromEntries(P), view: 'entry' })}">${icon('back')}<span>${T.back}</span></a>

        <div class="end glass" style="--r:20px;padding:0">${dr('intl', 1043, true)}${dr('brazilian', 862)}${dr('russian', 800)}</div></div>
      <div class="gbody">
        <section class="card glass stats"><div class="rate"><h2>${T.rating} · ${T.intl}</h2>
          <div class="rating num"><span class="big">1043</span><span class="delta">+12</span><span class="of">${T.last20}</span></div>${spark}</div>
          <div class="levels"><h2>${T.vsComputer}</h2>${lvRow('easy', 590, 14, 2, 1)}${lvRow('medium', 1050, 6, 2, 5)}${lvRow('hard', 1500, 0, 1, 4)}</div></section>
        <section class="card glass list"><h2 class="lhead">${T.recent} · ${T.games_n(35)}<span class="lkey"><i class="mk q2">??</i> ${R.blunders}</span></h2><div class="scroll">${rows}</div></section>
      </div></div>`;
  }

  // A past game (task 078's C), opened from its row on the results screen: the board at a
  // move beside the whole list, to step through and nothing else. Its head says it is a
  // replay that counts for nothing (it doesn't become the game to continue, and the
  // results and rating keep what the game gave when it ended); the board takes no moves.
  //   Landscape: the steps a column of four taps at the board's left (to the start, back,
  //   on, to the end), the board the height less the margins, at its right back and the
  //   title, then the game (the result, the opponent, the date, the rating it moved) and
  //   what the move shown was, over the list (tall) or beside it (a phone).
  //   Portrait: back and the title, the board, the steps a row under it, then the move
  //   shown and the list.
  // The list's rows are taps (a move jumps the board there): 34 dp, under the 88 dp rule,
  // as a miss shows the neighbouring move, which the steps put right. Each side's
  // accuracy heads its column. &ply=0..110 the move shown (0 the start).
  let ply = Math.max(0, Math.min(PLIES.length, +(P.get('ply') ?? 39)));
  function nowLine(p) {
    if (!p) return `<span class="nw">${R.start}</span>`;
    const j = p - 1, no = Math.floor(j / 2) + 1, k = PLIES[j].k, mk = shownMark(k);
    const said = mk ? `<b>${MARKS[mk].name}:</b> ${MARKS[mk].says.replace(/^./, (c) => c.toLowerCase())}` : k === '=' ? R.only : R.good;
    return `${dot(j % 2 ? 'black' : 'white')}<span class="nw"><span class="num">${no}${j % 2 ? '…' : '.'} ${PLIES[j].m}</span>${glyph(k)} <span class="said">${said}</span></span>`;
  }
  function replayScreen() {
    document.body.insertAdjacentHTML('afterbegin', '<div class="bgl"></div>');
    const n = PLIES.length, g = 24, STEP = 88;
    const [l, t, r, b] = insetsOf(device, landscape);
    const sx = l, sy = t, sw = W - l - r, sh = H - t - b;
    const stepBtn = (k, ic) => `<button class="button" data-step="${k}">${icon(ic)}</button>`;
    const steps = stepBtn('start', 'first') + stepBtn(-1, 'prev') + stepBtn(1, 'fwd') + stepBtn('end', 'last');
    const backTo = `?${new URLSearchParams({ ...Object.fromEntries(P), view: 'games', ply: '' })}`.replace('&ply=', '');
    // The head: back, the title with its "doesn't count" pill, and under them what the
    // game was (where no card of its own says so, the phones) or what a replay is.
    const pill = `<span class="pill">${R.noCount}</span>`;
    const head = (sub) => `<a class="button back" href="${backTo}">${icon('back')}<span>${T.back}</span></a>` +
      `<span class="rtitle"><span class="rname">${icon('replay')}${R.replay}${sub ? pill : ''}</span><small>${sub || pill}</small></span>`;
    const short = `${res('lost')}${R.lostTo} ${T.medium} · 1050 · ${T.today}`;
    const game = `<div class="rgame"><div class="result">${res('lost')}<span><span>${R.lostTo} ${T.medium} · 1050</span>` +
      `<small>${T.today} 18:05 · ${R.moves55} · ${R.as} ${dot('white')}</small></span></div>` +
      `<div class="rrate num">${R.ratingThen} 1031 → 1023 (−8)</div></div>`;
    const now = `<div class="rnow">${nowLine(ply)}</div>`;
    const list = (cls) => box(cls.r, `moves glass rlist ${cls.c || ''}`, movesInner(n, ply - 1, true, false, { acc: true, tap: true }));
    let html = deviceMarks(device, landscape), br;
    if (landscape) {
      const B = sh - 2 * g;
      const stx = sx + g, bx = stx + STEP + 12, colX = bx + B + g, colW = sx + sw - g - colX, colH = B;
      const gap = Math.min(16, (B - 4 * STEP) / 3), sy0 = sy + g + (B - 4 * STEP - 3 * gap) / 2;
      html += box([stx, sy0, STEP, 4 * STEP + 3 * gap], 'rsteps col', steps, `gap:${gap}px`);
      br = [bx, sy + g, B, B];
      const tall = colH >= 560;
      html += box([colX, sy + g, colW, 88], 'rhead', head(tall ? '' : short));
      const y = sy + g + 88 + 12, rest = colH - 100;
      if (tall) {
        const infoH = 186;
        html += box([colX, y, colW, infoH], 'glass rinfo', game + now);
        html += list({ r: [colX, y + infoH + 12, colW, rest - infoH - 12] });
        note = `replay, landscape, ${DEVNAME[device]}: the board ${Math.round(B)} dp, the list ${Math.round(colW)} × ${Math.round(rest - infoH - 12)}`;
      } else {
        html += box([colX, y, colW, rest], 'glass rinfo port', `${now}<div class="moves">${movesInner(n, ply - 1, true, false, { acc: true, tap: true })}</div>`);
        note = `replay, landscape, ${DEVNAME[device]}: the board ${Math.round(B)} dp, the list ${Math.round(colW)} × ${Math.round(rest)}, the game in the head`;
      }
    } else {
      const w = sw - 2 * g, minList = 300;
      const B = Math.min(w, sh - 2 * g - 88 - 12 - 12 - STEP - 12 - minList);
      const y0 = sy + g;
      html += box([sx + g, y0, w, 88], 'rhead', head(short));
      br = [sx + (sw - B) / 2, y0 + 100, B, B];
      const stY = br[1] + B + 12;
      html += box([sx + g, stY, w, STEP], 'rsteps row', steps);
      const ly = stY + STEP + 12;
      html += box([sx + g, ly, w, sy + sh - g - ly], 'glass rinfo port', `${now}<div class="moves">${movesInner(n, ply - 1, true, false, { acc: true, tap: true })}</div>`);
      note = `replay, portrait, ${DEVNAME[device]}: the board ${Math.round(B)} dp, the list ${Math.round(w)} × ${Math.round(sy + sh - g - ly)}`;
    }
    html += box(br, '', '<div id="board" style="width:100%"></div>', `--bw:${br[2]}px`);
    document.getElementById('app').innerHTML = html;
    drawReplay();
    document.querySelectorAll('[data-step]').forEach((bt) => bt.onclick = () => {
      const k = bt.dataset.step;
      goPly(k === 'start' ? 0 : k === 'end' ? n : ply + +k);
    });
    document.querySelectorAll('.rlist .mv, .rinfo .mv').forEach((m) => m.addEventListener('click', () => goPly(+m.dataset.ply + 1)));
    stepsState();
  }
  function goPly(p) {
    ply = Math.max(0, Math.min(PLIES.length, p));
    P.set('ply', ply); history.replaceState(null, '', `?${P}`);
    replayScreen.redraw();
  }
  function stepsState() {
    const n = PLIES.length;
    document.querySelectorAll('[data-step]').forEach((bt) => {
      const k = bt.dataset.step;
      bt.disabled = (k === 'start' || k === '-1') ? ply <= 0 : ply >= n;
    });
  }
  function drawReplay() {
    const el = document.getElementById('board');
    el.className = ''; el.innerHTML = '';
    const pos = at(ply);
    Draughts.board(el, { ...pos, view: '2d' });
    const k = ply ? PLIES[ply - 1].k : '';
    if (k && k !== '=') {
      const to = pos.last[1], x = to.charCodeAt(0) - 97, y = +to.slice(1) - 1;
      const sq = el.querySelectorAll('.sq')[(9 - y) * 10 + x];
      sq.insertAdjacentHTML('beforeend', `<span class="badge ${k === '*' ? 'best' : { '?!': 'q0', '?': 'q1', '??': 'q2' }[k]}" data-mk="${k}" data-ply="${ply - 1}">${k === '*' ? icon('star') : k}</span>`);
    }
  }
  replayScreen.redraw = () => {
    drawReplay();
    document.querySelectorAll('.mv').forEach((m) => { const j = +m.dataset.ply; m.classList.toggle('lit', j === ply - 1); m.classList.toggle('dim', j > ply - 1); });
    document.querySelectorAll('.rnow').forEach((e) => { e.innerHTML = nowLine(ply); });
    stepsState(); hideTip();
    scrollLists(); Draughts.paint();
  };

  // Settings: the app's groups, the Moves row last in Game. Where both groups don't fit
  // the height beside the board, one shows at a time behind two tabs, as on a phone.
  function settingsScreen() {
    const t = (on, label, cls = '', k, v) => `<button class="tile ${cls}${on ? ' on' : ''}"${k ? ` data-k="${k}" data-v="${v}"` : ''}>${label}</button>`;
    const setting = (name, tiles, cls = '') => `<div class="setting ${cls}"><h3>${name}</h3><div class="tiles">${tiles}</div></div>`;
    const movesRow = setting(T.moves,
      t(marks === 'hidden', `${T.off}<small>${T.offNote}</small>`, '', 'marks', 'hidden') +
      t(marks === 'off', `${T.list}<small>${T.listNote}</small>`, '', 'marks', 'off') +
      t(marks === 'on', `${T.withMarks}<small class="glyphs">${glyph('*')}${glyph('?!')}${glyph('?')}${glyph('??')}</small>`, '', 'marks', 'on'), 'new');
    const thumb = (s) => `<span class="thumb" style="background-image:url(../design/backgrounds/masters/${s}-01-2048.jpg)"></span>`;
    const game = `<section class="group glass"><h2>${icon('target')}${T.game}<small>${T.privacy}</small></h2>` +
      setting(T.draughts, t(true, `${T.intl}<small>10 × 10</small>`) + t(false, `${T.brazilian}<small>8 × 8</small>`) + t(false, `${T.russian}<small>8 × 8</small>`)) +
      setting(T.hints, t(true, T.mistakes) + t(false, T.all)) + movesRow + '</section>';
    const look = `<section class="group glass"><h2>${icon('sun')}${T.look}</h2>` +
      setting(T.theme, ['winter', 'spring', 'summer', 'autumn'].map((s) => t(Draughts.settings.season === s, `${thumb(s)}${T[s]}`, 'pic')).join('') + t(false, `<span class="thumb" style="display:grid;place-items:center">${icon('sun')}</span>${T.bydate}`, 'pic')) +
      setting(T.board, t(true, `${T.flat}<small>2D</small>`) + t(false, `${T.raised}<small>3D</small>`)) +
      setting(T.kings, t(true, T.auto) + t(false, T.crown) + t(false, T.stack)) + '</section>';
    const tab = get('tab', ['game', 'look'], 'game');
    const lang2 = `<div class="lang glass">${icon('globe')}${t(lang === 'en', 'English', '', 'lang', 'en')}${t(lang === 'et', 'Eesti', '', 'lang', 'et')}</div>`;
    const render = (tabs) => {
      const head = tabs
        ? `<div class="tabs">${['game', 'look'].map((k) => `<button class="tile glass${tab === k ? ' on' : ''}" data-k="tab" data-v="${k}">${icon(k === 'game' ? 'target' : 'sun')}${T[k]}</button>`).join('')}</div>`
        : `<h1>${T.settings}</h1>`;
      const topRow = `<div class="top"><a class="button glass back" href="#">${icon('back')}<span>${T.back}</span></a>${head}${landscape ? lang2 : `<div class="end">${lang2}</div>`}</div>`;
      document.getElementById('app').innerHTML = `<div class="page">${landscape ? '' : topRow}<div class="sbody"><div class="groups">` +
        `${landscape ? topRow : ''}${tabs ? (tab === 'game' ? game : look) : game + look}</div>` +
        `<div class="preview"><div id="board"></div>${marks !== 'hidden' && landscape && !phone ? `<div class="moves glass" style="width:232px;height:${Math.min(388, H - 160)}px">${movesInner(12, 11, marks === 'on')}</div>` : ''}</div></div></div>`;
    };
    render(false);
    const groups = document.querySelector('.groups');
    const over = groups.scrollHeight + 48 - H;
    if (landscape && over > 0) { render(true); note = `both groups would run ${over} dp past the foot with the Moves row: tabs, as on a phone`; }
    else if (landscape) note = `both groups fit, ${-over} dp to spare`;
    const pv = document.querySelector('.preview');
    const s = Math.min(pv.clientWidth - (marks !== 'hidden' && landscape && !phone ? 252 : 0), pv.clientHeight) * 0.94;
    if (landscape && phone) groups.style.overflowY = 'auto';
    const el = document.getElementById('board');
    el.style.width = `${Math.max(0, s)}px`; el.style.flex = 'none';
    Draughts.board(el, { ...at(12), view: '2d' });
    document.querySelectorAll('[data-k]').forEach((b) => b.onclick = () => { P.set(b.dataset.k, b.dataset.v); location.search = P.toString(); });
  }

  // Where the games screen is reached from: home's menu with a Games row (the rating at
  // its end).
  function entryScreen() {
    const gameRow = `<a class="item${' new'}" href="?${new URLSearchParams({ ...Object.fromEntries(P), view: 'games' })}">${icon('games')}<span>${T.games}</span><small class="num">1043</small></a>`;
    const items = `<a class="item primary" href="#">${icon('next')}<span>${T.continue}</span></a>` +
      `<a class="item" href="#">${icon('friend')}<span>${T.friend}</span></a>` +
      `<a class="item" href="#">${icon('computer')}<span>${T.computer}</span><small>${T.medium.toLowerCase()}</small></a>` +
      `<a class="item" href="#">${icon('puzzle')}<span>${T.puzzles}</span><small>23 / 64</small></a>` +
      gameRow +
      `<a class="item settings" href="#">${icon('gear')}<span>${T.settings}</span></a>`;
    // As home.goose: settings a row where the column fits, else the gear beside the
    // wordmark; where even that doesn't fit, no wordmark.
    const full = 6;
    let rows = full, withMark = true;
    const colOf = () => (withMark ? (rows < full ? 86 : 100) : 0) + rows * 88 + (rows - 1) * 2;
    if (!landscape || colOf() > H - 48) rows--;
    if (colOf() > H - 32) withMark = false;
    const colH = colOf();
    let html = `<nav class="menu glass"><div class="content"><div class="mark">${face()}<h1>${T.app}</h1></div>${items}</div></nav><div id="hboard"></div>`;
    document.getElementById('app').innerHTML = html;
    if (rows < full) {
      document.querySelector('.item.settings').remove();
      document.querySelector('.mark').insertAdjacentHTML('beforeend', `<span style="margin-left:auto;display:grid;place-items:center;width:88px;height:88px">${icon('gear').replace('<svg', '<svg style="width:40px;height:40px;stroke-width:2.4;opacity:0.85"')}</span>`);
    }
    if (!withMark) document.querySelector('.mark').style.display = 'none';
    const menu = document.querySelector('.menu'), content = menu.querySelector('.content'), board = document.getElementById('hboard');
    const put = (el, x, y, w, h) => Object.assign(el.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px` });
    let size;
    if (landscape) {
      put(menu, -32, 0, 72 + 360 + 40 + 32, H);
      menu.style.padding = '0 40px 0 104px';
      const free = 72 + 360 + 40;
      size = Math.min(0.7 * H, W - free - 80, H - 64);
      put(board, free + (W - free - size) / 2, (H - size) / 2, size, size);
      note = `home: ${rows} rows${withMark ? '' : ', no wordmark'}, the column ${colH} of ${H} dp`;
    } else {
      const sheetH = colH + 64;
      put(menu, 0, H - sheetH, W, sheetH + 32);
      menu.style.padding = '32px';
      menu.style.borderRadius = '32px 32px 0 0';
      menu.style.alignContent = 'start';
      size = Math.min(0.8 * W, 0.6 * H, H - sheetH - 80);
      put(board, (W - size) / 2, (H - sheetH - size) / 2, size, size);
      note = `home: ${rows} rows, the board ${Math.round(size)} dp`;
    }
    board.style.display = size < 128 ? 'none' : '';
    Draughts.board(board, { ...Draughts.start(10), view: '2d' });
  }

  Draughts.init();
  const gridD = view === 'game' && take === 'd' && P.has('grid');
  if (gridD) dGrid();
  else ({ game: gameScreen, settings: settingsScreen, games: gamesScreen, replay: replayScreen, entry: entryScreen })[view]();
  if (note) document.body.insertAdjacentHTML('beforeend', `<div class="note"${take === 'd' && view === 'game' ? ' style="left:50%;bottom:auto;top:4px;transform:translateX(-50%);max-width:70vw"' : ''}>${note}</div>`);
  // Take d: the line opens the sheet (landscape's line or rows, portrait's strip or the
  // bar's line), its head or the scrim closes it.
  const goOpen = (v) => () => { P.set('open', v); location.search = P.toString(); };
  document.querySelectorAll('.dline, .dlist, .pstrip, .pline').forEach((e) => e.addEventListener('click', goOpen(open ? '0' : '1')));
  document.querySelectorAll('.dhead, .scrim').forEach((e) => e.addEventListener('click', goOpen('0')));
  wireTips();
  document.title = `Draughts: history, ${view}${view === 'game' ? ` ${take}` : ''}${note ? `: ${note}` : ''}`;
  Draughts.paint();
  Draughts.syncGlass();
  scrollLists();
  requestAnimationFrame(() => { Draughts.paint(); Draughts.syncGlass(); scrollLists(); });
  addEventListener('load', () => document.fonts.ready.then(() => { scrollLists(); Draughts.syncGlass(); }));

  // A mark's tip (task 078's B), shown over the mark's move. Under the mouse, a move or a
  // count with a mark shows it while the pointer is on it. On touch, a tap on a move with
  // a mark shows it (in the game's panel or sheet, whose rows take no other tap; a
  // replay's tap jumps there, its line under the board saying the same); the next tap
  // anywhere only closes it, unless it is on another mark, which it moves to. &tip=N shows
  // ply N's (1-based) at load, &tip=foot the foot's ??, &tip=games the results' first ??.
  let tipFor = null, tipHover = false;
  function hideTip() { document.querySelector('.tip')?.remove(); tipFor = null; }
  function showTip(a, hover) {
    hideTip();
    const k = a.dataset.mk, j = +a.dataset.ply, m = MARKS[k];
    const no = Math.floor(j / 2) + 1;
    const mv = j >= 0 ? `<span class="tmv num">${dot(j % 2 ? 'black' : 'white')}${no}${j % 2 ? '…' : '.'} ${PLIES[j].m}</span>` : '';
    const chip = `<span class="tglyph ${k === '*' ? 'best' : { '?!': 'q0', '?': 'q1', '??': 'q2' }[k]}">${k === '*' ? icon('star') : k}</span>`;
    document.body.insertAdjacentHTML('beforeend', `<div class="tip glass" role="tooltip">${chip}<div class="tw"><div class="tt"><b>${j >= 0 ? m.name : m.names}</b>${mv}</div><p>${j >= 0 ? m.says : m.all}</p></div></div>`);
    const tip = document.querySelector('.tip'), ar = a.getBoundingClientRect();
    const [il, , ir] = insetsOf(device, landscape);   // kept in the safe area
    const tw = Math.min(320, W - il - ir - 24); tip.style.width = `${tw}px`;
    const th = tip.offsetHeight;
    const x = Math.max(il + 12, Math.min(W - ir - tw - 12, ar.left + ar.width / 2 - tw / 2));
    const y = ar.top - th - 10 >= 8 ? ar.top - th - 10 : ar.bottom + 10;
    tip.style.left = `${x}px`; tip.style.top = `${y}px`;
    tipFor = a; tipHover = hover;
    Draughts.syncGlass();
  }
  function wireTips() {
    const inReplay = view === 'replay';
    document.addEventListener('pointerover', (e) => {
      if (e.pointerType !== 'mouse') return;
      const a = e.target.closest('[data-mk]');
      if (a && a !== tipFor) showTip(a, true);
      else if (!a && tipFor && tipHover) hideTip();
    });
    document.addEventListener('click', (e) => {
      const a = e.target.closest('[data-mk]');
      const touchTip = a && !(inReplay && a.classList.contains('mv')) && !e.target.closest('.dlist, .pstrip, .pline');
      if (touchTip) {
        e.preventDefault(); e.stopPropagation();
        if (a === tipFor && !tipHover) hideTip(); else showTip(a, false);
      } else if (tipFor && !tipHover) {
        e.preventDefault(); e.stopPropagation(); hideTip();
      }
    }, true);
    if (tipAt) {
      const a = tipAt === 'games' ? document.querySelector('.bl[data-mk]:not(.zero)')
        : tipAt === 'foot' ? document.querySelector('.mfoot [data-mk="??"]')
        : [...document.querySelectorAll(`[data-ply="${+tipAt - 1}"][data-mk]`)].find((e) => e.offsetParent);
      if (a) setTimeout(() => {
        const l = a.closest('.mlist');
        if (l) { const r = a.getBoundingClientRect(), lr = l.getBoundingClientRect();
          if (r.top < lr.top + 20 || r.bottom > lr.bottom - 6) l.scrollTop += r.top - lr.top - lr.height / 2; }
        showTip(a, false);
      }, 500);
    }
  }

  // The takes, from the switcher (its 2D/3D view is left out: view here is the screen).
  const bar = document.querySelector('.proto-bar');
  bar.querySelector('[data-key="view"]')?.remove();
  const sel = (key, values, current) => `<select data-k="${key}" aria-label="${key}">${values.map((v) =>
    `<option${v === current ? ' selected' : ''}>${v}</option>`).join('')}</select>`;
  bar.insertAdjacentHTML('afterbegin', sel('view', ['game', 'settings', 'games', 'replay', 'entry'], view) +
    sel('take', ['a', 'd'], take) + (take === 'd' ? sel('fit', ['row', 'slim'], fit) + sel('port', ['strip', 'bar'], port) + sel('open', ['0', '1'], open ? '1' : '0') +
      sel('board', ['flat', '3d'], three ? '3d' : 'flat') : '') + sel('device', ['pixel', 'a33', 'iphone', 'none'], device) +
    sel('explain', ['pop', 'legend'], explain) +
    sel('marks', ['on', 'off', 'hidden'], marks) + sel('state', ['early', 'mid', 'late'], state) +
    sel('lang', ['en', 'et'], lang));
  document.body.insertAdjacentHTML('beforeend', '<button class="proto-fold">Options</button>');
  document.querySelector('.proto-fold').onclick = () => document.body.classList.toggle('bar-open');
  bar.querySelectorAll('select[data-k]').forEach((s) => s.onchange = (e) => {
    e.stopPropagation();
    P.set(s.dataset.k, s.value);
    location.search = P.toString();
  });
</script>
</body>
</html>

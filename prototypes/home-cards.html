<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kabe: home, cards</title>
<link rel="stylesheet" href="kabe.css">
<script src="kabe.js"></script>
<style>
  /* Take B: three solid cards like paper on the table, each with a small scene made of
     the game's own pieces instead of an icon, a title, and one line. Light cards with
     dark text: they read as things to pick up, not as windows. */
  .home { display: grid; grid-template-rows: auto 1fr; gap: 28px; height: 100%; padding: 40px 48px; }
  h1 { margin: 0; font-size: 56px; font-weight: 400; letter-spacing: 0.04em; }
  h1 small { font-size: 22px; color: var(--fg-dim); letter-spacing: 0.02em; margin-left: 16px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; align-self: center; }
  .card {
    display: grid;
    grid-template-rows: auto auto auto;
    gap: 6px;
    padding: 18px 18px 26px;
    border-radius: 28px;
    background: var(--light);
    color: color-mix(in srgb, var(--b-face), #000 35%);
    text-decoration: none;
    box-shadow: 0 2px 0 color-mix(in srgb, var(--light), #000 18%), 0 22px 40px -18px rgb(0 0 0 / 0.6);
    transition: transform 140ms;
  }
  .card:active { transform: scale(0.97); }
  .scene {
    position: relative;
    aspect-ratio: 1.25;
    border-radius: 18px;
    background: color-mix(in srgb, var(--light), #000 7%);
    container-type: inline-size;
    --u: 1cqw;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .scene .piece { inset: auto; width: 30cqw; height: 30cqw; }
  .card h2 { margin: 0; font-size: 30px; font-weight: 700; padding: 0 8px; }
  .card p { margin: 0; font-size: 18px; opacity: 0.75; padding: 0 8px; }
  .scene .robot { position: absolute; right: 12cqw; top: 22cqw; width: 34cqw; height: 34cqw; color: color-mix(in srgb, var(--b-face), #000 20%); }
  .levels { display: flex; gap: 8px; padding: 10px 8px 0; }
  .levels span { flex: 1; text-align: center; padding: 8px 0; border-radius: 12px; font-size: 16px;
    background: color-mix(in srgb, var(--light), #000 9%); }
  .levels span.on { background: var(--dark); color: var(--light); }
  .mini { position: absolute; inset: 10cqw 18cqw; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); border-radius: 3cqw; overflow: hidden; }
  .mini > div { background: var(--light); position: relative; }
  .mini > div.d { background: var(--dark); }
  .scene .mini .piece { width: auto; height: auto; inset: 11%; --u: 0.6cqw; }
  .arrow { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--glow); }
  @media (orientation: portrait) {
    .cards { grid-template-columns: 1fr; width: min(100%, 560px); justify-self: center; gap: 20px; }
    .card { grid-template-columns: 200px 1fr; grid-template-rows: auto auto 1fr; column-gap: 18px; padding: 16px; }
    .scene { grid-row: span 3; margin: 0; aspect-ratio: 1; }
    .card h2 { padding-top: 14px; }
    h1 small { display: block; margin: 6px 0 0; }
  }
</style>
</head>
<body>
<main class="home">
  <h1>Kabe <small>mängi sõbraga, õpi ülesannetest</small></h1>
  <div class="cards">
    <a class="card" href="game.html">
      <div class="scene">
        <div class="piece white" style="left: 16cqw; top: 26cqw"></div>
        <div class="piece black" style="right: 16cqw; top: 26cqw"></div>
      </div>
      <h2>Sõbraga</h2><p>Kaks mängijat, üks laud</p>
    </a>
    <a class="card" href="game.html">
      <div class="scene">
        <div class="piece white" style="left: 14cqw; top: 26cqw"></div>
        <span class="robot" data-icon="computer"></span>
      </div>
      <h2>Arvutiga</h2>
      <div class="levels"><span>Kerge</span><span class="on">Keskmine</span><span>Raske</span></div>
    </a>
    <a class="card" href="puzzles.html">
      <div class="scene">
        <div class="mini" id="mini"></div>
      </div>
      <h2>Ülesanded</h2><p>23 / 90 tähte</p>
    </a>
  </div>
</main>
<script>
  Kabe.init();
  document.querySelectorAll('.robot svg').forEach((s) => { s.style.width = '100%'; s.style.height = '100%'; });
  // A capture in three squares: white jumps the black piece.
  const cells = ['d', '', 'd', '', 'd', '', 'd', '', 'd'];
  const pieces = { 6: 'white', 4: 'black' };
  document.getElementById('mini').innerHTML = cells.map((c, i) =>
    `<div class="${c}">${pieces[i] ? `<div class="piece ${pieces[i]}"></div>` : ''}</div>`).join('') +
    '<svg class="arrow icon" viewBox="0 0 30 30"><path d="M6 25 Q 12 10 24 5" stroke-width="1.6" stroke-dasharray="2 2"/><path d="M19 5h5v5" stroke-width="1.6"/></svg>';
</script>
</body>
</html>

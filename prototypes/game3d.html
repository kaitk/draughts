<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: game around the 3D board</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* The game screen's UI around a 3D board (task 015). A WebGL canvas under the UI draws
     the board with poc/3d's camera (52.5° down, a 31° field of view, 14.75 away), only
     placed and sized: its image is scaled and shifted in clip space to fit the take's
     box, so the board's perspective is the native one at every size. Good enough for
     layout, not the native look. A drag turns it within the inspection range (yaw ±35°,
     pitch 35° to 75°); a double click resets.

     ?take=now     game.html's layout with the 3D board in its square
     ?take=steep   the same, the camera 65° down, so the board is taller in the square
     ?take=top     the board pushed to the top: one column beside it in landscape, the
                   way out and the play below it in portrait
     ?take=corners the far edge's narrowing used: the panels in the top corners beside
                   it, the board's wide near edge running under them
     ?take=bleed   the board sized by its playing field, its frame running off the
                   screen: off the sides at the near corners in portrait, off the bottom
                   in landscape (the corners take's panels)
     &pitch=       any take's camera angle
     &controls=a   the corners take's floating camera buttons (the default there): a column
                   at the right edge under the play panel, in portrait above it; b, beside
                   the board's near corners, in portrait under them; off. View: 52.5° or 74°
                   down, and the reset: off the rest angle a tap eases back to it, a gold
                   dot on the button showing that. Zoom (landscape only): the whole playing field, pieces and all,
                   grown to the largest size clear of the panels and the buttons. Showcase
                   (the hand): a mode, lit while on, in which a drag anywhere on the board
                   turns it (±35°) and tips it (35° to 80° down); it stays where it is let
                   go, and the button again only stops the dragging (play goes on at that
                   angle; View resets it; a hot-seat turn does too). The board refits as
                   the camera moves. Buttons: 56 dp (44 disc) on a tablet, 48 (40) on a
                   phone in landscape, 52 (42) in portrait.
     &pp=          portrait's camera angle on the corners take: 52.5, 60 or 65 (the default)
     The switcher's Move plays a move and turns the board 180° for the other player, as a
     hot-seat game against a friend would (0.7 s, eased).

     Sizes are dp times --k: 1 on the tablet (800 dp on the short side), 0.75 CSS px on a
     phone (gui::DENSITY_FLOOR), so 412 px across is the app's 549 dp. */
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .ui { position: fixed; inset: 0; pointer-events: none; }
  .ui > * { position: absolute; pointer-events: auto; }
  .k { --k: 1; }
  .panel { display: flex; flex-direction: column; gap: calc(12px * var(--k)); padding: calc(16px * var(--k)); }
  .panel .space { flex: 1; }
  .row { display: flex; align-items: center; justify-content: flex-start; gap: calc(12px * var(--k));
    min-width: 0; min-height: calc(88px * var(--k)); padding: 0 calc(14px * var(--k));
    font-size: calc(24px * var(--k)); text-align: left; white-space: nowrap; }
  .row.button svg { flex: none; width: calc(34px * var(--k)); height: calc(34px * var(--k)); stroke-width: 2.2; }
  /* An icon over its word, where the word doesn't fit beside it. */
  .row.tall { flex-direction: column; justify-content: center; gap: calc(4px * var(--k));
    min-height: calc(96px * var(--k)); padding: 0 calc(6px * var(--k)); font-size: calc(20px * var(--k)); }
  .row.big { flex-direction: column; justify-content: center; gap: calc(8px * var(--k));
    min-height: calc(132px * var(--k)); font-size: calc(26px * var(--k)); }
  .row.big svg { width: calc(48px * var(--k)); height: calc(48px * var(--k)); }
  .row.big.short { min-height: calc(96px * var(--k)); }
  .row.wide { flex-direction: row; justify-content: center; min-height: calc(88px * var(--k)); }
  .row.wide svg { width: calc(36px * var(--k)); height: calc(36px * var(--k)); }
  .turn { display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(18px * var(--k)); padding: calc(18px * var(--k)) 0 calc(10px * var(--k));
    text-align: center; font-size: calc(26px * var(--k)); white-space: nowrap; }
  .turn .piece { --u: calc(7px * var(--k)); position: relative; inset: auto; flex: none;
    width: calc(72px * var(--k)); height: calc(72px * var(--k));
    box-shadow: 0 0 0 calc(4px * var(--k)) color-mix(in srgb, var(--glow) 80%, transparent),
      0 0 calc(22px * var(--k)) calc(4px * var(--k)) color-mix(in srgb, var(--glow) 45%, transparent); }
  .turn.line { flex-direction: row; padding: 0 calc(6px * var(--k)); gap: calc(14px * var(--k)); }
  .turn.line .piece { width: calc(52px * var(--k)); height: calc(52px * var(--k)); --u: calc(5px * var(--k)); }
  .bar { display: grid; grid-template-columns: repeat(3, 1fr); flex-direction: row; }
  .bar .row { justify-content: center; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: calc(12px * var(--k)); }
  .pair { display: grid; grid-template-columns: auto 1fr; gap: calc(12px * var(--k)); align-items: center; }
  .tile { padding: calc(8px * var(--k)); }
  .tile .row.tall { min-height: calc(80px * var(--k)); min-width: calc(80px * var(--k)); font-size: calc(17px * var(--k)); }
  /* A floating camera button: a 48 dp target, a 40 dp disc of shade with a hairline, no
     panel; an SDF circle and a line icon natively. */
  .ctl { width: calc(var(--cb) * 1px * var(--k)); height: calc(var(--cb) * 1px * var(--k)); padding: 0; border: 0;
    background: none; display: grid; place-items: center; color: var(--fg); cursor: pointer;
    touch-action: none; -webkit-tap-highlight-color: transparent; }
  .ctl::before { content: ''; position: absolute; inset: calc((var(--cb) - var(--cd)) * 0.5px * var(--k)); border-radius: 50%;
    background: rgb(0 0 0 / 0.3); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.22), 0 2px 8px -3px rgb(0 0 0 / 0.5);
    transition: transform 120ms, background 120ms; }
  .ctl:active::before { transform: scale(0.92); background: rgb(0 0 0 / 0.42); }
  .ctl.on::before { background: color-mix(in srgb, var(--glow) 30%, rgb(0 0 0 / 0.3)); }
  .ctl svg { position: relative; width: calc(var(--cd) * 0.62px * var(--k)); height: calc(var(--cd) * 0.62px * var(--k)); stroke-width: 2.4; }
  /* The dot: the board is off its rest angle; View brings it back. */
  .ctl.dot::after { content: ''; position: absolute; width: calc(7px * var(--k)); height: calc(7px * var(--k));
    top: calc((var(--cb) - var(--cd)) * 0.5px * var(--k)); right: calc((var(--cb) - var(--cd)) * 0.5px * var(--k));
    border-radius: 50%; background: var(--glow); box-shadow: 0 0 0 calc(1.5px * var(--k)) rgb(0 0 0 / 0.55); }
  /* The switcher at the top middle here, off the corners' camera buttons. */
  .proto-bar { top: 4px; bottom: auto; right: auto; left: 50%; transform: translateX(-50%);
    flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 24px); }
  @media (orientation: portrait) { .proto-bar { top: auto; bottom: 4px; } }
  .guides .box { position: fixed; outline: 1px dashed rgb(255 255 255 / 0.5); pointer-events: none; }
</style>
</head>
<body data-screen="board" class="k">
<canvas id="gl"></canvas>
<div class="ui" id="ui"></div>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const TAKES = ['now', 'steep', 'top', 'corners', 'bleed'];
const take = TAKES.includes(params.get('take')) ? params.get('take') : 'now';
Draughts.init();
// The 3D board stands on the season's photograph blurred (task 015), whatever the view.
document.body.classList.add('scene-blur');

// The take, from the switcher.
const bar = document.querySelector('.proto-bar');
bar.insertAdjacentHTML('afterbegin', `<select aria-label="take">${TAKES.map((t) =>
  `<option${t === take ? ' selected' : ''}>${t}</option>`).join('')}</select>`);
bar.querySelector('select').onchange = (e) => {
  e.stopPropagation();
  params.set('take', e.target.value);
  location.search = params.toString();
};
// The corners take's camera controls, portrait's angle, and a move for the hot-seat turn.
const CONTROLS = take === 'corners' ? (['a', 'b', 'off'].includes(params.get('controls')) ? params.get('controls') : 'a') : 'off';
const PORTRAIT = ['52.5', '60', '65'];
const PP = PORTRAIT.includes(params.get('pp')) ? +params.get('pp') : 65;
if (take === 'corners') {
  const opt = (key, values, cur, label) => `<select data-proto="${key}" aria-label="${key}">${values.map((x) =>
    `<option value="${x}"${String(cur) === x ? ' selected' : ''}>${label(x)}</option>`).join('')}</select>`;
  bar.querySelector('select').insertAdjacentHTML('afterend',
    opt('controls', ['a', 'b', 'off'], CONTROLS, (x) => `controls ${x}`) +
    opt('pp', PORTRAIT, PP, (x) => `portrait ${x}°`) + '<button data-proto="move">Move</button>');
  bar.querySelectorAll('select[data-proto]').forEach((s) => s.onchange = (e) => {
    e.stopPropagation();
    params.set(s.dataset.proto, s.value);
    location.search = params.toString();
  });
  bar.querySelector('[data-proto=move]').onclick = () => makeMove();
}

// ---- The position: game.html's.
const POS = {
  white: ['a1', 'c1', 'e1', 'g1', 'b2', 'f2', 'h2', 'c3', 'e3', 'd4', 'h6'],
  black: ['b8', 'd8', 'f8', 'h8', 'a7', 'c7', 'b6', 'e5', 'g5'],
  kings: ['h6'], selected: 'd4', forced: ['h6'], last: ['h4', 'g5'],
};
// A square's center in poc/3d's world: a square is 1, the field -4..4, +z the near (white) side.
const at = (sq) => [sq.charCodeAt(0) - 97 - 3.5, 0, 3.5 - (+sq.slice(1) - 1)];

// ---- The camera (poc/3d/board3d.goose).
const FOV = 31, DISTANCE = 14.75, TARGET = [0, -0.15, 1.1];
const PITCH_ASKED = +params.get('pitch');
// The rest pitch, set per orientation in layout(); the top view's, picked by eye.
let PITCH = PITCH_ASKED || (take === 'steep' ? 65 : 52.5);
const TOP_PITCH = 74;
// The camera now: the view (0 at rest, 1 the top view), the zoom (0 to 1), the board's
// turn in degrees (the hot-seat turn), and the showcase's yaw and pitch on top.
const v = { top: 0, zoom: 0, turn: 0, yaw: 0, pitch: 0 };
let viewPitch = PITCH;

// ---- Small matrix helpers, column-major.
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const norm = (a) => { const l = Math.hypot(...a); return [a[0] / l, a[1] / l, a[2] / l]; };
function perspective(fovy, aspect, n, f) {
  const t = 1 / Math.tan(fovy / 2);
  return [t / aspect, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) / (n - f), -1, 0, 0, 2 * f * n / (n - f), 0];
}
function lookAt(eye, target) {
  const z = norm(sub(eye, target)), x = norm(cross([0, 1, 0], z)), y = cross(z, x);
  return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, eye), -dot(y, eye), -dot(z, eye), 1];
}
function mul(a, b) {
  const o = new Array(16).fill(0);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) for (let k = 0; k < 4; k++) o[c * 4 + r] += a[k * 4 + r] * b[c * 4 + k];
  return o;
}
const project = (m, p) => {
  const x = m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12], y = m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13];
  const w = m[3] * p[0] + m[7] * p[1] + m[11] * p[2] + m[15];
  return [x / w, y / w];
};
function eyeOf(yaw, pitch) {
  const a = yaw * Math.PI / 180, p = pitch * Math.PI / 180;
  return [TARGET[0] + Math.sin(a) * Math.cos(p) * DISTANCE, TARGET[1] + Math.sin(p) * DISTANCE,
    TARGET[2] + Math.cos(a) * Math.cos(p) * DISTANCE];
}
const viewProj = (W, H, yaw, pitch) => mul(perspective(FOV * Math.PI / 180, W / H, 2, 40), lookAt(eyeOf(yaw, pitch), TARGET));
// The board turned about its center by d degrees, and a vector turned the same way.
const rotY = (d) => { const a = d * Math.PI / 180, c = Math.cos(a), s = Math.sin(a); return [c, 0, -s, 0, 0, 1, 0, 0, s, 0, c, 0, 0, 0, 0, 1]; };
const rotV = (p, d) => { const a = d * Math.PI / 180, c = Math.cos(a), s = Math.sin(a); return [c * p[0] + s * p[2], p[1], -s * p[0] + c * p[2]]; };

// ---- Geometry (src/model3d/mesh.goose's sizes): the field -4.1..4.1 with its inlay, the frame
// 0.5 wide, its top 0.05 up, a 0.09 bullnose, the underside at -0.7; pieces 0.44 in
// radius and 0.24 high, a king a stack of two.
const INNER = 4.1, FRAME_W = 0.5, TOP = 0.05, BOTTOM = -0.7, RC = 0.05, R = 0.44, HT = 0.24;
const verts = [];
const vtx = (p, n, m, a) => verts.push(p[0], p[1], p[2], n[0], n[1], n[2], m, a[0], a[1]);
// A profile (strips of {o, y, no, ny}) swept along a path of {c, d} samples (closed).
function sweep(strips, path, mat, aux, closed) {
  const np = path.length, segs = closed ? np : np - 1;
  for (const s of strips) for (let i = 0; i + 1 < s.length; i++) for (let j = 0; j < segs; j++) {
    const A = path[j], B = path[(j + 1) % np];
    const P = (q, S) => [S.c[0] + S.d[0] * q.o, q.y, S.c[1] + S.d[1] * q.o];
    const N = (q, S) => [S.d[0] * q.no, q.ny, S.d[1] * q.no];
    const a = s[i], b = s[i + 1], ax = aux || [0, 0];
    vtx(P(a, A), N(a, A), mat, ax); vtx(P(b, A), N(b, A), mat, ax); vtx(P(b, B), N(b, B), mat, ax);
    vtx(P(a, A), N(a, A), mat, ax); vtx(P(b, B), N(b, B), mat, ax); vtx(P(a, B), N(a, B), mat, ax);
  }
}
const line = (o0, y0, o1, y1) => { const t = norm([o1 - o0, y1 - y0, 0]); return [{ o: o0, y: y0, no: t[1], ny: -t[0] }, { o: o1, y: y1, no: t[1], ny: -t[0] }]; };
function arc(co, cy, r, a0, a1, steps) {
  const out = [];
  for (let i = 0; i <= steps; i++) {
    const a = a0 + (a1 - a0) * i / steps;
    out.push({ o: co + r * Math.cos(a), y: cy + r * Math.sin(a), no: Math.cos(a), ny: Math.sin(a) });
  }
  return out;
}
function quad(x0, z0, x1, z1, y, mat, aux) {
  const n = [0, 1, 0];
  vtx([x0, y, z0], n, mat, aux); vtx([x1, y, z0], n, mat, aux); vtx([x1, y, z1], n, mat, aux);
  vtx([x0, y, z0], n, mat, aux); vtx([x1, y, z1], n, mat, aux); vtx([x0, y, z1], n, mat, aux);
}
// The frame's path: the field's outline with corners of radius RC, outward directions.
const framePath = [];
for (const [sx, sz, a0] of [[1, 1, 0], [-1, 1, 90], [-1, -1, 180], [1, -1, 270]]) {
  for (let i = 0; i <= 8; i++) {
    const a = (a0 + i * 90 / 8) * Math.PI / 180, d = [Math.cos(a), Math.sin(a)];
    framePath.push({ c: [sx * (INNER - RC) + d[0] * RC, sz * (INNER - RC) + d[1] * RC], d });
  }
}
const frameProfile = [
  [{ o: 0, y: 0, no: -1, ny: 0 }, { o: 0, y: TOP, no: -1, ny: 0 }],
  line(0, TOP, FRAME_W - 0.09, TOP).map((q) => ({ ...q, no: 0, ny: 1 })),
  arc(FRAME_W - 0.09, TOP - 0.09, 0.09, Math.PI / 2, 0, 6),
  [{ o: FRAME_W, y: TOP - 0.09, no: 1, ny: 0 }, { o: FRAME_W, y: BOTTOM, no: 1, ny: 0 }],
];
const pieceProfile = [
  arc(R - 0.04, 0.04, 0.04, -Math.PI / 2, 0, 3),
  [{ o: R, y: 0.04, no: 1, ny: 0 }, { o: R, y: HT - 0.07, no: 1, ny: 0 }],
  arc(R - 0.07, HT - 0.07, 0.07, 0, Math.PI / 2, 6),
  [{ o: R - 0.07, y: HT, no: 0, ny: 1 }, { o: 0, y: HT, no: 0, ny: 1 }],
];
const ring = (cx, cz) => {
  const p = [];
  for (let i = 0; i < 48; i++) { const a = i / 48 * 2 * Math.PI, d = [Math.cos(a), Math.sin(a)]; p.push({ c: [cx, cz], d }); }
  return p;
};
const ranges = {};
function build() {
  verts.length = 0;
  // The board's shadow on nothing, drawn first.
  quad(-7, -7, 7, 7.5, BOTTOM, 10, [0, 0]);
  ranges.floor = verts.length / 9;
  // Opaque: the field, the frame, the pieces.
  quad(-INNER, -INNER, INNER, INNER, 0, 0, [0, 0]);
  sweep(frameProfile, framePath, 1, null, true);
  const pieces = [];
  for (const side of ['white', 'black']) for (const sq of POS[side]) {
    const c = at(sq), sel = sq === POS.selected, king = POS.kings.includes(sq);
    const lift = sel ? 0.12 : 0;
    pieces.push({ c, sel, king, side });
    for (let d = 0; d < (king ? 2 : 1); d++) {
      const y0 = lift + d * (HT + 0.01);
      const strips = pieceProfile.map((s) => s.map((q) => ({ ...q, y: q.y + y0 })));
      sweep(strips, ring(c[0], c[2]), side === 'white' ? 2 : 3, [c[0], c[2]], true);
    }
  }
  ranges.opaque = verts.length / 9;
  // Over the field: each piece's soft shadow, the selection's glow ring, the forced ring.
  for (const p of pieces) {
    // Centred on the piece; the shader shifts it away from the light, which stays on screen.
    const s = [p.c[0], p.c[2]], e = 0.92;
    quad(s[0] - e, s[1] - e, s[0] + e, s[1] + e, 0.002, p.sel ? 14 : 11, s);
    if (p.sel) quad(p.c[0] - 0.7, p.c[2] - 0.7, p.c[0] + 0.7, p.c[2] + 0.7, 0.003, 12, [p.c[0], p.c[2]]);
    if (POS.forced.includes(sqOf(p.c))) quad(p.c[0] - 0.7, p.c[2] - 0.7, p.c[0] + 0.7, p.c[2] + 0.7, 0.004, 13, [p.c[0], p.c[2]]);
  }
  ranges.all = verts.length / 9;
}
function sqOf(c) { return String.fromCharCode(97 + Math.round(c[0] + 3.5)) + Math.round(4.5 - c[2]); }

// What bounds the board on screen: the frame's outline at its top and its foot, and the
// pieces' tops; for the bleed take, the field with a sliver of the frame (0.12 of 0.5).
const outline = [], field = [];
function outlines() {
  outline.length = 0; field.length = 0;
  for (const s of framePath) for (const y of [TOP, BOTTOM]) outline.push([s.c[0] + s.d[0] * FRAME_W, y, s.c[1] + s.d[1] * FRAME_W]);
  for (const s of framePath) field.push([s.c[0] + s.d[0] * 0.12, TOP, s.c[1] + s.d[1] * 0.12]);
  for (const side of ['white', 'black']) for (const sq of POS[side]) {
    const c = at(sq), top = [c[0], 2 * HT + 0.12, c[2]];
    outline.push(top); field.push(top);
  }
}
outlines();

// ---- WebGL.
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: true, alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: true });
const VS = `#version 300 es
layout(location=0) in vec3 pos; layout(location=1) in vec3 nrm; layout(location=2) in float mat; layout(location=3) in vec2 aux;
uniform mat4 vp; out vec3 vPos; out vec3 vN; flat out int vMat; out vec2 vAux;
void main() { vPos = pos; vN = nrm; vMat = int(mat + 0.5); vAux = aux; gl_Position = vp * vec4(pos, 1.0); }`;
const FS = `#version 300 es
precision highp float;
in vec3 vPos; in vec3 vN; flat in int vMat; in vec2 vAux; out vec4 o;
uniform vec3 eye, cLight, cDark, cFrame, cW, cB, cGlow, lightDir; uniform vec4 last; uniform float stone;
// The shadows' offsets away from the light, in the board's frame (the light stays on screen).
uniform vec2 floorOff, pieceOff;
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
vec3 lin(vec3 c) { return pow(c, vec3(2.2)); }
// Figure: wood drawn out along its grain, stone round.
float figure(vec2 along, float seed) {
  if (stone > 0.5) return 0.6 * noise(along * 2.2 + seed) + 0.4 * noise(along * 7.0) - 0.5;
  return 0.6 * (noise(vec2(along.x * 0.7 + seed, along.y * 22.0)) - 0.5) + 0.4 * (noise(vec2(along.x * 0.2, along.y * 3.0 + seed)) - 0.5);
}
void main() {
  vec2 p = vPos.xz;
  if (vMat >= 10) {
    float a; vec3 c = vec3(0);
    float d = length(p - vAux - (vMat == 11 || vMat == 14 ? pieceOff : vec2(0)));
    if (vMat == 10) {
      vec2 q = abs(p - floorOff) - vec2(4.6 - 0.6);
      float sd = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - 0.6;
      a = 0.6 * (1.0 - smoothstep(-0.5, 1.2, sd));
    } else if (vMat == 11) a = 0.55 * (1.0 - smoothstep(0.30, 0.62, d));

    }
    useFit(b, f, W, H);
  } else viewPitch = PITCH;
  render();
  syncDot();
}

// ---- Tweens, eased in and out, drawn only while one runs.
const tweens = {};
const ease = (u) => u < 0.5 ? 4 * u * u * u : 1 - (-2 * u + 2) ** 3 / 2;
let raf = 0;
function tween(key, to, ms, done) {
  tweens[key] = { from: v[key], to, t0: performance.now(), ms, done };
  if (!raf) raf = requestAnimationFrame(step);
}
function step(now) {
  raf = 0;
  for (const key of Object.keys(tweens)) {
    const t = tweens[key], u = Math.max(0, Math.min(1, (now - t.t0) / t.ms));
    v[key] = t.from + (t.to - t.from) * ease(u);
    if (u >= 1) { delete tweens[key]; if (t.done) t.done(); }
  }
  frame();
  if (Object.keys(tweens).length && !raf) raf = requestAnimationFrame(step);
}

// ---- The floating camera buttons.
const CTL_ICONS = {
  // The view each would go to: the board from above, or in perspective.
  top: '<rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M12 4v16M4 12h16"/>',
  low: '<path d="M7.5 5h9L21 19H3z"/><path d="M12 5v14M5.25 12h13.5"/>',
  zoomIn: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/><path d="M7.5 10.5h6M10.5 7.5v6"/>',
  zoomOut: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/><path d="M7.5 10.5h6"/>',
  // The showcase: a board in perspective on an orbit with its arrowhead.
  orbit: '<path d="M8.5 6.5h7l2 5h-11z"/><path d="M3.5 14.5c1.2 3 4.6 5 8.5 5s7.3-2 8.5-5"/><path d="m20.7 18.2-.2-3.7-3.6.8"/><path d="m3.3 18.2.2-3.7 3.6.8"/>',
};
const want = { top: false, zoom: false, orbit: false };
function controls(names, r, row) {
  const B = Math.min(r.w, r.h), step = names.length > 1 ? ((row ? r.w : r.h) - B) / (names.length - 1) : 0;
  names.forEach((n, i) => {
    const el = document.createElement('button');
    el.className = 'ctl';
    el.dataset.ctl = n;
    Object.assign(el.style, { left: `${r.x + (row ? i * step : 0)}px`, top: `${r.y + (row ? 0 : i * step)}px` });
    ui.appendChild(el);
  });
}
function syncControls() {
  const svg = (d) => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
  for (const el of ui.querySelectorAll('.ctl')) {
    const n = el.dataset.ctl;
    el.innerHTML = svg(CTL_ICONS[n === 'view' ? (want.top ? 'low' : 'top') : n === 'zoom' ? (want.zoom ? 'zoomOut' : 'zoomIn') : n]);
    el.classList.toggle('on', (n === 'view' && want.top) || (n === 'zoom' && want.zoom) || (n === 'orbit' && want.orbit));
  }
}
ui.addEventListener('click', (e) => {
  const el = e.target.closest('.ctl');
  if (!el) return;
  if (el.dataset.ctl === 'view') {
    // Off the rest angle: back to rest; at rest: the top view, then rest again.
    if (!showcaseOff()) resetView();
    else { want.top = !want.top; tween('top', want.top ? 1 : 0, 600); }
  }
  if (el.dataset.ctl === 'zoom') { want.zoom = !want.zoom; tween('zoom', want.zoom ? 1 : 0, 450); }
  if (el.dataset.ctl === 'orbit') {
    if (want.orbit) endShowcase();
    else { want.orbit = true; delete tweens.yaw; delete tweens.pitch; canvas.style.touchAction = 'none'; }
  }
  syncControls();
});
// Showcase: a mode in which a drag anywhere on the board turns and tips it within the
// range (yaw ±35°, 35° to 80° down). It stays where it is let go; ending the mode (the
// button) only stops the dragging: the board stays at the angle it was left at, and play
// goes on there. The View button is the reset (a dot on it shows the board is off rest).
function endShowcase() {
  if (!want.orbit) return;
  want.orbit = false;
  canvas.style.touchAction = '';
  syncControls();
}
const showcaseOff = () => Math.abs(v.yaw) < 0.5 && Math.abs(v.pitch) < 0.5;
const offRest = () => !showcaseOff() || v.top > 0.02 || want.top;
// Ease everything back to the rest view (52.5°, or 65° in portrait).
function resetView() {
  want.top = false; want.orbit = false;
  canvas.style.touchAction = '';
  tween('top', 0, 600); tween('yaw', 0, 600); tween('pitch', 0, 600);
  syncControls();
}
// The dot on View, kept in step with the camera each frame.
let dotOn = null;
function syncDot() {
  const on = offRest();
  if (on === dotOn) return;
  dotOn = on;
  for (const el of ui.querySelectorAll('.ctl[data-ctl=view]')) el.classList.toggle('dot', on);
}

// ---- The hot-seat turn: a move, then the board turns to face the next player.
const START = structuredClone(POS);
const MOVES = [['c3', 'b4'], ['b6', 'a5'], ['e3', 'f4'], ['g5', 'h4']];
let ply = 0, side = 'white', turnTo = 0;
function makeMove() {
  if (ply % MOVES.length === 0) Object.assign(POS, structuredClone(START));
  const [from, to] = MOVES[ply % MOVES.length], list = POS[side];
  list[list.indexOf(from)] = to;
  Object.assign(POS, { last: [from, to], selected: null, forced: [] });
  ply++;
  side = side === 'white' ? 'black' : 'white';
  upload();
  outlines();
  for (const t of document.querySelectorAll('.turn')) {
    const p = t.querySelector('.piece');
    p.className = `piece ${side}`;
    delete p.dataset.painted;
    t.querySelector('span').textContent = side === 'white' ? "White's turn" : "Black's turn";
  }
  Draughts.paint();
  resetView();
  frame();
  turnTo += 180;
  setTimeout(() => tween('turn', turnTo, 700), 250);
}

// A drag on the board: in the showcase it moves the camera; with the buttons off it turns
// the board as before (a double click resets); otherwise it is the game's.
let drag = null;
canvas.addEventListener('pointerdown', (e) => {
  if (CONTROLS !== 'off' && !want.orbit) return;
  delete tweens.yaw; delete tweens.pitch;
  drag = [e.clientX, e.clientY];
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  v.yaw = Math.max(-35, Math.min(35, v.yaw - (e.clientX - drag[0]) * 0.3));
  v.pitch = Math.max(35 - viewPitch, Math.min(80 - viewPitch, v.pitch + (e.clientY - drag[1]) * 0.3));
  drag = [e.clientX, e.clientY];
  frame();
});
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('dblclick', () => { if (CONTROLS === 'off') { v.yaw = 0; v.pitch = 0; frame(); } });
let resizing = 0;
addEventListener('resize', () => { clearTimeout(resizing); resizing = setTimeout(layout, 60); });
document.fonts.ready.then(layout);
layout();
</script>
</body>
</html>

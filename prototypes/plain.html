<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: plain background</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* A plain background in place of the season's photograph (task 044). The season still
     picks the board, so the photograph's on or off is a choice of its own beside the
     Background row's seasons and by the date, not a sixth tile among them. Three
     placements of it in settings' Look group (?place=a to c, &plain=on, &lang=et), and
     the plain fade per season behind home, the flat game, and the 3D game
     (?view=grid, &grad=a or b; each frame is home.html, game.html, or
     game3d.html?take=corners with ?plain=on).

     ?place=a  a row of its own under Background: Photo and Plain, each a thumbnail
     ?place=b  a two-part switch under the Background row's name (beside it in
               portrait), photo and plain; the seasons' thumbnails show what it chose
     ?place=c  one tile at the Background row's end, after by the date, lit when plain;
               the seasons' thumbnails show what it chose

     On a phone in portrait (narrower than 640 px) only the Look group shows, as the
     phone's Look tab does. Layout as settings.html. */
  .settings { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; height: 100%; padding: 24px 32px; }
  .side { display: grid; grid-template-rows: auto 1fr; gap: 14px; min-height: 0; }
  .top { display: flex; align-items: center; gap: 20px; }
  .lang { --r: 20px; display: flex; align-items: center; gap: 8px; margin-left: auto; padding: 6px 6px 6px 14px; }
  .lang .tile { min-height: 48px; min-width: 76px; }
  .lang > .icon { width: 28px; height: 28px; opacity: 0.85; margin-right: 4px; }
  .top h1 { margin: 0; font-size: 34px; font-weight: 400; }
  .groups { display: grid; gap: 10px; align-content: center; }
  .group { --r: 24px; display: grid; gap: 10px; padding: 12px 20px 14px; }
  .group h2 { margin: 0 0 2px; display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 400; }
  .group h2 .icon { width: 30px; height: 30px; stroke-width: 2; opacity: 0.85; }
  .setting { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 14px; }
  .setting h3 { margin: 0; font-size: 18px; font-weight: 400; color: var(--fg-dim); letter-spacing: 0.03em; }
  .tiles { display: flex; gap: 10px; flex-wrap: wrap; }
  .tile { display: grid; justify-items: center; align-content: center; gap: 2px; min-width: 88px; min-height: 56px; padding: 4px 16px 6px;
    border: 0; border-radius: 16px; cursor: pointer; color: var(--fg); font: inherit; font-size: 19px; text-decoration: none;
    background: var(--button); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.12); }
  .tile small { font-size: 13px; color: var(--fg-dim); }
  .tile.on { background: color-mix(in srgb, var(--glow) 22%, transparent); box-shadow: inset 0 0 0 2px var(--glow); }
  .tile.pic { min-width: 0; padding: 4px 4px 5px; font-size: 13px; }
  .tile .thumb { width: 62px; height: 40px; border-radius: 11px; background: center / cover; display: grid; place-items: center; }
  .tile .thumb .icon { width: 26px; height: 26px; }
  /* Take c: the toggle a little apart from the seasons and by the date. */
  .tile.apart { margin-left: 8px; }
  /* Take b: two halves of one pill under the row's name. */
  .name { display: grid; gap: 8px; justify-items: start; }
  .switch { display: flex; padding: 3px; gap: 3px; border-radius: 14px; background: rgb(255 255 255 / 0.06);
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.12); }
  .switch button { display: grid; place-items: center; width: 52px; height: 40px; padding: 0; border: 0; border-radius: 11px;
    cursor: pointer; background: transparent; }
  .switch button.on { background: color-mix(in srgb, var(--glow) 22%, transparent); box-shadow: inset 0 0 0 2px var(--glow); }
  .switch .thumb { width: 36px; height: 24px; border-radius: 7px; background: center / cover; }
  .preview { container-type: size; display: grid; place-items: center; min-height: 0; }
  .preview #board { width: calc(min(100cqw, 100cqh) * 0.94); }
  .preview .board:not(.view-3d) { isolation: isolate; }
  .kp { position: relative; width: 34px; height: 38px; }
  .kp .piece { --u: 3px; inset: 4px 0 0; }
  @media (orientation: portrait) {
    .settings { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) auto; gap: 16px; }
    .side { display: contents; }
    .top { order: -2; }
    .preview { order: -1; }
    .groups { grid-template-columns: 1fr 1fr; align-items: start; }
    .group { height: 100%; align-content: start; }
    .setting { grid-template-columns: 1fr; gap: 6px; }
    .name { grid-template-columns: 1fr auto; align-items: center; }
  }
  @media (orientation: portrait) and (max-width: 640px) {
    .settings { padding: 16px; }
    .groups { grid-template-columns: 1fr; }
    .group.game { display: none; }
  }

  /* ?view=grid: the four seasons' plain fades behind home, the flat game, and the 3D
     game, each a 1280 × 800 page shown at 40%. */
  body.grid { overflow: auto; }
  .grid main { display: grid; grid-template-columns: auto repeat(3, 512px); gap: 12px 16px; padding: 16px; align-items: center; }
  .grid .head { font-size: 20px; color: var(--fg-dim); }
  .grid .frame { width: 512px; height: 320px; overflow: hidden; border-radius: 10px; box-shadow: 0 0 0 1px rgb(255 255 255 / 0.15); }
  .grid iframe { width: 1280px; height: 800px; border: 0; transform: scale(0.4); transform-origin: 0 0; }
</style>
</head>
<body>
<script>
  const params = new URLSearchParams(location.search);
  const D = Draughts, S = D.settings;
  const et = params.get('lang') === 'et';
  const T = et ? {
    title: 'Seaded', look: 'Välimus', game: 'Mäng', background: 'Taust', byDate: 'Tänane', board: 'Kabelaud',
    kings: 'Tammid', picture: 'Pilt', photo: 'Foto', plain: 'Lihtne', flat: 'Lame', raised: 'Ruumiline', auto: 'Laua järgi',
    crown: 'Kroon', stack: 'Virn', hints: 'Vihjed', mistakes: 'Ainult vead', moves: 'Kõik käigud', draughts: 'Kabe',
    seasons: { winter: 'Talv', spring: 'Kevad', summer: 'Suvi', autumn: 'Sügis' },
  } : {
    title: 'Settings', look: 'Look', game: 'Game', background: 'Background', byDate: 'By date', board: 'Board',
    kings: 'Kings', picture: 'Picture', photo: 'Photo', plain: 'Plain', flat: 'Flat', raised: 'Raised', auto: 'Auto',
    crown: 'Crown', stack: 'Stack', hints: 'Move hints', mistakes: 'Mistakes only', moves: 'All moves', draughts: 'Draughts',
    seasons: { winter: 'Winter', spring: 'Spring', summer: 'Summer', autumn: 'Autumn' },
  };
  const go = (key, value) => {
    const p = new URLSearchParams(location.search);
    if (value === null) p.delete(key); else p.set(key, value);
    if (key === 'season') p.delete('theme');
    location.search = p.toString();
  };

  if (params.get('view') === 'grid') {
    // Each season's plain fade behind home (the 3D board), the flat game, and the 3D game.
    document.body.classList.add('grid', `theme-${S.theme}`);
    const grad = S.grad;
    const cols = [['Home', 'home.html?'], ['Game, flat', 'game.html?view=2d&'], ['Game, 3D', 'game3d.html?take=corners&view=3d&']];
    let html = '<main><span></span>' + cols.map(([name]) => `<span class="head">${name}</span>`).join('');
    for (const s of ['autumn', 'winter', 'spring', 'summer']) {
      html += `<span class="head">${T.seasons[s]}</span>`;
      for (const [, url] of cols) {
        html += `<div class="frame"><iframe loading="eager" src="${url}season=${s}&plain=on&grad=${grad}"></iframe></div>`;
      }
    }
    document.body.innerHTML = html + '</main>';
    document.body.style.background = '#111';
    document.documentElement.style.setProperty('--font', D.loadFont());
  } else {
    document.body.insertAdjacentHTML('afterbegin', `<main class="settings">
      <div class="side">
        <div class="top"><a class="button glass" href="home.html" data-icon="back" aria-label="Back"></a><h1>${T.title}</h1>
          <div class="lang glass" id="lang"></div></div>
        <div class="groups" id="groups"></div>
      </div>
      <div class="preview"><div id="board"></div></div>
    </main>`);
    D.init();
    const place = ['a', 'b', 'c'].includes(params.get('place')) ? params.get('place') : 'a';
    const plain = S.plain === 'on', now = params.get('season') === null;
    const photo = (s) => `../design/backgrounds/masters/${s}-01-2048.jpg`;
    const fade = (s) => D.paintPlain(D.SEASON_THEME[s], 124, 80);
    const tile = (on, key, value, label, cls = '') =>
      `<button class="tile ${cls}${on ? ' on' : ''}" data-k="${key}" data-v="${value}">${label}</button>`;
    const setting = (title, tiles) => `<div class="setting">${title.startsWith('<') ? title : `<h3>${title}</h3>`}<div class="tiles">${tiles}</div></div>`;
    const group = (iconName, title, body, cls = '') =>
      `<section class="group glass ${cls}"><h2>${D.icon(iconName)}${title}</h2>${body}</section>`;
    const king = (stack) => `<span class="kp${stack ? ' stack' : ''}"><span class="piece white king"></span></span>`;
    const thumb = (style) => `<span class="thumb" style="${style}"></span>`;
    // A season's thumbnail: its photograph, or with plain on (takes b and c) its fade.
    const seasonThumb = (s) => (plain && place !== 'a' ? thumb(`background-image: url(${fade(s)})`) : thumb(`background-image: url(${photo(s)})`));
    const seasons = ['winter', 'spring', 'summer', 'autumn'];
    const shown = S.season;
    let background = seasons.map((s) => tile(!now && S.season === s, 'season', s, `${seasonThumb(s)}${T.seasons[s]}`, 'pic')).join('') +
      tile(now, 'season', '', `<span class="thumb" style="background: color-mix(in srgb, var(--glow) 18%, rgb(255 255 255 / 0.06))">${D.icon('sun')}</span>${T.byDate}`, 'pic');
    let name = T.background, extra = '';
    if (place === 'a') {
      extra = setting(T.picture,
        tile(!plain, 'plain', 'off', `${thumb(`background-image: url(${photo(shown)})`)}${T.photo}`, 'pic') +
        tile(plain, 'plain', 'on', `${thumb(`background-image: url(${fade(shown)})`)}${T.plain}`, 'pic'));
    } else if (place === 'b') {
      name = `<div class="name"><h3>${T.background}</h3><div class="switch">` +
        `<button class="${plain ? '' : 'on'}" data-k="plain" data-v="off" aria-label="${T.photo}">${thumb(`background-image: url(${photo(shown)})`)}</button>` +
        `<button class="${plain ? 'on' : ''}" data-k="plain" data-v="on" aria-label="${T.plain}">${thumb(`background-image: url(${fade(shown)})`)}</button></div></div>`;
    } else {
      background += tile(plain, 'plain', plain ? 'off' : 'on', `${thumb(`background-image: url(${fade(shown)})`)}${T.plain}`, 'pic apart');
    }
    const v = params.get('v') || 'intl';
    document.getElementById('groups').innerHTML =
      group('target', T.game,
        setting(T.draughts,
          tile(v === 'intl', 'v', 'intl', 'International<small>10 × 10</small>') +
          tile(v === 'brazilian', 'v', 'brazilian', 'Brazilian<small>8 × 8</small>') +
          tile(v === 'russian', 'v', 'russian', 'Russian<small>8 × 8</small>')) +
        setting(T.hints, tile(S.assist === 'mistakes', 'assist', 'mistakes', T.mistakes) + tile(S.assist === 'moves', 'assist', 'moves', T.moves)),
        'game') +
      group('sun', T.look,
        setting(name, background) + extra +
        setting(T.board, tile(S.view === '2d', 'view', '2d', `${T.flat}<small>2D</small>`) + tile(S.view === '3d', 'view', '3d', `${T.raised}<small>3D</small>`)) +
        setting(T.kings, tile(S.king === 'auto', 'king', 'auto', T.auto) + tile(S.king === 'crown', 'king', 'crown', `${king(false)}${T.crown}`) +
          tile(S.king === 'stack', 'king', 'stack', `${king(true)}${T.stack}`)));
    document.getElementById('lang').innerHTML = D.icon('globe') +
      tile(!et, 'lang', 'en', 'English') + tile(et, 'lang', 'et', 'Eesti');
    document.querySelectorAll('button[data-k]').forEach((t) => t.onclick = () => go(t.dataset.k, t.dataset.v || null));
    // The place, from the switcher.
    const bar = document.querySelector('.proto-bar');
    bar.insertAdjacentHTML('afterbegin', `<select aria-label="place">${['a', 'b', 'c'].map((t) =>
      `<option${t === place ? ' selected' : ''}>${t}</option>`).join('')}</select>`);
    bar.querySelector('select').onchange = (e) => { e.stopPropagation(); go('place', e.target.value); };
    const moves = S.assist === 'moves';
    D.board(document.getElementById('board'), {
      n: v === 'intl' ? 10 : 8,
      white: ['a1', 'c1', 'e1', 'g1', 'b2', 'f2', 'h2', 'c3', 'e3', 'd4', 'h6'],
      black: ['b8', 'd8', 'f8', 'h8', 'a7', 'c7', 'b6', 'e5', 'g5'],
      kings: ['h6'],
      forced: ['h6'],
      ...(moves ? { selected: 'd4', via: ['f6'], targets: ['h4'] } : { error: ['c5'] }),
      last: ['h4', 'g5'],
    });
    D.paint();
    D.syncGlass();
  }
</script>
</body>
</html>

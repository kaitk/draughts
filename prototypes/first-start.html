<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: first start</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* The first start (task 019), pages linked in order by ?page=:
       variant  which draughts, as two cards with the starting position: international
                10 × 10 (lit, the default once it exists) and Russian 8 × 8;
       learn    learn the moves, or just play;
       1..8     the tutorial: one idea a page on the chosen board, move hints showing
                the moves, the only place they do by default (docs/product.md);
       done     what to play first; move hints go back to mistakes only.
     ?v=intl or russian carries the choice. Later the tutorial's lines are spoken too. */
  .page { display: grid; place-items: center; height: 100%; padding: 32px; }
  .sheet { display: grid; justify-items: center; gap: 22px; padding: 36px 40px; max-width: 980px; }
  .sheet h1 { margin: 0; font-size: 44px; font-weight: 400; text-align: center; }
  .sheet p { margin: 0; color: var(--fg-dim); font-size: 22px; text-align: center; }
  .mark { display: flex; align-items: center; gap: 12px; font-size: 26px; letter-spacing: 0.06em; color: var(--fg-dim); }
  .mark .piece { position: relative; inset: auto; width: 40px; height: 40px; --u: 4px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; width: 100%; }
  .card { display: grid; justify-items: center; align-content: start; gap: 14px; padding: 22px 22px 20px; border-radius: 24px;
    color: var(--fg); text-decoration: none; background: var(--button); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.14); }
  .card.on { background: color-mix(in srgb, var(--glow) 20%, transparent); box-shadow: inset 0 0 0 2px var(--glow); }
  .card .board { width: 100%; max-width: 280px; }
  .card b { font-size: 30px; font-weight: 400; }
  .card small { color: var(--fg-dim); font-size: 18px; text-align: center; }
  .card .icon { width: 64px; height: 64px; stroke-width: 1.8; }
  .card.big { min-height: 240px; align-content: center; }
  .go { display: flex; align-items: center; justify-content: center; gap: 14px; min-width: 260px; min-height: 76px; padding: 0 28px;
    border-radius: 22px; color: var(--fg); text-decoration: none; font-size: 28px;
    background: color-mix(in srgb, var(--glow) 24%, transparent); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.2); }
  .go .icon { width: 32px; height: 32px; stroke-width: 2.4; }
  .go.quiet { background: var(--button); }
  .row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

  /* A tutorial page: the board as in the game, and a panel with the steps, the idea in
     a few words, and back and next. */
  .lesson { --gap: 24px; --panel: 340px; display: flex; align-items: center; justify-content: center; gap: var(--gap);
    height: 100%; padding: var(--gap); }
  .lesson #board { flex: none; width: min(100vh - 2 * var(--gap), 100vw - var(--panel) - 3 * var(--gap)); }
  .lesson .panel { display: flex; flex-direction: column; gap: 18px; flex: none; width: var(--panel);
    height: min(100vh - 2 * var(--gap), 100vw - var(--panel) - 3 * var(--gap)); padding: 28px 26px; }
  .steps { display: flex; gap: 8px; }
  .steps i { width: 12px; height: 12px; border-radius: 50%; background: rgb(255 255 255 / 0.22); }
  .steps i.done { background: color-mix(in srgb, var(--glow) 60%, transparent); }
  .steps i.now { background: var(--glow); box-shadow: 0 0 10px 2px color-mix(in srgb, var(--glow) 50%, transparent); }
  .lesson h2 { margin: 6px 0 0; font-size: 36px; font-weight: 400; line-height: 1.15; }
  .lesson p { margin: 0; font-size: 22px; line-height: 1.4; color: var(--fg-dim); }
  .lesson .space { flex: 1; }
  .lesson .nav { display: flex; gap: 12px; }
  .lesson .nav a { min-width: 0; min-height: 80px; flex: 1; border-radius: 20px; text-decoration: none; color: var(--fg); }
  .lesson .nav a.back { flex: none; width: 80px; }
  .lesson .nav .button svg { width: 34px; height: 34px; }
  .lesson .nav .next { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 26px; }

  @media (orientation: portrait) {
    .cards { grid-template-columns: 1fr; }
    .card { grid-template-columns: 200px 1fr; justify-items: start; align-items: center; text-align: left; }
    .card .board { grid-row: span 2; }
    .sheet { width: 100%; padding: 32px 28px; }
    .card.big { grid-template-columns: 80px 1fr; min-height: 140px; }
    .card.big .icon { grid-row: span 2; }
    .card.big b, .card.big small { grid-column: 2; }
    .card small { text-align: left; }
    .lesson { --panel: 300px; flex-direction: column; }
    .lesson #board { width: min(100vw - 2 * var(--gap), 100vh - var(--panel) - 3 * var(--gap)); }
    .lesson .panel { width: min(100vw - 2 * var(--gap), 100vh - var(--panel) - 3 * var(--gap)); height: auto; }
  }
</style>
</head>
<body>
<main id="main"></main>
<script>
  const params = new URLSearchParams(location.search);
  const page = params.get('page') || 'variant';
  const v = params.get('v') || 'intl';
  const intl = v === 'intl';
  const n = intl ? 10 : 8;
  const link = (p, extra = {}) => {
    const q = new URLSearchParams(location.search);
    q.set('page', p);
    for (const [k, val] of Object.entries(extra)) q.set(k, val);
    return `?${q}`;
  };
  // The starting position: men on the dark squares of the first four rows (10 × 10)
  // or three (8 × 8) on each side.
  const start = (size) => {
    const rows = size === 10 ? 4 : 3, white = [], black = [];
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      if ((x + y) % 2) continue;
      const sq = String.fromCharCode(97 + x) + (y + 1);
      if (y < rows) white.push(sq); else if (y >= size - rows) black.push(sq);
    }
    return { white, black };
  };
  const far = n;   // the far row
  // The tutorial: one idea a page. Squares are named as on the board, a1 at white's
  // bottom left; the same lines work on both boards, with the far row and international's
  // rule of taking the most added.
  const STEPS = [
    { title: 'Move forward', text: 'A piece moves one square on the diagonal, forward. Tap it, then tap where it goes.',
      board: { white: ['c3', 'e1'], black: ['f6', 'h6'], selected: 'c3', targets: ['b4', 'd4'] } },
    { title: 'Jump to capture', text: 'Jump over a piece next to you onto the empty square behind it. The piece you jump is taken.',
      board: { white: ['d4', 'c1'], black: ['e5', 'b8'], selected: 'd4', targets: ['f6'] } },
    { title: 'You must capture', text: 'If you can take a piece, you have to. The piece that must capture glows red.',
      board: { white: ['c3', 'g3'], black: ['d4', 'f8'], forced: ['c3'], error: ['h4'] } },
    { title: 'Keep jumping', text: 'After a jump, if you can jump again, keep going. One move can take many pieces.',
      board: { white: ['a3'], black: ['b4', 'd6', 'h8'], selected: 'a3', via: ['c5'], targets: ['e7'] } },
    ...(intl ? [{ title: 'Take the most', text: 'If there are several captures, take the one that takes the most pieces.',
      board: { white: ['c3', 'g3'], black: ['d4', 'f6', 'h4'], forced: ['c3'], selected: 'c3', via: ['e5'], targets: ['g7'] } }] : []),
    { title: 'Become a king', text: `Reach the far side and your piece becomes a king, with a crown.`,
      board: { white: [`e${far - 1}`, 'c1'], black: ['h2'], kings: [], selected: `e${far - 1}`, targets: [`d${far}`, `f${far}`] } },
    // The two variants crown differently in the middle of a capture (rules.md).
    intl ? { title: 'Crowned only at the end', text: 'If a capture crosses the far side and goes on jumping, the piece stays a man. It is crowned only if it stops there.',
      board: { white: ['b8'], black: ['c9', 'e9'], selected: 'b8', via: ['d10'], targets: ['f8'] } }
      : { title: 'Crowned on the way', text: 'If a capture reaches the far side, the piece is crowned at once and goes on jumping as a king.',
      board: { white: ['b6'], black: ['c7', 'g5'], selected: 'b6', via: ['d8'], targets: ['h4'] } },
    { title: 'Kings fly', text: 'A king moves any number of squares along a diagonal, forward or back.',
      board: { white: ['d4'], black: ['b8'], kings: ['d4'], selected: 'd4',
        targets: ['c3', 'b2', 'a1', 'e5', 'f6', 'g7', 'c5', 'b6', 'a7', 'e3', 'f2', 'g1'] } },
  ];
  const main = document.getElementById('main');
  const choose = (key, label, sub, on, href, inner) =>
    `<a class="card${on ? ' on' : ''}${inner ? ' big' : ''}" href="${href}">${inner || `<div class="board" data-n="${key}"></div>`}<b>${label}</b><small>${sub}</small></a>`;

  if (page === 'variant') {
    main.innerHTML = `<div class="page"><div class="sheet glass">` +
      `<div class="mark"><div class="piece white king"></div>Draughts</div>` +
      `<h1>Which draughts do you play?</h1>` +
      `<div class="cards">` +
      choose(10, 'International', '10 × 10, twenty pieces each', intl, link('variant', { v: 'intl' })) +
      choose(8, 'Russian', '8 × 8, twelve pieces each', !intl, link('variant', { v: 'russian' })) +
      `</div><p>You can change this for each new game.</p>` +
      `<a class="go" href="${link('learn')}"><span data-icon="next"></span>Next</a></div></div>`;
  } else if (page === 'learn') {
    main.innerHTML = `<div class="page"><div class="sheet glass"><h1>Learn the moves?</h1><div class="cards">` +
      choose(0, 'Show me', 'Seven short steps on the board', true, link('1'), `<span data-icon="hint"></span>`) +
      choose(0, 'Just play', 'Straight to the game; the steps stay in settings', false, 'home.html', `<span data-icon="next"></span>`) +
      `</div></div></div>`;
  } else if (page === 'done') {
    main.innerHTML = `<div class="page"><div class="sheet glass">` +
      `<div class="mark"><div class="piece white king"></div></div>` +
      `<h1>You know the moves!</h1>` +
      `<p>From now on the board shows only your mistakes. You can show the moves again in settings.</p>` +
      `<div class="row"><a class="go" href="home.html?pick=computer&v=${v}"><span data-icon="computer"></span>Play the computer</a>` +
      `<a class="go quiet" href="home.html?pick=friend&v=${v}"><span data-icon="friend"></span>Play a friend</a></div></div></div>`;
  } else {
    const i = Math.max(1, Math.min(STEPS.length, +page)) - 1, s = STEPS[i];
    document.body.dataset.screen = 'board';
    main.innerHTML = `<div class="lesson"><div id="board"></div><aside class="panel glass">` +
      `<div class="steps">${STEPS.map((_, k) => `<i class="${k < i ? 'done' : k === i ? 'now' : ''}"></i>`).join('')}</div>` +
      `<h2>${s.title}</h2><p>${s.text}</p><div class="space"></div><div class="nav">` +
      `<a class="button back" href="${i === 0 ? link('learn') : link(String(i))}" data-icon="back" aria-label="Back"></a>` +
      `<a class="button primary next" href="${i === STEPS.length - 1 ? link('done') : link(String(i + 2))}">` +
      `${i === STEPS.length - 1 ? 'Done' : 'Next'}<span data-icon="next"></span></a></div></aside></div>`;
  }
  // The "learn" page's count of steps follows the variant.
  main.innerHTML = main.innerHTML.replace('Seven short steps', `${['Six', 'Seven', 'Eight'][STEPS.length - 6]} short steps`);
  Draughts.init();
  for (const el of document.querySelectorAll('[data-n]')) {
    const size = +el.dataset.n;
    if (size) Draughts.board(el, { n: size, ...start(size) });
  }
  const b = document.getElementById('board');
  if (b) {
    const s = STEPS[Math.max(1, Math.min(STEPS.length, +page)) - 1];
    Draughts.board(b, { n, assist: 'moves', ...s.board });
  }
  Draughts.syncGlass();
</script>
</body>
</html>

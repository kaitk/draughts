<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: today's puzzles</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* Today's puzzles (task 087, a take): back, the title bare on the photograph, the
     streak of days at the right; today's puzzles as large tiles on one glass, each its
     level's rising bars and its stars, the first unsolved lit. Done, a card under them
     says so: the moon, the stars won, new puzzles tomorrow, and one more if the setting
     allows. Portrait: the tiles two by two. */
  .day { display: flex; flex-direction: column; gap: 20px; }
  .top h1 { text-shadow: 0 0 6px rgb(0 0 0 / 0.5), 0 2px 4px rgb(0 0 0 / 0.5); }
  .top .streak { font-size: 34px; text-shadow: 0 0 6px rgb(0 0 0 / 0.5); }
  .top .streak .icon { width: 40px; height: 40px; }
  .body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
  .set { display: grid; grid-template-columns: repeat(var(--n), 176px); gap: 16px; padding: 20px; }
  .p { flex-direction: column; gap: 18px; min-height: 196px; padding: 0; border-radius: 24px; }
  .rise { display: flex; align-items: end; gap: 6px; height: 40px; }
  .rise i { width: 11px; border-radius: 3px; background: rgb(255 255 255 / 0.28); }
  .rise i.on { background: var(--fg); }
  .st { display: flex; gap: 2px; color: var(--glow); }
  .st .icon { width: 40px; height: 40px; stroke-width: 1.6; }
  .p.solved { background: rgb(255 255 255 / 0.06); }
  .done { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 24px;
    width: calc(4 * 176px + 3 * 16px + 40px); max-width: 100%; padding: 20px 24px; box-sizing: border-box; }
  .done[hidden] { display: none; }
  .done .moon { grid-row: span 2; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center;
    background: color-mix(in srgb, var(--glow) 20%, transparent); }
  .done .moon .icon { width: 38px; height: 38px; color: var(--glow); }
  .done b { font-weight: 400; font-size: 30px; align-self: end; }
  .done small { align-self: start; display: flex; align-items: center; gap: 6px; }
  .done small .icon { width: 16px; height: 16px; color: var(--glow); }
  .done .more { grid-row: span 2; }
  .more { box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.25); background: none; font-size: 24px; }
  @container (max-height: 599px) and (orientation: landscape) {
    .set { grid-template-columns: repeat(var(--n), 150px); padding: 14px; gap: 12px; }
    .p { min-height: 150px; gap: 12px; }
    .st .icon { width: 32px; height: 32px; }
    .done { width: calc(4 * 150px + 3 * 12px + 28px); padding: 12px 20px; }
    .done .moon { width: 56px; height: 56px; }
  }
  @container (orientation: portrait) {
    .set { grid-template-columns: repeat(2, minmax(0, 220px)); }
    .done { width: min(100%, 2 * 220px + 16px + 40px); grid-template-columns: auto 1fr; }
    .done .more { grid-row: auto; grid-column: 1 / -1; }
    .done > span:empty { display: none; }
  }
</style>
</head>
<body>
<main class="screen day">
  <div class="top">
    <a class="tile glass" href="puzzles.html?daily=a" data-icon="back">Back</a><h1>Today</h1>
    <span class="end streak" id="streak"></span>
  </div>
  <div class="body">
    <div class="set glass" id="set"></div>
    <div class="done glass" id="done" hidden></div>
  </div>
</main>
<script>
  // Takes: ?today=N puzzles solved (2) of ?n= (4); ?bars=0 leaves the level's bars off
  // the tiles; ?more=1 offers one more once all are solved; ?streak=N days (5, 0 hides it).
  const P = Draughts.params, icon = Draughts.icon;
  const n = Number(P.get('n') ?? 4), today = Math.min(n, Number(P.get('today') ?? 2));
  const streak = Number(P.get('streak') ?? 5), bars = P.get('bars') !== '0', more = P.get('more') === '1';
  // A day's shape: a warm-up below the player's level, at it, a stretch above.
  const LEVEL = { 3: [1, 2, 3], 4: [1, 2, 2, 3], 5: [1, 2, 2, 3, 3] }[n] || Array(n).fill(2);
  const STARS = [3, 3, 2, 1, 2];
  document.getElementById('set').style.setProperty('--n', n);
  document.getElementById('set').innerHTML = LEVEL.map((lv, i) => {
    const won = i < today ? STARS[i] : 0, cls = i < today ? ' solved' : i === today ? ' on' : '';
    const rise = bars ? `<span class="rise">${[1, 2, 3].map((k) => `<i class="${k <= lv ? 'on' : ''}" style="height:${13 * k + 1}px"></i>`).join('')}</span>` : '';
    return `<a class="tile p${cls}" href="puzzle.html?daily=1">${rise}<span class="st">${[0, 1, 2].map((k) =>
      icon(k < won ? 'star' : 'starOff')).join('')}</span></a>`;
  }).join('');
  if (streak > 0) document.getElementById('streak').innerHTML = `${icon('flame')}${streak}`;
  if (today >= n) {
    const got = STARS.slice(0, n).reduce((a, b) => a + b, 0), done = document.getElementById('done');
    done.hidden = false;
    done.innerHTML = `<span class="moon">${icon('moon')}</span><b>Done for today</b>` +
      (more ? `<a class="tile more" href="puzzle.html?daily=1" data-icon="plus">One more</a>` : '<span></span>') +
      `<small>${icon('star')}${got} / ${3 * n} · New puzzles tomorrow</small>`;
  }
  Draughts.init();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts: puzzle set</title>
<link rel="stylesheet" href="draughts.css">
<script src="draughts.js"></script>
<style>
  /* Choosing the draughts (International, Brazilian, Russian) on the puzzles' library, and
     the library itself reworked (task 037). ?take=now, a, b, c; &v=intl, brazilian,
     russian; &tie=shared (the choice is settings' Draughts) or own (the puzzles' own);
     &br=shown or hidden (Brazilian, while it plays International's set); &stars=some or
     none; &view=library or home (home's menu, its Puzzles count following the choice);
     &open=1 (b's picker open); &lang=et; &guides outlines each tap.

     now: today's library (puzzles.html?take=a, built), no choice: the set follows settings.
     a:   today's rows, a three-way switch (name and size) in the title row.
     b:   the draughts' name under the title, a tap opens a small picker of the three with
          their boards and counts; the rows show stars and what's next, a Continue row on
          top, and locked themes as a path (pips of Learn's puzzles still to solve).
     c:   a grid of theme cards (room used in landscape), Continue as the first card, the
          draughts as the new game's setup tiles (a small board, name, size) in the title row.

     The count everywhere is stars, as home's ("0 / 222" is International's 74 puzzles × 3;
     Russian's 46 make 138). Brazilian plays International's set, its stars too, until it
     has its own. */
  main { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 24px; }
  .phone main { padding: 16px; }
  h1, h2 { margin: 0; font-weight: 400; }
  .icon { stroke-width: 2.2; }

  .page { max-width: 1200px; margin: 0 auto; display: grid; gap: 14px; align-content: start; }
  .head { display: flex; align-items: center; gap: 16px; min-height: 88px; flex-wrap: wrap; }
  .head h1 { font-size: 40px; white-space: nowrap; }
  .phone .head h1 { font-size: 32px; }
  .head .title { display: grid; gap: 2px; min-width: 0; }
  .note { font-size: 17px; color: var(--fg-dim); }

  /* A theme's mark (as puzzles.html). */
  .mark { position: relative; flex: none; display: grid; place-items: center; border-radius: 50%;
    background: color-mix(in srgb, var(--glow) 20%, transparent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--glow) 45%, transparent); }
  .locked .mark { background: rgb(255 255 255 / 0.06); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.16); }
  .locked .mark > .icon { opacity: 0.45; }
  .badge { position: absolute; right: -4px; bottom: -4px; width: 30px; height: 30px; border-radius: 50%; display: grid;
    place-items: center; background: color-mix(in srgb, var(--glass-tint), rgb(255 255 255 / 0.25)); }
  .badge .icon { width: 18px; height: 18px; stroke-width: 2.4; }
  .bar { display: block; height: 8px; border-radius: 4px; background: rgb(255 255 255 / 0.14); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: var(--glow);
    box-shadow: 0 0 8px color-mix(in srgb, var(--glow) 60%, transparent); }
  .num { font-size: 22px; color: var(--fg-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .num .icon { width: 20px; height: 20px; color: var(--glow); vertical-align: -3px; margin-right: 4px; }
  .hint { font-size: 17px; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The path to a locked theme: one pip per Learn puzzle it waits for, lit when solved. */
  .pips { display: inline-flex; gap: 6px; vertical-align: middle; margin-right: 10px; }
  .pips i { width: 12px; height: 12px; border-radius: 50%; background: rgb(255 255 255 / 0.18); }
  .pips i.on { background: var(--glow); box-shadow: 0 0 6px color-mix(in srgb, var(--glow) 60%, transparent); }

  /* A theme as a row (now, a, b). */
  .library { display: grid; gap: 14px; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); }
  .theme { display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: 20px; row-gap: 10px;
    align-items: center; min-height: 112px; padding: 16px 24px 16px 18px; color: var(--fg); text-decoration: none; }
  .theme .mark { grid-row: 1 / 3; width: 80px; height: 80px; }
  .theme .mark > .icon { width: 46px; height: 46px; }
  .theme h2 { font-size: 32px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; align-self: end; }
  .theme .num { align-self: end; }
  .theme .bar, .theme .hint, .theme .sub { grid-column: 2 / 4; align-self: start; }
  .theme.b { grid-template-rows: auto auto auto; row-gap: 8px; }
  .theme.b .mark { grid-row: 1 / 4; }
  .theme.locked h2 { color: var(--fg-dim); }
  .phone .theme { min-height: 96px; padding: 10px 18px 10px 12px; column-gap: 14px; }
  .phone .theme .mark { width: 64px; height: 64px; }
  .phone .theme .mark > .icon { width: 38px; height: 38px; }
  .phone .theme h2 { font-size: 26px; }
  .phone .num { font-size: 19px; }
  .phone .hint { font-size: 15px; }
  /* Continue: the next puzzle without stars in the theme last played, lit like home's
     Continue. */
  .continue { display: grid; grid-template-columns: auto 1fr; column-gap: 18px; align-items: center; min-height: 96px;
    padding: 12px 22px 12px 14px; color: var(--fg); text-decoration: none; grid-column: 1 / -1; }
  .continue.glass::after { background: linear-gradient(color-mix(in srgb, var(--glow) 24%, transparent),
    color-mix(in srgb, var(--glow) 24%, transparent)), var(--glass-tint); }
  .continue .go { width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center;
    background: color-mix(in srgb, var(--glow) 36%, transparent); }
  .continue .go .icon { width: 36px; height: 36px; stroke-width: 2.6; }
  .continue h2 { font-size: 30px; }
  .continue .hint { font-size: 18px; }
  .phone .continue { min-height: 88px; }
  .phone .continue h2 { font-size: 26px; }

  /* a: the switch, three tiles in a row in the title row (settings' tiles, joined). */
  .switch { display: grid; grid-template-columns: repeat(var(--n), auto); gap: 4px; margin-left: auto; padding: 4px; border-radius: 22px; }
  .switch a { display: grid; justify-items: center; align-content: center; min-width: 120px; min-height: 64px; padding: 4px 14px;
    border-radius: 18px; color: var(--fg); text-decoration: none; font-size: 19px; white-space: nowrap; }
  .switch a small { font-size: 14px; color: var(--fg-dim); }
  .switch a.on { background: color-mix(in srgb, var(--glow) 22%, transparent); box-shadow: inset 0 0 0 2px var(--glow); }
  .portrait .switch { margin-left: 0; width: 100%; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
  .portrait .switch a { min-width: 0; font-size: 17px; padding: 4px 6px; }

  /* b: the draughts' name under the title, a quiet button with a caret; its picker. */
  .which { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px 0 12px; margin: 0 0 0 -12px;
    border-radius: 14px; color: var(--fg-dim); font-size: 20px; text-decoration: none; justify-self: start; position: relative; }
  .which:hover, .which.open { background: rgb(255 255 255 / 0.1); color: var(--fg); }
  .which .icon { width: 20px; height: 20px; stroke-width: 2.4; }
  .which::before { content: ''; position: absolute; inset: -22px -8px; }  /* an 88 dp tap */
  .head-b { position: relative; }
  .picker { position: absolute; top: calc(100% - 4px); left: 104px; z-index: 5; width: 400px; padding: 10px; display: grid; gap: 6px; }
  .portrait .picker { left: 0; width: 100%; }
  .picker a { display: grid; grid-template-columns: 56px 1fr auto; column-gap: 14px; align-items: center; min-height: 80px;
    padding: 8px 14px 8px 10px; border-radius: 18px; color: var(--fg); text-decoration: none; font-size: 22px; }
  .picker a.on { background: color-mix(in srgb, var(--glow) 22%, transparent); box-shadow: inset 0 0 0 2px var(--glow); }
  .picker a:hover:not(.on) { background: rgb(255 255 255 / 0.08); }
  .picker .mini { width: 56px; grid-row: 1 / 3; }
  .picker small { font-size: 15px; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .picker .num { font-size: 18px; grid-row: 1 / 3; grid-column: 3; }
  .picker .foot { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--fg-dim); padding: 4px 10px 2px; }
  .picker .foot .icon { width: 18px; height: 18px; }
  .portrait .picker small { white-space: normal; }
  .portrait .pick { font-size: 15px; padding: 8px 2px; }
  .scrim { position: fixed; inset: 0; z-index: 4; background: rgb(0 0 0 / 0.25); }

  /* c: the setup's tiles (home.html?pick=friend) and a grid of theme cards. */
  .setup { display: grid; grid-template-columns: repeat(var(--n), 132px); gap: 10px; margin-left: auto; }
  .portrait .setup { margin-left: 0; width: 100%; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
  .pick { display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 88px; padding: 8px 6px;
    border-radius: 16px; color: var(--fg); text-decoration: none; font-size: 17px; white-space: nowrap;
    background: var(--button); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.12); }
  .pick.on { background: color-mix(in srgb, var(--glow) 22%, transparent); box-shadow: inset 0 0 0 2px var(--glow); }
  .pick small { font-size: 13px; color: var(--fg-dim); }
  .pick .mini { width: 40px; margin-bottom: 4px; }
  .pick .label { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .cards { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 14px; }
  .card { display: grid; grid-template-rows: auto auto auto auto; justify-items: center; align-content: center; gap: 10px;
    min-height: var(--card-h); padding: 16px 18px 18px; color: var(--fg); text-decoration: none; text-align: center; }
  .card .mark { width: 84px; height: 84px; }
  .card .mark > .icon { width: 48px; height: 48px; }
  .card h2 { font-size: 28px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .bar { width: 100%; }
  .card.locked h2 { color: var(--fg-dim); }
  .card .hint { font-size: 15px; max-width: 100%; }
  .card .pips { margin: 0; }
  .card.continue { grid-column: auto; grid-template-columns: none; padding: 16px 18px 18px; }
  .card.continue .go { width: 84px; height: 84px; }
  .card.continue .go .icon { width: 44px; height: 44px; }
  .phone .card { gap: 6px; padding: 12px 10px 14px; }
  .phone .card .mark { width: 60px; height: 60px; }
  .phone .card .mark > .icon { width: 34px; height: 34px; }
  .phone .card h2 { font-size: 22px; }
  .portrait .card.continue { grid-column: 1 / -1; grid-template-columns: auto 1fr; justify-items: start; text-align: left;
    column-gap: 16px; min-height: 88px; padding: 10px 18px 10px 12px; }
  .portrait .card.continue .go { width: 64px; height: 64px; grid-row: 1 / 3; }
  .portrait .card.continue .go .icon { width: 34px; height: 34px; }

  /* home: the menu's column as home.html draws it, the Puzzles row's count following. */
  .home-menu { position: fixed; inset: 0 auto 0 0; width: 440px; display: grid; align-content: center; gap: 10px; padding: 48px 40px;
    border-radius: 0 32px 32px 0; }
  .portrait .home-menu { inset: auto 0 0 0; width: auto; border-radius: 32px 32px 0 0; padding: 28px; }
  .home-menu .wm { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; font-size: 56px; letter-spacing: 0.06em; }
  .home-menu .wm .piece { position: relative; inset: auto; width: 52px; height: 52px; --u: 5px; flex: none; }
  .item { display: flex; align-items: center; gap: 18px; min-height: 80px; padding: 0 18px; border-radius: 20px;
    color: var(--fg); text-decoration: none; font-size: 30px; }
  .item .icon { width: 34px; height: 34px; opacity: 0.85; }
  .item.primary { background: color-mix(in srgb, var(--glow) 24%, transparent); }
  .item small { margin-left: auto; font-size: 17px; color: var(--fg-dim); white-space: nowrap; text-align: right; }
  .item small b { font-weight: 400; color: var(--fg); }
  .item.lit { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--glow) 70%, transparent); }
  .phone .home-menu .item { min-height: 64px; font-size: 24px; }
  .phone .home-menu .wm { font-size: 40px; margin-bottom: 10px; }

  .guides a { outline: 1px dashed rgb(255 120 120 / 0.8); }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const params = new URLSearchParams(location.search);
  const pick = (k, list, d) => (list.includes(params.get(k)) ? params.get(k) : d);
  const TAKES = ['now', 'a', 'b', 'c'];
  const take = pick('take', TAKES, 'b');
  const br = pick('br', ['shown', 'hidden'], 'shown');
  let v = pick('v', ['intl', 'brazilian', 'russian'], 'intl');
  if (br === 'hidden' && v === 'brazilian') v = 'intl';
  const tie = pick('tie', ['shared', 'own'], 'shared');
  const fresh = params.get('stars') === 'none';
  const view = pick('view', ['library', 'home'], 'library');
  const open = params.get('open') === '1';
  const lang = params.get('lang') === 'et' ? 'et' : 'en';

  // The strings, English with the Estonian beside them. New keys for strings/<lang>.txt:
  //   puzzles.for_now   = International's puzzles for now  | Esialgu rahvusvahelise kabe ülesanded
  //   puzzles.continue  = Continue                          | Jätka
  //   puzzles.next      = Next: {}                          | Järgmine: {}
  //   puzzles.all_done  = All solved                        | Kõik lahendatud
  //   puzzles.opens     = Opens with {} more in Learn       | Avaneb, kui Õpis veel {}
  //   puzzles.also_games = New games too                    | Ka uued mängud
  // Kept: variant.*, puzzles.levels, home.puzzles, puzzles.stars ({} / {}).
  const S = {
    en: { puzzles: 'Puzzles', back: 'Back', draughts: 'Draughts', play: 'Continue', friend: 'A friend', computer: 'The computer',
      settings: 'Settings', variant: { intl: 'International', brazilian: 'Brazilian', russian: 'Russian' },
      forNow: "International's puzzles for now", next: (x) => `Next: ${x}`, allDone: 'All solved',
      opens: (k) => `Opens with ${k} more in Learn`, more: (k) => `Solve ${k} more in Learn`, alsoGames: 'New games too',
      levels: ['Easy', 'Harder', 'Hardest'],
      names: { learn: 'Learn', captures: 'Captures', crowning: 'Crowning', shots: 'Shots', kings: 'King shots', safe: 'Safe move' } },
    et: { puzzles: 'Ülesanded', back: 'Tagasi', draughts: 'Kabe', play: 'Jätka', friend: 'Sõbraga', computer: 'Arvutiga',
      settings: 'Seaded', variant: { intl: 'Rahvusvaheline', brazilian: 'Brasiilia', russian: 'Vene' },
      forNow: 'Esialgu rahvusvahelise kabe ülesanded', next: (x) => `Järgmine: ${x}`, allDone: 'Kõik lahendatud',
      opens: (k) => `Avaneb, kui Õpis veel ${k}`, more: (k) => `Lahenda Õpis veel ${k}`, alsoGames: 'Ka uued mängud',
      levels: ['Kerge', 'Raskem', 'Kõige raskem'],
      names: { learn: 'Õpi', captures: 'Löömine', crowning: 'Tammiks', shots: 'Kombinatsioonid', kings: 'Tammi löögid', safe: 'Ohutu käik' } },
  }[lang];
  document.documentElement.lang = lang;

  Object.assign(Draughts.ICONS, {
    book: '<path d="M12 6.5C10 5 7 4.4 3 4.8v13.4c4-.4 7 .1 9 1.6 2-1.5 5-2 9-1.6V4.8c-4-.4-7 .2-9 1.7z"/><path d="M12 6.5v13.3"/>',
    jumps: '<circle cx="7.5" cy="18" r="2.8"/><circle cx="16.5" cy="18" r="2.8"/><path d="M2.5 15.5C3.5 7.5 11 7.5 12 14.5 13 7.5 20.5 7.5 21.5 15.5"/><path d="M19 14.2l2.5 1.6 1.3-2.7"/>',
    king: '<circle cx="12" cy="12" r="9.5"/><path d="M7 16.2 6.3 9.6l3.1 2.5L12 8l2.6 4.1 3.1-2.5-.7 6.6z"/>',
    shieldOk: '<path d="M12 2.5 4 5.5v6c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10v-6z"/><path d="M8.3 12.2l2.6 2.6 4.8-5"/>',
    caret: '<path d="M6 9l6 6 6-6"/>',
  });
  const icon = Draughts.icon;

  // The two sets as built: International's 74 (Brazilian's until it has its own) and
  // Russian's 46. done: puzzles with stars in this sample.
  const ICON = { learn: 'book', captures: 'jumps', crowning: 'crownLine', shots: 'target', kings: 'king', safe: 'shieldOk' };
  const SETS = {
    intl: [['learn', [4, 4, 4], 12], ['captures', [4, 3, 3], 5], ['crowning', [4, 4, 4], 2], ['shots', [10, 10], 0],
      ['kings', [4, 3, 3], 0], ['safe', [2, 4, 4], 0]],
    russian: [['learn', [4, 4, 4], 3], ['captures', [4, 3, 3], 0], ['crowning', [4, 3, 3], 0], ['shots', [6, 5, 3], 0]],
  };
  const OPEN_AT = 6;  // half of Learn
  const setOf = (variant) => (variant === 'russian' ? 'russian' : 'intl');
  function themes(variant) {
    const list = SETS[setOf(variant)].map(([id, levels, done]) => ({ id, levels, done: fresh ? 0 : done }));
    const learn = list[0].done;
    const pat = [3, 3, 2, 3, 1, 3, 2, 3, 3, 2, 3, 3];
    for (const t of list) {
      t.total = t.levels.reduce((a, b) => a + b, 0);
      t.locked = t.id !== 'learn' && learn < OPEN_AT;
      if (t.locked) t.done = 0;
      t.stars = Array.from({ length: t.total }, (_, i) => (i < t.done ? pat[(i + t.id.length) % pat.length] : 0));
      t.got = t.stars.reduce((a, b) => a + b, 0);
      // The level of the first puzzle without stars.
      let i = t.done, l = 0;
      while (l < t.levels.length - 1 && i >= t.levels[l]) { i -= t.levels[l]; l++; }
      t.nextLevel = t.done < t.total ? l : -1;
    }
    return list;
  }
  const count = (variant) => {
    const list = themes(variant);
    return [list.reduce((a, t) => a + t.got, 0), list.reduce((a, t) => a + t.total * 3, 0)];
  };
  const T = themes(v), learnDone = T[0].done;
  // Continue: the theme last played (here the latest open one with stars and some left),
  // else Learn.
  const last = [...T].reverse().find((t) => !t.locked && t.done > 0 && t.done < t.total) || T[0];

  const go = (changes) => {
    const p = new URLSearchParams(location.search);
    for (const [k, val] of Object.entries(changes)) { if (val === null) p.delete(k); else p.set(k, val); }
    location.search = p.toString();
  };

  const W = innerWidth, H = innerHeight, landscape = W >= H, phone = Math.min(W, H) < 600;
  document.body.classList.toggle('phone', phone);
  document.body.classList.toggle('portrait', !landscape);
  document.body.classList.toggle('guides', params.has('guides'));
  const VARIANTS = br === 'hidden' ? ['intl', 'russian'] : ['intl', 'brazilian', 'russian'];
  document.body.style.setProperty('--n', VARIANTS.length);
  const size = (x) => (x === 'intl' ? '10 × 10' : '8 × 8');
  const back = `<a class="button glass" href="#" data-act="home" aria-label="${S.back}" data-icon="back"></a>`;
  const bar = (t) => `<span class="bar"><i style="width:${(100 * t.got / (3 * t.total)).toFixed(1)}%"></i></span>`;
  const mark = (t) => `<span class="mark">${icon(ICON[t.id])}${t.locked ? `<span class="badge">${icon('lock')}</span>` : ''}</span>`;
  const plain = (t) => `<span class="num">${t.done} / ${t.total}</span>`;
  const starNum = (t) => `<span class="num">${icon('star')}${t.got} / ${3 * t.total}</span>`;
  const pips = () => `<span class="pips">${Array.from({ length: OPEN_AT }, (_, i) => `<i class="${i < learnDone ? 'on' : ''}"></i>`).join('')}</span>`;
  const nextLine = (t) => (t.nextLevel < 0 ? S.allDone : S.next(`${S.levels[t.nextLevel]} ${t.done + 1}`));
  const forNow = v === 'brazilian' ? `<span class="note">${S.forNow}</span>` : '';

  // Today's row (puzzles.html, take a).
  const rowNow = (t) => `<a class="theme glass${t.locked ? ' locked' : ''}" href="#" data-theme="${t.id}">${mark(t)}<h2>${S.names[t.id]}</h2>` +
    `${t.locked ? '<span></span>' : plain(t)}${t.locked ? `<span class="hint">${S.more(OPEN_AT - learnDone)}</span>` : bar(t)}</a>`;
  // b's row: stars, the bar, and what's next; a locked theme's path to it.
  const rowB = (t) => `<a class="theme b glass${t.locked ? ' locked' : ''}" href="#" data-theme="${t.id}">${mark(t)}<h2>${S.names[t.id]}</h2>` +
    (t.locked ? `<span></span><span class="hint">${pips()}${S.opens(OPEN_AT - learnDone)}</span>`
      : `${starNum(t)}${bar(t)}<span class="hint">${nextLine(t)}</span>`) + '</a>';
  const contRow = () => `<a class="continue glass" href="puzzle.html"><span class="go">${icon('next')}</span>` +
    `<span class="title"><h2>${S.play}</h2><span class="hint">${S.names[last.id]} · ${S.levels[Math.max(0, last.nextLevel)]} ${last.done + 1}</span></span></a>`;

  const app = document.getElementById('app');
  const cols = (n) => (landscape && W >= 960 && n > 4 ? 2 : 1);

  function library() {
    if (take === 'now' || take === 'a') {
      const sw = take === 'a' ? `<div class="switch glass">${VARIANTS.map((x) =>
        `<a href="#" class="${x === v ? 'on' : ''}" data-v="${x}">${S.variant[x]}<small>${size(x)}</small></a>`).join('')}</div>` : '';
      app.innerHTML = `<div class="page"><div class="head">${back}<div class="title"><h1>${S.puzzles}</h1>${forNow}</div>${sw}</div>` +
        `<div class="library" style="--cols:${cols(T.length)}">${T.map(rowNow).join('')}</div></div>`;
    } else if (take === 'b') {
      const picker = !open ? '' : `<div class="scrim" data-act="close"></div><div class="picker glass">${VARIANTS.map((x) => {
        const [got, of] = count(x);
        return `<a href="#" class="${x === v ? 'on' : ''}" data-v="${x}"><span class="mini" data-n="${x === 'intl' ? 10 : 8}"></span>` +
          `<span>${S.variant[x]}</span><small>${x === 'brazilian' ? S.forNow : size(x)}</small><span class="num">${got} / ${of}</span></a>`;
      }).join('')}${tie === 'shared' ? `<div class="foot">${icon('gear')} ${S.alsoGames}</div>` : ''}</div>`;
      app.innerHTML = `<div class="page"><div class="head head-b">${back}<div class="title"><h1>${S.puzzles}</h1>` +
        `<a href="#" class="which${open ? ' open' : ''}" data-act="open">${S.variant[v]} · ${size(v)}${icon('caret')}</a></div>${picker}</div>` +
        `${v === 'brazilian' ? `<span class="note">${S.forNow}</span>` : ''}` +
        `<div class="library" style="--cols:${cols(T.length + 1)}">${contRow()}${T.map(rowB).join('')}</div></div>`;
    } else {
      const setup = `<div class="setup">${VARIANTS.map((x) => `<a href="#" class="pick${x === v ? ' on' : ''}" data-v="${x}">` +
        `<span class="mini" data-n="${x === 'intl' ? 10 : 8}"></span><span class="label">${S.variant[x]}</span><small>${size(x)}</small></a>`).join('')}</div>`;
      const n = T.length + (landscape ? 1 : 0);
      const c = landscape ? Math.min(4, Math.ceil(n / 2)) : 2;
      const card = (t) => `<a class="card glass${t.locked ? ' locked' : ''}" href="#" data-theme="${t.id}">${mark(t)}<h2>${S.names[t.id]}</h2>` +
        (t.locked ? `${pips()}<span class="hint">${S.opens(OPEN_AT - learnDone)}</span>` : `${starNum(t)}${bar(t)}`) + '</a>';
      const cont = `<a class="card continue glass" href="puzzle.html"><span class="go">${icon('next')}</span><h2>${S.play}</h2>` +
        `<span class="hint">${S.names[last.id]} · ${S.levels[Math.max(0, last.nextLevel)]} ${last.done + 1}</span></a>`;
      const rows = Math.ceil(n / c), roomH = H - 2 * (phone ? 16 : 24) - (landscape ? 88 : 88 + 100 + 88 + 28) - 14 - (v === 'brazilian' ? 30 : 0);
      const cardH = Math.max(phone ? 150 : 200, Math.min(300, Math.floor((roomH - (rows - 1) * 14) / rows)));
      app.innerHTML = `<div class="page"><div class="head">${back}<div class="title"><h1>${S.puzzles}</h1>${forNow}</div>${setup}</div>` +
        `<div class="cards" style="--cols:${c};--card-h:${cardH}px">${cont}${T.map(card).join('')}</div></div>`;
    }
  }

  function home() {
    const [got, of] = count(v);
    const label = tie === 'own' || v === 'brazilian' ? `<b>${S.variant[v]}</b><br>${got} / ${of}` : `${got} / ${of}`;
    app.innerHTML = `<nav class="home-menu glass"><div class="wm"><div class="piece white king"></div>${S.draughts}</div>` +
      `<a class="item primary" href="#">${icon('next')}${S.play}</a><a class="item" href="#">${icon('friend')}${S.friend}</a>` +
      `<a class="item" href="#">${icon('computer')}${S.computer}</a>` +
      `<a class="item lit" href="?${params}&view=library">${icon('puzzle')}${S.puzzles}<small>${label}</small></a>` +
      (landscape ? `<a class="item" href="#">${icon('gear')}${S.settings}</a>` : '') + '</nav>';
  }

  (view === 'home' ? home : library)();
  // A name too long for its place gets smaller, down to two thirds, before it is cut
  // (as puzzles.html).
  for (const el of app.querySelectorAll('h1, h2, .pick .label')) {
    const px = parseFloat(getComputedStyle(el).fontSize);
    if (el.scrollWidth <= el.clientWidth + 1) continue;
    el.style.fontSize = `${Math.max(px * 2 / 3, Math.floor(px * el.clientWidth / el.scrollWidth))}px`;
  }
  Draughts.settings.bg = 'photo';
  Draughts.init();
  for (const el of app.querySelectorAll('[data-n]')) Draughts.board(el, { ...Draughts.start(+el.dataset.n), view: '2d' });
  for (const el of app.querySelectorAll('[data-v]')) el.addEventListener('click', (e) => { e.preventDefault(); go({ v: el.dataset.v, open: null }); });
  for (const el of app.querySelectorAll('[data-act]')) el.addEventListener('click', (e) => {
    e.preventDefault();
    const a = el.dataset.act;
    if (a === 'home') go({ view: 'home', open: null });
    else go({ open: a === 'open' && !open ? '1' : null });
  });
  for (const el of app.querySelectorAll('[data-theme]')) el.addEventListener('click', (e) => {
    e.preventDefault();
    if (!el.classList.contains('locked')) location.href = `puzzles.html?take=a&view=theme&theme=${el.dataset.theme === 'kings' ? 'kings' : el.dataset.theme}`;
  });
  addEventListener('resize', () => location.reload());

  // The title says whether the page fits.
  let right = 0, bottom = 0, cut = 0;
  for (const el of app.querySelectorAll('*')) {
    const r = el.getBoundingClientRect();
    right = Math.max(right, r.right); bottom = Math.max(bottom, r.bottom + app.scrollTop);
    if (/^H[12]$/.test(el.tagName) && el.scrollWidth > el.clientWidth + 1) cut++;
  }
  document.title = `Draughts: puzzle set, take ${take}, ${v}: content ${Math.round(bottom)} of ${H} dp` +
    `${right > W + 0.5 ? `, too wide ${Math.round(right)}` : ''}${cut ? `, ${cut} cut` : ''}`;

  const sw = document.querySelector('.proto-bar');
  const sel = (key, values, cur) => `<select aria-label="${key}" data-q="${key}">${values.map((x) =>
    `<option${String(x) === String(cur) ? ' selected' : ''}>${x}</option>`).join('')}</select>`;
  sw.insertAdjacentHTML('afterbegin', sel('take', TAKES, take) + sel('view', ['library', 'home'], view) +
    sel('v', ['intl', 'brazilian', 'russian'], v) + sel('tie', ['shared', 'own'], tie) + sel('br', ['shown', 'hidden'], br) +
    sel('stars', ['some', 'none'], fresh ? 'none' : 'some') + sel('open', ['0', '1'], open ? '1' : '0') + sel('lang', ['en', 'et'], lang));
  for (const s of sw.querySelectorAll('[data-q]')) s.onchange = (e) => { e.stopPropagation(); go({ [s.dataset.q]: e.target.value }); };
</script>
</body>
</html>
